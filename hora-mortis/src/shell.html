<title>Hora Mortis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gothic pixel action game of one-hit kills, slowed time and returned blood.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Silkscreen&family=UnifrakturMaguntia&display=swap">
<style>
  /* Single dark look: a candle-lit cathedral at night. The canvas is the whole page. */
  :root {
    --bg: #030204;
    --ink: #e8dcc0;
    --gold: #d9a441;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    font-family: "IM Fell English", Georgia, serif;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  #screen {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; cursor: none; touch-action: none; outline: none;
    image-rendering: pixelated;
  }
  #screen:focus-visible { outline: 1px solid var(--gold); }
</style>
<div id="stage"><canvas id="screen" tabindex="0" aria-label="Hora Mortis — click to play. A and D move, W jumps, S rolls, click strikes, Shift slows time, E performs the last rites."></canvas></div>
