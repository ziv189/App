<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Frozen Hour</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07050a; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      display: block;
      background: #000;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" tabindex="0"></canvas>

  <!-- Art: shared helpers first, then every drawn character and creature -->
  <script src="js/art/base.js"></script>
  <script src="js/art/humanoid.js"></script>
  <script src="js/art/enemies.js"></script>
  <!-- Per-character and per-creature overrides (each one replaces the base drawing for its id) -->
  <script src="js/art/chars/leo.js"></script>
  <script src="js/art/chars/mireille.js"></script>
  <script src="js/art/chars/gaspard.js"></script>
  <script src="js/art/chars/regent.js"></script>
  <script src="js/art/chars/juliette.js"></script>
  <script src="js/art/chars/elias.js"></script>
  <script src="js/art/chars/pivert.js"></script>
  <script src="js/art/chars/hugo.js"></script>
  <script src="js/art/chars/bastien.js"></script>
  <script src="js/art/chars/tomas.js"></script>
  <script src="js/art/creatures/rouage.js"></script>
  <script src="js/art/creatures/fige.js"></script>
  <script src="js/art/creatures/sablier.js"></script>

  <!-- Environment and audio -->
  <script src="js/env/env.js"></script>
  <script src="js/env/themes/station.js"></script>
  <script src="js/env/themes/market.js"></script>
  <script src="js/env/themes/foundry.js"></script>
  <script src="js/env/themes/tower.js"></script>
  <script src="js/env/themes/clockface.js"></script>
  <script src="js/audio/audio.js"></script>
  <script src="js/audio/tracks/title.js"></script>
  <script src="js/audio/tracks/ch1.js"></script>
  <script src="js/audio/tracks/ch2.js"></script>
  <script src="js/audio/tracks/ch3.js"></script>
  <script src="js/audio/tracks/ch4.js"></script>
  <script src="js/audio/tracks/ch5.js"></script>
  <script src="js/audio/tracks/boss.js"></script>
  <script src="js/audio/tracks/ending_good.js"></script>
  <script src="js/audio/tracks/ending_bad.js"></script>

  <!-- Chapters (maps, scenes, dialogue) and endings -->
  <script src="js/chapters/index.js"></script>
  <script src="js/chapters/ch1.js"></script>
  <script src="js/chapters/ch2.js"></script>
  <script src="js/chapters/ch3.js"></script>
  <script src="js/chapters/ch4.js"></script>
  <script src="js/chapters/ch5.js"></script>
  <script src="js/story/endings.js"></script>

  <!-- Engine (last) -->
  <script src="js/game.js"></script>
</body>
</html>
