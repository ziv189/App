  <script>
/* js/art/base.js */
/* ART — registre et helpers de dessin partagés par tous les personnages et ennemis.
   Contrat : voir game/DESIGN.md, section 5. Ne pas modifier la signature des helpers. */
(function () {
  const ART = {
    OUT: '#1c1420',
    chars: {},

    register(ch) {
      this.chars[ch.id] = ch;
      return ch;
    },

    get(id) {
      return this.chars[id] || null;
    },

    /* Dessine le personnage `id` avec la pose `pose`, pieds en (0,0), face à droite par défaut. */
    draw(ctx, id, pose) {
      const c = this.chars[id];
      const p = pose || {};
      ctx.save();
      if (p.facing === -1) ctx.scale(-1, 1);
      try {
        if (c && typeof c.draw === 'function') c.draw(ctx, p);
        else placeholder(ctx, c ? c.w : 24, c ? c.h : 40);
      } catch (e) {
        // Un dessin défectueux ne doit jamais faire planter le jeu.
        placeholder(ctx, 24, 40);
      }
      ctx.restore();
    },

    /* Dessine le portrait (buste 200x200 centré sur 0,0) pour la boîte de dialogue. */
    portrait(ctx, id, expr, t) {
      const c = this.chars[id];
      ctx.save();
      try {
        if (c && typeof c.portrait === 'function') c.portrait(ctx, expr || 'neutral', t || 0);
        else placeholderPortrait(ctx);
      } catch (e) {
        placeholderPortrait(ctx);
      }
      ctx.restore();
    },

    /* ---------- helpers ---------- */

    limb(ctx, x1, y1, x2, y2, width, color, opts) {
      const o = opts || {};
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.lineCap = 'round';
      if (o.stroke !== false) {
        ctx.strokeStyle = o.outline || ART.OUT;
        ctx.lineWidth = width + (o.lw == null ? 2 : o.lw) * 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    },

    ell(ctx, x, y, rx, ry, color, opts) {
      const o = opts || {};
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.translate(x, y);
      ctx.rotate(o.rot || 0);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (o.stroke !== false) {
        ctx.strokeStyle = o.outline || ART.OUT;
        ctx.lineWidth = o.lw == null ? 2 : o.lw;
        ctx.stroke();
      }
      ctx.restore();
    },

    rr(ctx, x, y, w, h, r, color, opts) {
      const o = opts || {};
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(o.rot || 0);
      const rw = w / 2, rh = h / 2;
      const rad = Math.max(0, Math.min(r, rw, rh));
      ctx.beginPath();
      ctx.moveTo(-rw + rad, -rh);
      ctx.arcTo(rw, -rh, rw, rh, rad);
      ctx.arcTo(rw, rh, -rw, rh, rad);
      ctx.arcTo(-rw, rh, -rw, -rh, rad);
      ctx.arcTo(-rw, -rh, rw, -rh, rad);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      if (o.stroke !== false) {
        ctx.strokeStyle = o.outline || ART.OUT;
        ctx.lineWidth = o.lw == null ? 2 : o.lw;
        ctx.stroke();
      }
      ctx.restore();
    },

    poly(ctx, pts, color, opts) {
      const o = opts || {};
      if (!pts || pts.length < 3) return;
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      if (o.stroke !== false) {
        ctx.strokeStyle = o.outline || ART.OUT;
        ctx.lineWidth = o.lw == null ? 2 : o.lw;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      ctx.restore();
    },

    gear(ctx, x, y, r, teeth, rot, color, opts) {
      const o = opts || {};
      const n = Math.max(3, teeth | 0);
      const inner = r * 0.78;
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const a0 = (i / (n * 2)) * Math.PI * 2;
        const a1 = ((i + 0.5) / (n * 2)) * Math.PI * 2;
        const rr = i % 2 === 0 ? r : inner;
        if (i === 0) ctx.moveTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
        else ctx.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
        ctx.lineTo(Math.cos(a1) * rr, Math.sin(a1) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      if (o.stroke !== false) {
        ctx.strokeStyle = o.outline || ART.OUT;
        ctx.lineWidth = o.lw == null ? 2 : o.lw;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      // moyeu
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = ART.shade(color, -0.35);
      ctx.fill();
      ctx.restore();
    },

    /* Œil : blanc + pupille. blink 0 (ouvert) .. 1 (fermé). lookX/lookY : direction de regard (-1..1). */
    eye(ctx, x, y, r, lookX, lookY, blink, opts) {
      const o = opts || {};
      const b = ART.clamp(blink || 0, 0, 1);
      const ry = Math.max(0.6, r * (1 - b));
      ctx.save();
      ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
      ctx.beginPath();
      ctx.ellipse(x, y, r, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = o.white || '#f6efe1';
      ctx.fill();
      ctx.strokeStyle = o.outline || ART.OUT;
      ctx.lineWidth = o.lw == null ? 1.5 : o.lw;
      ctx.stroke();
      if (b < 0.8) {
        const pr = r * 0.5;
        const px = x + ART.clamp(lookX || 0, -1, 1) * r * 0.35;
        const py = y + ART.clamp(lookY || 0, -1, 1) * r * 0.25;
        ctx.beginPath();
        ctx.ellipse(px, py, pr, Math.min(pr, ry), 0, 0, Math.PI * 2);
        ctx.fillStyle = o.pupil || '#20181f';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px - pr * 0.3, py - pr * 0.35, pr * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
      ctx.restore();
    },

    /* Éclaircit (amt > 0) ou assombrit (amt < 0) une couleur '#rrggbb'. amt dans [-1, 1]. */
    shade(hex, amt) {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
      if (!m) return hex;
      const n = parseInt(m[1], 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const f = ART.clamp(amt || 0, -1, 1);
      const t = f < 0 ? 0 : 255;
      const k = Math.abs(f);
      r = Math.round(r + (t - r) * k);
      g = Math.round(g + (t - g) * k);
      b = Math.round(b + (t - b) * k);
      return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
    },

    lerp(a, b, t) {
      return a + (b - a) * t;
    },

    clamp(v, a, b) {
      return v < a ? a : v > b ? b : v;
    },
  };

  function placeholder(ctx, w, h) {
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(-w / 2, -h, w, h);
  }

  function placeholderPortrait(ctx) {
    ctx.fillStyle = '#555';
    ctx.fillRect(-100, -100, 200, 200);
  }

  window.ART = ART;
})();

</script>
  <script>
/* js/art/humanoid.js */
/* Shared rig for every person in the game: player, NPCs, Regent, Juliette, Gaspard, Elias.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up. Registers all people with ART. */
(function () {
  const OUT = ART.OUT;
  const clamp = ART.clamp;
  const lerp = ART.lerp;

  const SPEC = {
    leo: { k: 1, skin: '#f1c7a0', hair: '#3a2a22', hairStyle: 'short', coat: '#7a4a2b', shirt: '#efe6d2',
      pants: '#3b3f4e', boots: '#2a1d17', scarf: '#2d4a7a', scarfStripe: '#d9c27a', goggles: true,
      weapon: 'wrench', metal: '#c99a3b', hat: 'none' },
    mireille: { k: 0.96, skin: '#e8b89a', hair: '#b8462b', hairStyle: 'braids', coat: '#5b2a4e', trim: '#c99a3b',
      shirt: '#f4efe6', pants: '#2f2a3a', boots: '#4a2e1d', weapon: 'dagger', metal: '#cfd5dc', hat: 'none' },
    gaspard: { k: 1.25, robot: true, brass: '#c9963f', skin: '#c9963f', hair: '#7a5222', coat: '#1f3a33', trim: '#2d5a4d',
      collar: '#f4efe6', glass: '#6fd3ff', pants: '#1a2b26', boots: '#5a3d1d', hat: 'none', weapon: 'none', hairStyle: 'none' },
    regent: { k: 2.05, skin: '#e6c3a5', hair: '#c9c4cc', hairStyle: 'swept', coat: '#1a1a24', lining: '#3d1f4f',
      gold: '#d9b35a', porcelain: '#efe9dc', crack: '#8a7f6e', mask: true, pants: '#15151d', boots: '#0e0e12',
      weapon: 'cane', metal: '#d9b35a', hat: 'none' },
    juliette: { k: 0.82, ghost: true, skin: '#fbe7c8', hair: '#5a3b26', hairStyle: 'floating', dress: '#f4ead0',
      trim: '#d9b35a', glow: '#ffe9a8', hat: 'none', weapon: 'none' },
    elias: { k: 1.12, skin: '#e8c3a0', hair: '#8a8580', hairStyle: 'short', coat: '#4a3626', shirt: '#dfd8c8',
      pants: '#2d2a33', boots: '#2a1d17', brassHalf: true, glasses: true, brass: '#c9963f', gear: '#d9b35a',
      weapon: 'none', hat: 'none' },
    pivert: { k: 1, skin: '#f0c49b', hair: '#6b4a33', hairStyle: 'bun', dress: '#c25a4e', apron: '#f7f1e4',
      hat: 'headscarf', scarf: '#2b3f6e', dots: '#e8b84d', pants: '#4e3b2e', boots: '#3a2a22', carry: 'bread',
      weapon: 'none' },
    hugo: { k: 0.86, skin: '#e2b08c', hair: '#b8b2a8', hairStyle: 'bald', beard: '#b8b2a8', coat: '#3c5e8b',
      hat: 'cap', capColor: '#4a3b2a', glasses: true, pants: '#3a3a40', boots: '#2a2018', carry: 'loupe', weapon: 'none' },
    bastien: { k: 1, skin: '#f0c9a5', hair: '#3a2a22', hairStyle: 'short', coat: '#1f2d4a', trim: '#d9b35a',
      pants: '#1f2d4a', boots: '#1a1a1a', hat: 'peaked', capColor: '#1f2d4a', moustache: true, carry: 'clipboard',
      weapon: 'none' },
    tomas: { k: 0.68, skin: '#f1c7a0', hair: '#8c5a2e', hairStyle: 'short', coat: '#2d3e6b', stripes: '#efe6d2',
      pants: '#6b4a2a', boots: '#3a2a22', laugh: true, carry: 'bread', hat: 'none', weapon: 'none' },
  };

  const seg = (x, y, a, len) => [x + Math.sin(a) * len, y + Math.cos(a) * len];
  const blinkAt = (t) => ((t % 3.4) < 0.12 ? 1 : 0);

  /* ---------- head (origin = head centre, radius R) ---------- */
  function backHair(ctx, sp, R, o) {
    const hair = sp.hair;
    const st = sp.hairStyle;
    if (st === 'long' || st === 'braids') {
      ART.rr(ctx, -R * 1.02, -0.2 * R, R * 2.04, R * 1.4, R * 0.6, hair);
    }
    if (st === 'braids') {
      const sway = Math.sin((o.t || 0) * 9) * 0.12 * R;
      ART.limb(ctx, -0.6 * R, 0.4 * R, -1.25 * R, 1.9 * R + sway, 0.42 * R, hair, { lw: 1.2 });
      ART.limb(ctx, -0.9 * R, 0.4 * R, -1.65 * R, 1.6 * R - sway, 0.4 * R, hair, { lw: 1.2 });
    }
    if (st === 'bun') ART.ell(ctx, -0.55 * R, -0.95 * R, 0.55 * R, 0.55 * R, hair);
    if (st === 'swept') ART.rr(ctx, -R * 1.0, -0.6 * R, R * 1.6, R * 1.2, R * 0.5, hair, { lw: 1.4 });
    if (st === 'floating') {
      const tm = o.time || 0;
      for (let i = 0; i < 4; i++) {
        const x0 = (i - 1.5) * 0.45 * R;
        const w = Math.sin(tm * 2 + i) * 0.25 * R;
        ART.limb(ctx, x0, -0.7 * R, x0 + w, -1.8 * R - i * 0.25 * R, 0.25 * R, hair, { lw: 1 });
      }
    }
  }
  function frontHair(ctx, sp, R) {
    const st = sp.hairStyle;
    if (st === 'none' || st === 'bald') return;
    if (st === 'curly') {
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI * 0.9 + (i / 6) * Math.PI * 0.9;
        ART.ell(ctx, Math.cos(a) * R * 0.85, -0.3 * R + Math.sin(a) * R * 0.85, 0.36 * R, 0.36 * R, sp.hair, { lw: 1.2 });
      }
      return;
    }
    const ry = st === 'floating' ? 0.62 * R : 0.74 * R;
    ART.ell(ctx, -0.05 * R, -0.3 * R, R * 1.02, ry, sp.hair);
    if (st === 'swept') ART.limb(ctx, -0.2 * R, -0.75 * R, 0.5 * R, -0.5 * R, 0.14 * R, '#ffffff', { lw: 0, alpha: 0.5 });
  }
  function hat(ctx, sp, R) {
    const h = sp.hat;
    if (!h || h === 'none') return;
    if (h === 'cap' || h === 'peaked') {
      const len = h === 'peaked' ? 1.6 : 1.4;
      ART.ell(ctx, 0, -0.85 * R, R * 1.0, R * 0.55, sp.capColor || '#4a3b2a');
      ART.poly(ctx, [[0.45 * R, -0.72 * R], [len * R, -0.55 * R], [len * R - 0.1 * R, -0.4 * R], [0.42 * R, -0.5 * R]], sp.capColor || '#4a3b2a');
      if (h === 'peaked') ART.ell(ctx, 0.05 * R, -0.98 * R, 0.16 * R, 0.16 * R, '#d9b35a', { lw: 1.2 });
    } else if (h === 'bowler') {
      ART.ell(ctx, 0, -0.9 * R, 1.35 * R, 0.22 * R, '#2b2420');
      ART.rr(ctx, -0.8 * R, -2.0 * R, 1.6 * R, 1.25 * R, 0.5 * R, '#2b2420');
    } else if (h === 'headscarf') {
      const c = sp.scarf || '#2b3f6e';
      ART.poly(ctx, [[-1.08 * R, -0.1 * R], [-0.95 * R, -1.15 * R], [0.35 * R, -1.3 * R], [1.08 * R, -0.35 * R], [0.62 * R, -0.52 * R], [-0.5 * R, -0.62 * R]], c);
      for (let i = 0; i < 6; i++) ART.ell(ctx, -0.8 * R + i * 0.32 * R, -0.85 * R + (i % 2) * 0.22 * R, 0.07 * R, 0.07 * R, sp.dots || '#e8b84d', { stroke: false });
    }
  }
  function goggles(ctx, sp, R, front) {
    const gy = -0.78 * R;
    ART.limb(ctx, -1.02 * R, -0.5 * R, 1.0 * R, -0.55 * R, 0.14 * R, '#5a3b22', { lw: 1 });
    if (front) {
      ART.ell(ctx, -0.4 * R, gy, 0.38 * R, 0.34 * R, sp.metal || '#c99a3b');
      ART.ell(ctx, 0.4 * R, gy, 0.38 * R, 0.34 * R, sp.metal || '#c99a3b');
      ART.ell(ctx, -0.4 * R, gy, 0.24 * R, 0.22 * R, '#7fd0e8', { lw: 1.2 });
      ART.ell(ctx, 0.4 * R, gy, 0.24 * R, 0.22 * R, '#7fd0e8', { lw: 1.2 });
    } else {
      ART.ell(ctx, 0.25 * R, gy, 0.38 * R, 0.34 * R, sp.metal || '#c99a3b');
      ART.ell(ctx, 0.25 * R, gy, 0.24 * R, 0.22 * R, '#7fd0e8', { lw: 1.2 });
    }
  }
  function brows(ctx, x, by, expr, dirIn) {
    let yIn = by, yOut = by;
    if (expr === 'angry') { yIn = by + 0.16 * 1; yOut = by - 0.1; }
    if (expr === 'sad' || expr === 'worried') { yIn = by - 0.12; yOut = by + 0.04; }
    if (expr === 'happy') { yIn = by - 0.04; yOut = by - 0.04; }
    if (expr === 'surprised') { yIn = by - 0.1; yOut = by - 0.1; }
    return [[x - 0.26 * dirIn, yOut], [x + 0.26 * dirIn, yIn]];
  }
  function face(ctx, sp, R, o) {
    const front = !!o.front;
    const expr = o.expr || 'neutral';
    const ey = -0.12 * R;
    const eyeR = (expr === 'surprised' || sp.ghost ? 0.23 : 0.17) * R;
    const xs = front ? [-0.38 * R, 0.38 * R] : [0.38 * R];
    xs.forEach((x, i) => {
      const dirIn = front ? (x < 0 ? 1 : -1) : -1;
      if (sp.brassHalf && !front) {
        // one dial eye instead of a real eye
        ART.ell(ctx, x, ey, eyeR * 1.05, eyeR * 1.05, '#f7f3e8', { lw: 1.5 });
        const a = (o.time || 0) * 0.8;
        ART.limb(ctx, x, ey, x + Math.sin(a) * eyeR * 0.7, ey - Math.cos(a) * eyeR * 0.7, 1.4, '#222', { stroke: false });
        ART.limb(ctx, x, ey, x + Math.sin(a * 0.1) * eyeR * 0.9, ey + Math.cos(a * 0.1) * eyeR * 0.9, 1, '#222', { stroke: false });
      } else if (expr === 'happy') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, ey + 0.05 * R, eyeR, Math.PI * 1.12, Math.PI * 1.88);
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.restore();
      } else {
        ART.eye(ctx, x, ey, eyeR, o.look || 0, 0, o.blink || 0, { lw: 1.4 });
      }
      const [b1, b2] = brows(ctx, x, ey - 0.42 * R, expr, dirIn);
      ART.limb(ctx, b1[0], b1[1], b2[0], b2[1], 0.09 * R, sp.hairStyle === 'none' ? OUT : (sp.hair || OUT), { lw: 0.6 });
      if (sp.glasses) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, ey, 0.34 * R, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(190,225,240,0.25)'; ctx.fill();
        ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.restore();
      }
    });
    if (sp.beard) ART.ell(ctx, front ? 0 : 0.2 * R, 0.62 * R, 0.82 * R, 0.5 * R, sp.beard);
    if (sp.moustache) ART.limb(ctx, front ? -0.25 * R : 0.1 * R, 0.36 * R, front ? 0.25 * R : 0.6 * R, 0.3 * R, 0.16 * R, '#2a2220', { lw: 0.8 });
    mouth(ctx, sp, R, expr, front, o);
  }
  function mouth(ctx, sp, R, expr, front, o) {
    const mx = front ? 0 : 0.36 * R, my = 0.44 * R;
    const w = front ? 0.36 * R : 0.26 * R;
    if (sp.laugh || (expr === 'happy' && sp.laugh !== false && o.big)) {
      ART.ell(ctx, mx, my, w * 0.5, w * 0.36, '#3a1a1a', { lw: 1 });
      ART.rr(ctx, mx - w * 0.4, my - w * 0.28, w * 0.8, w * 0.22, 2, '#ffffff', { lw: 0.8 });
      return;
    }
    const talking = o.talk ? Math.abs(Math.sin((o.time || 0) * 16)) : 0;
    ctx.save();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (talking > 0.2) {
      ctx.fillStyle = '#4a1f22';
      ctx.ellipse(mx, my, w * 0.28, w * 0.2 * talking, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else if (expr === 'happy') {
      ctx.moveTo(mx - w / 2, my - 0.02 * R);
      ctx.quadraticCurveTo(mx, my + 0.2 * R, mx + w / 2, my - 0.02 * R);
      ctx.stroke();
    } else if (expr === 'sad') {
      ctx.moveTo(mx - w / 2, my + 0.06 * R);
      ctx.quadraticCurveTo(mx, my - 0.12 * R, mx + w / 2, my + 0.06 * R);
      ctx.stroke();
    } else if (expr === 'surprised') {
      ctx.fillStyle = '#4a1f22';
      ctx.ellipse(mx, my, w * 0.22, w * 0.27, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else if (expr === 'worried') {
      ctx.moveTo(mx - w / 2, my);
      ctx.quadraticCurveTo(mx - w * 0.2, my - 0.08 * R, mx, my);
      ctx.quadraticCurveTo(mx + w * 0.2, my + 0.08 * R, mx + w / 2, my);
      ctx.stroke();
    } else if (expr === 'angry') {
      ctx.moveTo(mx - w / 2, my + 0.03 * R);
      ctx.lineTo(mx + w / 2, my - 0.03 * R);
      ctx.stroke();
    } else {
      ctx.moveTo(mx - w / 2, my);
      ctx.lineTo(mx + w / 2, my);
      ctx.stroke();
    }
    ctx.restore();
  }

  function robotHead(ctx, sp, R, o) {
    const front = !!o.front;
    ART.rr(ctx, -0.95 * R, -1.1 * R, 1.9 * R, 2.1 * R, 0.6 * R, sp.brass);
    ART.rr(ctx, -0.55 * R, -0.75 * R, 1.1 * R, 0.95 * R, 0.25 * R, '#2a2a30', { lw: 1.4 });
    const glow = 0.6 + 0.4 * Math.sin((o.time || 0) * 3);
    const gx = front ? 0 : 0.2 * R;
    const eyes = front ? [-0.25 * R, 0.25 * R] : [gx];
    eyes.forEach((ex) => {
      ctx.save();
      ctx.shadowColor = sp.glass; ctx.shadowBlur = 12 * glow;
      ART.ell(ctx, ex, -0.3 * R, 0.2 * R, 0.2 * R, sp.glass, { lw: 1.2 });
      ctx.restore();
    });
    for (let i = 0; i < 3; i++) ART.limb(ctx, -0.4 * R + i * 0.4 * R, 0.5 * R, -0.4 * R + i * 0.4 * R, 0.78 * R, 1.4, '#3a2a18', { lw: 0.4 });
  }
  function maskHalf(ctx, sp, R, o) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-0.1 * R, -R * 1.2, R * 1.4, R * 2.4); ctx.clip();
    ART.ell(ctx, 0, 0, R, R * 1.05, sp.porcelain, { lw: 1.4 });
    const cr = sp.crack;
    ART.limb(ctx, 0.35 * R, -0.6 * R, 0.85 * R, -0.05 * R, 1.2, cr, { stroke: false });
    ART.limb(ctx, 0.5 * R, 0.1 * R, 0.1 * R, 0.6 * R, 1.2, cr, { stroke: false });
    ART.limb(ctx, 0.4 * R, -0.1 * R, 0.85 * R, 0.3 * R, 1.0, cr, { stroke: false });
    ctx.restore();
    ART.ell(ctx, 0.4 * R, -0.12 * R, 0.2 * R, 0.14 * R, '#2a2228', { lw: 1 });
    ART.limb(ctx, 0.15 * R, -0.42 * R, 0.6 * R, -0.45 * R, 0.07 * R, sp.gold, { lw: 0.6 });
  }
  function brassHalf(ctx, sp, R, o) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-0.05 * R, -R * 1.2, R * 1.4, R * 2.4); ctx.clip();
    ART.ell(ctx, 0, 0, R, R * 1.05, sp.brass, { lw: 1.4 });
    ctx.restore();
    ART.gear(ctx, 0.5 * R, 0.25 * R, 0.34 * R, 7, (o.time || 0) * 2, sp.gear, { lw: 1 });
  }

  function drawHead(ctx, sp, R, o) {
    backHair(ctx, sp, R, o);
    if (sp.robot) {
      robotHead(ctx, sp, R, o);
    } else {
      ART.ell(ctx, 0, 0, R, R * 1.05, sp.skin || '#f1c7a0');
      if (sp.mask) maskHalf(ctx, sp, R, o);
      if (sp.brassHalf) brassHalf(ctx, sp, R, o);
      frontHair(ctx, sp, R);
      hat(ctx, sp, R);
      if (sp.goggles) goggles(ctx, sp, R, !!o.front);
      if (sp.ghost) ART.ell(ctx, 0.35 * R, 0.3 * R, 0.18 * R, 0.12 * R, '#f2a8a0', { alpha: 0.5, stroke: false });
      face(ctx, sp, R, o);
      return;
    }
    hat(ctx, sp, R);
    face(ctx, sp, R, o);
  }

  /* ---------- body ---------- */
  function drawLegs(ctx, sp, k, hipY, th1, sh1, th2, sh2) {
    const legW = 6.2 * k;
    const legs = [
      { th: th2, sh: sh2, col: ART.shade(sp.pants || '#333', -0.25) },
      { th: th1, sh: sh1, col: sp.pants || '#333' },
    ];
    for (const L of legs) {
      const [kx, ky] = seg(0, hipY, L.th, 10.5 * k);
      const [fx, fy] = seg(kx, ky, L.th + L.sh, 10.5 * k);
      ART.limb(ctx, 0, hipY, kx, ky, legW, L.col, { lw: 1.6 });
      ART.limb(ctx, kx, ky, fx, fy, legW * 0.9, L.col, { lw: 1.6 });
      ART.ell(ctx, fx + 1.5 * k, fy - 1.5 * k, 3.6 * k, 2.6 * k, sp.boots || '#2a1d17', { lw: 1.4 });
    }
  }

  function drawFigure(ctx, sp, p) {
    const k = sp.k || 1;
    const st = p.state || 'idle';
    const t = p.t || 0, tm = p.time || 0;
    const moving = st === 'walk' || st === 'run';
    const ph = tm * (st === 'run' ? 13 : 8);
    const amp = st === 'run' ? 0.85 : 0.5;
    const idleSway = Math.sin(tm * 2.6);
    let th1 = 0, sh1 = 0, th2 = 0, sh2 = 0, au1 = 0.12, af1 = 0.25, au2 = -0.12, af2 = 0.2, lean = 0;
    let bob = idleSway * 0.6 * k;
    switch (st) {
      case 'walk':
      case 'run':
        th1 = Math.sin(ph) * amp; th2 = Math.sin(ph + Math.PI) * amp;
        sh1 = 0.2 * th1 - 0.4 * Math.max(0, Math.cos(ph));
        sh2 = 0.2 * th2 - 0.4 * Math.max(0, Math.cos(ph + Math.PI));
        au1 = -Math.sin(ph) * 0.7; au2 = Math.sin(ph) * 0.7; af1 = 0.3; af2 = 0.3;
        lean = st === 'run' ? 0.18 : 0.05;
        bob = -Math.abs(Math.sin(ph)) * 2.2 * k;
        break;
      case 'jump':
        th1 = 0.95; sh1 = -0.8; th2 = 0.55; sh2 = -1.3; au1 = 2.7; af1 = 0.25; au2 = 2.3; af2 = 0.45; lean = -0.06; bob = 0;
        break;
      case 'fall':
        th1 = 0.35; sh1 = 0.1; th2 = -0.35; sh2 = -0.15; au1 = 1.9; af1 = 0.2; au2 = -1.5; af2 = 0.2; lean = 0.05; bob = 0;
        break;
      case 'land':
        th1 = 0.5; sh1 = -0.9; th2 = 0.5; sh2 = -0.9; au1 = 0.8; af1 = 0.3; au2 = 0.6; af2 = 0.3; lean = 0.22;
        bob = -3 * k;
        break;
      case 'attack': {
        const u = clamp(t / 0.26, 0, 1);
        const e = 1 - Math.pow(1 - u, 3);
        th1 = 0.22; sh1 = 0.05; th2 = -0.22; sh2 = 0; lean = 0.14;
        au1 = lerp(2.5, -0.5, e); af1 = lerp(0.2, 0.1, e);
        au2 = 0.6; af2 = 0.5;
        break;
      }
      case 'dash':
        th1 = -0.5; sh1 = -0.2; th2 = -0.95; sh2 = -0.5; au1 = -2.2; af1 = 0.15; au2 = -1.7; af2 = 0.2; lean = 1.15; bob = 0;
        break;
      case 'hurt':
        lean = -0.28; au1 = 2.2; af1 = 0.6; au2 = 1.6; af2 = 0.8; bob = 0;
        break;
      case 'talk':
        au1 = 1.15; af1 = 2.0; au2 = 0.1; af2 = 0.2; lean = 0.02;
        break;
      case 'slow':
        au1 = 0.12 + idleSway * 0.05; au2 = -0.12 - idleSway * 0.05;
        break;
      case 'dead':
        au1 = 0.4; af1 = 0.6; au2 = -0.5; af2 = 0.5; lean = -0.3;
        break;
      default:
        break;
    }
    if (sp.hat === 'peaked' && st === 'idle') lean = 0;

    const hipY = -21 * k + bob;
    ctx.save();
    if (st === 'dead') {
      const u = Math.min(1, t / 0.5);
      ctx.rotate(-u * Math.PI / 2 * 0.95);
      if (t > 0.6) ctx.globalAlpha *= Math.max(0, 1 - (t - 0.6) / 0.5);
    }
    drawLegs(ctx, sp, k, hipY, th1, sh1, th2, sh2);

    // upper body, rotated around the hip
    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate(lean);
    const arm = (a, af, col, w) => {
      const [ex, ey] = seg(0, -14 * k, a, 7.5 * k);
      const [hx, hy] = seg(ex, ey, a + af, 7 * k);
      ART.limb(ctx, 0, -14 * k, ex, ey, w * k, col, { lw: 1.4 });
      ART.limb(ctx, ex, ey, hx, hy, w * 0.85 * k, sp.skin || '#f1c7a0', { lw: 1.4 });
      return [hx, hy];
    };
    const sleeve = sp.robot ? sp.brass : sp.coat || sp.dress || '#444';
    arm(au2, af2, ART.shade(sleeve, -0.25), 5.2);

    // tails / dress / apron
    if (sp.dress && !sp.ghost) {
      ART.poly(ctx, [[-8 * k, -4 * k], [8 * k, -4 * k], [11 * k, 14 * k], [-11 * k, 14 * k]], sp.dress);
    }
    if (sp.lining) ART.poly(ctx, [[-8 * k, -2 * k], [8 * k, -2 * k], [10 * k, 17 * k], [-10 * k, 17 * k]], sp.coat);
    if (sp.lining) ART.poly(ctx, [[-2 * k, 0], [8 * k, 0], [9 * k, 16 * k], [0, 16 * k]], sp.lining, { stroke: false });
    if (sp.robot) ART.poly(ctx, [[-8 * k, -4 * k], [8 * k, -4 * k], [9 * k, 14 * k], [-9 * k, 14 * k]], sp.coat);
    // torso
    ART.rr(ctx, -7 * k, -18 * k, 14 * k, 17 * k, 4 * k, sp.robot ? sp.brass : (sp.coat || sp.dress || '#444'));
    if (sp.robot) {
      ART.rr(ctx, -7.2 * k, -18 * k, 14.4 * k, 5 * k, 3 * k, sp.coat);
      ART.gear(ctx, 0, -10 * k, 3.2 * k, 8, tm * 2, sp.brass, { lw: 1 });
    }
    if (sp.trim) ART.rr(ctx, -1.2 * k, -18 * k, 2.4 * k, 16 * k, 1, sp.trim, { lw: 0.8 });
    if (sp.shirt) ART.poly(ctx, [[-2.5 * k, -18 * k], [2.5 * k, -18 * k], [0, -10 * k]], sp.shirt, { lw: 1 });
    if (sp.stripes) for (let i = 0; i < 4; i++) ART.rr(ctx, -7 * k, -16 * k + i * 4 * k, 14 * k, 1.8 * k, 0, sp.stripes, { stroke: false });
    if (sp.apron) ART.poly(ctx, [[-6 * k, -8 * k], [6 * k, -8 * k], [7 * k, 12 * k], [-7 * k, 12 * k]], sp.apron, { lw: 1 });
    if (sp.scarf && !sp.dress) {
      const drag = clamp(-p.vx * 0.04, -8, 8) * k;
      const w = Math.sin(tm * 8) * 1.2 * k;
      ART.poly(ctx, [[-4 * k, -20 * k], [4 * k, -20 * k], [5 * k + drag, -15 * k], [-12 * k + drag, -14 * k + w], [-13 * k + drag, -11 * k + w], [4 * k, -15 * k]], sp.scarf, { lw: 1.4 });
      if (sp.scarfStripe) ART.limb(ctx, -10 * k + drag, -15.5 * k + w, 3 * k, -17 * k, 1.4 * k, sp.scarfStripe, { stroke: false });
    }
    if (sp.collar) ART.poly(ctx, [[-4 * k, -18 * k], [4 * k, -18 * k], [0, -14 * k]], sp.collar, { lw: 1 });

    // head
    ctx.save();
    ctx.translate(0, -23 * k + (st === 'hurt' ? 1.2 * k : 0));
    const R = 8.8 * k;
    drawHead(ctx, sp, R, { expr: st === 'hurt' ? 'worried' : (sp.expr || 'neutral'), blink: blinkAt(tm), look: 0.4, talk: st === 'talk', time: tm, t: tm });
    ctx.restore();

    // front arm + weapon
    const hand = arm(au1, af1, sp.robot ? sp.brass : ART.shade(sleeve, 0.05), 5.4);
    const wAng = au1 + af1;
    const wx = hand[0], wy = hand[1];
    if (st === 'attack') {
      const start = 2.5, cur = au1;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -14 * k, 17 * k, Math.PI / 2 - start, Math.PI / 2 - cur, false);
      ctx.strokeStyle = 'rgba(255,241,201,0.45)'; ctx.lineWidth = 6 * k; ctx.stroke();
      ctx.restore();
    }
    if (sp.weapon === 'wrench') {
      const [ex, ey] = seg(wx, wy, wAng, 13 * k);
      ART.limb(ctx, wx, wy, ex, ey, 3 * k, sp.metal || '#c99a3b', { lw: 1 });
      ART.gear(ctx, ex, ey, 4.8 * k, 6, tm * 4, sp.metal || '#c99a3b', { lw: 1 });
    } else if (sp.weapon === 'dagger') {
      const [ex, ey] = seg(wx, wy, wAng, 8 * k);
      ART.limb(ctx, wx, wy, ex, ey, 2 * k, sp.metal || '#cfd5dc', { lw: 1 });
    } else if (sp.weapon === 'cane') {
      const [ex, ey] = seg(wx, wy, wAng, 30 * k);
      ART.limb(ctx, wx, wy, ex, ey, 2.2 * k, '#2a2228', { lw: 1 });
      ART.ell(ctx, ex, ey, 3.6 * k, 3.6 * k, sp.gold, { lw: 1 });
    }
    if (sp.carry === 'bread') ART.ell(ctx, wx - 2 * k, wy + 2 * k, 4.6 * k, 3.4 * k, '#d9a35a', { lw: 1.2 });
    if (sp.carry === 'clipboard') ART.rr(ctx, wx - 2 * k, wy - 6 * k, 6 * k, 8 * k, 1, '#c9a86a', { lw: 1 });
    ctx.restore(); // upper body
    ctx.restore(); // figure
  }

  function drawGhost(ctx, sp, p) {
    const k = sp.k || 0.82;
    const tm = p.time || 0;
    const st = p.state || 'idle';
    const bob = Math.sin(tm * 2) * 3 * k;
    const float = -6 * k + bob;
    ctx.save();
    ctx.globalAlpha *= 0.86;
    if (st === 'dead') { ctx.globalAlpha *= Math.max(0, 1 - (p.t || 0) / 1.0); }
    ART.ell(ctx, 0, -20 * k + float, 22 * k, 26 * k, sp.glow, { stroke: false, alpha: 0.22 });
    ctx.translate(0, float);
    const sway = Math.sin(tm * 3) * 2 * k;
    ART.poly(ctx, [[-6 * k, -22 * k], [6 * k, -22 * k], [11 * k + sway, 0], [-11 * k + sway, 0]], sp.dress, { lw: 1.2, alpha: 0.95 });
    ART.rr(ctx, -6.5 * k, -24 * k, 13 * k, 4 * k, 2 * k, sp.trim, { lw: 1 });
    const R = 8.8 * k;
    ctx.save();
    ctx.translate(0, -33 * k);
    drawHead(ctx, sp, R, { expr: st === 'hurt' ? 'worried' : (sp.expr || 'happy'), blink: blinkAt(tm), look: 0.5, talk: st === 'talk', time: tm, t: tm });
    ctx.restore();
    ART.ell(ctx, -1 * k, -18 * k, 2.2 * k, 2.2 * k, sp.trim, { lw: 1 });
    ctx.restore();
  }

  function drawBoss(ctx, sp, p) {
    // The Regent: tall, the coat is the body; the cane and the sand beam are drawn here.
    const st = p.state || 'idle';
    const t = p.t || 0, tm = p.time || 0;
    const phase = p.phase || 1;
    const k = sp.k;
    if (st === 'beam') {
      const pulse = 0.7 + 0.3 * Math.sin(tm * 30);
      ctx.save();
      ctx.globalAlpha = 0.85;
      ART.rr(ctx, 14 * k, -92, 330, 26 * pulse, 12, '#ffd27a', { lw: 1.5, alpha: 0.85 });
      ART.rr(ctx, 14 * k, -84, 330, 10, 5, '#fff3c4', { stroke: false, alpha: 0.9 });
      ctx.restore();
    }
    drawFigure(ctx, sp, { state: st === 'beam' ? 'telegraph' : st, t, time: tm, vx: p.vx, vy: p.vy });
    if (phase >= 2) {
      ART.rr(ctx, -6 * k, -110, 12 * k, 2, 0, sp.gold, { stroke: false, alpha: 0.0 });
    }
    if (phase >= 3) {
      for (let i = 0; i < 4; i++) {
        const a = tm * 1.5 + i * Math.PI / 2;
        ART.gear(ctx, Math.cos(a) * 42, -62 + Math.sin(a) * 40, 9, 9, tm * 3 + i, sp.gold, { lw: 1 });
      }
    }
    if (st === 'summon') {
      for (let i = 0; i < 6; i++) {
        const a = tm * 2 + i * Math.PI / 3;
        ART.gear(ctx, Math.cos(a) * 60, -60 + Math.sin(a) * 25, 6, 8, tm * 4, sp.gold, { lw: 1 });
      }
    }
  }

  function drawPortrait(ctx, sp, expr, t) {
    const blink = blinkAt(t);
    const coat = sp.coat || sp.dress || sp.jumper || sp.smock || '#3b3b4a';
    ART.rr(ctx, -86, 50, 172, 120, 28, coat);
    if (sp.trim) ART.limb(ctx, -20, 62, 0, 110, 3, sp.trim, { lw: 0.5 });
    if (sp.collar) ART.poly(ctx, [[-22, 52], [22, 52], [0, 80]], sp.collar);
    if (sp.scarf && !sp.dress) ART.rr(ctx, -40, 50, 80, 14, 6, sp.scarf);
    if (sp.stripes) for (let i = 0; i < 3; i++) ART.rr(ctx, -86, 62 + i * 16, 172, 6, 0, sp.stripes, { stroke: false });
    ART.rr(ctx, -15, 26, 30, 34, 8, sp.skin || '#f1c7a0');
    ctx.save();
    ctx.translate(0, -16);
    drawHead(ctx, sp, 50, { front: true, expr, blink, look: 0, talk: false, time: t, t });
    ctx.restore();
  }

  /* ---------- registration ---------- */
  function reg(id, w, h, ghost) {
    const sp = SPEC[id];
    ART.register({
      id, w, h,
      draw(ctx, p) {
        if (sp.ghost) drawGhost(ctx, sp, p);
        else if (id === 'regent') drawBoss(ctx, sp, p);
        else drawFigure(ctx, sp, p);
      },
      portrait(ctx, expr, t) { drawPortrait(ctx, sp, expr, t); },
    });
  }
  reg('leo', 22, 46);
  reg('mireille', 22, 46);
  reg('gaspard', 34, 62);
  reg('regent', 60, 100);
  reg('juliette', 22, 42);
  reg('elias', 30, 64);
  reg('pivert', 28, 48);
  reg('hugo', 24, 40);
  reg('bastien', 26, 50);
  reg('tomas', 20, 32);
  window.HUMANOID_SPEC = SPEC;
})();

  <script>
/* js/art/enemies.js */
/* Enemies: rouage (clockwork crab), fige (frozen citizen), sablier (flying hourglass).
   Facing right; origin = contact point (feet / bottom). Registered with ART. */
(function () {
  const clamp = ART.clamp;
  const P = {
    brass: '#c9963f', brassDark: '#7a5222', eye: '#ff5a3c',
    stone: '#b9b2a6', stoneDark: '#7e776d', crack: '#4a4640', glow: '#ffe27a', glowRed: '#ff7a3c',
    glass: 'rgba(200,235,255,0.55)', sand: '#ffd27a', paper: '#f4efe6', ink: '#3a3a44',
  };

  /* ---- rouage: clockwork crab ---- */
  function drawRouage(ctx, p) {
    const st = p.state || 'idle';
    const t = p.t || 0, tm = p.time || 0;
    const walking = st === 'walk' || st === 'attack';
    const spin = walking ? tm * 9 : tm * 0.6;
    let lunge = 0, open = 0.25 + 0.1 * Math.sin(tm * 3);
    if (st === 'attack') { lunge = Math.min(1, t / 0.12) * 4; open = 0.9; }
    if (st === 'attack' && t > 0.2) lunge = 4 - (t - 0.2) * 14;
    const bodyY = -12 + (walking ? Math.abs(Math.sin(tm * 9)) * -1.5 : 0);
    ctx.save();
    if (st === 'dead') {
      const u = Math.min(1, t / 0.5);
      ctx.globalAlpha *= t > 0.5 ? Math.max(0, 1 - (t - 0.5) / 0.4) : 1;
      ART.gear(ctx, -4 - u * 6, -6 - u * 8, 5, 7, spin, P.brass, { lw: 1 });
      ART.gear(ctx, 6 + u * 4, -4 - u * 4, 3.5, 6, -spin, P.brassDark, { lw: 1 });
      ART.gear(ctx, 1, -16 - u * 10, 2.5, 5, spin * 2, P.brass, { lw: 1 });
      ctx.restore();
      return;
    }
    // legs (4 thin springs)
    for (let i = 0; i < 4; i++) {
      const side = i < 2 ? 1 : -1;
      const fx = -6 + (i % 2) * 8 + side * 0;
      const step = walking ? Math.sin(tm * 14 + i * 1.6) * 3 : 0;
      ART.limb(ctx, fx, bodyY + 2, fx + 6 + step, -1, 1.6, P.brassDark, { lw: 0.8 });
    }
    // body gear
    ART.gear(ctx, lunge, bodyY, 9.5, 8, spin, P.brass, { lw: 1.6 });
    ART.ell(ctx, lunge, bodyY, 3, 3, P.brassDark, { lw: 1 });
    // pincers
    const pincer = (side) => {
      const x0 = lunge + side * 9, y0 = bodyY - 2;
      const ang = side * (0.55 + open * 0.8);
      const x1 = x0 + side * 9 * Math.cos(ang), y1 = y0 - 7 * Math.sin(ang * 0.6) - 2;
      ART.limb(ctx, x0, y0, x1, y1, 3.5, P.brass, { lw: 1 });
      ART.limb(ctx, x1, y1, x1 + side * 3.5, y1 - 3.2, 3, P.brass, { lw: 1 });
      ART.limb(ctx, x1, y1, x1 + side * 3.5, y1 + 2.5, 2.5, P.brass, { lw: 1 });
    };
    pincer(1); pincer(-1);
    // antenna springs
    ART.limb(ctx, lunge + 3, bodyY - 8, lunge + 7, bodyY - 15, 1.4, P.brassDark, { lw: 0.6 });
    ART.limb(ctx, lunge - 3, bodyY - 8, lunge - 6, bodyY - 14, 1.4, P.brassDark, { lw: 0.6 });
    ART.ell(ctx, lunge + 7, bodyY - 16, 1.8, 1.8, P.eye, { lw: 0.6 });
    ART.ell(ctx, lunge - 6, bodyY - 15, 1.6, 1.6, P.eye, { lw: 0.6 });
    ctx.restore();
  }

  /* ---- fige: frozen citizen in stone ---- */
  function drawFige(ctx, p) {
    const st = p.state || 'idle';
    const t = p.t || 0, tm = p.time || 0;
    const active = st !== 'idle';
    const snap = Math.floor(tm * 4) / 4;   // stop-motion "tic-tac"
    let lean = 0, lunge = 0, armUp = 0.2;
    if (st === 'walk') { lean = Math.sin(snap * 12) * 0.05; armUp = 0.4; }
    if (st === 'attack') { lean = 0.35; lunge = Math.min(10, t * 40); armUp = 1.1; }
    if (st === 'hurt') { lean = -0.2; }
    ctx.save();
    if (st === 'dead') {
      const u = Math.min(1, t / 0.6);
      ctx.globalAlpha *= Math.max(0, 1 - Math.max(0, t - 0.5) / 0.5);
      ART.poly(ctx, [[-8, -20], [1, -22], [-3, -36], [-9, -34]], P.stone, { lw: 1.2 });
      ART.poly(ctx, [[3, -22], [10, -24], [8, -30], [2, -28]], P.stoneDark, { lw: 1.2 });
      for (let i = 0; i < 3; i++) ART.ell(ctx, (i - 1) * 6 * u, -4 - u * 6 * i, 1.6, 1.6, P.stoneDark, { stroke: false, alpha: 0.7 });
      ctx.restore();
      return;
    }
    ctx.translate(lunge, 0);
    ctx.rotate(lean);
    // legs
    const stepL = active && st === 'walk' ? (Math.floor(tm * 3.2) % 2 ? 2 : -2) : 0;
    ART.rr(ctx, -6, -22, 5, 22, 2, P.stoneDark, { lw: 1.4 });
    ART.rr(ctx, 1 + stepL, -22, 5, 22, 2, P.stone, { lw: 1.4 });
    ART.rr(ctx, -8 + stepL, -3, 9, 4, 1.5, P.stoneDark, { lw: 1.2 });
    ART.rr(ctx, 0 - stepL, -3, 9, 4, 1.5, P.stone, { lw: 1.2 });
    // coat
    ART.poly(ctx, [[-9, -40], [9, -40], [11, -20], [-11, -20]], P.stone, { lw: 1.6 });
    ART.limb(ctx, -4, -30, 4, -28, 1, P.crack, { stroke: false });
    ART.limb(ctx, 2, -36, -3, -26, 1, P.crack, { stroke: false });
    // arms
    ART.limb(ctx, -7, -37, -11, -27 + armUp * 4, 4.6, P.stoneDark, { lw: 1.2 });
    ART.limb(ctx, 7, -37, 12 + lunge * 0.5, -30 - armUp * 9, 4.6, P.stone, { lw: 1.2 });
    // head
    ART.ell(ctx, 0, -46, 7.5, 8, P.stone, { lw: 1.6 });
    ART.poly(ctx, [[-9, -48], [-6, -58], [6, -58], [9, -49]], '#2b2a33', { lw: 1.2 });   // bowler hat
    ART.ell(ctx, 0, -55, 6.5, 2.5, '#2b2a33', { lw: 1 });
    const glowing = st === 'attack' || st === 'hurt';
    const eyeCol = glowing ? P.glowRed : P.glow;
    const flick = active ? 0.5 + 0.5 * Math.sin(tm * 20) : 0.25;
    ART.ell(ctx, 2.5, -47, 1.9, 1.7, eyeCol, { lw: 0.6, alpha: 0.6 + flick * 0.4 });
    ART.ell(ctx, -2.5, -47, 1.9, 1.7, eyeCol, { lw: 0.6, alpha: 0.6 + flick * 0.4 });
    // cracks glow when attacking
    if (glowing) {
      ART.limb(ctx, -6, -28, -2, -18, 1, P.glowRed, { stroke: false, alpha: 0.9 });
      ART.limb(ctx, 5, -34, 9, -26, 1, P.glowRed, { stroke: false, alpha: 0.9 });
    }
    ART.limb(ctx, -4, -38, -2, -30, 1, P.crack, { lw: 0 });
    ART.limb(ctx, 4, -24, 6, -14, 1, P.crack, { lw: 0 });
    ctx.restore();
  }

  /* ---- sablier: flying hourglass ---- */
  function drawSablier(ctx, p) {
    const st = p.state || 'idle';
    const t = p.t || 0, tm = p.time || 0;
    ctx.save();
    if (st === 'dead') {
      const u = Math.min(1, t / 0.6);
      ctx.translate(0, u * 40);
      ctx.rotate(u * 2.5);
      ctx.globalAlpha *= Math.max(0, 1 - Math.max(0, t - 0.3) / 0.5);
    }
    const flap = st === 'dead' ? 0 : Math.sin(tm * (st === 'attack' ? 30 : 14));
    const wingSpan = st === 'dead' ? 0.2 : 1;
    // paper wings
    ART.poly(ctx, [[-2, -20], [-14 - wingSpan * 6 * flap, -26 - flap * 4], [-12, -14]], P.paper, { lw: 1 });
    ART.poly(ctx, [[2, -20], [14 + wingSpan * 6 * flap, -26 - flap * 4], [12, -14]], P.paper, { lw: 1 });
    ART.limb(ctx, -12 - wingSpan * 3 * flap, -21, -5, -17, 0.6, P.ink, { stroke: false });
    ART.limb(ctx, 12 + wingSpan * 3 * flap, -21, 5, -17, 0.6, P.ink, { stroke: false });
    // glass bulbs
    ART.poly(ctx, [[-7, -32], [7, -32], [1.5, -22], [7, -12], [-7, -12], [-1.5, -22]], P.glass, { lw: 1.4 });
    // brass caps
    ART.rr(ctx, -8.5, -35, 17, 4, 1.5, P.brass, { lw: 1.2 });
    ART.rr(ctx, -8.5, -11, 17, 4, 1.5, P.brass, { lw: 1.2 });
    // sand
    const drop = (tm * 40) % 10;
    ART.limb(ctx, 0, -22, 0, -15 + 0, 1.2, P.sand, { stroke: false });
    ART.ell(ctx, 0, -17 + drop * 0.1, 1.2, 1.4, P.sand, { stroke: false });
    ART.poly(ctx, [[-5, -13], [5, -13], [0, -17]], P.sand, { stroke: false });
    // falling grains trail
    for (let i = 0; i < 3; i++) {
      const y = -8 + ((tm * 30 + i * 9) % 18);
      ART.ell(ctx, Math.sin(tm * 3 + i) * 2, y, 0.9, 0.9, P.sand, { stroke: false, alpha: 0.7 });
    }
    ctx.restore();
  }

  function portraitStub(ctx) {
    ART.ell(ctx, 0, 0, 60, 60, '#333', { lw: 2 });
  }

  const reg = (id, w, h, draw) => ART.register({ id, w, h, draw, portrait: portraitStub });
  reg('rouage', 26, 18, drawRouage);
  reg('fige', 26, 48, drawFige);
  reg('sablier', 26, 34, drawSablier);
})();

  <!-- Per-character and per-creature overrides (each one replaces the base drawing for its id) -->
  <script>
/* js/art/chars/leo.js */
/* Léo Varin (id 'leo') — apprentice clockmaker, the player.
   Flat vector style, thick dark outlines, light from the upper left.
   draw(): facing RIGHT, origin = centre of the feet (the engine flips left-facing sprites).
   portrait(): 200x200 box centred on (0,0). Contract: game/AGENT_BRIEF.md, section "Art contract". */
(function () {
  const PAL = {
    scarf: '#1f2c55', scarfPale: '#cdd8ea',
    brass: '#d4a94e', brassDk: '#8a6a2a', brassHi: '#f3dc94', lens: '#9fd6e8',
    leather: '#6e4528', leatherLt: '#8a5a36', leatherDk: '#4a2c17',
    shirt: '#f3e7cf', shirtSh: '#d8c7a3',
    skin: '#f0c4a0', skinSh: '#d7a380',
    hair: '#4a3020', hairDk: '#3a2418',
    pants: '#3a3f52', boot: '#3b2616',
    mouth: '#7a2f2f', face: '#f6efe1', gear: '#2a1d12'
  };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
  function quad(P0, P1, P2, u) {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * P0[0] + b * P1[0] + c * P2[0], a * P0[1] + b * P1[1] + c * P2[1]];
  }

  // Frozen statues: every colour goes to a flat grey.
  function greyOf(hex) {
    const n = parseInt(hex.slice(1), 16);
    const l = ((n >> 16) & 255) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11;
    const v = Math.round(clamp(60 + l * 0.6, 0, 255)).toString(16).padStart(2, '0');
    return '#' + v + v + v;
  }
  function palette(frozen) {
    const K = {};
    for (const k in PAL) K[k] = frozen ? greyOf(PAL[k]) : PAL[k];
    return K;
  }

  function blinkAt(T) {
    const k = ((T % 3.7) + 3.7) % 3.7;
    return k < 0.14 ? Math.sin((k / 0.14) * Math.PI) : 0;
  }

  // Pose parameters. Leg and back-arm angles: from straight down, + = forward.
  // wr = direction of the Dawn Wrench from the shoulder (0 = forward, + = down, - = up).
  function pose(p, s) {
    const T = p.time || 0;
    const t = p.t || 0;
    const q = {
      hipY: -19, lean: 0.02, legF: 0.12, legB: -0.12, bB: -0.15, wr: 0.85,
      blink: blinkAt(T), mouth: 0, brow: 0, trail: false, ghost: false
    };
    switch (s) {
      case 'frozen':
        q.blink = 0;
        return q;
      case 'dead':
        q.blink = 1; q.lean = -0.1; q.bB = -1.3; q.legF = 0.5; q.legB = -0.5; q.wr = 1.4;
        return q;
      case 'walk':
      case 'run': {
        const run = s === 'run';
        const ph = T * (run ? 15 : 9), sw = Math.sin(ph), A = run ? 0.9 : 0.5;
        q.legF = sw * A; q.legB = -sw * A;
        q.bB = sw * A * 0.8 - 0.1;                       // back arm swings with the front leg
        q.wr = 0.85 + sw * (run ? 0.3 : 0.15);           // weapon arm swings against it
        q.hipY = -19 - Math.abs(Math.cos(ph)) * (run ? 2.2 : 1);
        q.lean = run ? 0.2 : 0.04;
        break;
      }
      case 'jump':
        q.legF = 0.9; q.legB = -0.5; q.bB = -1.5; q.wr = -0.5; q.lean = 0.1; q.hipY = -18;
        break;
      case 'fall':
        q.legF = 0.45; q.legB = -0.6; q.bB = -1.1; q.wr = 0.6; q.lean = -0.06;
        break;
      case 'land': {
        const k = clamp(1 - t / 0.25, 0, 1);            // knees bend, then he straightens
        q.hipY = -19 + 4 * k; q.legF = 0.12 + 0.25 * k; q.legB = -0.12 - 0.25 * k;
        q.lean = 0.02 + 0.14 * k; q.bB = -0.15 + 0.4 * k;
        break;
      }
      case 'attack': {
        // anticipation (0-0.10 s), swing (0.10-0.22 s), follow-through (0.22-0.38 s)
        q.bB = t < 0.22 ? -1.0 : 0.3;
        if (t < 0.1) {
          const k = smooth(t / 0.1);
          q.wr = lerp(0.85, -2.6, k); q.lean = lerp(0.02, -0.14, k);
          q.legF = lerp(0.12, 0.05, k); q.legB = lerp(-0.12, -0.25, k); q.hipY = -19 + 1.2 * k;
        } else if (t < 0.22) {
          const k = smooth((t - 0.1) / 0.12);
          q.wr = lerp(-2.6, 0.35, k); q.lean = lerp(-0.14, 0.26, k);
          q.legF = lerp(0.05, 0.4, k); q.legB = lerp(-0.25, -0.4, k); q.hipY = lerp(-17.8, -19.5, k);
          q.trail = true;
        } else {
          const k = clamp((t - 0.22) / 0.16, 0, 1);
          q.wr = lerp(0.35, 1.0, k); q.lean = lerp(0.26, 0.16, k);
          q.legF = 0.4; q.legB = -0.4; q.hipY = -19.5;
          q.trail = true;
        }
        break;
      }
      case 'hurt': {
        const f = clamp(1 - t / 0.35, 0, 1);            // flinch back, then recover
        q.lean = 0.02 - 0.3 * f; q.wr = lerp(0.85, -0.6, f); q.bB = -0.1 - 1.2 * f;
        q.legF = 0.15 - 0.1 * f; q.legB = -0.1;
        q.mouth = 0.1 + 0.5 * f; q.blink = Math.max(q.blink, 0.7 * f); q.brow = -0.8 * f;
        break;
      }
      case 'dash':
        q.lean = 0.45; q.hipY = -16; q.legF = 0.9; q.legB = -1.0; q.bB = -1.5; q.wr = 0.25;
        q.ghost = true;
        break;
      case 'talk':
        q.mouth = 0.15 + 0.55 * (0.5 + 0.5 * Math.sin(T * 17));
        q.wr = 0.85 + Math.sin(T * 4.5) * 0.12;
        q.bB = -0.2 + Math.sin(T * 3) * 0.12;
        break;
      default: {
        // idle, slow (Pendule active) and unknown states: breathing
        const b = Math.sin(T * (s === 'slow' ? 1.2 : 2.6));
        q.hipY += b * 0.35; q.lean += b * 0.012; q.wr += Math.sin(T * 2) * 0.04;
      }
    }
    return q;
  }

  // Striped ribbon along a polyline: dark outline, then bands; every `every`-th band is pale.
  function ribbon(ctx, pts, w0, w1, cA, cB, every) {
    const n = pts.length - 1;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = w0 + 3;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();
    for (let i = 0; i < n; i++) {
      const u = i / Math.max(1, n - 1);
      const c = i % every === every - 1 ? cB : cA;
      ART.limb(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], w0 + (w1 - w0) * u, c, { stroke: false });
    }
  }

  // Lower body, in world space with the hip at (hx, hy).
  function leg(ctx, hx, hy, a, K) {
    const s = Math.sin(a), c = Math.cos(a);
    const kx = hx + s * 9.5 + 1.2, ky = hy + c * 9.5;
    const fx = hx + s * 18.5, fy = hy + c * 18.5;
    ART.limb(ctx, hx, hy, kx, ky, 6.6, K.pants);
    ART.limb(ctx, kx, ky, fx, fy, 5.6, K.pants);
    ART.ell(ctx, fx + 1.6, fy - 1.2, 4.4, 2.6, K.boot);
    ART.ell(ctx, fx + 2.4, fy - 2, 1.4, 0.7, K.leatherLt, { stroke: false });
  }

  // Arm from shoulder to hand, elbow bent slightly backward and down.
  function arm(ctx, sx, sy, hx, hy, cloth, K) {
    const dx = hx - sx, dy = hy - sy, len = Math.hypot(dx, dy) || 1;
    const ex = (sx + hx) / 2 - (dy / len) * 2.4, ey = (sy + hy) / 2 + (dx / len) * 2.4;
    ART.limb(ctx, sx, sy, ex, ey, 5.2, cloth);
    ART.limb(ctx, ex, ey, hx, hy, 4.6, cloth);
    ART.ell(ctx, hx, hy, 2.6, 2.6, K.skin, { lw: 1.4 });
  }

  // Scarf tail: streams behind him. p.vx is scaled by facing so it always trails behind the motion.
  function scarfTail(ctx, p, K) {
    const f = p.facing === -1 ? -1 : 1;
    const T = p.time || 0;
    const v = clamp(((p.vx || 0) * f) / 20, -14, 14);
    const lift = clamp(-(p.vy || 0) / 35, -5, 5);
    const w = Math.sin(T * 9) * (1 + Math.abs(v) * 0.12);
    const back = -7 - 1.1 * v;
    const P0 = [-2.5, -15.2], P1 = [back * 0.45 - 1, -16 + lift * 0.4 - w * 0.4], P2 = [back, -10 + lift + w * 0.6];
    const pts = [];
    for (let i = 0; i <= 6; i++) pts.push(quad(P0, P1, P2, i / 6));
    ribbon(ctx, pts, 6.2, 3.4, K.scarf, K.scarfPale, 3);
  }

  // Waistcoat, cream shirt, belt, pocket watch on its chain (ticking again).
  function torso(ctx, K, T) {
    ART.rr(ctx, -6, 0.5, 12, 4, 2, K.pants, { lw: 1.6 });
    ART.rr(ctx, -6.5, -14, 13, 16, 4.5, K.leather);
    ART.rr(ctx, 2.2, -13.5, 4.2, 10, 1.6, K.shirt, { lw: 1.4 });
    ctx.save();
    ctx.strokeStyle = K.leatherLt; ctx.lineWidth = 0.8; ctx.setLineDash([1.2, 1.2]);
    ctx.beginPath(); ctx.moveTo(-4.5, -12); ctx.lineTo(-4.5, -1); ctx.stroke();
    ctx.restore();
    ART.ell(ctx, 3.4, -8.5, 0.9, 0.9, K.brass, { lw: 0.8 });
    ART.ell(ctx, 3.4, -2.5, 0.9, 0.9, K.brass, { lw: 0.8 });
    ART.rr(ctx, -7, -0.6, 14, 3, 1, K.leatherDk, { lw: 1.2 });
    ART.rr(ctx, 2.6, -0.2, 2.8, 2.2, 0.6, K.brass, { lw: 1 });
    ART.limb(ctx, 3.4, -8.5, 5.6, -2.5, 0.9, K.brass, { stroke: false });
    ART.ell(ctx, 6, 1.4, 2.3, 2.3, K.brass, { lw: 1.2 });
    ART.ell(ctx, 6, 1.4, 1.5, 1.5, K.face, { stroke: false });
    ART.limb(ctx, 6, 1.4, 6 + Math.cos(T * 2.2) * 1.1, 1.4 + Math.sin(T * 2.2) * 1.1, 0.6, K.hairDk, { stroke: false });
  }

  // Head with messy hair, goggles pushed up on the forehead, brow and mouth.
  function head(ctx, q, K) {
    ART.ell(ctx, -0.6, -18.5, 1.8, 2.5, K.skinSh);
    ART.ell(ctx, 1, -19, 7.4, 8.4, K.skin);
    ART.ell(ctx, 8.1, -18.6, 1.2, 1.5, K.skin);
    ART.poly(ctx, [[-7.4, -16.5], [-7.4, -24], [-3.2, -28.8], [1.6, -30.2], [5.4, -28.2], [7.5, -23.2],
      [5.6, -23.2], [3, -23.8], [-1, -23.2], [-4.6, -18.5]], K.hair, { lw: 1.6 });
    ART.poly(ctx, [[-1.5, -29.4], [0.2, -33.4], [2.4, -29.2]], K.hair, { lw: 1.4 });
    ART.poly(ctx, [[2.4, -29.2], [4.6, -32.4], [5, -27.8]], K.hair, { lw: 1.4 });
    ART.limb(ctx, -7, -21, 6.8, -25, 1.4, K.leatherDk, { stroke: false });       // goggle strap
    ART.limb(ctx, -2.6, -27.6, 4.2, -27.5, 1.6, K.brass, { stroke: false });    // goggle bridge
    ART.ell(ctx, -2.6, -27.8, 2.9, 2.9, K.brass, { lw: 1.4 });
    ART.ell(ctx, 4.2, -27.5, 3.2, 3.2, K.brass, { lw: 1.4 });
    ART.ell(ctx, -2.6, -27.8, 1.9, 1.9, K.lens, { lw: 0.8 });
    ART.ell(ctx, 4.2, -27.5, 2.2, 2.2, K.lens, { lw: 0.8 });
    ART.eye(ctx, 4.4, -17.8, 1.9, 0.5, 0, q.blink, { lw: 0.9 });
    ART.limb(ctx, 2.6, -22.6 - q.brow * 0.3, 6.4, -21.6 + q.brow * 1.1, 1.2, K.hairDk, { stroke: false });
    if (q.mouth > 0.08) ART.ell(ctx, 6.4, -14.6, 1.2, 0.3 + q.mouth * 1.4, K.mouth, { lw: 0.9 });
    else ART.limb(ctx, 5.4, -14.6, 7.6, -14.4, 0.9, K.mouth, { stroke: false });
  }

  // Scarf wrap under the chin, with two pale stripes.
  function wrap(ctx, K) {
    ART.ell(ctx, 0.6, -10.8, 5.6, 2.9, K.scarf, { lw: 1.3 });
    ART.limb(ctx, -4, -12.2, 4, -12.2, 0.9, K.scarfPale, { stroke: false });
    ART.limb(ctx, -4, -9.6, 4, -9.6, 0.9, K.scarfPale, { stroke: false });
  }

  function figure(ctx, p, q, K) {
    const hy = q.hipY;
    leg(ctx, 0, hy, q.legB, K);
    leg(ctx, 0, hy, q.legF, K);
    ctx.save();
    ctx.translate(0, hy);
    ctx.rotate(q.lean);
    arm(ctx, 0, -13, Math.sin(q.bB) * 11, -13 + Math.cos(q.bB) * 11, K.shirtSh, K);
    scarfTail(ctx, p, K);
    torso(ctx, K, p.time || 0);
    head(ctx, q, K);
    wrap(ctx, K);
    if (q.trail) {
      // Arc traced by the wrench head (radius 39 from the shoulder): the attack trail.
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,215,122,0.35)'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0, -13, 39, -2.6, q.wr); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,246,214,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -13, 39, Math.max(-2.6, q.wr - 0.7), q.wr); ctx.stroke();
      ctx.restore();
    }
    // Front (weapon) arm and the Dawn Wrench: hand 9 px from the shoulder, handle 30 px long.
    const hx = Math.cos(q.wr) * 9, hz = -13 + Math.sin(q.wr) * 9;
    arm(ctx, 0, -13, hx, hz, K.shirt, K);
    const ex = hx + Math.cos(q.wr) * 30, ey = hz + Math.sin(q.wr) * 30;
    ART.limb(ctx, hx, hz, ex, ey, 4.4, K.brass, { lw: 1.4 });
    ART.limb(ctx, hx, hz, ex, ey, 1.2, K.brassHi, { stroke: false });
    ART.rr(ctx, ex - 6.2, ey - 5.8, 12.4, 11.6, 2.6, K.brass, { rot: q.wr, lw: 1.6 });
    ART.ell(ctx, ex + Math.cos(q.wr) * 3.4, ey + Math.sin(q.wr) * 3.4, 2.1, 2.1, PAL.gear, { stroke: false });
    ctx.restore();
  }

  function draw(ctx, p) {
    const s = p.state || 'idle';
    const K = palette(s === 'frozen');
    const q = pose(p, s);
    const dead = s === 'dead';
    const dt = p.t || 0;
    if (s === 'slow') ART.ell(ctx, 0, -23, 17, 29, PAL.lens, { stroke: false, alpha: 0.12 });
    ART.ell(ctx, 0, 0.5, 11, 2.6, '#000000', { stroke: false, alpha: dead ? 0.1 : 0.22 });
    if (dead) {
      // Falls backward around the feet and fades out.
      ctx.rotate(-Math.PI / 2 * smooth(dt / 0.45));
      ctx.globalAlpha *= 1 - smooth((dt - 0.9) / 1.1);
    }
    if (q.ghost) {
      ctx.save();
      ctx.globalAlpha *= 0.25;
      ctx.translate(-13, 0);
      figure(ctx, p, q, K);
      ctx.restore();
    }
    figure(ctx, p, q, K);
  }

  // Brow inner y, brow outer y, eye openness (1 = open), mouth curve (-1 frown .. 1 smile), mouth open (0..1)
  const EXPR = {
    neutral:   [-22, -24, 1.0, 0.0, 0.0],
    happy:     [-26, -28, 0.35, 1.0, 0.3],

    ART.ell(ctx, -44, -2, 7, 10, K.skinSh, { lw: 2.2 });
    ART.ell(ctx, 44, -2, 7, 10, K.skinSh, { lw: 2.2 });

    ctx.save();
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(-46, -22); ctx.quadraticCurveTo(0, -78, 46, -22);
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = 10; ctx.stroke();
    ctx.strokeStyle = K.leatherDk; ctx.lineWidth = 7; ctx.stroke();
    ctx.restore();
    ART.limb(ctx, -17, -52, 17, -52, 4, K.brass, { stroke: false });
    ART.ell(ctx, -17, -52, 15, 15, K.brass, { lw: 2.5 });
    ART.ell(ctx, 17, -52, 15, 15, K.brass, { lw: 2.5 });
    ART.ell(ctx, -17, -52, 10.5, 10.5, K.lens, { lw: 2 });
    ART.ell(ctx, 17, -52, 10.5, 10.5, K.lens, { lw: 2 });

    ART.ell(ctx, 14, -56, 3, 2, '#ffffff', { stroke: false, alpha: 0.7 });

    ART.eye(ctx, 17, -2, 8.5, 0.2, 0, blink, { lw: 2.2 });
    ART.limb(ctx, -34, E[1], -10, E[0], 6, K.hairDk, { stroke: false });

      ART.ell(ctx, f[0], f[1], 1.6, 1.6, '#b56e4a', { stroke: false, alpha: 0.7 });

  <script>
/* js/art/chars/mireille.js */
/* Mireille Crow (id 'mireille'), thief and ally, 22. Plain browser script.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up.
   Look: two long red braids, short plum velvet jacket with brass buttons, fingerless
   black gloves, a lockpick tucked in her hair (twirled when idle), a short dagger.
   Canvas axes: pose.vx > 0 is moving right, so the braids stream back. */
(function () {
  const clamp = ART.clamp, lerp = ART.lerp;
  const TAU = Math.PI * 2;
  const SCALE = 0.94;              // a little smaller than Leo
  const GROUND = -2.2;             // ankle height when standing; the boot sole sits on y = 0
  const HIP = -17;                 // hip height when standing
  const THIGH = 7.6, SHIN = 7.2;   // hip to ankle = 14.8
  const UPPER = 6.2, FORE = 5.8;   // shoulder to elbow, elbow to wrist
  const SF = [3.2, -13.4], SB = [-3.2, -13.2];   // shoulder joints, upper-body frame
  const STATES = ['idle', 'walk', 'run', 'jump', 'fall', 'land', 'attack', 'dash', 'hurt', 'dead', 'talk', 'slow', 'frozen'];
  const FRINGE = [[-6.4, -21.0], [-6.8, -25.4], [-5.2, -28.6], [-1.4, -30.0], [2.6, -29.4], [5.4, -27.0],
    [6.0, -24.2], [4.2, -25.4], [1.2, -26.6], [-1.6, -26.8], [-4.2, -25.0], [-5.6, -22.4]];

  const PAL = {
    hair: '#d2402c', hairDk: '#8c2417', hairHi: '#ff8a62', skin: '#e9b796', skinDk: '#c28a6c',
    freckle: '#8d3b24', jacket: '#5d2149', jacketDk: '#3b1430', jacketHi: '#8a4b80',
    shirt: '#f3ebdb', brass: '#d8a94c', steel: '#d6dce4', belt: '#2a1a14',
    pants: '#2e2843', pantsDk: '#211d31', boot: '#3d2719', bootDk: '#2a1a11',
    glove: '#1b1820', brow: '#7f2a1c', eyeIris: '#2f5c48', lipLine: '#6e2f26', mouthIn: '#3a1420', teeth: '#f6efe1',
  };

  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const mod = (v, m) => ((v % m) + m) % m;
  const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

  function stone(hex) {
    const n = parseInt(hex.slice(1), 16);
    const L = 0.3 * ((n >> 16) & 255) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255);
    const h = (v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0');
    return '#' + h(L * 0.8 + 26) + h(L * 0.82 + 30) + h(L * 0.9 + 38);
  }
  const STONE = {};
  Object.keys(PAL).forEach((k) => { STONE[k] = stone(PAL[k]); });

  /* Two-bone IK: returns the middle joint (j) and the end point (e). Picks the bend closest to (px,py). */
  function ik(ax, ay, tx, ty, l1, l2, px, py) {
    const dx = tx - ax, dy = ty - ay;
    const len = Math.hypot(dx, dy) || 1e-4;
    const d = clamp(len, Math.abs(l1 - l2) + 0.05, l1 + l2 - 0.05);
    const base = Math.atan2(dy, dx);
    const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const c1 = [ax + l1 * Math.cos(base + A), ay + l1 * Math.sin(base + A)];
    const c2 = [ax + l1 * Math.cos(base - A), ay + l1 * Math.sin(base - A)];
    const first = Math.hypot(c1[0] - px, c1[1] - py) <= Math.hypot(c2[0] - px, c2[1] - py);
    return { j: first ? c1 : c2, e: [ax + d * Math.cos(base), ay + d * Math.sin(base)] };
  }

  function leg(ctx, hip, foot, P, front) {
    const k = ik(hip[0], hip[1], foot[0], foot[1], THIGH, SHIN, hip[0] + 3, (hip[1] + foot[1]) / 2);
    const c = front ? P.pants : P.pantsDk;
    ART.limb(ctx, hip[0], hip[1], k.j[0], k.j[1], 5, c);
    ART.limb(ctx, k.j[0], k.j[1], k.e[0], k.e[1], 4.2, c);
    ART.rr(ctx, k.e[0] - 2.4, k.e[1] - 0.5, 5.8, 2.5, 1.2, front ? P.boot : P.bootDk, { lw: 1.4 });
  }

  /* Arm in the upper-body frame. Returns the hand point and the forearm direction (for the dagger). */
  function arm(ctx, P, sh, hand, sleeve) {
    const k = ik(sh[0], sh[1], hand[0], hand[1], UPPER, FORE, sh[0] - 2.2, sh[1] + 5.5);
    const wx = k.e[0], wy = k.e[1];
    let ux = wx - k.j[0], uy = wy - k.j[1];
    const ul = Math.hypot(ux, uy) || 1;
    ux /= ul; uy /= ul;
    ART.limb(ctx, sh[0], sh[1], k.j[0], k.j[1], 5, sleeve);
    ART.limb(ctx, k.j[0], k.j[1], wx, wy, 4.4, sleeve);
    ART.limb(ctx, wx - ux * 1.8, wy - uy * 1.8, wx, wy, 3.4, P.glove, { lw: 1 });   // glove cuff
    const hx = wx + ux * 2, hy = wy + uy * 2, rot = Math.atan2(uy, ux);
    ART.ell(ctx, hx, hy, 1.9, 1.5, P.glove, { rot, lw: 1.2 });                      // fingerless glove
    ART.ell(ctx, hx + ux * 1.6, hy + uy * 1.6, 1.0, 0.8, P.skin, { rot, lw: 0.8 }); // exposed fingertips
    return { hand: [hx, hy], u: [ux, uy] };
  }

  /* One braid: a chain of plaited segments that sways with time and streams back with speed. */
  function braid(ctx, P, ax, ay, o) {
    const N = o.n, seg = o.seg, rad = o.rad;
    const pts = [[ax, ay]];
    let x = ax, y = ay;
    for (let i = 0; i < N; i++) {
      const a = o.base + 0.05 * i + o.sway * (0.4 + 0.12 * i) * Math.sin(o.t * 4.2 - i * 0.75 + o.ph);
      const L = seg * (1 - 0.04 * i);
      x += Math.sin(a) * L; y += Math.cos(a) * L;

    for (let i = 0; i < N; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      const r = rad * (1 - 0.5 * i / N);
      ART.ell(ctx, (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2, r, r * 1.3, i % 2 ? P.hair : P.hairDk,
        { lw: 1.1, rot: Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) + Math.PI / 2 });
    }
    ART.ell(ctx, x, y, rad * 0.7, rad * 0.7, P.brass, { lw: 1 });
  }

  function sheath(ctx, P) {
    ART.limb(ctx, -4.6, -3.2, -7.4, 3.6, 2.2, P.belt, { lw: 0.9 });
    ART.ell(ctx, -4.4, -3.6, 1.1, 1.1, P.brass, { lw: 0.8 });
  }

  function cracks(ctx) {
    ctx.beginPath();
    ctx.moveTo(-2, -10); ctx.lineTo(0, -7); ctx.lineTo(-1.2, -4.5);
    ctx.moveTo(2.5, -15); ctx.lineTo(1.6, -12.5);

  }

  function jacket(ctx, P, frozen) {
    ART.poly(ctx, [[-4.6, 1.8], [4.6, 1.8], [5.2, -4.2], [5.6, -10.2], [4.8, -14.2], [2.4, -16.0],
      [-2.4, -16.0], [-4.8, -14.2], [-5.6, -10.2], [-5.2, -4.2]], P.jacket, { lw: 1.6 });
    ART.poly(ctx, [[-4.0, -13.2], [-1.4, -14.4], [-2.2, -9.0], [-4.4, -8.0]], P.jacketHi, { stroke: false, alpha: 0.7 });
    ART.poly(ctx, [[-0.9, -15.6], [1.9, -15.6], [2.4, -4.2], [0.2, -4.2]], P.shirt, { lw: 1 });
    ART.poly(ctx, [[-2.8, -16.2], [2.8, -16.2], [1.4, -13.2], [-1.6, -13.2]], P.jacketDk, { lw: 1 });
    ART.ell(ctx, 2.6, -10.2, 0.9, 0.9, P.brass, { lw: 0.9 });

    ART.limb(ctx, -4.4, 1.2, 4.4, 1.2, 1.1, P.brass, { stroke: false });
    ART.rr(ctx, -5.3, -4.8, 10.6, 2.2, 0.8, P.belt, { lw: 1 });

  /* Lockpick in her hair. Twirls (full turn about its base) when idle; otherwise stays tucked.

  function pickPart(ctx, P, S, behind) {
    const a = S.twirl ? S.tm * 5.2 - 1.2 : -2.05;

    ART.ell(ctx, -0.6, -22.4, 7, 7.2, P.hair, { lw: 1.6 });                       // hair volume behind the head

    ctx.beginPath(); ctx.moveTo(1.6, -25.6); ctx.quadraticCurveTo(3.0, -26.6, 4.8, -25.9);

  /* Short dagger in the hand: grip, brass guard, steel blade along the forearm direction. */
  function dagger(ctx, P, g, u) {
    const n = [-u[1], u[0]];
    const bx = g[0] + u[0] * 1.2, by = g[1] + u[1] * 1.2;
    ART.limb(ctx, g[0] - u[0] * 2.4, g[1] - u[1] * 2.4, bx, by, 1.6, P.belt, { lw: 0.8 });
    ART.limb(ctx, bx + n[0] * 2.3, by + n[1] * 2.3, bx - n[0] * 2.3, by - n[1] * 2.3, 1.3, P.brass, { lw: 0.8 });
    const sx = bx + u[0] * 0.8, sy = by + u[1] * 0.8;
    ART.poly(ctx, [[sx + n[0] * 1.3, sy + n[1] * 1.3], [sx + u[0] * 8.4, sy + u[1] * 8.4],

    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
    ctx.strokeStyle = 'rgba(250,240,255,0.55)'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.restore();
  }

  function streaks(ctx, a) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(250,240,255,' + (0.5 * a).toFixed(2) + ')';
    ctx.lineWidth = 1.6;
    [[-9, -19, -6], [-15, -15, -5], [-21, -22, -8]].forEach(([y, x0, x1]) => {
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    });
    ctx.restore();

    const R = [4.6, -2.0], K0 = [-5.2, -6.5], K1 = [13.2, -15.5], K2 = [11.0, -9.0];
    const q = clamp(a, 0, 1);
    if (q < 0.3) return mix(R, K0, q / 0.3);
    if (q < 0.6) {
      const u = (q - 0.3) / 0.3, m = mix(K0, K1, u);
      return [m[0], m[1] - 5 * Math.sin(Math.PI * u)];
    }
    return mix(K1, K2, (q - 0.6) / 0.4);
  }

  /* Walk and run: opposed arms and legs, a hip bob at double stride frequency. */
  function gait(S, c, stride, lift, lean, hipBase, armK, armY) {
    S.lean = lean;
    S.hy = hipBase + 0.8 * Math.cos(2 * c);
    S.ff = [0.8 + stride * Math.sin(c), GROUND - lift * Math.max(0, Math.cos(c))];
    S.bf = [0.8 - stride * Math.sin(c), GROUND - lift * Math.max(0, -Math.cos(c))];
    const dy = armY + 0.8 * Math.cos(2 * c);
    S.fa = [SF[0] - armK * Math.sin(c), SF[1] + dy];
    S.ba = [SB[0] + armK * Math.sin(c), SB[1] + dy];
  }

  /* Turns the pose into joint targets and flags. Unknown states behave like idle. */
  function pose(pz) {
    const p = pz || {};
    const st = STATES.indexOf(p.state) >= 0 ? p.state : 'idle';
    const time = num(p.time), t = Math.max(0, num(p.t)), vx = num(p.vx);
    const wind = clamp(vx * 0.0024, -0.6, 0.6);
    const S = {
      tm: time, hx: 0, hy: HIP, dy: 0, lean: 0.05, tilt: 0, sx: 1, sy: 1, rot: 0, alpha: 1,
      ff: [2.2, GROUND], bf: [-2.4, GROUND], fa: [4.6, -2.0], ba: [-4.4, -2.0],
      blink: mod(time, 3.6) < 0.12 ? 1 : 0, lookX: 0.4 + 0.4 * Math.sin(time * 0.6), lookY: -0.1,
      mouth: 0, twirl: false, dagger: false, frozen: false, streak: 0, aura: 0, trail: null,
      sway: 0.16 + Math.min(0.3, Math.abs(vx) * 0.0012), bb: -wind,
    };
    switch (st) {
      case 'walk': gait(S, time * 7.2, 3.8, 2.6, 0.06, -16.4, 3.2, 10.3); break;
      case 'run': gait(S, time * 11.5, 5, 4.4, 0.2, -15.2, 4, 6.6); S.sway *= 1.1; break;
      case 'jump':
        S.hy = -17.6; S.lean = 0.08; S.sy = 1.05; S.sx = 0.97;
        S.ff = [4.4, -7.4]; S.bf = [-3.8, -4.4]; S.fa = [7.6, -21.4]; S.ba = [-7, -15.2]; S.bb += 0.2;
        break;
      case 'fall':
        S.hy = -17.4; S.lean = -0.03; S.sy = 1.03;
        S.ff = [3.4, -3.6]; S.bf = [-2.8, -3]; S.fa = [13.4, -13.2]; S.ba = [-10.8, -15.4]; S.bb -= 0.05;
        break;
      case 'land': {
        const k = 1 - Math.min(1, t / 0.2);
        S.hy = HIP + 4.6 * k; S.lean = 0.28 * k; S.sx = 1 + 0.08 * k; S.sy = 1 - 0.1 * k;
        S.ff = [3.6, GROUND]; S.bf = [-3.6, GROUND]; S.fa = [5.4, -4.6]; S.ba = [-5, -4];
        break;
      }
      case 'attack': {
        const a = Math.min(1, t / 0.32);
        S.fa = strikeHand(a); S.ba = [-5.2, -4]; S.dagger = true;
        S.lean = a < 0.6 ? lerp(-0.08, 0.25, a / 0.6) : lerp(0.25, 0.12, (a - 0.6) / 0.4);
        S.hy = -16.2; S.ff = [5.6, GROUND]; S.bf = [-3.2, GROUND];
        S.bb += 0.25 * Math.sin(Math.PI * a);
        S.trail = a > 0.3 && a < 0.8 ? [strikeHand(a - 0.2), strikeHand(a - 0.1), strikeHand(a)] : null;
        break;
      }
      case 'dash':
        S.hy = -12.8; S.lean = 0.55; S.ff = [7.2, -2.6]; S.bf = [-8.6, -1.8];
        S.fa = [7.2, -6.2]; S.ba = [-5.2, -3.4]; S.bb = -1.05; S.sway = 0.08; S.streak = 1;
        break;
      case 'hurt': {
        const k = Math.max(0, 1 - t / 0.4);
        S.hy = -16.6; S.hx = 1.6 * Math.sin(t * 38) * k; S.lean = -0.34 * k; S.tilt = -0.28 * k;
        S.ff = [1.4, GROUND]; S.bf = [-2.2, GROUND]; S.fa = [-1.2, -19.2]; S.ba = [-7.2, -10.2];
        S.bb = 0.6 * k - wind; S.blink = 0.4 + 0.6 * k; S.mouth = 0.7 * k;
        break;
      }
      case 'dead': {
        const a = Math.min(1, t / 0.7), e = a * (2 - a);
        S.rot = -1.5 * e; S.hy = -16.6; S.ff = [2.4, GROUND]; S.bf = [-2.6, GROUND + 0.3];
        S.fa = [4.4, -2.2]; S.ba = [-4.4, -1.6]; S.blink = 1; S.sway = 0; S.bb = 0;
        S.alpha = 1 - clamp((t - 0.9) / 0.6, 0, 1);
        break;
      }
      case 'talk':
        S.lean = 0.04 + 0.02 * Math.sin(time * 1.6); S.tilt = 0.06 + 0.03 * Math.sin(time * 1.3);
        S.fa = [7.6 + 1.2 * Math.sin(time * 4.2), -7.6 + 1.2 * Math.cos(time * 3.1)];
        S.mouth = 0.5 + 0.5 * Math.sin(time * 16); S.lookX = 0.6;
        break;
      case 'slow':
        S.tm = time * 0.4; S.sway *= 0.6; S.aura = 0.12 + 0.05 * Math.sin(time * 2.5);
        break;
      case 'frozen':
        S.frozen = true; S.tm = 0; S.sway = 0; S.blink = 0.85; S.lookX = 0; S.lookY = 0; S.bb = -0.1;
        break;
      default:
        break;   // idle: breathing, sly glance, lockpick twirl
    }
    S.twirl = st === 'idle' || st === 'talk' || st === 'slow';
    if (st !== 'dead' && st !== 'frozen') S.dy = 0.3 * Math.sin(S.tm * 2.1) - 0.1;
    return S;
  }

  function draw(ctx, p) {
    const S = pose(p);
    const P = S.frozen ? STONE : PAL;
    ctx.save();
    ctx.globalAlpha *= S.alpha;
    ctx.scale(SCALE * S.sx, SCALE * S.sy);
    if (S.rot) ctx.rotate(S.rot);
    if (S.aura > 0) ART.ell(ctx, 0, -22, 13, 25, '#ffd98a', { stroke: false, alpha: S.aura });
    if (S.streak > 0) streaks(ctx, S.streak);
    const hip = [S.hx, S.hy];
    leg(ctx, hip, S.bf, P, false);
    ART.rr(ctx, S.hx - 4.4, S.hy - 2.6, 8.8, 5.4, 2.2, P.pants, { lw: 1.6 });
    leg(ctx, hip, S.ff, P, true);

    ctx.save();
    ctx.translate(S.hx, S.hy + S.dy);
    ctx.rotate(S.lean);
    braid(ctx, P, -5.0, -23.0, { t: S.tm, ph: 1.9, sway: S.sway, base: -0.5 + S.bb * 0.9, n: 7, seg: 3.3, rad: 2.2 });
    arm(ctx, P, SB, S.ba, P.jacketDk);
    jacket(ctx, P, S.frozen);
    if (!S.dagger) sheath(ctx, P);
    braid(ctx, P, -4.4, -19.4, { t: S.tm, ph: 0, sway: S.sway, base: -0.22 + S.bb, n: 7, seg: 3.3, rad: 2.2 });
    ART.limb(ctx, 0.4, -14.6, 0.4, -18, 4, P.skin, { lw: 1 });                  // neck
    head(ctx, P, S);
    if (S.trail) trail(ctx, S.trail);
    const fa = arm(ctx, P, SF, S.fa, P.jacket);
    if (S.dagger) dagger(ctx, P, fa.hand, fa.u);
    ctx.restore();
    ctx.restore();
  }

  const EXPR = {
    neutral: { bo: -29, bi: -31, lid: 0, mouth: 'smirk' },
    happy: { bo: -33, bi: -36, lid: 0, mouth: 'grin', arcs: true },
    sad: { bo: -28, bi: -38, lid: 0.25, mouth: 'frown' },
    angry: { bo: -33, bi: -25, lid: 0.4, mouth: 'tight' },
    surprised: { bo: -40, bi: -41, lid: 0, mouth: 'o', eye: 8 },
    worried: { bo: -30, bi: -36, lid: 0.1, mouth: 'wavy' },
  };

  function portrait(ctx, expr, t) {
    const E = EXPR[expr] || EXPR.neutral;
    const tm = num(t), blink = mod(tm, 3.6) < 0.12 ? 1 : 0;
    const bg = ctx.createLinearGradient(0, -100, 0, 100);
    bg.addColorStop(0, '#4a2440'); bg.addColorStop(1, '#1d1420');
    ctx.fillStyle = bg; ctx.fillRect(-100, -100, 200, 200);
    const glow = ctx.createRadialGradient(-50, -60, 6, -50, -60, 130);
    glow.addColorStop(0, 'rgba(255,190,140,0.3)'); glow.addColorStop(1, 'rgba(255,190,140,0)');
    ctx.fillStyle = glow; ctx.fillRect(-100, -100, 200, 200);

    ART.ell(ctx, 0, -22, 52, 56, PAL.hair, { lw: 2.5 });                       // hair volume
    ART.limb(ctx, -18, -62, -27, -80, 2.4, PAL.steel, { lw: 1 });              // lockpick
    ART.ell(ctx, -18, -62, 2.4, 2.4, PAL.brass, { lw: 1 });
    ART.rr(ctx, -14, 18, 28, 42, 6, PAL.skin, { lw: 2 });                      // neck
    ART.poly(ctx, [[-84, 100], [-80, 72], [-68, 54], [-40, 44], [-14, 46], [0, 60], [14, 46], [40, 44],
      [68, 54], [80, 72], [84, 100]], PAL.jacket, { lw: 2.5 });
    ART.poly(ctx, [[-70, 60], [-52, 50], [-44, 56], [-62, 74]], PAL.jacketHi, { stroke: false, alpha: 0.5 });
    ART.poly(ctx, [[-14, 45], [0, 66], [14, 45]], PAL.shirt, { lw: 1.5 });
    ART.ell(ctx, 0, 78, 3.2, 3.2, PAL.brass, { lw: 1.4 });
    ART.ell(ctx, 0, 93, 3.2, 3.2, PAL.brass, { lw: 1.4 });
    braid(ctx, PAL, -40, -4, { t: tm, ph: 0.6, sway: 0.05, base: -0.12, n: 8, seg: 10.5, rad: 5.4 });
    braid(ctx, PAL, 40, -4, { t: tm, ph: 0, sway: 0.05, base: 0.12, n: 8, seg: 10.5, rad: 5.4 });

    ART.ell(ctx, -37, -12, 6, 9, PAL.skin, { lw: 2 });
    ART.ell(ctx, 37, -12, 6, 9, PAL.skin, { lw: 2 });
    ART.ell(ctx, -37, 2, 2.4, 2.4, PAL.brass, { lw: 1 });                      // hoop earring
    ART.ell(ctx, 0, -14, 37, 42, PAL.skin, { lw: 2.5 });
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, -14, 37, 42, 0, 0, TAU); ctx.clip();
    ART.ell(ctx, 18, -6, 26, 46, '#b9765a', { stroke: false, alpha: 0.2 });   // shade on the right
    ctx.restore();
    ART.poly(ctx, [[-40, -14], [-42, -40], [-30, -62], [-4, -70], [20, -66], [41, -50], [41, -30],
      [30, -36], [14, -38], [-6, -40], [-24, -32], [-36, -20]], PAL.hair, { lw: 2 });
    ART.limb(ctx, -26, -52, 6, -60, 2.4, PAL.hairHi, { stroke: false, alpha: 0.6 });

    const r = E.eye || 6.2;
    [-14, 14].forEach((x) => {
      if (E.arcs) {
        ctx.save();
        ctx.beginPath(); ctx.arc(x, -13, 5.5, Math.PI * 1.2, Math.PI * 1.8);
        ctx.strokeStyle = ART.OUT; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.stroke();
        ctx.restore();
        return;
      }
      ART.eye(ctx, x, -14, r, 0.4, 0, blink, { lw: 2, pupil: PAL.eyeIris });
      if (E.lid) {
        const top = -14 - r - 1.5, h = (2 * r + 1.5) * E.lid;
        ctx.save();
        ctx.fillStyle = PAL.skin; ctx.fillRect(x - r - 2, top, 2 * r + 4, h);
        ctx.beginPath(); ctx.moveTo(x - r - 0.5, top + h); ctx.lineTo(x + r + 0.5, top + h);
        ctx.strokeStyle = ART.OUT; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.restore();
      }
    });

    ctx.save();
    ctx.strokeStyle = PAL.brow; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    [-1, 1].forEach((s) => {
      ctx.beginPath();
      ctx.moveTo(s * 26, E.bo);
      ctx.quadraticCurveTo(s * 16, (E.bo + E.bi) / 2 - 3, s * 7, E.bi);
      ctx.stroke();
    });
    ctx.beginPath(); ctx.moveTo(3, -6); ctx.quadraticCurveTo(6, 2, 2, 7); ctx.quadraticCurveTo(0, 9, -3, 7.5);
    ctx.strokeStyle = PAL.skinDk; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.restore();

    [[-22, 2], [-17, 5], [-11, 2], [11, 2], [17, 5], [22, 1]].forEach(([x, y]) => ART.ell(ctx, x, y, 1.1, 1.1, PAL.freckle, { stroke: false }));
    if (E.arcs) [-22, 22].forEach((x) => ART.ell(ctx, x, 10, 7, 4.5, '#e8837a', { stroke: false, alpha: 0.4 }));

    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const m = E.mouth;
    if (m === 'smirk') {
      ctx.beginPath(); ctx.moveTo(-11, 30); ctx.quadraticCurveTo(2, 36, 12, 26);
      ctx.strokeStyle = PAL.lipLine; ctx.lineWidth = 3; ctx.stroke();
    } else if (m === 'grin') {
      ctx.beginPath(); ctx.moveTo(-15, 24); ctx.quadraticCurveTo(0, 26, 15, 24); ctx.quadraticCurveTo(0, 46, -15, 24);
      ctx.closePath(); ctx.fillStyle = PAL.mouthIn; ctx.fill(); ctx.strokeStyle = ART.OUT; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-11, 25.5); ctx.quadraticCurveTo(0, 28, 11, 25.5); ctx.quadraticCurveTo(0, 31, -11, 25.5);
      ctx.fillStyle = PAL.teeth; ctx.fill();
    } else if (m === 'frown') {
      ctx.beginPath(); ctx.moveTo(-11, 38); ctx.quadraticCurveTo(0, 28, 11, 38);
      ctx.strokeStyle = PAL.lipLine; ctx.lineWidth = 3; ctx.stroke();
    } else if (m === 'tight') {
      ctx.beginPath(); ctx.moveTo(-12, 31); ctx.lineTo(12, 31);
      ctx.moveTo(-12, 31); ctx.lineTo(-13.5, 34.5); ctx.moveTo(12, 31); ctx.lineTo(13.5, 34.5);
      ctx.strokeStyle = PAL.lipLine; ctx.lineWidth = 2.8; ctx.stroke();
    } else if (m === 'o') {
      ART.ell(ctx, 0, 32, 5.5, 7, PAL.mouthIn, { lw: 2.2 });
    } else if (m === 'wavy') {
      ctx.beginPath(); ctx.moveTo(-11, 34); ctx.quadraticCurveTo(-5.5, 28, 0, 34); ctx.quadraticCurveTo(5.5, 40, 11, 34);
      ctx.strokeStyle = PAL.lipLine; ctx.lineWidth = 2.8; ctx.stroke();
    }
    ctx.restore();
  }

  ART.register({ id: 'mireille', w: 22, h: 46, draw, portrait });
})();
