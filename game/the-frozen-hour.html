  <script>
/* js/env/themes/station.js */
/* ENV theme "station": Vermeil Station, rainy night, frozen at 23:47.
   Contract: game/DESIGN.md section 6 and game/AGENT_BRIEF.md (environment theme contract).
   Plain browser script (no import/export). Each method saves and restores its own context state.
   Defensive: unknown tile characters draw nothing and bad numbers fall back to 0. */
(function () {
  window.ENV_THEMES = window.ENV_THEMES || {};

  const S = 32;                                       // tile size (px)
  const OUT = '#1c1420';                              // outline colour used across the game
  const TAU = Math.PI * 2;
  const HOUR_A = (11 + 47 / 60) / 12 * TAU;           // 23:47: hour hand just short of 12
  const MIN_A = (47 / 60) * TAU;                      // minute hand on the 47 mark
  const BRICK_TONES = ['#66627c', '#6d6886', '#5d5870', '#716c88'];

  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const wrap = (v, m) => ((v % m) + m) % m;
  // deterministic pseudo-random value in [0, 1): a given brick always keeps its tone
  const rnd = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };

  /* ---------- clocks frozen at 23:47 ---------- */
  function clockFace(ctx, cx, cy, r, faceIn, faceOut, rim) {
    ctx.lineCap = 'round';
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(1, r * 0.06); ctx.stroke();
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
    g.addColorStop(0, faceIn); g.addColorStop(1, faceOut);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(38,30,56,0.75)';
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * TAU;
      ctx.lineWidth = Math.max(0.8, r * (k % 3 ? 0.035 : 0.07));
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(a) * r * 0.76, cy - Math.cos(a) * r * 0.76);
      ctx.lineTo(cx + Math.sin(a) * r * 0.9, cy - Math.cos(a) * r * 0.9);
      ctx.stroke();
    }
    ctx.strokeStyle = '#231d3a';
    ctx.lineWidth = Math.max(0.9, r * 0.08);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(HOUR_A) * r * 0.5, cy - Math.cos(HOUR_A) * r * 0.5);
    ctx.stroke();
    ctx.lineWidth = Math.max(0.8, r * 0.05);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(MIN_A) * r * 0.75, cy - Math.cos(MIN_A) * r * 0.75);
    ctx.stroke();
    ctx.fillStyle = '#c9953a';
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, r * 0.09), 0, TAU); ctx.fill();
  }

  // Huge sky clock for the far layer: warm halo, iron rim, brass ring, lit face. It is stopped:
  // frost sits just inside the brass ring and a dark crack runs in from it. The 23:47 plate is drawn
  // by skyClockPlate, after the arch ribs, so no leg crosses it.
  function skyClock(ctx, cx, cy, r) {
    const halo = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.9);
    halo.addColorStop(0, 'rgba(255,205,135,0.22)');
    halo.addColorStop(1, 'rgba(255,205,135,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.9, 0, TAU); ctx.fill();
    clockFace(ctx, cx, cy, r, '#e8dcc0', '#d8c79c', '#262244');
    ctx.strokeStyle = '#b7863f'; ctx.lineWidth = r * 0.025;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.97, 0, TAU); ctx.stroke();
    // frost: a dotted white arc just inside the brass ring
    const fr = Math.max(0.6, r * 0.008);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    for (let k = 0; k < 48; k++) {
      const a = k / 48 * TAU, fx = cx + Math.sin(a) * r * 0.935, fy = cy - Math.cos(a) * r * 0.935;
      ctx.moveTo(fx + fr, fy); ctx.arc(fx, fy, fr, 0, TAU);
    }
    ctx.fill();
    // crack from the brass ring toward the pivot, with one short branch; starts clear of the hour ticks
    const at = (a, k) => [cx + Math.sin(a) * r * k, cy - Math.cos(a) * r * k];
    ctx.strokeStyle = 'rgba(35,29,58,0.85)'; ctx.lineWidth = Math.max(1, r * 0.017);
    ctx.beginPath();
    ctx.moveTo(...at(3.9, 0.97)); ctx.lineTo(...at(4.04, 0.6)); ctx.lineTo(...at(3.94, 0.26));
    ctx.moveTo(...at(4.04, 0.6)); ctx.lineTo(...at(4.2, 0.42));
    ctx.stroke();
  }

  // Brass plate under a sky clock, engraved 23:47 in the game's serif face. Drawn after the arch ribs
  // so no leg crosses it.
  function skyClockPlate(ctx, cx, cy, r) {
    const pw = r * 0.8, ph = r * 0.17, px = cx - pw / 2, py = cy + r * 1.16;
    ctx.fillStyle = '#b7863f'; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.font = 'bold ' + Math.max(8, Math.round(r * 0.12)) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,236,170,0.5)'; ctx.fillText('23:47', cx, py + ph / 2 + 1);
    ctx.fillStyle = '#2a1f0c'; ctx.fillText('23:47', cx, py + ph / 2);
  }

  /* ---------- background layers ---------- */
  // Path of the dial rims (1.2r discs). Used as an evenodd hole in a clip so ironwork stays off the faces.
  function dialDisc(ctx, dials) {
    ctx.beginPath();
    for (const [dx, dy, dr] of dials) { ctx.moveTo(dx + dr * 1.2, dy); ctx.arc(dx, dy, dr * 1.2, 0, TAU); }
  }

  // Iron train-shed arches: cold glass tint, ribs, legs, a tie beam and a king post.
  // Two passes around the sky clocks: 'glass' before the dials, 'ribs' after them. The ribs stay off
  // the dial faces, so the faces and hands read clean. dials = [x, y, r] per clock.
  function archRow(ctx, cx, f, H, pass, W, dials) {
    const P = 230, spring = H * 0.44, top = H * 0.16, floor = H * 0.84;
    const off = -((cx * f) % P);
    const archPath = (x0, x1, xm) => {
      ctx.beginPath();
      ctx.moveTo(x0, floor); ctx.lineTo(x0, spring);
      ctx.quadraticCurveTo(x0, top, xm, top);
      ctx.quadraticCurveTo(x1, top, x1, spring);
      ctx.lineTo(x1, floor);
    };
    if (pass === 'glass') {
      ctx.fillStyle = 'rgba(78,68,140,0.28)';
      for (let i = -1; i < 7; i++) {
        const x0 = off + i * P, x1 = x0 + P, xm = x0 + P / 2;
        archPath(x0, x1, xm); ctx.closePath(); ctx.fill();
      }
      return;
    }
    const ribs = (ink) => {
      ctx.strokeStyle = ink; ctx.lineCap = 'butt';
      for (let i = -1; i < 7; i++) {
        const x0 = off + i * P, x1 = x0 + P, xm = x0 + P / 2;
        archPath(x0, x1, xm); ctx.lineWidth = 6; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x0, spring + 46); ctx.lineTo(x1, spring + 46);
        ctx.moveTo(xm, top); ctx.lineTo(xm, spring + 46);
        ctx.lineWidth = 2.5; ctx.stroke();
      }
    };
    ctx.save(); dialDisc(ctx, dials); ctx.rect(0, 0, W, H); ctx.clip('evenodd'); ribs('#1b1838'); ctx.restore();   // off the dials
  }

  // Gabled station roofs with chimneys; some windows lit warm.
  function roofRow(ctx, cx, f, H) {
    const P = 210, base = H * 0.62;
    const off = -((cx * f) % P);
    const q = Math.trunc((cx * f) / P);
    for (let i = -1; i < 7; i++) {
      const x0 = off + i * P, k = i + q;
      const ridge = base - rnd(k, 3) * 30, eave = ridge + 34;
      ctx.fillStyle = '#15122e';
      ctx.beginPath();
      ctx.moveTo(x0, H); ctx.lineTo(x0, eave);
      ctx.lineTo(x0 + P / 2, ridge);
      ctx.lineTo(x0 + P, eave); ctx.lineTo(x0 + P, H);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(x0 + P * 0.72, ridge - 6, 12, 30);              // chimney
      if (rnd(k, 7) > 0.35) {                                       // a lit window, framed in roof colour
        ctx.fillStyle = 'rgba(255,196,110,0.4)';
        ctx.fillRect(x0 + P * 0.28, eave + 16, 12, 16);
        ctx.fillStyle = '#15122e';
        ctx.fillRect(x0 + P * 0.28 + 5.5, eave + 16, 1, 16);        // mullion
        ctx.fillRect(x0 + P * 0.28, eave + 32, 12, 1);              // sill
      }
    }
  }

  // Warm lamp posts: iron pole, lamp head, bulb, glow, a pool of light and a reflection on the wet ground.
  // The ground is the walkway top, so the posts stand at floor depth. The iron and bulb are clipped to the
  // dial rims, so a post passes behind a sky dial; the glow is dimmed where it reaches a dial.
  function lampRow(ctx, cx, f, H, W, dials) {
    const P = 240, ground = H * 0.88, topY = H * 0.36, ds = dials || [];
    const off = -((cx * f) % P);
    for (let i = -1; i < 6; i++) {
      const x = off + i * P + 60, hx = x + 19, hy = topY + 12;
      const near = ds.some(([dx, , dr]) => Math.abs(hx - dx) < dr * 1.2 + 90);
      ctx.save();
      dialDisc(ctx, ds); ctx.rect(0, 0, W, H); ctx.clip('evenodd');
      ctx.fillStyle = '#0c0a1e';
      ctx.fillRect(x - 2, topY, 4, ground - topY);                  // pole
      ctx.fillRect(x, topY, 18, 3);                                  // arm
      ctx.beginPath();
      ctx.moveTo(x + 12, topY + 3); ctx.lineTo(x + 26, topY + 3);
      ctx.lineTo(x + 22, hy); ctx.lineTo(x + 16, hy); ctx.closePath(); ctx.fill();   // lamp head
      ctx.fillStyle = '#ffd792';
      ctx.beginPath(); ctx.arc(hx, hy, 3, 0, TAU); ctx.fill();      // bulb
      ctx.restore();
      ctx.fillStyle = '#0c0a1e';
      ctx.fillRect(x - 7, ground - 6, 14, 6);                        // plinth
      const glow = ctx.createRadialGradient(hx, hy + 2, 2, hx, hy + 2, 90);
      glow.addColorStop(0, 'rgba(255,190,100,0.45)');
      glow.addColorStop(0.4, 'rgba(255,170,80,0.12)');
      glow.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.globalAlpha = near ? 0.5 : 1;
      ctx.fillStyle = glow;
      ctx.fillRect(hx - 90, hy - 88, 180, 180);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,190,100,0.12)';
      ctx.beginPath(); ctx.ellipse(hx, ground - 2, 70, 8, 0, 0, TAU); ctx.fill();
      const refl = ctx.createLinearGradient(0, ground, 0, H);
      refl.addColorStop(0, 'rgba(255,190,100,0.1)');
      refl.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = refl;
      ctx.fillRect(hx - 4, ground, 8, H - ground);
    }
  }

  function background(ctx, camX, camY, t, W, H) {
    const cx = num(camX), time = num(t);
    ctx.save();
    // sky: deep blue-violet, opaque
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#080a22');
    sky.addColorStop(0.5, '#1a1a4c');
    sky.addColorStop(0.85, '#2b2766');
    sky.addColorStop(1, '#3a2f74');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // far layer (0.2x): faint twinkling stars and a low cloud deck
    for (let i = 0; i < 28; i++) {
      const sx = wrap(i * 97.3 - cx * 0.2, W), sy = 16 + (i * 53) % (H * 0.36);
      const a = 0.22 + 0.18 * Math.sin(time * 1.3 + i * 2.1);
      ctx.fillStyle = 'rgba(225,230,255,' + a.toFixed(3) + ')';
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.fillStyle = 'rgba(38,34,92,0.55)';
    for (let i = 0; i < 5; i++) {
      const clx = wrap(i * 260 - cx * 0.2, W + 320) - 160;
      const cly = 54 + (i * 37) % 46;
      ctx.beginPath(); ctx.ellipse(clx, cly, 150 - (i % 2) * 40, 22 + (i % 3) * 5, 0, 0, TAU); ctx.fill();
    }
    // far layer: the sky clocks, always 23:47, one every 1100 px of parallax
    const P = 1100, dials = [];
    for (let x = wrap(W * 0.5 - cx * 0.2, P) - P; x < W + 240; x += P) dials.push([x, 150, 118]);
    // mid layer: iron arches (0.35x), glass tint under the dials and ribs over them; then roof silhouettes (0.45x)
    archRow(ctx, cx, 0.35, H, 'glass', W, dials);
    for (const [x, y, r] of dials) skyClock(ctx, x, y, r);
    archRow(ctx, cx, 0.35, H, 'ribs', W, dials);
    for (const [x, y, r] of dials) skyClockPlate(ctx, x, y, r);     // plate over the ribs: no leg crosses it
    roofRow(ctx, cx, 0.45, H);
    // wet platform edge under a violet haze
    const haze = ctx.createLinearGradient(0, H * 0.6, 0, H * 0.84);
    haze.addColorStop(0, 'rgba(120,110,200,0)');
    haze.addColorStop(1, 'rgba(120,110,200,0.16)');
    ctx.fillStyle = haze; ctx.fillRect(0, H * 0.6, W, H * 0.24);
    ctx.fillStyle = '#0b0a1f'; ctx.fillRect(0, H * 0.84, W, H * 0.16);
    ctx.fillStyle = '#3a3470'; ctx.fillRect(0, H * 0.84, W, 2);
    // warm lamp posts (0.5x), nearest to the world
    lampRow(ctx, cx, 0.5, H, W, dials);
    ctx.restore();
  }

  /* ---------- tiles (each draws only inside its 32x32 cell) ---------- */
  // Grey stone bricks; exposed faces get a lighter top lip and darker sides.
  function tileStone(ctx, x, y, n) {
    ctx.fillStyle = '#2e2a42'; ctx.fillRect(x, y, S, S);            // mortar
    for (let row = 0; row < 4; row++) {
      const by = y + row * 8, off = row % 2 ? 8 : 0;
      for (let bx = off - 16; bx < S; bx += 16) {
        const l = Math.max(0, bx), r = Math.min(S, bx + 15);
        if (r <= l) continue;
        const k = Math.floor(rnd(Math.floor((x + bx) / 16), Math.floor(y / 8) + row) * BRICK_TONES.length);
        ctx.fillStyle = BRICK_TONES[Math.min(k, BRICK_TONES.length - 1)];
        ctx.fillRect(x + l, by, r - l, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x + l, by, r - l, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x + l, by + 6, r - l, 1);
      }
    }
    if (!n.u) {                                                       // exposed top: lighter lip
      ctx.fillStyle = '#a7a2bf'; ctx.fillRect(x, y, S, 4);
      ctx.fillStyle = '#d6d1e8'; ctx.fillRect(x, y, S, 1);
      ctx.fillStyle = 'rgba(20,16,36,0.35)'; ctx.fillRect(x, y + 4, S, 1);
    }
    if (!n.l) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x, y, 2, S); }
    if (!n.r) { ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x + S - 2, y, 2, S); }
    if (!n.d) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y + S - 2, S, 2); }
  }

  // Iron plank with brass studs, iron brackets and a little rust. The lit top sits on the cell top (y),
  // which is the walkable surface.
  function tilePlank(ctx, x, y) {
    ctx.fillStyle = '#1a1d2c'; ctx.fillRect(x, y + 9, S, 3);        // underside shadow
    ctx.fillStyle = '#5e6882'; ctx.fillRect(x, y + 1, S, 8);        // iron plank
    ctx.fillStyle = '#8a93ab'; ctx.fillRect(x, y, S, 2);            // lit top edge
    ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, S - 1, 9);   // 1px outline
    ctx.fillStyle = '#2a2f3e'; ctx.fillRect(x + 11, y + 2, 1, 7);   // plank seam
    ctx.fillStyle = 'rgba(160,90,50,0.3)'; ctx.fillRect(x + 20, y + 5, 6, 2);   // rust
    ctx.fillStyle = '#3a4260';                                      // brackets, attached to the plank underside
    ctx.beginPath(); ctx.moveTo(x + 4, y + 12); ctx.lineTo(x + 11, y + 12); ctx.lineTo(x + 4, y + 19); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + S - 4, y + 12); ctx.lineTo(x + S - 11, y + 12); ctx.lineTo(x + S - 4, y + 19); ctx.closePath(); ctx.fill();
    for (const sx of [8, 24]) {                                     // brass studs, 16 px apart across the run
      ctx.fillStyle = '#c9953a'; ctx.strokeStyle = OUT; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(x + sx, y + 4.5, 2, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe49a'; ctx.fillRect(x + sx - 0.8, y + 3.2, 1, 1);
    }
  }

  // Brass spikes standing on the cell floor.
  function tileSpikes(ctx, x, y) {
    ctx.strokeStyle = OUT; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const sx = x + 2 + i * 8;
      ctx.fillStyle = '#c9953a';
      ctx.beginPath(); ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 7); ctx.lineTo(sx + 8, y + S); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,236,170,0.55)';
      ctx.beginPath(); ctx.moveTo(sx + 4, y + 8); ctx.lineTo(sx + 2, y + S - 1); ctx.lineTo(sx + 4, y + S - 1); ctx.closePath(); ctx.fill();
    }
  }

  // Lit lantern-clock: warm flickering glow, iron post, dial showing 23:47.
  function tileLantern(ctx, x, y, t) {
    const flick = 0.88 + 0.12 * Math.sin(t * 9 + x);
    const g = ctx.createRadialGradient(x + 16, y + 12, 2, x + 16, y + 12, 22);
    g.addColorStop(0, 'rgba(255,196,110,' + (0.6 * flick).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,196,110,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#26223a';
    ctx.fillRect(x + 14, y + 20, 4, 12);
    ctx.beginPath(); ctx.moveTo(x + 10, y + 32); ctx.lineTo(x + 22, y + 32); ctx.lineTo(x + 20, y + 28); ctx.lineTo(x + 12, y + 28); ctx.closePath(); ctx.fill();
    clockFace(ctx, x + 16, y + 12, 7.5, '#fff1cf', '#e2c98e', '#2a2440');
  }

  // Iron exit door with a dial at 23:47 and a warm light along the foot.
  function tileDoor(ctx, x, y, t) {
    ctx.fillStyle = '#1f1d2c'; ctx.fillRect(x, y, S, S);            // frame
    ctx.fillStyle = '#4a4a5e'; ctx.fillRect(x + 3, y + 1, S - 6, S - 1);   // iron leaf
    ctx.fillStyle = '#383850'; ctx.fillRect(x + 6, y + 17, S - 12, 12);    // lower panel
    ctx.fillStyle = '#c9953a';                                      // brass rivets
    for (const [rx, ry] of [[6, 4], [26, 4], [6, 28], [26, 28]]) { ctx.beginPath(); ctx.arc(x + rx, y + ry, 1.1, 0, TAU); ctx.fill(); }
    clockFace(ctx, x + 16, y + 11, 6.2, '#efe4c6', '#c8b47f', '#2a2440');
    const pulse = 0.35 + 0.15 * Math.sin(t * 3);
    ctx.fillStyle = 'rgba(242,198,109,' + pulse.toFixed(3) + ')';
    ctx.fillRect(x + 4, y + 30, S - 8, 2);
  }

  // Golden clockwork gear, spinning, with a small glint.
  function tileGear(ctx, x, y, t) {
    const spin = t * 2.2 + x * 0.1;
    if (window.ART && typeof ART.gear === 'function') {
      ART.gear(ctx, x + 16, y + 16, 9, 8, spin, '#e0b054', { lw: 1.4 });
    } else {
      ctx.fillStyle = '#e0b054'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x + 16, y + 16, 8, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(t * 6 + x)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x + 23, y + 9, 1.6, 0, TAU); ctx.fill();
  }

  // Oil flask with a pulsing amber glow.
  function tileOil(ctx, x, y, t) {
    const pulse = 0.7 + 0.3 * Math.sin(t * 4 + x);
    const g = ctx.createRadialGradient(x + 16, y + 20, 2, x + 16, y + 20, 16);
    g.addColorStop(0, 'rgba(255,170,60,' + (0.35 * pulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#b8862e'; ctx.fillRect(x + 12, y + 5, 8, 4);  // brass cap
    ctx.fillStyle = 'rgba(255,170,60,' + pulse.toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(x + 16, y + 20, 7, 8, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + 12, y + 16, 2, 5);
  }

  // Iron grille (arena barrier) with rails, brass rivets and a warning glow at both edges.
  function tileGrille(ctx, x, y, t) {
    ctx.fillStyle = 'rgba(30,26,46,0.94)'; ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#6f6a84';
    for (let i = 2; i < S; i += 8) ctx.fillRect(x + i, y, 3, S);
    ctx.fillStyle = '#4a4660';
    ctx.fillRect(x, y + 3, S, 3); ctx.fillRect(x, y + S - 6, S, 3);
    ctx.fillStyle = '#c9953a';
    for (let i = 3; i < S; i += 8) ctx.fillRect(x + i, y + 4, 1.5, 1.5);
    const glow = 0.3 + 0.2 * Math.sin(t * 5);
    ctx.fillStyle = 'rgba(255,90,60,' + glow.toFixed(3) + ')';
    ctx.fillRect(x, y, 2, S); ctx.fillRect(x + S - 2, y, 2, S);
  }

  function tile(ctx, ch, x, y, t, nb) {
    const X = num(x), Y = num(y), time = num(t), n = nb || {};
    ctx.save();
    ctx.beginPath(); ctx.rect(X, Y, S, S); ctx.clip();
    switch (ch) {
      case '#': tileStone(ctx, X, Y, n); break;
      case '=': tilePlank(ctx, X, Y); break;
      case '^': tileSpikes(ctx, X, Y); break;
      case 'C': tileLantern(ctx, X, Y, time); break;
      case 'X': tileDoor(ctx, X, Y, time); break;
      case 'o': tileGear(ctx, X, Y, time); break;
      case 'h': tileOil(ctx, X, Y, time); break;
      case 'B': tileGrille(ctx, X, Y, time); break;
      default: break;
    }
    ctx.restore();
  }

  /* ---------- foreground: slanted rain, low alpha only ---------- */
  function rainLayer(ctx, cam, time, W, H, n, speed, alpha, lw, dx) {
    ctx.strokeStyle = 'rgba(190,200,235,' + alpha + ')';
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = wrap(i * 137.5 - time * speed - cam, W + 60) - 30;
      const y = wrap(i * 71.3 + time * speed * 2.2, H + 40) - 20;
      ctx.moveTo(x + dx, y - dx * 2.2);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function foreground(ctx, camX, camY, t, W, H) {
    const cx = num(camX), time = num(t);
    ctx.save();
    ctx.lineCap = 'round';
    rainLayer(ctx, cx * 0.3, time, W, H, 64, 380, 0.14, 1, 5);      // far drops: thin, faint
    rainLayer(ctx, cx * 0.6, time, W, H, 34, 520, 0.3, 1.6, 7);     // near drops: longer, brighter
    ctx.restore();
  }

  window.ENV_THEMES.station = { background, tile, foreground };
})();

</script>
  <script>
/* js/env/themes/market.js */
/* ENV theme "market": the Frozen Market of Vermeil at dusk, everyone stopped mid-gesture.
   Contract: DESIGN.md section 6 and AGENT_BRIEF.md (environment theme contract).
   Plain browser script: no import/export. Every method saves and restores its own canvas state. */
(function () {
  window.ENV_THEMES = window.ENV_THEMES || {};

  const SZ = 32;                                          // tile size (px)
  const SKY = [[0, '#e07a4c'], [0.4, '#d2705a'], [0.75, '#8c4262'], [1, '#4e2a4e']];
  const FAR = '#5a2846';                                  // far rooftops and tower (parallax 0.2)
  const MID = '#401e34';                                  // near rooftops (parallax 0.4)
  const CREAM = '#f6e0c6', RED = '#7d2332';               // awning stripes
  const STONE = ['#8b6f5e', '#9c7e68', '#7a6150', '#a48a70'];
  // 23:47, frozen: hour hand just before 12, minute hand at 47 (same maths as env.js).
  const HOUR_A = (11.78 / 12) * Math.PI * 2;
  const MIN_A = (47 / 60) * Math.PI * 2;

  function num(v, d) { return typeof v === 'number' && isFinite(v) ? v : (d || 0); }
  function wrap(v, p) { return ((v % p) + p) % p; }
  // Deterministic pseudo-random value in [0,1): same inputs, same result (no flicker between frames).
  function hash2(a, b) { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); }

  // Clock hands frozen at 23:47, centred on (cx, cy), radius r.
  function hands(ctx, cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(HOUR_A) * r * 0.5, cy - Math.cos(HOUR_A) * r * 0.5); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(MIN_A) * r * 0.8, cy - Math.cos(MIN_A) * r * 0.8); ctx.stroke();
  }

  /* ---------- background ---------- */

  function drawSky(ctx, W, H) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    SKY.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // low pale sun; the sky does not scroll, so it stays put
    const sx = W * 0.7, sy = H * 0.3;
    const glow = ctx.createRadialGradient(sx, sy, 6, sx, sy, 240);
    glow.addColorStop(0, 'rgba(255,220,150,0.5)');
    glow.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe2a8';
    ctx.beginPath(); ctx.arc(sx, sy, 20, 0, Math.PI * 2); ctx.fill();
  }

  // Buildings of one repeating period. Keyed on the global period index g, so the pattern
  // stays put while the camera moves.
  function blocks(g, seed, P) {
    const a = 60 + hash2(g * 3.1, seed) * 50;
    const b = 50 + hash2(g * 5.7, seed * 2.3) * 50;
    const parts = [[0, a], [a, b], [a + b, P - a - b]];
    return parts.map(function (p, j) {
      const k = g * 7.3 + j * 4.1 + seed * 3.7;
      return {
        k: k,
        x: p[0],
        w: p[1],
        h: 24 + hash2(k, 1.3) * 60,                                   // roof line above base
        gable: hash2(k, 2.9) > 0.35 ? 12 + hash2(k, 4.7) * 16 : 0,    // 0 = flat roof
        chimney: hash2(k, 6.1) > 0.45
      };
    });
  }

  // Saint-Aube style clock tower in the far layer. Its dial shows 23:47.
  function drawTower(ctx, tx, base, H) {
    ctx.fillStyle = FAR;
    ctx.fillRect(tx + 2, base - 280, 32, H - (base - 280));          // shaft
    ctx.fillRect(tx - 4, base - 302, 44, 24);                       // belfry
    ctx.beginPath();
    ctx.moveTo(tx - 4, base - 302); ctx.lineTo(tx + 18, base - 352); ctx.lineTo(tx + 40, base - 302);
    ctx.closePath(); ctx.fill();
    const dx = tx + 18, dy = base - 250;
    const glow = ctx.createRadialGradient(dx, dy, 4, dx, dy, 26);
    glow.addColorStop(0, 'rgba(255,200,120,0.35)');
    glow.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(dx - 26, dy - 26, 52, 52);
    ctx.beginPath(); ctx.arc(dx, dy, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#f6e2b0'; ctx.fill();
    ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1; ctx.stroke();
    hands(ctx, dx, dy, 9, '#3a1834');
  }

  // One parallax row of rooftops: silhouettes, chimneys with frozen smoke, optional lit windows.
  function rooftopRow(ctx, o, cx, W, H) {
    const s = -cx * o.f;
    const gStart = Math.floor(-s / o.P);
    const x0 = gStart * o.P + s;                                     // screen x of first period, in (-P, 0]
    for (let k = 0; x0 + k * o.P < W; k++) {
      const g = gStart + k, px = x0 + k * o.P;
      if (o.tower && ((g % 3) + 3) % 3 === 1) drawTower(ctx, px + 150, o.base, H);
      ctx.fillStyle = o.color;
      blocks(g, o.seed, o.P).forEach(function (b) {
        const top = o.base - b.h - b.gable;
        ctx.fillRect(px + b.x, top, b.w, H - top);
        if (b.gable) {
          ctx.beginPath();
          ctx.moveTo(px + b.x - 3, top);
          ctx.lineTo(px + b.x + b.w / 2, top - b.gable);
          ctx.lineTo(px + b.x + b.w + 3, top);
          ctx.closePath(); ctx.fill();
        }
        if (b.chimney) {
          const chx = px + b.x + b.w * 0.7, chTop = top - b.gable * 0.6 - 16;
          ctx.fillRect(chx, chTop, 7, top - chTop + 4);
          if (hash2(b.k, 8.8) > 0.5) {                               // frozen smoke puffs
            ctx.fillStyle = 'rgba(240,186,170,0.14)';
            for (let i = 0; i < 3; i++) {
              ctx.beginPath(); ctx.arc(chx + 3 + i * 3, chTop - 8 - i * 10, 5 + i * 3, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = o.color;
          }
        }
      });
    }
    if (!o.lit) return;
    for (let k = 0; x0 + k * o.P < W; k++) {                         // lit windows, drawn over the bodies
      const g = gStart + k, px = x0 + k * o.P;
      blocks(g, o.seed, o.P).forEach(function (b) {
        const top = o.base - b.h - b.gable;
        const cols = Math.floor((b.w - 10) / 12);
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < cols; c++) {
            if (hash2(b.k + r * 1.9, c * 2.3 + 0.5) < 0.6) continue;
            const wy = top + 14 + r * 16;
            if (wy > H - 20) continue;
            ctx.fillStyle = 'rgba(255,190,110,0.75)';
            ctx.fillRect(px + b.x + 6 + c * 12, wy, 5, 7);
          }
        }
      });
    }
  }

  // Hanging lanterns on static strings from the awning rail (parallax 0.5).
  function drawLantern(ctx, x, y, t, i) {
    const f = 0.85 + 0.15 * Math.sin(t * 2.5 + i);
    const g = ctx.createRadialGradient(x, y, 2, x, y, 34);
    g.addColorStop(0, 'rgba(255,200,110,' + (0.4 * f).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,200,110,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 34, y - 34, 68, 68);
    ctx.strokeStyle = 'rgba(30,14,26,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 46); ctx.lineTo(x, y - 10); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y, 6, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcd72'; ctx.fill();
    ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#2a1420';
    ctx.fillRect(x - 4, y - 11, 8, 3);
    ctx.fillRect(x - 3, y + 7, 6, 2);
  }

  function drawLanterns(ctx, cx, W, t) {
    const P = 170, s = -cx * 0.5;
    const gStart = Math.floor(-s / P), x0 = gStart * P + s;
    for (let k = 0; x0 + k * P < W; k++) {
      const g = gStart + k;
      for (let j = 0; j < 2; j++) {
        const x = x0 + k * P + (j ? 125 : 40);
        const y = 96 + hash2(g * 2.3 + j, 3.3) * 34;
        drawLantern(ctx, x, y, t, g * 2 + j);
      }
    }
  }

  // Striped cream and red awning along the top, scalloped edge, parallax 0.5.
  function drawAwnings(ctx, cx, W, H) {
    const SW = 40, s = -cx * 0.5, gStart = Math.floor(-s / SW), x0 = gStart * SW + s;
    // shadow the awning throws on the sky below
    const sh = ctx.createLinearGradient(0, 46, 0, 80);
    sh.addColorStop(0, 'rgba(60,16,36,0.22)');
    sh.addColorStop(1, 'rgba(60,16,36,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(0, 46, W, 34);
    for (let k = 0; x0 + k * SW < W; k++) {
      const g = gStart + k, x = x0 + k * SW;
      ctx.fillStyle = Math.abs(g) % 2 ? CREAM : RED;
      ctx.fillRect(x, 0, SW, 26);
      ctx.beginPath();
      ctx.moveTo(x, 26); ctx.lineTo(x + SW, 26);
      ctx.arc(x + SW / 2, 26, SW / 2, 0, Math.PI, false);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(x + SW / 2, 26, SW / 2, 0, Math.PI, false);   // darker scallop edge
      ctx.strokeStyle = '#3a1420'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.fillStyle = '#4a2030';                                       // top rail
    ctx.fillRect(0, 0, W, 3);
  }

  // Rounded backing plate, filled with the current style (used under HUD text).
  function plate(ctx, x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  /* ---------- tiles ---------- */

  // '#': cobblestones on a 8px grid (aligned so neighbouring tiles join), sandy highlights.
  function tCobble(ctx, x, y, n) {
    ctx.fillStyle = '#4e3a31';
    ctx.fillRect(x, y, SZ, SZ);
    for (let r = 0; r < 4; r++) {
      const row = y + r * 8, off = r % 2 ? 4 : 0;
      for (let c = -1; c < 4; c++) {
        const sx = x + off + c * 8;
        const x0 = Math.max(x, sx), x1 = Math.min(x + SZ, sx + 7);
        if (x1 <= x0) continue;
        ctx.fillStyle = STONE[Math.floor(hash2(sx, row) * STONE.length) % STONE.length];
        ctx.fillRect(x0, row, x1 - x0, 7);
        ctx.fillStyle = 'rgba(240,214,160,0.35)';
        ctx.fillRect(x0, row, x1 - x0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x0, row + 6, x1 - x0, 1);
      }
    }
    ctx.fillStyle = 'rgba(246,222,170,0.6)';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(x + Math.floor(hash2(x + i, y) * 30), y + Math.floor(hash2(y + i, x) * 30), 2, 1);
    }
    if (!n.u) {                                                      // exposed top: sand drift
      ctx.fillStyle = '#dcb77c'; ctx.fillRect(x, y, SZ, 3);
      ctx.fillStyle = '#f4dca8'; ctx.fillRect(x, y, SZ, 1);
      ctx.fillStyle = '#c9a26a';
      for (let i = 0; i < SZ; i += 4) ctx.fillRect(x + i, y + 3, 3, 1 + Math.floor(hash2(x + i, y + 7) * 3));
    }
    ctx.fillStyle = 'rgba(30,18,20,0.35)';
    if (!n.l) ctx.fillRect(x, y, 2, SZ);
    if (!n.r) ctx.fillRect(x + SZ - 2, y, 2, SZ);
  }

  // '=': a wooden board with seams and nails; a crate under it where nothing solid is below.
  function tPlank(ctx, x, y, n) {
    const top = y + 4, bh = 10;
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(x, top, SZ, bh);
    ctx.fillStyle = '#c48b52'; ctx.fillRect(x, top, SZ, 2);
    ctx.fillStyle = '#f4dca8'; ctx.fillRect(x, top, SZ, 1);          // cream top rim, as on the stone
    ctx.fillStyle = 'rgba(20,8,20,0.6)'; ctx.fillRect(x, top - 1, SZ, 1);   // dark top edge
    ctx.fillStyle = 'rgba(30,14,6,0.55)';
    ctx.fillRect(x + 10, top, 1, bh); ctx.fillRect(x + 21, top, 1, bh);
    ctx.fillStyle = 'rgba(40,20,8,0.25)';
    ctx.fillRect(x + 2, top + 5, 6, 1); ctx.fillRect(x + 13, top + 4, 7, 1); ctx.fillRect(x + 24, top + 6, 5, 1);
    ctx.fillStyle = '#c9a050';
    ctx.fillRect(x + 5, top + 3, 2, 2); ctx.fillRect(x + 26, top + 3, 2, 2);
    ctx.fillStyle = 'rgba(20,8,20,0.6)'; ctx.fillRect(x, top + bh - 2, SZ, 2);  // dark 2px underside
    if (!n.d && hash2(x, y) > 0.4) {
      const cy0 = top + bh;
      ctx.fillStyle = '#8a5a32'; ctx.fillRect(x + 3, cy0, SZ - 6, y + SZ - cy0);
      ctx.fillStyle = 'rgba(20,10,4,0.5)';
      for (let i = cy0 + 4; i < y + SZ; i += 5) ctx.fillRect(x + 3, i, SZ - 6, 1);
      ctx.fillStyle = 'rgba(20,8,20,0.6)';                           // dark 2px crate outline
      ctx.fillRect(x + 3, cy0, 2, y + SZ - cy0); ctx.fillRect(x + SZ - 5, cy0, 2, y + SZ - cy0);
      ctx.fillRect(x + 3, y + SZ - 2, SZ - 6, 2);
      ctx.fillStyle = '#b08a4a';
      ctx.fillRect(x + 4, cy0 + 1, 3, 3); ctx.fillRect(x + SZ - 7, cy0 + 1, 3, 3);
    }
  }

  // '^': tarnished brass spikes standing on the ground.
  function tSpikes(ctx, x, y) {
    for (let i = 0; i < 4; i++) {
      const sx = x + 2 + i * 8;
      ctx.beginPath();
      ctx.moveTo(sx, y + SZ); ctx.lineTo(sx + 4, y + 7); ctx.lineTo(sx + 8, y + SZ);
      ctx.closePath();
      ctx.fillStyle = '#c9a04a'; ctx.fill();
      ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,200,0.5)';
      ctx.fillRect(sx + 2, y + 14, 1, SZ - 14);
    }
  }

  // 'C': lit lantern-clock on a bracket, dial at 23:47.
  function tLantern(ctx, x, y, t) {
    const cx = x + 16, cy = y + 13, f = 0.85 + 0.15 * Math.sin(t * 9 + x);
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
    g.addColorStop(0, 'rgba(255,210,120,' + (0.6 * f).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, SZ, SZ);
    ctx.fillStyle = '#2a2024';
    ctx.fillRect(cx - 1.5, cy + 7, 3, 12);
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd98a'; ctx.fill();
    ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff4d6'; ctx.fill();
    hands(ctx, cx, cy, 4.5, '#2a1420');
  }

  // 'X': iron exit door with a clock dial at 23:47 and a pulsing light along the threshold.
  function tExit(ctx, x, y, t) {
    const cx = x + 16, L = x + 5, R = x + 27, f = 0.3 + 0.2 * Math.sin(t * 3);
    ctx.beginPath();
    ctx.moveTo(L, y + SZ); ctx.lineTo(L, y + 10);
    ctx.arc(cx, y + 10, 11, Math.PI, 0, false);
    ctx.lineTo(R, y + SZ); ctx.closePath();
    ctx.fillStyle = '#6e5a6a'; ctx.fill();
    ctx.strokeStyle = '#e0a45a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#2a2833'; ctx.fillRect(L + 3, y + 19, R - L - 6, SZ - 19);
    ctx.fillStyle = '#1c1820'; ctx.fillRect(cx - 0.5, y + 19, 1, SZ - 19);
    ctx.beginPath(); ctx.arc(cx, y + 12, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f1e6cc'; ctx.fill(); ctx.stroke();
    hands(ctx, cx, y + 12, 6, '#2a1420');
    ctx.fillStyle = 'rgba(255,200,110,' + f.toFixed(3) + ')';
    ctx.fillRect(L + 2, y + SZ - 5, R - L - 4, 3);
  }

  // 'o': golden gear that turns.
  function tGear(ctx, x, y, t) {
    if (window.ART && typeof window.ART.gear === 'function') {
      window.ART.gear(ctx, x + 16, y + 16, 9, 8, t * 2.2 + x * 0.1, '#f2c66d', { lw: 1.4 });
    } else {
      ctx.beginPath(); ctx.arc(x + 16, y + 16, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#f2c66d'; ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.3 * Math.sin(t * 6 + x)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x + 22, y + 9, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // 'h': oil flask with an amber glow.
  function tOil(ctx, x, y, t) {
    const p = 0.7 + 0.3 * Math.sin(t * 4 + x);
    ctx.fillStyle = '#7d4a1c'; ctx.fillRect(x + 12, y + 5, 8, 4);
    ctx.beginPath(); ctx.ellipse(x + 16, y + 20, 8, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,170,60,' + p.toFixed(3) + ')'; ctx.fill();
    ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + 12, y + 16, 2, 5);
  }

  // 'B': iron grate of the arena, with an ember glow on both edges.
  function tGrate(ctx, x, y, t) {
    ctx.fillStyle = 'rgba(38,34,44,0.92)'; ctx.fillRect(x, y, SZ, SZ);
    ctx.fillStyle = '#7a7480';
    for (let i = 2; i < SZ; i += 8) ctx.fillRect(x + i, y, 3, SZ);
    ctx.fillStyle = '#c9a050';
    for (let i = 3; i < SZ; i += 8) ctx.fillRect(x + i, y + 4, 1.5, 1.5);
    ctx.fillStyle = 'rgba(255,120,70,' + (0.3 + 0.2 * Math.sin(t * 5)).toFixed(3) + ')';
    ctx.fillRect(x, y, 2, SZ); ctx.fillRect(x + SZ - 2, y, 2, SZ);
  }

  window.ENV_THEMES.market = {
    background(ctx, camX, camY, t, W, H) {
      const w = num(W, 960), h = num(H, 540), cx = num(camX), tt = num(t);
      ctx.save();
      drawSky(ctx, w, h);
      rooftopRow(ctx, { f: 0.2, P: 260, base: h * 0.70, color: FAR, seed: 1, lit: false, tower: true }, cx, w, h);
      rooftopRow(ctx, { f: 0.4, P: 210, base: h * 0.86, color: MID, seed: 7, lit: true, tower: false }, cx, w, h);
      drawLanterns(ctx, cx, w, tt);
      drawAwnings(ctx, cx, w, h);
      const hz = ctx.createLinearGradient(0, h * 0.8, 0, h);            // plum dusk shadow at the bottom
      hz.addColorStop(0, 'rgba(40,14,40,0)');
      hz.addColorStop(1, 'rgba(40,14,40,0.4)');
      ctx.fillStyle = hz;
      ctx.fillRect(0, h * 0.8, w, h * 0.2);
      ctx.restore();
    },

    tile(ctx, ch, x, y, t, nb) {
      const n = nb || {}, X = num(x), Y = num(y), tt = num(t);
      ctx.save();
      ctx.beginPath(); ctx.rect(X, Y, SZ, SZ); ctx.clip();
      switch (ch) {
        case '#': tCobble(ctx, X, Y, n); break;
        case '=': tPlank(ctx, X, Y, n); break;
        case '^': tSpikes(ctx, X, Y); break;
        case 'C': tLantern(ctx, X, Y, tt); break;
        case 'X': tExit(ctx, X, Y, tt); break;
        case 'o': tGear(ctx, X, Y, tt); break;
        case 'h': tOil(ctx, X, Y, tt); break;
        case 'B': tGrate(ctx, X, Y, tt); break;
        default: break;
      }
      ctx.restore();
    },

    // Drifting dust motes: low alpha only (0.12 to 0.32). Dark plates sit under the HUD text.
    foreground(ctx, camX, camY, t, W, H) {
      const w = num(W, 960), h = num(H, 540), cx = num(camX), cy = num(camY), tt = num(t);
      ctx.save();
      plate(ctx, 14, 12, 172, 36, 8, 'rgba(40,14,32,0.72)');            // hearts
      plate(ctx, w - 150, 12, 136, 36, 8, 'rgba(40,14,32,0.72)');       // gear and counter
      for (let i = 0; i < 36; i++) {
        const r1 = hash2(i * 1.13, 2.7), r2 = hash2(i * 0.71, 5.3), r3 = hash2(i * 2.9, 1.1);
        const sway = Math.sin(tt * 0.6 + i * 1.7) * (6 + r3 * 8);
        const x = wrap(r1 * (w + 60) - cx * 0.35 + sway, w + 60) - 30;
        const y = wrap(r2 * (h + 40) - tt * (4 + r3 * 6) - cy * 0.1, h + 40) - 20;
        ctx.fillStyle = 'rgba(255,236,200,' + (0.12 + r3 * 0.2).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, y, r3 > 0.7 ? 2 : 1.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  };
})();

  <script>
/* js/env/themes/foundry.js */
/* Environment theme "foundry": the iron foundry under the Saint-Aube Tower.
   Furnaces that never went out, frozen steam, sparks hanging in the air.
   Contract: DESIGN.md section 6 and AGENT_BRIEF.md (environment theme contract). */
(function () {
  window.ENV_THEMES = window.ENV_THEMES || {};

  const S = 32;                       // tile size
  const TAU = Math.PI * 2;
  const HOUR_A = (11.78 / 12) * TAU;  // every clock in the sky reads 23:47
  const MIN_A = (47 / 60) * TAU;

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : (d || 0));
  const mod = (a, m) => ((a % m) + m) % m;
  const f3 = (v) => Math.max(0, Math.min(1, v)).toFixed(3);
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // Parallax row: calls fn(k, screenX) for each world element k.
  // k is a stable world index, so the content does not shuffle as the camera moves.
  function row(camX, factor, period, W, fn) {
    const a = camX * factor;
    const k0 = Math.floor(a / period) - 1;
    const n = Math.ceil(W / period) + 3;
    for (let j = 0; j < n; j++) fn(k0 + j, (k0 + j) * period - a);
  }

  function rrPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Clock hands frozen at 23:47.
  function hands(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(HOUR_A) * r * 0.5, cy - Math.cos(HOUR_A) * r * 0.5);
    ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(MIN_A) * r * 0.8, cy - Math.cos(MIN_A) * r * 0.8);
    ctx.stroke();
    ctx.restore();
  }

  function gear(ctx, cx, cy, r, teeth, rot, color) {
    ctx.beginPath();
    const n = teeth * 2;
    for (let i = 0; i < n; i++) {
      const a = rot + (i * Math.PI) / teeth;
      const rr = i % 2 === 0 ? r : r * 0.7;
      const px = cx + Math.cos(a) * rr;
      const py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#1c1420';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* ---------- background ---------- */

  function drawSky(ctx, W, H, tt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b0805');
    g.addColorStop(0.45, '#3a1610');
    g.addColorStop(0.8, '#5b2513');
    g.addColorStop(1, '#2a0f09');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // dull furnace glow low on the horizon
    const hz = ctx.createRadialGradient(W * 0.5, H * 0.82, 10, W * 0.5, H * 0.82, W * 0.65);
    hz.addColorStop(0, 'rgba(255,120,50,' + f3(0.12 + 0.04 * Math.sin(tt * 0.8)) + ')');
    hz.addColorStop(1, 'rgba(255,120,50,0)');
    ctx.fillStyle = hz;
    ctx.fillRect(0, 0, W, H);
  }

  // Frozen steam bank: it never moves, it only parallaxes with the camera.
  function steamBank(ctx, x, P, y, k) {
    const cxm = x + P * 0.5 + (hash(k) - 0.5) * 90;
    const s = 0.8 + hash(k + 2) * 0.6;
    const puffs = [[0, 0, 30], [28, -12, 38], [60, -2, 28], [-26, 6, 24], [34, 12, 24]];
    ctx.fillStyle = 'rgba(200,205,215,0.08)';
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i];
      ctx.beginPath();
      ctx.arc(cxm + p[0] * s, y + p[1] * s, p[2] * s, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(225,230,240,0.05)';
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i];
      ctx.beginPath();
      ctx.arc(cxm + p[0] * s, y + p[1] * s - 4, p[2] * s * 0.6, 0, TAU);
      ctx.fill();
    }
  }

  // Chimney stack with a frozen steam plume; some carry a clock reading 23:47.
  function chimney(ctx, x, P, base, k) {
    const hgt = 120 + hash(k) * 150;
    const wd = 26 + hash(k + 0.5) * 14;
    const cxm = x + P * (0.25 + hash(k + 1.5) * 0.5);
    const bx = cxm - wd / 2;
    const top = base - hgt;
    ctx.fillStyle = '#2a100b';
    ctx.fillRect(bx, top, wd, hgt);
    ctx.fillRect(bx - 5, top - 4, wd + 10, 8);
    for (let p = 0; p < 3; p++) {
      ctx.fillStyle = 'rgba(232,214,206,' + f3(0.15 - p * 0.04) + ')';
      ctx.beginPath();
      ctx.arc(cxm + (hash(k + p * 3) - 0.5) * 12 + p * 5, top - 16 - p * 20, 11 + p * 6, 0, TAU);
      ctx.fill();
    }
    if (hash(k + 9) < 0.3) {
      const r = 9;
      const cy = top + 24;
      ctx.fillStyle = 'rgba(255,150,70,0.16)';
      ctx.beginPath(); ctx.arc(cxm, cy, r * 1.8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c9a474';
      ctx.beginPath(); ctx.arc(cxm, cy, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#1a0a06';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      hands(ctx, cxm, cy, r, '#2a100b');
    }
  }

  // Sparks frozen in mid-air, twinkling in place.
  function sparks(ctx, x, P, H, k, tt) {
    for (let j = 0; j < 2; j++) {
      const sx = x + hash(k * 3 + j) * P;
      const sy = H * (0.12 + hash(k * 7 + j + 3) * 0.55);
      const a = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(tt * 2.1 + k + j * 2));
      ctx.fillStyle = 'rgba(255,140,60,0.14)';
      ctx.beginPath(); ctx.arc(sx, sy, 4.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,' + f3(a) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, 1.3, 0, TAU); ctx.fill();
    }
  }

  // Cooling pipes with frost on top, and a few vertical drops.
  function pipes(ctx, x, P, H, k) {
    const bars = [[H * 0.47, 10], [H * 0.53, 7]];
    for (let i = 0; i < bars.length; i++) {
      const y = bars[i][0];
      const th = bars[i][1];
      ctx.fillStyle = '#3b1a12';
      ctx.fillRect(x, y, P + 1, th);
      ctx.fillStyle = 'rgba(220,200,195,0.18)';
      ctx.fillRect(x, y, P + 1, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(x, y + th - 2, P + 1, 2);
      ctx.fillStyle = '#2a120c';
      ctx.fillRect(x - 2, y - 3, 5, th + 6);
    }
    if (hash(k + 0.2) < 0.45) {
      const vx = x + 30 + hash(k + 4) * (P - 60);
      const y0 = H * 0.47;
      const len = H * 0.82 - y0;
      ctx.fillStyle = '#3b1a12';
      ctx.fillRect(vx, y0, 8, len);
      ctx.fillStyle = 'rgba(220,200,195,0.16)';
      ctx.fillRect(vx, y0, 2, len);
    }
  }

  // Furnace house with an arched mouth that spills orange light.
  function furnace(ctx, x, P, base, k, tt) {
    if (hash(k) < 0.2) return; // some bays are cold
    const bw = 110, bh = 150;
    const bx = x + (P - bw) / 2 + (hash(k + 4) - 0.5) * 30;
    const top = base - bh;
    ctx.fillStyle = '#2a0f0a';
    ctx.fillRect(bx, top, bw, bh);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 1; i < 5; i++) { ctx.moveTo(bx, top + i * 30); ctx.lineTo(bx + bw, top + i * 30); }
    ctx.stroke();
    const ow = 56, oh = 62;
    const ox = bx + (bw - ow) / 2;
    const mouth = base - 16;
    const oy = mouth - oh;
    const flick = 0.85 + 0.15 * Math.sin(tt * 3.1 + k * 1.7);
    const sp = ctx.createRadialGradient(ox + ow / 2, mouth, 4, ox + ow / 2, mouth, 110);
    sp.addColorStop(0, 'rgba(255,130,40,' + f3(0.12 * flick) + ')');
    sp.addColorStop(1, 'rgba(255,130,40,0)');
    ctx.fillStyle = sp;
    ctx.fillRect(ox - 110, mouth - 110, ow + 220, 220);
    ctx.beginPath();
    ctx.moveTo(ox, mouth);
    ctx.lineTo(ox, oy + ow / 2);
    ctx.arc(ox + ow / 2, oy + ow / 2, ow / 2, Math.PI, 0);
    ctx.lineTo(ox + ow, mouth);
    ctx.closePath();
    const fire = ctx.createLinearGradient(0, oy, 0, mouth);
    fire.addColorStop(0, '#d9874a');
    fire.addColorStop(0.5, '#b84a1c');
    fire.addColorStop(1, '#6e2410');
    ctx.fillStyle = fire;
    ctx.fill();
    ctx.strokeStyle = '#120706';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Glow bands along the floor, then the dark iron plates in front.
  function floorGlow(ctx, W, H, tt) {
    const gy = H * 0.74;
    const g = ctx.createLinearGradient(0, gy, 0, H);
    g.addColorStop(0, 'rgba(255,110,40,0)');
    g.addColorStop(0.5, 'rgba(255,110,40,0.14)');
    g.addColorStop(1, 'rgba(255,90,30,0.32)');
    ctx.fillStyle = g;
    ctx.fillRect(0, gy, W, H - gy);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = 'rgba(255,190,100,' + f3(0.1 + 0.05 * Math.sin(tt * 1.6 + i * 2)) + ')';
      ctx.fillRect(0, H * (0.9 + i * 0.065), W, 2 + i);
    }
    ctx.fillStyle = 'rgba(14,5,4,0.85)';
    ctx.fillRect(0, H * 0.93, W, H * 0.07);
    ctx.fillStyle = '#0a0302';
    for (let x = 0; x < W; x += 96) ctx.fillRect(x, H * 0.93, 2, H * 0.07);
  }

  function background(ctx, camX, camY, t, W, H) {
    const cx = num(camX), tt = num(t), w = num(W, 960), h = num(H, 540);
    const base = h * 0.82;
    ctx.save();
    drawSky(ctx, w, h, tt);
    // cool dark band behind the play height, so the gameplay reads against it
    const band = ctx.createLinearGradient(0, h * 0.5, 0, h * 0.8);
    band.addColorStop(0, 'rgba(12,6,10,0)');
    band.addColorStop(1, 'rgba(12,6,10,0.08)');
    ctx.fillStyle = band;
    ctx.fillRect(0, h * 0.5, w, h * 0.5);
    row(cx, 0.3, 360, w, (k, x) => steamBank(ctx, x, 360, h * (0.16 + hash(k + 11) * 0.2), k));
    row(cx, 0.2, 230, w, (k, x) => chimney(ctx, x, 230, base, k));
    row(cx, 0.35, 160, w, (k, x) => sparks(ctx, x, 160, h, k, tt));
    row(cx, 0.45, 150, w, (k, x) => pipes(ctx, x, 150, h, k));
    row(cx, 0.45, 240, w, (k, x) => furnace(ctx, x, 240, base, k, tt));
    floorGlow(ctx, w, h, tt);
    ctx.restore();
  }

  /* ---------- tiles ---------- */

  // Glowing orange seam; the pulse phase is shared per row so neighbours line up.
  function seam(ctx, x1, y1, x2, y2, tt, phase) {
    const pulse = 0.4 + 0.2 * Math.sin(tt * 2 + phase);
    ctx.strokeStyle = 'rgba(255,100,30,0.14)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,170,80,' + f3(pulse) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function plate(ctx, x, y, n, seed, tt) {
    const s = mod(seed, 8);
    const g = ctx.createLinearGradient(x, y, x, y + S);
    g.addColorStop(0, '#4a4650');
    g.addColorStop(1, '#2a282f');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, S, S);
    if (s % 3 === 0) {
      ctx.fillStyle = 'rgba(150,70,30,0.22)';
      ctx.beginPath(); ctx.ellipse(x + 20, y + 12, 7, 4, 0.3, 0, TAU); ctx.fill();
    }
    if (s < 2) seam(ctx, x, y + 16, x + S, y + 16, tt, y / S);
    else if (s === 5) seam(ctx, x + 16, y, x + 16, y + S, tt, (x + y) / S);
    ctx.strokeStyle = '#120c0d';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, S - 1, S - 1);
    ctx.fillStyle = 'rgba(255,220,200,0.07)';
    ctx.fillRect(x + 1, y + 1, S - 2, 2);
    const rv = [[6, 8], [26, 8], [6, 24], [26, 24]];
    for (let i = 0; i < rv.length; i++) {
      ctx.beginPath();
      ctx.arc(x + rv[i][0], y + rv[i][1], 1.8, 0, TAU);
      ctx.fillStyle = '#716056';
      ctx.fill();
      ctx.strokeStyle = '#120c0c';
      ctx.stroke();
    }
    // exposed sides: rusted lip on top, shade on the others
    if (!n.u) {
      ctx.fillStyle = '#9a909a'; ctx.fillRect(x, y, S, 4);
      ctx.fillStyle = 'rgba(235,225,235,0.35)'; ctx.fillRect(x, y, S, 1);
    }
    if (!n.d) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, y + S - 3, S, 3); }
    if (!n.l) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x, y, 2, S); }
    if (!n.r) { ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x + S - 2, y, 2, S); }
  }

  // Rusty grate platform, lit from the furnace below.
  function grate(ctx, x, y, tt) {
    ctx.fillStyle = '#2a140c';
    ctx.fillRect(x, y + 14, S, 14);
    const gl = ctx.createLinearGradient(0, y + 16, 0, y + S);
    gl.addColorStop(0, 'rgba(255,120,40,0)');
    gl.addColorStop(1, 'rgba(255,120,40,' + f3(0.15 + 0.05 * Math.sin(tt * 2.4)) + ')');
    ctx.fillStyle = gl;
    ctx.fillRect(x, y + 16, S, S - 16);
    ctx.fillStyle = '#7a4128';
    for (let i = 0; i < S; i += 4) ctx.fillRect(x + i, y + 9, 2, 10);
    ctx.fillStyle = '#c77a45';
    ctx.fillRect(x, y + 6, S, 4);
    ctx.fillStyle = 'rgba(255,200,140,0.25)';
    ctx.fillRect(x, y + 6, S, 1);
    ctx.strokeStyle = '#1a0b05';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 6.5, S - 1, 4);
    ctx.fillStyle = 'rgba(90,40,20,0.7)';
    ctx.fillRect(x + 9, y + 20, 2, 2);
    ctx.fillRect(x + 21, y + 26, 2, 2);
  }

  // Rusty spikes with hot tips.
  function spikes(ctx, x, y, tt) {
    for (let i = 0; i < 4; i++) {
      const sx = x + 2 + i * 8;
      ctx.beginPath();
      ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 6); ctx.lineTo(sx + 8, y + S);
      ctx.closePath();
      ctx.fillStyle = '#4d2d22';
      ctx.fill();
      ctx.strokeStyle = '#120706';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 6);
      ctx.strokeStyle = 'rgba(220,150,110,0.35)';
      ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 4, y + 6, 6, 0, TAU);
      ctx.fillStyle = 'rgba(255,140,50,0.22)';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + 2.4, y + 15); ctx.lineTo(sx + 4, y + 6); ctx.lineTo(sx + 5.6, y + 15);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,150,60,' + f3(0.75 + 0.25 * Math.sin(tt * 5 + i)) + ')';
      ctx.fill();
    }
  }

  // Lit lantern-clock, dial at 23:47.
  function lantern(ctx, x, y, tt) {
    const cx = x + 16, cy = y + 13;
    const flick = 0.85 + 0.15 * Math.sin(tt * 9 + x);
    const hg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 15);
    hg.addColorStop(0, 'rgba(255,160,70,' + f3(0.6 * flick) + ')');
    hg.addColorStop(1, 'rgba(255,160,70,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#1f1718';
    ctx.fillRect(cx - 1.5, cy + 8, 3, 24);
    rrPath(ctx, cx - 7, cy - 8, 14, 18, 4);
    ctx.fillStyle = '#ffae55';
    ctx.fill();
    ctx.strokeStyle = '#120706';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#f4e4c0';
    ctx.beginPath(); ctx.arc(cx, cy + 1, 4.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1c1420';
    ctx.lineWidth = 1;
    ctx.stroke();
    hands(ctx, cx, cy + 1, 4.5, '#2a100b');
  }

  // Exit: riveted iron door with a dial at 23:47 and a glowing slit at the foot.
  function exitDoor(ctx, x, y, tt) {
    ctx.fillStyle = '#1e1a1d';
    ctx.fillRect(x, y, S, S);
    rrPath(ctx, x + 3, y + 1, S - 6, S - 1, 3);
    ctx.fillStyle = '#4a4448';
    ctx.fill();
    ctx.strokeStyle = '#120c0c';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    rrPath(ctx, x + 6, y + 4, S - 12, S - 8, 2);
    ctx.fillStyle = '#2c2729';
    ctx.fill();
    const cx = x + 16, cy = y + 12;
    ctx.fillStyle = '#e6d8b8';
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1c1420';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    hands(ctx, cx, cy, 7, '#2a100b');
    ctx.fillStyle = 'rgba(255,130,50,' + f3(0.45 + 0.3 * Math.sin(tt * 3)) + ')';
    ctx.fillRect(x + 7, y + 24, S - 14, 3);
  }

  // Golden cog, turning.
  function cog(ctx, x, y, tt) {
    const cx = x + 16, cy = y + 16;
    gear(ctx, cx, cy, 10, 8, tt * 2.2 + x * 0.1, '#d59a3c');
    ctx.fillStyle = '#7a4a1c';
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.5)';
    ctx.beginPath(); ctx.arc(cx + 5, cy - 6, 1.5, 0, TAU); ctx.fill();
  }

  // Oil flask with a glowing belly.
  function oil(ctx, x, y, tt) {
    ctx.fillStyle = '#7d4a1c';
    ctx.fillRect(x + 12, y + 6, 8, 4);
    const pulse = 0.7 + 0.3 * Math.sin(tt * 4 + x);
    ctx.beginPath();
    ctx.ellipse(x + 16, y + 20, 8, 9, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,150,60,' + f3(pulse) + ')';
    ctx.fill();
    ctx.strokeStyle = '#1c1420';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(x + 12, y + 16, 2, 5);
  }

  // Arena bars: iron grille with hot edges.
  function bars(ctx, x, y, tt) {
    ctx.fillStyle = '#1e181c';
    ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#5e5458';
    for (let i = 2; i < S; i += 8) ctx.fillRect(x + i, y, 3, S);
    ctx.fillStyle = '#3a3034';
    ctx.fillRect(x, y + 4, S, 2);
    ctx.fillRect(x, y + S - 6, S, 2);
    ctx.fillStyle = 'rgba(255,110,50,' + f3(0.3 + 0.2 * Math.sin(tt * 5)) + ')';
    ctx.fillRect(x, y, 2, S);
    ctx.fillRect(x + S - 2, y, 2, S);
  }

  function tile(ctx, ch, x, y, t, nb) {
    const px = num(x), py = num(y), tt = num(t), n = nb || {};
    ctx.save();
    ctx.beginPath();
    ctx.rect(px, py, S, S);
    ctx.clip();
    switch (ch) {
      case '#': plate(ctx, px, py, n, Math.floor(px / S) * 31 + Math.floor(py / S) * 17, tt); break;
      case '=': grate(ctx, px, py, tt); break;
      case '^': spikes(ctx, px, py, tt); break;
      case 'C': lantern(ctx, px, py, tt); break;
      case 'X': exitDoor(ctx, px, py, tt); break;
      case 'o': cog(ctx, px, py, tt); break;
      case 'h': oil(ctx, px, py, tt); break;
      case 'B': bars(ctx, px, py, tt); break;
      default: break;
    }
    ctx.restore();
  }

  /* ---------- foreground ---------- */

  // Embers rising slowly, alpha kept within 0.14-0.39 (contract: 0.1-0.4).
  function foreground(ctx, camX, camY, t, W, H) {
    const cx = num(camX), tt = num(t), w = num(W, 960), h = num(H, 540);
    ctx.save();
    for (let i = 0; i < 30; i++) {
      const r0 = hash(i * 3.1 + 1), r1 = hash(i * 5.7 + 2), r2 = hash(i * 9.3 + 4);
      const speed = 12 + r0 * 24;
      const span = h + 40;
      const y = h + 20 - mod(tt * speed + r2 * span, span);
      const sway = Math.sin(tt * 0.9 + i * 1.7) * (6 + r1 * 8);
      const x = mod(r1 * w - cx * 0.6 + sway, w + 60) - 30;
      const a = 0.14 + 0.25 * (0.5 + 0.5 * Math.sin(tt * 3 + i));
      const r = 1 + r0 * 1.6;
      ctx.fillStyle = 'rgba(255,150,60,' + f3(a) + ')';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,230,170,0.35)';
      ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  window.ENV_THEMES.foundry = {
    background(ctx, camX, camY, t, W, H) { background(ctx, camX, camY, t, W, H); },
    tile(ctx, ch, x, y, t, nb) { tile(ctx, ch, x, y, t, nb); },
    foreground(ctx, camX, camY, t, W, H) { foreground(ctx, camX, camY, t, W, H); }
  };
})();

  <script>
/* js/env/themes/tower.js */
/* ENV theme "tower": inside the Saint-Aube Clock Tower (DESIGN.md section 6, AGENT_BRIEF.md).
   Cold blue-grey stone, arches in the far layer, huge stopped gear rings in the mid layer,
   ropes and chains, a dim blue light from above. Every clock reads 23:47. */
(function () {
  window.ENV_THEMES = window.ENV_THEMES || {};

  const S = 32;
  const OUT = '#1c1420';
  const WOOD = '#6b5234', WOOD_HI = '#8c6d48', WOOD_LO = '#3e2e1f';
  const BRASS = '#c49a4e', BRASS_HI = '#f0d48a', BRASS_LO = '#7a5a2a';
  const HOUR_A = (11.78 / 12) * Math.PI * 2;  // 23:47
  const MIN_A = (47 / 60) * Math.PI * 2;

  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const mod = (v, m) => ((v % m) + m) % m;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hash = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
  const rgb = (r, g, b) => 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';

  // ART.gear when the art helpers are loaded, otherwise a plain disc with teeth
  function gear(ctx, x, y, r, teeth, rot, color, opts) {
    if (window.ART && typeof window.ART.gear === 'function') {
      window.ART.gear(ctx, x, y, r, teeth, rot, color, opts || {});
      return;
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < teeth; k++) {
      const a = rot + (k / teeth) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.14, 0, Math.PI * 2); ctx.fill();
    }
  }

  // hands frozen at 23:47 (hour just before XII, minute on the 47)
  function hands(ctx, x, y, len, lw, color) {
    ctx.strokeStyle = color; ctx.lineCap = 'round';
    ctx.lineWidth = lw * 1.3;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.sin(HOUR_A) * len * 0.6, y - Math.cos(HOUR_A) * len * 0.6); ctx.stroke();
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.sin(MIN_A) * len, y - Math.cos(MIN_A) * len); ctx.stroke();
  }

  function dial(ctx, x, y, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#c8c1ae';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#343c4a'; ctx.lineWidth = r * 0.1; ctx.stroke();
    ctx.fillStyle = '#343c4a';
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      ctx.fillRect(x + Math.sin(a) * r * 0.8 - 1.5, y - Math.cos(a) * r * 0.8 - 1.5, 3, 3);
    }
    hands(ctx, x, y, r * 0.8, r * 0.06, '#2a2f38');
    ctx.restore();
  }

  function arch(ctx, x, top, w, H) {
    const r = w / 2;
    ctx.fillStyle = '#060a10';
    ctx.beginPath();
    ctx.moveTo(x, H); ctx.lineTo(x, top + r);
    ctx.arc(x + r, top + r, r, Math.PI, 0);
    ctx.lineTo(x + w, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,185,215,0.16)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + r, top + r, r - 4, Math.PI, 0); ctx.stroke();
  }

  // a stopped gear ring: body, inner ring, fixed spokes, hub, cold highlight on the top rim
  function ringGear(ctx, x, y, r, teeth, rot) {
    gear(ctx, x, y, r, teeth, rot, '#243041', { stroke: false });
    ctx.strokeStyle = '#121a25'; ctx.lineWidth = Math.max(4, r * 0.06);
    ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#1a2431'; ctx.lineWidth = r * 0.07;
    for (let k = 0; k < 6; k++) {
      const a = rot + (k * Math.PI) / 3;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.18, y + Math.sin(a) * r * 0.18);
      ctx.lineTo(x + Math.cos(a) * r * 0.72, y + Math.sin(a) * r * 0.72);
      ctx.stroke();
    }
    ctx.fillStyle = '#121a25';
    ctx.beginPath(); ctx.arc(x, y, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,190,220,0.14)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r - 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }

  function rope(ctx, x, H, t, i) {
    const sway = Math.sin(t * 0.6 + i * 1.3) * 2;
    // fades in from the top edge so the rope does not run behind the HUD
    const fade = ctx.createLinearGradient(0, 0, 0, H * 0.3);
    fade.addColorStop(0, 'rgba(47,53,63,0)'); fade.addColorStop(1, '#2f353f');
    const fadeHi = ctx.createLinearGradient(0, 0, 0, H * 0.3);
    fadeHi.addColorStop(0, 'rgba(92,101,114,0)'); fadeHi.addColorStop(1, '#5c6572');
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.quadraticCurveTo(x + 46 + sway, H * 0.5, x + 14 + sway, H * 0.86);
    ctx.strokeStyle = fade; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = fadeHi; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // hanging chain: alternating face-on and edge-on links, ending in a brass weight
  function chain(ctx, x, yEnd, t, i) {
    const sway = Math.sin(t * 0.5 + i) * 1.5;
    ctx.strokeStyle = '#56616f'; ctx.lineWidth = 2;
    for (let y = 0, k = 0; y < yEnd; y += 9, k++) {
      ctx.beginPath();
      ctx.ellipse(x + sway, y, k % 2 ? 1.8 : 3.6, 5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = BRASS_LO; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x + sway, yEnd + 10, 7, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = BRASS;
    ctx.beginPath(); ctx.ellipse(x + sway - 2, yEnd + 6, 2, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  /* ---------- background (opaque, parallax 0.2x far / 0.45x mid) ---------- */
  function background(ctx, camX, camY, t, W, H) {
    W = num(W) || 960; H = num(H) || 540;
    const cx = num(camX), cy = num(camY), tt = num(t);
    ctx.save();
    // cold stone, lit from above
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080d15'); g.addColorStop(0.5, '#1d2c40'); g.addColorStop(1, '#0a1018');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // dim blue light falling from above
    const L = ctx.createRadialGradient(W * 0.5, -H * 0.1, 10, W * 0.5, -H * 0.1, W * 0.8);
    L.addColorStop(0, 'rgba(120,170,230,0.30)'); L.addColorStop(1, 'rgba(120,170,230,0)');
    ctx.fillStyle = L; ctx.fillRect(0, 0, W, H);

    // far layer: one faded 23:47 dial on the wall (wrapped), then the arches
    const far = cx * 0.2;
    const dx = mod(W * 0.5 - far, 1200);
    for (let k = -1; k <= 1; k++) dial(ctx, dx + k * 1200, H * 0.16, 56, 0.45);
    const AP = 240, aOff = -mod(far, AP);
    for (let i = -1; i < 6; i++) arch(ctx, aOff + i * AP, H * 0.36, 110, H);
    // pale shafts of blue light slanting down between the arches
    const SP = 380, sOff = -mod(far, SP);
    ctx.fillStyle = 'rgba(150,190,235,0.07)';
    for (let i = -1; i < 4; i++) {
      const x = sOff + i * SP + 120;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + 50, 0); ctx.lineTo(x + 190, H * 0.9); ctx.lineTo(x + 60, H * 0.9);
      ctx.closePath(); ctx.fill();
    }

    // mid layer: huge stopped gear rings, with ropes and chains in front
    const mid = cx * 0.45;
    const GP = 440, gOff = -mod(mid, GP);
    const GEARS = [[170, 28, 0.2], [125, 20, 1.1], [190, 30, 0.6]];
    for (let i = -1; i < 4; i++) {
      const G = GEARS[mod(i, 3)];
      ringGear(ctx, gOff + i * GP + GP * 0.5, H * 0.5 - cy * 0.1, G[0], G[1], G[2]);
    }
    const RP = 300, rOff = -mod(mid, RP);
    for (let i = -1; i < 5; i++) rope(ctx, rOff + i * RP + 150, H, tt, i);
    const CP = 520, cOff = -mod(mid, CP);
    for (let i = -1; i < 3; i++) chain(ctx, cOff + i * CP + 380, H * 0.62, tt, i);

    // top band: keeps ropes and chains from running behind the HUD
    const B = ctx.createLinearGradient(0, 0, 0, H * 0.2);
    B.addColorStop(0, 'rgba(8,13,21,0.7)'); B.addColorStop(1, 'rgba(8,13,21,0)');
    ctx.fillStyle = B; ctx.fillRect(0, 0, W, H * 0.2);

    // floor haze
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, H * 0.82, W, H * 0.18);
    ctx.restore();
  }

  /* ---------- tiles (each draws only inside its 32x32 cell) ---------- */
  // '#': dark stone blocks, two courses of 16 px, mortar lines between them
  function stone(ctx, x, y, n) {
    ctx.fillStyle = '#080c12';
    ctx.fillRect(x, y, S, S);
    for (let r = 0; r < 2; r++) {
      const ry = y + r * 16;
      const row = Math.round(ry / 16);
      const shift = row % 2 ? 8 : 0;
      const k0 = Math.floor((x - shift) / 16), k1 = Math.floor((x + S - 1 - shift) / 16);
      for (let k = k0; k <= k1; k++) {
        const bs = k * 16 + shift, be = bs + 16;
        const a = Math.max(bs, x), b = Math.min(be, x + S);
        const h = hash(k, row);
        ctx.fillStyle = rgb(70 + h * 18, 82 + h * 18, 98 + h * 20);
        const l = bs >= x ? 1 : 0, rr = be <= x + S ? 1 : 0;
        ctx.fillRect(a + l, ry + 1, b - rr - (a + l), 14);
      }
    }
    if (!n.u) { ctx.fillStyle = 'rgba(180,200,220,0.18)'; ctx.fillRect(x, y, S, 2); }
    if (!n.l) { ctx.fillStyle = 'rgba(200,220,240,0.10)'; ctx.fillRect(x, y, 2, S); }
    if (!n.r) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + S - 2, y, 2, S); }
    if (!n.d) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, y + S - 2, S, 2); }
  }

  function stud(ctx, x, y) {
    ctx.fillStyle = BRASS;
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = BRASS_HI; ctx.fillRect(x - 1, y - 1.2, 1.2, 1.2);
  }

  // '=': weathered wooden beam, plank surface on the tile's top edge (where the player lands), brass studs
  function beam(ctx, x, y, n) {
    ctx.fillStyle = WOOD; ctx.fillRect(x, y, S, 14);
    ctx.fillStyle = WOOD_HI; ctx.fillRect(x, y, S, 2);
    ctx.fillStyle = WOOD_LO; ctx.fillRect(x, y + 12, S, 2);
    ctx.strokeStyle = 'rgba(38,26,16,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + 4.5); ctx.quadraticCurveTo(x + 16, y + 3, x + S, y + 5.5);
    ctx.moveTo(x, y + 7.5); ctx.lineTo(x + 10, y + 7.5);
    ctx.moveTo(x + 14, y + 7.5); ctx.lineTo(x + S, y + 7.5);
    ctx.stroke();
    const p = hash(Math.round(x / S), Math.round(y / S));
    ctx.fillStyle = 'rgba(120,145,170,0.2)';  // cold frost on the weathered wood
    ctx.beginPath(); ctx.ellipse(x + p * S, y + 6, 5 + p * 3, 3, 0, 0, Math.PI * 2); ctx.fill();
    stud(ctx, x + 8, y + 6);
    stud(ctx, x + 24, y + 6);
    if (!n.l) { ctx.fillStyle = WOOD_LO; ctx.fillRect(x, y, 2, 14); }
    if (!n.r) { ctx.fillStyle = WOOD_LO; ctx.fillRect(x + S - 2, y, 2, 14); }
  }

  // 'L': the same beam, reached only with the spring (midair jump); brass end caps and a faint brass glint on top
  function springLedge(ctx, x, y, n) {
    beam(ctx, x, y, n);
    ctx.fillStyle = BRASS_HI;
    if (!n.l) ctx.fillRect(x, y, 2, 14);
    if (!n.r) ctx.fillRect(x + S - 2, y, 2, 14);
    ctx.fillStyle = 'rgba(240,212,138,0.35)'; ctx.fillRect(x, y, S, 2);
  }

  // '^': brass spikes
  function spikes(ctx, x, y) {
    for (let i = 0; i < 4; i++) {
      const sx = x + 2 + i * 8;
      ctx.fillStyle = BRASS; ctx.strokeStyle = OUT; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 8); ctx.lineTo(sx + 8, y + S); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = BRASS_HI;
      ctx.beginPath(); ctx.moveTo(sx + 1, y + S - 1); ctx.lineTo(sx + 4, y + 10); ctx.lineTo(sx + 4, y + S - 1); ctx.closePath();
      ctx.fill();
    }
  }

  // 'C': lantern-clock on a pole, warm glow marks the save point
  function lantern(ctx, x, y, t) {
    const cx = x + 16, cy = y + 13;
    const flick = 0.85 + 0.15 * Math.sin(t * 9 + x);
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18);
    g.addColorStop(0, 'rgba(255,225,150,' + (0.55 * flick).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,225,150,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#2a2a33'; ctx.fillRect(cx - 1.5, cy + 7, 3, 12);
    ctx.fillStyle = BRASS; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff1c8';
    ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2); ctx.fill();
    hands(ctx, cx, cy, 4.5, 1.2, OUT);
  }

  // 'X': iron exit door with a 23:47 dial and a brass threshold glow
  function door(ctx, x, y, t) {
    ctx.fillStyle = '#2b3442'; ctx.fillRect(x + 2, y, S - 4, S);
    ctx.fillStyle = '#3d4859'; ctx.fillRect(x + 6, y + 3, S - 12, S - 3);
    ctx.fillStyle = '#1b212b';
    ctx.fillRect(x + 3, y, 2, S); ctx.fillRect(x + S - 5, y, 2, S);
    ctx.fillStyle = '#c8c1ae';
    ctx.beginPath(); ctx.arc(x + 16, y + 12, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
    hands(ctx, x + 16, y + 12, 5.5, 1.1, '#2a2f38');
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t * 3);
    ctx.fillStyle = BRASS_HI; ctx.fillRect(x + 6, y + 27, S - 12, 3);
    ctx.globalAlpha = 1;
  }

  // 'o': golden rouage, turning
  function rouage(ctx, x, y, t) {
    const cx = x + 16, cy = y + 16;
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 16);
    g.addColorStop(0, 'rgba(255,210,120,0.28)'); g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, S, S);
    gear(ctx, cx, cy, 10, 9, t * 2.2 + x * 0.1, BRASS, { lw: 1.4 });
    ctx.fillStyle = BRASS_LO;
    ctx.beginPath(); ctx.arc(cx, cy, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * Math.sin(t * 6 + x)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(cx + 5, cy - 6, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  // 'h': oil flask, glowing amber
  function oil(ctx, x, y, t) {
    const pulse = 0.7 + 0.3 * Math.sin(t * 4 + x);
    ctx.fillStyle = 'rgba(190,225,245,0.35)'; ctx.fillRect(x + 13, y + 8, 6, 5);
    ctx.fillStyle = BRASS_LO; ctx.fillRect(x + 12, y + 4, 8, 4);
    ctx.fillStyle = 'rgba(255,170,60,' + pulse.toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(x + 16, y + 20, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + 11, y + 16, 2, 5);
  }

  // soft ember glow on the air side of an edge: an ellipse 12 px out from the edge and 24 px along it
  function emberEdge(ctx, ex, y, dir) {
    ctx.save();
    ctx.translate(ex, y + S / 2); ctx.scale(0.5, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 24);
    g.addColorStop(0, 'rgba(255,110,80,0.4)'); g.addColorStop(1, 'rgba(255,110,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(dir < 0 ? -24 : 0, -24, 24, 48);
    ctx.restore();
  }

  // 'B': iron grate of the arena, red-hot edges with an ember glow outside them
  function grate(ctx, x, y, t) {
    ctx.fillStyle = 'rgba(44,54,68,0.92)'; ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#6d7989';
    for (let i = 8; i < S; i += 8) ctx.fillRect(x + i, y, 3, S);
    ctx.fillStyle = BRASS;
    for (let i = 9; i < S; i += 8) ctx.fillRect(x + i, y + 4, 1.5, 1.5);
    ctx.fillStyle = 'rgba(255,110,80,' + (0.75 + 0.15 * Math.sin(t * 5)).toFixed(3) + ')';
    ctx.fillRect(x, y, 4, S); ctx.fillRect(x + S - 4, y, 4, S);
    emberEdge(ctx, x, y, -1);
    emberEdge(ctx, x + S, y, 1);
  }

  function tile(ctx, ch, x, y, t, nb) {
    const n = nb || {};
    const X = num(x), Y = num(y), tt = num(t);
    ctx.save();
    if (ch !== 'B') { ctx.beginPath(); ctx.rect(X, Y, S, S); ctx.clip(); }  // the gate's glow spills past its cell
    if (ch === '#') stone(ctx, X, Y, n);
    else if (ch === '=') beam(ctx, X, Y, n);
    else if (ch === 'L') springLedge(ctx, X, Y, n);
    else if (ch === '^') spikes(ctx, X, Y);
    else if (ch === 'C') lantern(ctx, X, Y, tt);
    else if (ch === 'X') door(ctx, X, Y, tt);
    else if (ch === 'o') rouage(ctx, X, Y, tt);
    else if (ch === 'h') oil(ctx, X, Y, tt);
    else if (ch === 'B') grate(ctx, X, Y, tt);
    ctx.restore();
  }

  /* ---------- foreground: slow dust motes, alpha 0.1-0.4 ---------- */
  function foreground(ctx, camX, camY, t, W, H) {
    W = num(W) || 960; H = num(H) || 540;
    const cx = num(camX), cy = num(camY), tt = num(t);
    ctx.save();
    ctx.fillStyle = '#d6ebff';
    for (let i = 0; i < 36; i++) {
      const x = mod(i * 97.7 - cx * 0.35 + Math.sin(tt * 0.25 + i) * 14, W + 40) - 20;
      const y = mod(i * 53.1 - tt * 4 - cy * 0.1, H + 20) - 10;
      ctx.globalAlpha = clamp(0.12 + 0.16 * (0.5 + 0.5 * Math.sin(tt * 0.8 + i * 1.7)), 0.1, 0.4);
      ctx.beginPath(); ctx.arc(x, y, 0.8 + (i % 3) * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  window.ENV_THEMES.tower = { background: background, tile: tile, foreground: foreground };
})();
