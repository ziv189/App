        m.lean = -0.16 * k;
        m.loaf.rx = 6.6 * (1 + 0.15 * k);
        m.loaf.ry = 4.6 * (1 - 0.25 * k);
        m.loaf.x = 2 - 1.5 * k;
        m.squint = t < 0.6 ? 0.7 : 0.3;
        m.mouthO = true;
        break;
      }
      case 'dead': {
        const f = clamp(t / 0.5, 0, 1);
        m.lean = -(Math.PI / 2) * smooth(f);                  // falls backward
        m.alpha = 1 - clamp((t - 0.6) / 1.0, 0, 1);           // then fades out
        m.squint = 1;
        break;
      }
      default: { // idle: slow breathing, gentle sway
        const br = Math.sin(time * 2.4);
        m.sy = 1 + 0.018 * br;
        m.lean = 0.012 * Math.sin(time * 1.3);
        m.loaf.y = -17 - 0.5 * br;
      }
    }
    return m;
  }

  /* ---------- body parts (full figure, feet at 0,0) ---------- */
  function handsAt(m) {
    const L = m.loaf;
    return [[L.x - L.rx * 0.8, L.y + 1.2], [L.x + L.rx * 0.85, L.y + 1.4]];
  }

  function drawLegs(ctx, m, c) {
    const hips = [-3.4, 3.4];
    for (let i = 0; i < 2; i++) {
      const fx = m.feet[i][0], fy = m.feet[i][1];
      ART.limb(ctx, hips[i], -8, fx, fy - 3.2, 3.4, c.stocking, { lw: 1 });
      ART.ell(ctx, fx + 0.9, fy - 1.6, 3.7, 2.1, c.shoe, { lw: 1.3 });
    }
  }

  /* Bun at the nape, scarf knot and tails (behind the head). The pencil pokes out from under the scarf. */
  function drawTails(ctx, m, c) {
    const f = m.flutter;
    ART.ell(ctx, -8.8, -40.5, 3.2, 3.2, c.hair, { lw: 1.2 });
    ART.limb(ctx, -8.6, -41, -15.2, -48.2, 1.9, c.pencil, { lw: 0.8 });
    ART.limb(ctx, -15.2, -48.2, -16.8, -50, 1.9, c.wood, { lw: 0.6 });
    ART.poly(ctx, [[-8.5, -40], [-15.6, -36 + f], [-16.2, -28 + f], [-8, -33]], c.scarf, { lw: 1.4 });
    ART.poly(ctx, [[-9, -37.5], [-16.8, -42.6 - f], [-15.6, -46.8 - f], [-8.5, -41]], c.scarf, { lw: 1.4 });
    ART.ell(ctx, -12.4, -32 + f * 0.6, 0.9, 0.9, c.dot, { stroke: false });
  }

  function dressPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-6.5, -25.5);
    ctx.quadraticCurveTo(-12.6, -22, -12.9, -14);
    ctx.quadraticCurveTo(-13.8, -8, -14.6, -5.5);
    ctx.quadraticCurveTo(0, -3.6, 14.6, -5.5);
    ctx.quadraticCurveTo(13.8, -8, 12.9, -14);
    ctx.quadraticCurveTo(12.6, -22, 6.5, -25.5);
    ctx.closePath();
  }

  function drawDress(ctx, c) {
    dressPath(ctx);
    ctx.fillStyle = c.dress;
    ctx.fill();
    ctx.save();
    dressPath(ctx);
    ctx.clip();
    // light comes from the upper left: the right side of the skirt is in shade
    ART.poly(ctx, [[3, -26], [11, -20], [13.5, -13], [15.5, -4], [5, -4], [1, -14]], c.dressDark, { stroke: false, alpha: 0.85 });
    ART.ell(ctx, -7.5, -18, 2.2, 3.4, c.dressLight, { stroke: false, alpha: 0.5 });
    ART.limb(ctx, -7.8, -14, -9.6, -7, 1, c.dressDark, { stroke: false });
    ART.limb(ctx, 8.2, -15, 9.8, -8, 1, c.dressDark, { stroke: false });
    ctx.restore();
    dressPath(ctx);
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function drawApron(ctx, c) {
    ART.poly(ctx, [[-5.5, -24.8], [5.5, -24.8], [6.8, -19], [9.4, -12.5], [10.4, -7], [-10.4, -7], [-9.4, -12.5], [-6.8, -19]], c.apron, { lw: 1.4 });
    ART.limb(ctx, -6.6, -19, 6.6, -19, 1.1, c.apronShade, { stroke: false });
    ART.ell(ctx, -4.2, -12.5, 1.5, 0.9, c.flour, { stroke: false, rot: 0.4 });
    ART.ell(ctx, 5.4, -10, 1.2, 0.8, c.flour, { stroke: false });
    ART.ell(ctx, -7.8, -9.2, 1, 0.7, c.flour, { stroke: false });
  }

  /* Two-segment sleeve from shoulder to hand, elbow pushed outward. */
  function arm(ctx, sx, sy, hx, hy, side, color) {
    const ex = (sx + hx) / 2 + side * 3.2, ey = (sy + hy) / 2 + 2.2;
    ART.limb(ctx, sx, sy, ex, ey, 4.6, color, { lw: 1.4 });
    ART.limb(ctx, ex, ey, hx, hy, 4.2, color, { lw: 1.4 });
  }

  function drawArms(ctx, m, c) {
    const h = handsAt(m);
    arm(ctx, -7.8, -23.5, h[0][0], h[0][1], -1, c.dress);
    arm(ctx, 7.8, -23.5, h[1][0], h[1][1], 1, c.dress);
  }

  function drawTrail(ctx, m) {
    const s = m.swing;
    if (!s) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, s.R, s.from, s.to);
    ctx.strokeStyle = 'rgba(255, 244, 220, 0.55)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  function drawLoaf(ctx, m, c) {
    const L = m.loaf;
    ART.ell(ctx, L.x, L.y, L.rx, L.ry, c.bread, { lw: 1.5 });
    ART.ell(ctx, L.x + 0.8, L.y + 1.9, L.rx * 0.7, L.ry * 0.25, c.crust, { stroke: false, alpha: 0.35 });
    ART.ell(ctx, L.x - 1.2, L.y - 2.2, L.rx * 0.45, L.ry * 0.25, c.breadHi, { stroke: false, alpha: 0.9, rot: -0.15 });
    [-0.4, 0.05, 0.5].forEach((k) => {
      const x = L.x + k * L.rx;
      ART.limb(ctx, x - 1.3, L.y - 1.2, x + 0.9, L.y - 3, 0.9, c.crust, { stroke: false });
    });
    [[L.x + 2.6, L.y - 3.4], [L.x - 3.6, L.y + 0.6], [L.x + 4.2, L.y + 1.2]]
      .forEach(([x, y]) => ART.ell(ctx, x, y, 0.6, 0.6, c.dust, { stroke: false }));
  }

  function drawHands(ctx, m, c) {
    handsAt(m).forEach(([x, y]) => ART.ell(ctx, x, y, 2.3, 2.0, c.skin, { lw: 1.1 }));
  }

  function drawMouth(ctx, m, c) {
    if (m.st === 'dead') return;
    if (m.st === 'talk') ART.ell(ctx, 0.4, -25.6, 1.6, 0.5 + 1.1 * m.mouth, c.mouthIn, { lw: 0.8 });
    else if (m.mouthO) ART.ell(ctx, 0.4, -25.6, 1.3, 1.5, c.mouthIn, { lw: 0.8 });
    else ART.limb(ctx, -1.8, -26.4, 2.6, -26.4, 1, c.mouth, { stroke: false });
  }

  /* Head: face, then the headscarf cap with its polka dots. */
  function drawHead(ctx, m, c) {
    const shut = Math.max(m.blink, m.squint);
    ART.ell(ctx, 0, -34, 9.6, 10.2, c.skin, { lw: 1.8 });
    ART.ell(ctx, -5.4, -28.6, 2.6, 1.8, c.blush, { stroke: false, alpha: 0.75 });
    ART.ell(ctx, 5.4, -28.6, 2.6, 1.8, c.blush, { stroke: false, alpha: 0.75 });
    ART.limb(ctx, 0.8, -30.6, 1.6, -29.2, 0.9, c.skinDark, { stroke: false });
    ART.eye(ctx, -3.2, -31.8, 2.1, 0.3, 0, shut, { lw: 0.9 });
    ART.eye(ctx, 3.4, -31.8, 2.1, 0.3, 0, shut, { lw: 0.9 });
    drawMouth(ctx, m, c);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-10.6, -35);
    ctx.bezierCurveTo(-12.6, -52, 12.6, -52, 10.6, -35);
    ctx.bezierCurveTo(7, -40.5, -7, -40.5, -10.6, -35);
    ctx.closePath();
    ctx.fillStyle = c.scarf;
    ctx.fill();
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
    [[-5.2, -43.6], [0.2, -45.8], [5.4, -43.6], [-7.9, -40.8]]
      .forEach(([x, y]) => ART.ell(ctx, x, y, 1.1, 1.1, c.dot, { lw: 0.6 }));
  }

  function draw(ctx, p) {
    const m = pose(p || {});
    const c = palette(m.fz);
    ctx.save();
    if (m.alpha < 1) ctx.globalAlpha *= clamp(m.alpha, 0, 1);
    ctx.rotate(m.lean);              // pivot at the feet
    ctx.scale(m.sx, m.sy);
    if (m.dash) ART.limb(ctx, -17, -30, -27, -30, 1.4, 'rgba(255, 255, 255, 0.5)', { stroke: false });
    drawLegs(ctx, m, c);             // legs stay on the ground while the body bobs
    ctx.translate(0, m.bob);
    drawTails(ctx, m, c);
    drawDress(ctx, c);
    drawApron(ctx, c);
    drawArms(ctx, m, c);
    drawTrail(ctx, m);
    // the loaf goes behind her head during a wind-up, otherwise in front of it
    const front = m.behind ? [drawLoaf, drawHands, drawHead] : [drawHead, drawLoaf, drawHands];
    front.forEach((fn) => fn(ctx, m, c));
    ctx.restore();
  }

  /* ---------- portrait: head and shoulders filling the 200x200 box ---------- */
  function bodicePath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-100, 100);
    ctx.lineTo(-100, 78);
    ctx.quadraticCurveTo(-98, 50, -62, 46);
    ctx.quadraticCurveTo(-30, 62, 0, 62);
    ctx.quadraticCurveTo(30, 62, 62, 46);
    ctx.quadraticCurveTo(98, 50, 100, 78);
    ctx.lineTo(100, 100);
    ctx.closePath();
  }

  function drawPortraitMouth(ctx, e, c) {
    ctx.save();
    if (e === 'happy') {
      ctx.beginPath();
      ctx.moveTo(-18, 26);
      ctx.quadraticCurveTo(0, 32, 18, 26);
      ctx.quadraticCurveTo(14, 50, 0, 50);
      ctx.quadraticCurveTo(-14, 50, -18, 26);
      ctx.closePath();
      ctx.fillStyle = c.mouthIn;
      ctx.fill();
      ctx.strokeStyle = OUT;
      ctx.lineWidth = 2.6;
      ctx.stroke();
      ART.ell(ctx, 1, 42, 7, 3.4, c.tongue, { stroke: false });
    } else if (e === 'surprised') {
      ART.ell(ctx, 0, 34, 7.5, 9.5, c.mouthIn, { lw: 2.6 });
    } else if (e === 'angry') {
      ART.rr(ctx, -13, 31, 26, 7, 3.5, c.mouth, { lw: 1.6 });
    } else {
      ctx.beginPath();
      if (e === 'sad') {
        ctx.moveTo(-13, 40);
        ctx.quadraticCurveTo(0, 28, 13, 40);
      } else if (e === 'worried') {
        ctx.moveTo(-13, 36);
        ctx.quadraticCurveTo(-6.5, 30, 0, 36);
        ctx.quadraticCurveTo(6.5, 42, 13, 36);
      } else {
        ctx.moveTo(-12, 31);
        ctx.quadraticCurveTo(0, 37, 12, 31);
      }
      ctx.strokeStyle = c.mouth;
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.restore();
  }

  function portrait(ctx, expr, t) {
    const e = EXPRS.indexOf(expr) >= 0 ? expr : 'neutral';
    const time = num(t);
    const c = palette(0);
    const blink = ((time % 3.4) + 3.4) % 3.4 < 0.12 ? 1 : 0;
    const sway = Math.sin(time * 2.2) * 3;
    const happy = e === 'happy';
    ctx.save();
    ctx.translate(0, Math.sin(time * 2) * 0.8);

    // neck, dress with shoulder shade, apron bib, sleeves, loaf and hands
    ART.rr(ctx, -17, 22, 34, 36, 10, c.skin, { lw: 2.5 });
    bodicePath(ctx);
    ctx.fillStyle = c.dress;
    ctx.fill();
    ctx.save();
    bodicePath(ctx);
    ctx.clip();
    ART.poly(ctx, [[30, 50], [62, 44], [100, 60], [100, 100], [44, 100]], c.dressDark, { stroke: false, alpha: 0.8 });
    ctx.restore();
    bodicePath(ctx);
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ART.poly(ctx, [[-36, 62], [36, 62], [42, 100], [-42, 100]], c.apron, { lw: 2.2 });
    ART.ell(ctx, -20, 88, 4.5, 2.6, c.flour, { stroke: false });
    ART.ell(ctx, 22, 94, 3.4, 2.2, c.flour, { stroke: false });
    ART.ell(ctx, -30, 74, 2.6, 1.6, c.flour, { stroke: false });
    ART.limb(ctx, -74, 66, -42, 82, 16, c.dress, { lw: 2.4 });
    ART.limb(ctx, 74, 66, 42, 82, 16, c.dress, { lw: 2.4 });
    ART.ell(ctx, 0, 80, 36, 19, c.bread, { lw: 3 });
    ART.ell(ctx, 0, 91, 30, 5, c.crust, { stroke: false, alpha: 0.25 });
    ART.ell(ctx, -8, 70, 15, 5.5, c.breadHi, { stroke: false, alpha: 0.85, rot: -0.12 });
    [[-18, 73, -9, 68], [-1, 75, 7, 70], [13, 78, 21, 73]]
      .forEach((s) => ART.limb(ctx, s[0], s[1], s[2], s[3], 3.4, c.crust, { stroke: false }));
    [[-22, 85], [10, 88], [26, 80]].forEach(([x, y]) => ART.ell(ctx, x, y, 1.6, 1.6, c.dust, { stroke: false }));
    ART.ell(ctx, -40, 80, 9, 8.5, c.skin, { lw: 2.4 });
    ART.ell(ctx, 40, 81, 9, 8.5, c.skin, { lw: 2.4 });
    ART.limb(ctx, -44, 76, -43, 84, 1.2, c.skinDark, { stroke: false });
    ART.limb(ctx, 44, 77, 43, 85, 1.2, c.skinDark, { stroke: false });

    // scarf knot and tails behind the head
    ART.poly(ctx, [[-44, -30], [-84, -18 + sway], [-86, 10 + sway], [-48, -4]], c.scarf, { lw: 2.4 });
    ART.poly(ctx, [[-46, -46], [-92, -54 - sway], [-86, -28 - sway * 0.5], [-44, -30]], c.scarf, { lw: 2.4 });
    ART.ell(ctx, -70, -10 + sway * 0.4, 3.2, 3.2, c.dot, { lw: 1.4 });
    ART.ell(ctx, -78, -40 - sway * 0.3, 3, 3, c.dot, { lw: 1.4 });

    // head: rosy cheeks, nose, eyes, mouth
    ART.ell(ctx, 0, -6, 50, 52, c.skin, { lw: 3 });
    const blush = happy ? 0.85 : (e === 'sad' || e === 'worried') ? 0.4 : 0.6;
    ART.ell(ctx, -31, 8, 12, 7.5, c.blush, { stroke: false, alpha: blush });
    ART.ell(ctx, 33, 8, 12, 7.5, c.blush, { stroke: false, alpha: blush });
    ctx.beginPath();
    ctx.moveTo(3, -4);
    ctx.quadraticCurveTo(9, 6, 4, 10);
    ctx.strokeStyle = c.skinDark;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.stroke();
    if (happy) {
      [-18, 18].forEach((x) => {
        ctx.beginPath();
        ctx.arc(x, -11, 8.5, Math.PI * 1.18, Math.PI * 1.82);
        ctx.strokeStyle = OUT;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
      });
    } else {
      const surprised = e === 'surprised';
      const shut = surprised ? 0 : Math.max(blink, e === 'sad' ? 0.25 : e === 'angry' ? 0.45 : 0);
      const r = surprised ? 10.5 : e === 'worried' ? 9 : 8.5;
      const lx = e === 'worried' ? -0.3 : 0.2;
      const ly = e === 'worried' ? -0.6 : e === 'sad' ? 0.5 : 0;
      ART.eye(ctx, -18, -11, r, lx, ly, shut, { lw: 2 });
      ART.eye(ctx, 18, -11, r, lx, ly, shut, { lw: 2 });
    }
    drawPortraitMouth(ctx, e, c);

    // headscarf: blue dome, forehead edge, yellow polka dots
    ctx.beginPath();
    ctx.moveTo(-60, -20);
    ctx.bezierCurveTo(-72, -112, 72, -112, 60, -20);
    ctx.bezierCurveTo(30, -52, -30, -52, -60, -20);
    ctx.closePath();
    ctx.fillStyle = c.scarf;
    ctx.fill();
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
    [[-44, -44], [-22, -64], [0, -80], [22, -64], [44, -44], [0, -55]]
      .forEach(([x, y]) => ART.ell(ctx, x, y, 5.2, 5.2, c.dot, { lw: 1.8 }));

    // brows, and a sweat drop when worried
    BROWS[e].forEach((b) => ART.limb(ctx, b[0], b[1], b[2], b[3], 4.6, c.brow, { stroke: false }));
    if (e === 'worried') {
      ART.poly(ctx, [[72, -30], [66, -18], [78, -18]], c.drop, { lw: 1.8 });
      ART.ell(ctx, 72, -16, 5.5, 6, c.drop, { lw: 1.8 });
    }
    ctx.restore();
  }

  ART.register({
    id: 'pivert', w: 28, h: 48,
    draw(ctx, p) { draw(ctx, p); },
    portrait(ctx, expr, t) { portrait(ctx, expr, t); }
  });
})();

</script>
  <script>
/* js/art/chars/hugo.js */
/* Old Hugo (id hugo): grumpy toymaker who knew Elias. Short and a little hunched, big grey bushy beard,
   round wire spectacles, blue work smock with a pencil in the pocket, flat cap, loupe in one hand.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up. Slow, stubborn gait. */
(function () {
  const A = window.ART;
  if (!A) return;
  const OUT = A.OUT;
  const clamp = A.clamp;
  const TAU = Math.PI * 2;
  const STONE = '#8c8a94';

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const ease = (k) => k * k * (3 - 2 * k);
  const ang = (a) => Math.atan2(Math.cos(a), Math.sin(a)); // gait angle -> canvas angle

  const BASE = {
    smock: '#3c5e8b', smockHi: '#5a7fae', smockLo: '#2b4568', stitch: '#8fb0d8',
    skin: '#e2b08c', skinLo: '#c28f6b', nose: '#d99a7b',
    beard: '#b8b2a8', beardHi: '#e2dfd7', beardLo: '#8c867c', hair: '#b8b2a8',
    cap: '#4a3b2a', capLo: '#2f2519',
    pants: '#3a3a40', pantsLo: '#2a2a31', boot: '#2a2018', bootLo: '#1d150f',
    brass: '#c9963f', wood: '#6b4a2a', loupe: '#cdeef7', lens: '#d6eef0',
    pencil: '#e8b84d', pencilTip: '#ecd2a4', shirt: '#efe6d2',
    ink: '#2b1a1a', crack: '#4b4a52', tear: '#9fd3ef',
  };

  const TORSO = [[-5.9, 1.5], [5.6, 1.5], [6.4, -5.5], [5.2, -11.0], [2.8, -14.2], [-0.4, -14.9],
    [-4.2, -14.2], [-7.2, -11.0], [-7.6, -5.0], [-6.8, 0.0]];
  const TUFTS = [[-5.4, 3.8, 2.2], [-3.4, 9.8, 2.6], [0.8, 11.6, 2.6], [5.0, 10.4, 2.5], [7.4, 6.0, 2.3]];
  const GLASSES = [[0.6, -0.6], [5.0, -0.6]];

  /* ---------- palette (stone colours when frozen) ---------- */
  function mix(hex, to, k) {
    const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
    let out = '#';
    for (const sh of [16, 8, 0]) {
      const x = (a >> sh) & 255, y = (b >> sh) & 255;
      out += Math.round(x + (y - x) * k).toString(16).padStart(2, '0');
    }
    return out;
  }
  const palCache = {};
  function pal(stone) {
    const key = stone ? 'stone' : 'live';
    if (!palCache[key]) {
      const o = {};
      for (const k in BASE) o[k] = stone ? mix(BASE[k], STONE, 0.6) : BASE[k];
      palCache[key] = o;
    }
    return palCache[key];
  }

  /* ---------- pose ---------- */
  function blinkAt(t) { return ((t % 3.8) + 3.8) % 3.8 < 0.12 ? 1 : 0; }

  // Angles are measured from straight down: 0 = down, +PI/2 = forward, PI = up.
  function rest() {
    return {
      lean: 0.16, crouch: 0, dy: 0, hx: 0, hy: 0, hrot: 0, rot: 0, alpha: 1,
      legF: 0.05, legB: -0.05, liftF: 0, liftB: 0,
      aF1: 0.15, aF2: 0.66, aB1: -0.1, aB2: 0.45,
      peek: 0, mouth: 0, blink: 0, squint: 0, stone: false, streaks: false, trail: null,
    };
  }

  function idle(v, T) {
    const br = Math.sin(T * 2.2);
    v.lean += 0.012 * br;
    v.aF1 += 0.03 * br;
    v.hrot = 0.02 * br;
    const cyc = ((T % 7) + 7) % 7; // every 7 s he lifts the loupe to his eye for a moment
    v.peek = cyc < 1.6 ? Math.sin((cyc / 1.6) * Math.PI) : 0;
    v.blink = blinkAt(T);
  }

  function poseFor(p) {
    const st = typeof p.state === 'string' ? p.state : 'idle';
    const t = Math.max(0, num(p.t, 0));
    const T = num(p.time, 0);
    const v = rest();
    switch (st) {
      case 'walk': {
        const s = Math.sin(T * 5.0);
        v.lean = 0.2;
        v.legF = 0.34 * s; v.legB = -0.34 * s;
        v.liftF = Math.max(0, s) * 1.4; v.liftB = Math.max(0, -s) * 1.4;
        v.dy = 0.55 * Math.abs(s);
        v.aF1 = 0.15 - 0.12 * s; v.aB1 = -0.1 + 0.22 * s;
        v.hrot = -0.04 * s;
        v.blink = blinkAt(T);
        break;
      }
      case 'run': {
        const s = Math.sin(T * 8.5);
        v.lean = 0.34;
        v.legF = 0.55 * s; v.legB = -0.55 * s;
        v.liftF = Math.max(0, s) * 2.4; v.liftB = Math.max(0, -s) * 2.4;
        v.dy = 0.9 * Math.abs(s);
        v.aF1 = 0.25 - 0.4 * s; v.aF2 = 1.0; v.aB1 = -0.25 + 0.45 * s; v.aB2 = 0.8;
        v.hrot = 0.06; v.mouth = 0.35;
        break;
      }
      case 'jump': {
        v.lean = 0.14;
        v.legF = 0.35; v.legB = -0.2;
        v.aF1 = 2.2; v.aF2 = 2.0; v.aB1 = -1.9; v.aB2 = -2.1;
        v.mouth = 0.5;
        break;
      }
      case 'fall': {
        const w = Math.sin(T * 12);
        v.lean = 0.02;
        v.legF = 0.2; v.legB = -0.35;
        v.aF1 = 1.5 + 0.12 * w; v.aF2 = 1.2; v.aB1 = -1.4 - 0.12 * w; v.aB2 = -1.1;
        v.mouth = 0.35; v.squint = 0.4;
        break;
      }
      case 'land': {
        const k = clamp(1 - t / 0.2, 0, 1);
        v.crouch = 2.2 * k; v.lean = 0.16 + 0.1 * k;
        v.legF = 0.22 * k; v.legB = -0.22 * k;
        v.aF1 = 0.15 + 0.35 * k; v.aB1 = -0.1 - 0.25 * k;
        v.mouth = 0.6 * k; v.squint = 0.6 * k;
        break;
      }
      case 'attack': {
        const u = clamp(t / 0.42, 0, 1);
        let a1, a2, lean;
        if (u < 0.3) { // anticipation: loupe arm pulled back, weight on the heels
          const k = ease(u / 0.3);
          a1 = A.lerp(0.15, -1.2, k); a2 = A.lerp(0.66, 0.2, k); lean = A.lerp(0.16, -0.04, k);
        } else if (u < 0.6) { // strike: arc forward and down, leaning in
          const k = ease((u - 0.3) / 0.3);
          a1 = A.lerp(-1.2, 2.0, k); a2 = A.lerp(0.2, 1.1, k); lean = A.lerp(-0.04, 0.36, k);
        } else { // recovery: grumbling back to rest
          const k = ease((u - 0.6) / 0.4);
          a1 = A.lerp(2.0, 0.15, k); a2 = A.lerp(1.1, 0.66, k); lean = A.lerp(0.36, 0.16, k);
        }
        v.lean = lean; v.aF1 = a1; v.aF2 = a2;
        v.legF = 0.2; v.legB = -0.25;
        if (u > 0.3 && u < 0.6) { v.mouth = 0.9; v.squint = 0.5; }
        if (u > 0.25 && u < 0.7) v.trail = [-1.2, a1];
        break;
      }
      case 'dash': {
        const s = Math.sin(T * 16);
        v.lean = 0.42;
        v.legF = 0.6 * s; v.legB = -0.6 * s;
        v.liftF = Math.max(0, s) * 2; v.liftB = Math.max(0, -s) * 2;
        v.aF1 = -0.5; v.aF2 = 0.3; v.aB1 = -0.9; v.aB2 = -0.4;
        v.mouth = 0.5; v.streaks = true;
        break;
      }
      case 'hurt': {
        const k = clamp(1 - t / 0.4, 0, 1);
        v.lean = 0.16 - 0.32 * k; v.hrot = -0.3 * k; v.hx = -1 * k;
        v.aF1 = A.lerp(0.15, 1.5, k); v.aF2 = A.lerp(0.66, 1.2, k);
        v.aB1 = A.lerp(-0.1, -1.4, k); v.aB2 = A.lerp(0.45, -1.0, k);
        v.rot = Math.sin(t * 48) * 0.04 * k;
        v.mouth = 0.9 * k; v.squint = k; v.blink = k > 0.5 ? 1 : 0;
        break;
      }
      case 'dead': {
        const f = clamp(t / 0.7, 0, 1);
        v.rot = (-f * Math.PI) / 2; // topples backwards, feet stay put
        v.alpha = 1 - clamp((t - 0.6) / 0.8, 0, 1);
        v.aF1 = A.lerp(0.15, 1.2, f); v.aF2 = A.lerp(0.66, 0.9, f);
        v.aB1 = A.lerp(-0.1, -1.0, f); v.aB2 = A.lerp(0.45, -0.6, f);
        v.legF = 0.2 * f; v.legB = -0.25 * f;
        v.blink = 1; v.squint = 1;
        break;
      }
      case 'talk': {
        v.lean = 0.18;
        v.peek = 0.25 + 0.12 * Math.sin(T * 4.2); // loupe waggles while he lectures
        v.mouth = clamp(0.5 + 0.6 * Math.sin(T * 17) + 0.3 * Math.sin(T * 9.1), 0, 1);
        v.hrot = 0.05 * Math.sin(T * 3);
        v.blink = blinkAt(T);
        break;
      }
      case 'frozen': {
        v.stone = true; v.lean = 0.14; v.aF1 = 0.12; v.squint = 0.5;
        break;
      }
      case 'slow': {
        idle(v, T * 0.45); // Pendule active: everything, Hugo included, moves at half speed
        break;
      }
      default: {
        idle(v, T);
      }
    }
    return v;
  }

  /* ---------- drawing helpers ---------- */

  // Feet-frame point of a local point on the body (origin at the hip, rotated by the lean).
  function xf(lx, ly, lean, hipY) {
    const c = Math.cos(lean), s = Math.sin(lean);
    return [lx * c - ly * s, hipY + lx * s + ly * c];
  }

  // Closed smooth outline through pts (Catmull-Rom to Bezier), filled, with the dark contour.
  function smooth(ctx, pts, fill) {
    const n = pts.length;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      ctx.bezierCurveTo(
        p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
        p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
        p2[0], p2[1]);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  // Leg from hip to ankle, with a boot. `lift` raises the ankle while the foot swings.
  function leg(ctx, hip, a, lift, Lg, pants, boot) {
    const ax = hip[0] + Math.sin(a) * Lg;
    const ay = hip[1] + Math.cos(a) * Lg - lift;
    A.limb(ctx, hip[0], hip[1], ax, ay, 4.2, pants);
    A.rr(ctx, ax - 2.4, ay - 0.2, 6.6, 2.4, 1.2, boot);
  }

  // Arm from a shoulder point; returns the hand position.
  function arm(ctx, root, a1, a2, sleeve, skin) {
    const e = [root[0] + Math.sin(a1) * 6.2, root[1] + Math.cos(a1) * 6.2];
    const h = [e[0] + Math.sin(a2) * 5.6, e[1] + Math.cos(a2) * 5.6];
    A.limb(ctx, root[0], root[1], e[0], e[1], 3.9, sleeve);
    A.limb(ctx, e[0], e[1], h[0], h[1], 3.4, sleeve);
    A.ell(ctx, h[0], h[1], 1.9, 1.9, skin);
    return h;
  }

  function streaks(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(220,235,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-10, -8); ctx.lineTo(-18, -8);
    ctx.moveTo(-12, -17); ctx.lineTo(-22, -17);
    ctx.moveTo(-9, -27); ctx.lineTo(-16, -27);
    ctx.stroke();
    ctx.restore();
  }

  function eyeDot(ctx, g, v, P) {
    const x = g[0] + 0.3, y = g[1];
    if (v.blink) {
      ctx.save();
      ctx.strokeStyle = P.ink;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x - 0.9, y); ctx.lineTo(x + 0.9, y);
      ctx.stroke();
      ctx.restore();
    } else {
      A.ell(ctx, x, y, 0.75, 0.75 * (1 - 0.5 * v.squint), P.ink, { stroke: false });
    }
  }

  // Head in its own frame: origin at the centre of the skull, facing right.
  function drawHead(ctx, v, P) {
    ctx.save();
    ctx.strokeStyle = P.beardLo; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-5.2, -2.2); ctx.quadraticCurveTo(-7.6, 0.8, -5.6, 3.6); ctx.stroke();
    ctx.restore();
    A.ell(ctx, 0, 0, 6.4, 6.6, P.skin);
    A.ell(ctx, -1.4, 0.9, 1.5, 2.2, P.skinLo);
    A.ell(ctx, -0.3, -6.6, 6.8, 2.8, P.cap);                       // cap crown
    A.ell(ctx, 3.4, -4.6, 5.4, 1.2, P.capLo, { rot: 0.12 });       // cap peak
    A.ell(ctx, 0.6, -2.4, 2.6, 0.9, P.beardLo, { rot: 0.28 });     // grumpy brows
    A.ell(ctx, 5.0, -2.4, 2.4, 0.9, P.beardLo, { rot: -0.28 });

    ctx.save();
    ctx.fillStyle = P.lens; ctx.globalAlpha *= 0.45;
    ctx.beginPath();
    for (const g of GLASSES) { ctx.moveTo(g[0] + 1.8, g[1]); ctx.arc(g[0], g[1], 1.8, 0, TAU); }
    ctx.fill();
    ctx.restore();
    for (const g of GLASSES) eyeDot(ctx, g, v, P);
    ctx.save();
    ctx.strokeStyle = P.brass; ctx.lineWidth = 0.9;
    ctx.beginPath();
    for (const g of GLASSES) { ctx.moveTo(g[0] + 1.8, g[1]); ctx.arc(g[0], g[1], 1.8, 0, TAU); }
    ctx.moveTo(2.4, -0.6); ctx.lineTo(3.2, -0.6);                 // bridge
    ctx.stroke();
    ctx.restore();

    // big grey beard hangs under the spectacles
    for (const q of TUFTS) A.ell(ctx, q[0], q[1], q[2], q[2], P.beard, { lw: 1.6 });
    A.ell(ctx, 0.4, 7.2, 6.6, 5.6, P.beard, { lw: 1.6 });
    A.ell(ctx, -1.8, 3.8, 2.6, 1.2, P.beardHi, { stroke: false, rot: -0.35 });

    A.ell(ctx, 5.8, 2.0, 1.5, 1.6, P.nose);
    A.ell(ctx, 3.2, 4.8, 3.9, 1.5, P.beardHi, { rot: 0.06 });     // moustache
    A.ell(ctx, 3.8, 6.6, 1.4, 0.35 + 1.1 * v.mouth, P.ink, { stroke: false });
  }

  function drawFigure(ctx, v, P) {
    const hipY = -13 + v.crouch + v.dy;
    const Lg = 11 - v.crouch;
    const sF = xf(4.8, -11.5, v.lean, hipY);
    const sB = xf(-5.0, -11.5, v.lean, hipY);
    const H = xf(3.6 + v.hx, -20.0 + v.hy, v.lean, hipY);

    ctx.save();
    ctx.globalAlpha *= v.alpha;
    if (v.rot) ctx.rotate(v.rot);
    if (v.streaks) streaks(ctx);

    leg(ctx, [-2.2, hipY], v.legB, v.liftB, Lg, P.pantsLo, P.bootLo);
    leg(ctx, [2.0, hipY], v.legF, v.liftF, Lg, P.pants, P.boot);
    arm(ctx, sB, v.aB1, v.aB2, P.smockLo, P.skinLo);

    // body: hunched smock with a rounded back
    smooth(ctx, TORSO.map((q) => xf(q[0], q[1], v.lean, hipY)), P.smock);
    const hl = xf(-3.6, -8.0, v.lean, hipY);
    A.ell(ctx, hl[0], hl[1], 1.8, 3.4, P.smockHi, { stroke: false, rot: v.lean });
    const s0 = xf(-6.0, 0.4, v.lean, hipY), s1 = xf(5.0, 0.4, v.lean, hipY);
    ctx.save();
    ctx.strokeStyle = P.stitch; ctx.lineWidth = 0.8; ctx.setLineDash([1.2, 1.1]);
    ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
    ctx.restore();
    if (v.stone) {
      const k = [[-2.6, -9.0], [0.4, -5.6], [-1.2, -2.4]].map((q) => xf(q[0], q[1], v.lean, hipY));
      ctx.save();
      ctx.strokeStyle = P.crack; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(k[0][0], k[0][1]); ctx.lineTo(k[1][0], k[1][1]); ctx.lineTo(k[2][0], k[2][1]);
      ctx.stroke();
      ctx.restore();
    }

    // pencil standing in the breast pocket, then the pocket flap over its foot
    const pc = xf(5.6, -3.6, v.lean, hipY);
    ctx.save();
    ctx.translate(pc[0], pc[1]);
    ctx.rotate(v.lean + 0.35);
    A.rr(ctx, -1.0, -3.2, 2.0, 6.4, 0.6, P.pencil);
    A.poly(ctx, [[-1.0, -3.2], [1.0, -3.2], [0, -5.0]], P.pencilTip);
    ctx.restore();
    A.poly(ctx, [[2.0, -4.8], [7.0, -4.8], [7.0, -0.4], [2.0, -0.4]].map((q) => xf(q[0], q[1], v.lean, hipY)), P.smockLo, { lw: 1.4 });

    ctx.save();
    ctx.translate(H[0], H[1]);
    ctx.rotate(v.hrot + v.lean * 0.6);
    drawHead(ctx, v, P);
    ctx.restore();

    if (v.trail) { // faint arc behind the loupe on a strike
      const t0 = ang(v.trail[0]), t1 = ang(v.trail[1]);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(sF[0], sF[1], 12, Math.min(t0, t1), Math.max(t0, t1)); ctx.stroke();
      ctx.restore();
    }

    // near arm holds the loupe; lifted to his eye every few seconds
    const hF = arm(ctx, sF, v.aF1 + v.peek * 2.25, v.aF2 + v.peek * 1.24, P.smock, P.skin);
    const lx = hF[0] + A.lerp(1.5, 1.2, v.peek), ly = hF[1] + A.lerp(3.5, -0.5, v.peek);
    A.limb(ctx, hF[0], hF[1], lx, ly, 1.4, P.wood);
    A.ell(ctx, lx, ly, 3.3, 3.3, P.brass);
    A.ell(ctx, lx, ly, 2.3, 2.3, P.loupe);
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(lx - 0.9, ly - 0.9, 0.6, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function draw(ctx, p) {
    const v = poseFor(p || {});
    ctx.save();
    ctx.translate(-4, 0); // the sprite's visible mass sits a little right of centre; hitbox is centred
    drawFigure(ctx, v, pal(v.stone));
    ctx.restore();
  }

  /* ---------- portrait (200 x 200, centred on 0,0) ---------- */
  const EXPR = {
    neutral: { bt: 0, bi: 0, sq: 0, ey: 1, mo: 'line' },
    happy: { bt: -2, bi: 0, sq: 0.55, ey: 1, mo: 'smile' },
    sad: { bt: -1, bi: -1, sq: 0, ey: 1, mo: 'frown' },
    angry: { bt: 3, bi: 1, sq: 0.35, ey: 0.95, mo: 'tight' },
    surprised: { bt: -6, bi: 0, sq: 0, ey: 1.25, mo: 'o' },
    worried: { bt: -1, bi: -1.2, sq: 0, ey: 1, mo: 'wave' },
  };

  function drawPortrait(ctx, expr, t) {
    const e = EXPR[expr] || EXPR.neutral;
    const P = pal(false);
    const blink = blinkAt(num(t, 0));
    ctx.save();
    ctx.beginPath(); ctx.rect(-100, -100, 200, 200); ctx.clip();

    // shoulders in the smock, pencil and breast pocket at the right
    A.rr(ctx, -98, 60, 196, 84, 36, P.smock);
    ctx.save();
    ctx.translate(72, 62); ctx.rotate(0.21);
    A.rr(ctx, -3.5, -20, 7, 36, 2, P.pencil);
    A.poly(ctx, [[-3.5, -20], [3.5, -20], [0, -29]], P.pencilTip);
    ctx.restore();
    A.rr(ctx, 56, 74, 30, 26, 4, P.smockLo);
    A.poly(ctx, [[-24, 60], [24, 60], [0, 84]], P.shirt);

    // ears, head, grey hair at the temples, flat cap
    A.ell(ctx, -45, -8, 8, 13, P.skin);
    A.ell(ctx, 45, -8, 8, 13, P.skin);
    A.ell(ctx, 0, -10, 46, 52, P.skin);
    A.ell(ctx, -40, -44, 10, 6, P.hair, { rot: -0.4 });
    A.ell(ctx, 40, -44, 10, 6, P.hair, { rot: 0.4 });
    A.ell(ctx, 0, -66, 49, 25, P.cap);
    A.ell(ctx, 0, -49, 56, 6.5, P.capLo);

    // brows: angry tilts the inner ends down, sad and worried lift them
    const by = -33 + e.bt;
    A.ell(ctx, -20, by, 11, 3.6, P.beardLo, { rot: e.bi * 0.25 });
    A.ell(ctx, 20, by, 11, 3.6, P.beardLo, { rot: -e.bi * 0.25 });

    // spectacles, lenses and eyes
    ctx.save();
    ctx.fillStyle = P.lens; ctx.globalAlpha *= 0.4;
    ctx.beginPath();
    ctx.arc(-19, -14, 13, 0, TAU);
    ctx.moveTo(32, -14); ctx.arc(19, -14, 13, 0, TAU);
    ctx.fill();
    ctx.restore();
    A.eye(ctx, -19, -14, 6.5 * e.ey, 0.3, 0, Math.max(blink, e.sq));
    A.eye(ctx, 19, -14, 6.5 * e.ey, 0.3, 0, Math.max(blink, e.sq));
    ctx.save();
    ctx.strokeStyle = P.brass; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-6, -14); ctx.arc(-19, -14, 13, 0, TAU);
    ctx.moveTo(32, -14); ctx.arc(19, -14, 13, 0, TAU);
    ctx.moveTo(-6, -15.5); ctx.quadraticCurveTo(0, -20, 6, -15.5);
    ctx.moveTo(-32, -15); ctx.lineTo(-44, -12);
    ctx.moveTo(32, -15); ctx.lineTo(44, -12);
    ctx.stroke();
    ctx.restore();

    // big bushy grey beard
    const tufts = [[-50, 22, 9], [50, 22, 9], [-42, 40, 15], [42, 40, 15], [-28, 66, 17], [28, 66, 17], [0, 80, 18]];
    for (const q of tufts) A.ell(ctx, q[0], q[1], q[2], q[2], P.beard);
    A.ell(ctx, 0, 46, 56, 42, P.beard);
    A.ell(ctx, -20, 26, 16, 7, P.beardHi, { stroke: false, rot: -0.3 });
    ctx.save();
    ctx.strokeStyle = P.beardLo; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-30, 44); ctx.quadraticCurveTo(-24, 58, -30, 72);
    ctx.moveTo(30, 44); ctx.quadraticCurveTo(24, 58, 30, 72);
    ctx.moveTo(-8, 68); ctx.quadraticCurveTo(0, 76, 8, 68);
    ctx.stroke();
    ctx.restore();

    // nose and moustache over the beard, then the mouth
    A.ell(ctx, 0, 6, 9, 9, P.nose);
    A.ell(ctx, 0, 14, 22, 7, P.beardHi);
    A.ell(ctx, -22, 12, 5, 5, P.beardHi);
    A.ell(ctx, 22, 12, 5, 5, P.beardHi);

    if (e.mo === 'o') {
      A.ell(ctx, 0, 27, 6, 8, P.ink, { stroke: false });
    } else {
      ctx.save();
      ctx.strokeStyle = P.ink; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      if (e.mo === 'smile') { ctx.moveTo(-12, 22); ctx.quadraticCurveTo(0, 34, 12, 22); }
      else if (e.mo === 'frown') { ctx.moveTo(-10, 31); ctx.quadraticCurveTo(0, 20, 10, 31); }
      else if (e.mo === 'tight') { ctx.moveTo(-9, 27); ctx.lineTo(9, 27); }
      else if (e.mo === 'wave') { ctx.moveTo(-11, 27); ctx.quadraticCurveTo(-5.5, 21, 0, 27); ctx.quadraticCurveTo(5.5, 33, 11, 27); }
      else { ctx.moveTo(-9, 26); ctx.quadraticCurveTo(0, 28, 9, 26); }
      ctx.stroke();
      ctx.restore();
    }

    if (expr === 'worried') { // sweat drop
      A.poly(ctx, [[-60, -40], [-64.5, -29], [-55.5, -29]], P.tear, { lw: 1.4 });
      A.ell(ctx, -60, -27, 4.5, 4.5, P.tear, { lw: 1.4 });
    }
    ctx.restore();
  }

  A.register({
    id: 'hugo', w: 24, h: 40,
    draw(ctx, p) { draw(ctx, p); },
    portrait(ctx, expr, t) { drawPortrait(ctx, expr, t); },
  });
})();

</script>
  <script>
/* js/art/chars/bastien.js */
/* Bastien, station master of Vermeil: tall, thin, nervous, lives by the timetable.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up.
   Loaded after humanoid.js, so this sprite replaces its 'bastien' fallback. */
(function () {
  const clamp = ART.clamp;
  const PI = Math.PI;
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const easeOut = (k) => 1 - Math.pow(1 - k, 3);

  const C = {
    navy: '#1f2d4a', navyDeep: '#152039', navyDark: '#101a2e',
    red: '#b8362e', brass: '#d9b35a', brassDark: '#9c7a2e',
    skin: '#f0c9a5', skinShade: '#d9a983', hair: '#3a2a22', browInk: '#2a1f1a',
    boot: '#1a1a1a', wood: '#8a5a34', paper: '#f7f1e0', ink: '#7d8aa0',
    shirt: '#f4efe6', mouth: '#3a1f22', lens: '#f6efe1', tear: '#9fd8ff',
  };
  const STATES = ['idle', 'walk', 'run', 'jump', 'fall', 'land', 'attack', 'dash', 'hurt', 'dead', 'talk', 'slow', 'frozen'];
  const EXPRS = ['neutral', 'happy', 'sad', 'angry', 'surprised', 'worried'];
  const HIP_Y = -24;                 // hip height above the feet
  const LEG_A = 12.5, LEG_B = 12;    // thigh, shin
  const ARM_A = 8.5, ARM_B = 8;      // upper arm, forearm
  const HEAD_X = 0.8, HEAD_Y = -22.5;
  const SHOULDER_N = [1.2, -14.8], SHOULDER_F = [-1.2, -14.8];

  // Two-bone IK: returns the knee/elbow joint between root a and target b. `side` picks the bend.
  function ik(ax, ay, bx, by, la, lb, side) {
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 0.0001;
    const ux = dx / len, uy = dy / len;
    const d = clamp(len, Math.abs(la - lb) + 0.01, la + lb - 0.01);
    const a = (la * la - lb * lb + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, la * la - a * a));
    return {
      j: [ax + ux * a + uy * side * h, ay + uy * a - ux * side * h],
      e: [ax + ux * d, ay + uy * d],
    };
  }

  const blinkAt = (t) => (t % 3.4 < 0.12 ? 1 : 0);

  function stroke(ctx, pts, color, w) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- body parts (sprite) ---------- */

  function drawLeg(ctx, hip, L, far) {
    const col = far ? C.navyDeep : C.navy;
    const j = L.j, e = L.e;
    ART.limb(ctx, hip[0], hip[1], j[0], j[1], 4.4, col, { lw: 1 });
    ART.limb(ctx, j[0], j[1], e[0], e[1], 4, col, { lw: 1 });
    if (!far) ART.limb(ctx, hip[0], hip[1], j[0], j[1], 0.9, C.red, { stroke: false });
    ART.ell(ctx, e[0] + 1, e[1] - 1.6, 3.2, 2, far ? '#111111' : C.boot, { lw: 1 });
  }

  function drawArm(ctx, sh, A, far) {
    const sleeve = far ? C.navyDeep : C.navy;
    const j = A.j, h = A.e;
    ART.limb(ctx, sh[0], sh[1], j[0], j[1], 3.8, sleeve, { lw: 1 });
    ART.limb(ctx, j[0], j[1], h[0], h[1], 3.4, sleeve, { lw: 1 });
    const c0 = [j[0] + (h[0] - j[0]) * 0.8, j[1] + (h[1] - j[1]) * 0.8];
    const c1 = [j[0] + (h[0] - j[0]) * 0.86, j[1] + (h[1] - j[1]) * 0.86];
    ART.limb(ctx, c0[0], c0[1], c1[0], c1[1], 3.6, C.red, { stroke: false });
    ART.ell(ctx, h[0], h[1], 1.7, 1.7, far ? C.skinShade : C.skin, { lw: 0.9 });
  }

  function drawTorso(ctx, up) {
    const P = (pts) => pts.map((q) => up(q[0], q[1]));
    ART.poly(ctx, P([[-5.5, 1], [5.5, 1], [5, -6], [6.5, -11], [6, -15], [3.5, -16.4],
      [-3.5, -16.4], [-6, -15], [-6.5, -11], [-5, -6]]), C.navy, { lw: 2 });
    stroke(ctx, P([[3.5, -16.4], [6, -15], [6.5, -11], [5, -6], [5.5, 1]]), C.red, 1.2);
    stroke(ctx, P([[-3.5, -16.4], [-6, -15], [-6.5, -11], [-5, -6], [-5.5, 1]]), C.red, 1.2);
    ART.poly(ctx, P([[-2.6, -16.4], [2.6, -16.4], [0, -12.6]]), C.shirt, { lw: 1 });
    ART.poly(ctx, P([[-1.8, -15], [1.8, -15], [1.8, -19], [-1.8, -19]]), C.skin, { lw: 1 });
    for (const y of [-11.5, -6.5, -1.5]) {
      const b = up(2.3, y);
      ART.ell(ctx, b[0], b[1], 0.9, 0.9, C.brass, { lw: 0.6 });
    }
  }

  // Head centred on h. Peaked cap with red band piping, brass badge, thin moustache.
  function drawHead(ctx, h, k) {
    const x = h[0], y = h[1];
    ART.ell(ctx, x, y, 6.6, 7.2, C.skin, { lw: 1.6 });
    ART.ell(ctx, x - 5.9, y + 0.8, 1.4, 2, C.skinShade, { lw: 0.9 });
    ART.poly(ctx, [[x - 6.2, y - 4.4], [x - 5, y + 1.6], [x - 3.2, y + 2.6], [x - 3.6, y - 4.6]], C.hair, { lw: 1 });
    ART.rr(ctx, x - 6.9, y - 12.4, 13.8, 7.8, 3.4, C.navy, { lw: 1.5 });
    stroke(ctx, [[x - 6.6, y - 4.6], [x + 6.4, y - 4.6]], C.red, 1.1);
    ART.poly(ctx, [[x + 1.2, y - 4.8], [x + 10.2, y - 4.2], [x + 10.8, y - 2.4], [x + 1.2, y - 2.2]], C.navyDark, { lw: 1.2 });
    ART.ell(ctx, x + 2.4, y - 8.4, 1.5, 1.5, C.brass, { lw: 0.8 });
    ART.eye(ctx, x + 3.4, y - 0.4, 1.5, k.look[0], k.look[1], k.blink, { lw: 1 });
    ART.ell(ctx, x + 6.1, y + 0.9, 0.9, 1.2, C.skinShade, { lw: 0.8 });
    stroke(ctx, [[x + 2.4, y + 2.7], [x + 4.6, y + 1.7], [x + 7, y + 2.5]], C.hair, 1.3);
    if (k.mouth > 0.05) ART.ell(ctx, x + 4.4, y + 4.7, 1.2, 0.3 + k.mouth * 1.1, C.mouth, { stroke: false });
    else stroke(ctx, [[x + 3.2, y + 4.7], [x + 5.4, y + 4.5]], C.mouth, 0.8);
  }

  // Pocket watch, held up while he glances at it.
  function drawWatch(ctx, h, g) {
    const x = h[0], y = h[1] - 1.2;
    ART.ell(ctx, x, y, 2.4, 2.4, C.brass, { lw: 0.9 });
    ART.ell(ctx, x, y, 1.6, 1.6, C.lens, { lw: 0.5 });
    const a = -PI / 2 + g * 0.6;
    stroke(ctx, [[x, y], [x + Math.cos(a) * 1.2, y + Math.sin(a) * 1.2]], C.navyDark, 0.7);
  }

  // Clipboard held by the hand (its bottom edge sits in the fist).
  function drawClipboard(ctx, h) {
    ctx.save();
    ctx.translate(h[0] + 0.8, h[1] - 4.4);
    ctx.rotate(-0.15);
    ART.rr(ctx, -4.2, -5.6, 8.4, 11.2, 1.2, C.wood, { lw: 1.2 });
    ART.rr(ctx, -3.2, -4.3, 6.4, 9, 0.6, C.paper, { lw: 0.6 });
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (const y of [-2, 0.4, 2.6]) { ctx.moveTo(-2.2, y); ctx.lineTo(2.2, y); }
    ctx.stroke();
    ART.rr(ctx, -1.7, -6.3, 3.4, 2.2, 0.6, C.brassDark, { lw: 0.8 });
    ctx.restore();
  }

  // Sweep of the clipboard swing (attack trail), drawn from the shoulder.
  function drawTrail(ctx, sh, arc, lean) {
    ctx.save();
    ctx.translate(sh[0], sh[1]);
    ctx.rotate(lean);
    const t1 = PI / 2 - arc.a0, t2 = PI / 2 - arc.a1;
    ctx.strokeStyle = 'rgba(255,240,200,0.55)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, 14, Math.min(t1, t2), Math.max(t1, t2));
    ctx.stroke();
    ctx.restore();
  }

  // Speed lines behind him while dashing.
  function drawSpeed(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) {
      const y = -17 - i * 8;
      ctx.beginPath();
      ctx.moveTo(-15 - i, y);
      ctx.lineTo(-8 - i * 2, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- person states ---------- */

  function drawBastien(ctx, p) {
    const src = p || {};
    const st = STATES.indexOf(src.state) >= 0 ? src.state : 'idle';
    const t = Math.max(0, num(src.t));
    let tm = num(src.time);
    if (st === 'frozen') tm = 0;
    if (st === 'slow') tm *= 0.5;

    const k = {
      bob: 0, lean: 0, squash: 0, dip: 0, look: [0, 0], blink: blinkAt(tm), mouth: 0,
      fN: [1.6, 0], fF: [-1.6, 0],        // feet (absolute, near / far)
      hN: [5, 8], hF: [-0.5, 12],         // hands relative to their shoulder
      glance: 0, fall: 0, fade: 1, shake: 0, speed: false, arc: null,
    };

    // Idle family: breathing, tapping the clipboard, glancing at the pocket watch every 6 s.
    if (st === 'idle' || st === 'slow' || st === 'frozen') {
      const cyc = tm % 6;
      const g = cyc > 3.6 && cyc < 5 ? Math.sin(PI * (cyc - 3.6) / 1.4) : 0;
      const tap = Math.pow(Math.max(0, Math.sin(tm * 7.5)), 4);
      k.squash = Math.sin(tm * 2.6) * 0.015;
      k.hN = [5, 8 + tap * 1.6];
      k.hF = [-0.5 - g, 12 - 8 * g];
      k.glance = g;
      k.dip = g;
      k.look = [0.2 * g, 0.9 * g];
    }

    switch (st) {
      case 'walk':
      case 'run':
      case 'dash': {
        const ph = tm * (st === 'walk' ? 9 : st === 'run' ? 14 : 18);
        const S = st === 'walk' ? 3.4 : st === 'run' ? 5 : 6.2;
        const lift = st === 'walk' ? 2.6 : st === 'run' ? 4.2 : 5;
        const A = st === 'walk' ? 3.2 : st === 'run' ? 5 : 6;
        k.fN = [1.6 + Math.sin(ph) * S, -Math.max(0, Math.cos(ph)) * lift];
        k.fF = [-1.6 + Math.sin(ph + PI) * S, -Math.max(0, Math.cos(ph + PI)) * lift];
        k.bob = Math.abs(Math.sin(ph)) * (st === 'walk' ? 1.4 : st === 'run' ? 2.4 : 3);
        k.lean = st === 'walk' ? 0.05 : st === 'run' ? 0.16 : 0.3;
        k.hN = [Math.sin(ph + PI) * A, 10.5];   // arms swing against the legs
        k.hF = [Math.sin(ph) * A, 10.5];
        k.speed = st === 'dash';
        break;
      }
      case 'jump':
        k.fN = [3.6, -6.5]; k.fF = [-1.6, -12]; k.lean = -0.04;
        k.hN = [5, -8]; k.hF = [-3.5, -7];
        break;
      case 'fall':
        k.fN = [2.2, -2]; k.fF = [-1.2, -4]; k.lean = 0.06;
        k.hN = [8, -1.5]; k.hF = [-7.5, -1.5];
        break;
      case 'land': {
        const c = 1 - clamp(t / 0.22, 0, 1);
        k.bob = 4.5 * c; k.lean = 0.12 * c; k.squash = -0.1 * c;
        k.hN = [7, 2]; k.hF = [-7, 2];
        break;
      }
      case 'attack': {
        // windup back, then a swing through an arc with a trail
        const wind = clamp(t / 0.1, 0, 1);
        const swing = clamp((t - 0.1) / 0.28, 0, 1);
        const e = easeOut(swing);
        const a = swing > 0 ? -0.9 + 2.8 * e : -0.9 * wind;
        k.hN = [Math.sin(a) * 14, Math.cos(a) * 14];
        k.hF = [-4, 8];
        k.fN = [4, 0]; k.fF = [-3.4, 0];
        k.bob = 1.2 * e;
        k.lean = 0.08 + 0.14 * e;
        k.arc = { a0: -0.9, a1: a, on: swing > 0 && swing < 1 };
        break;
      }
      case 'hurt': {
        const f = clamp(1 - t / 0.5, 0, 1);
        k.lean = -0.28 * f; k.shake = Math.sin(t * 50) * 1.3 * f; k.bob = 0.8 * f;
        k.dip = -0.6 * f; k.hN = [4, -4]; k.hF = [-4, -1];
        k.blink = 0.85; k.mouth = 0.6;
        break;
      }
      case 'dead': {
        const f = clamp(t / 0.6, 0, 1);
        k.fall = -(PI / 2) * f * f;                       // tips backwards onto the platform
        k.fade = 1 - clamp((t - 0.5) / 0.9, 0, 1);
        k.hN = [6, 9]; k.hF = [-3, 9];
        k.blink = 1;
        break;
      }
      case 'talk':
        k.hN = [5 + Math.sin(tm * 6) * 1.5, 9 + Math.sin(tm * 11) * 0.8];
        k.dip = Math.sin(tm * 9) * 0.3;
        k.look = [0.3, 0];
        k.mouth = 0.25 + 0.75 * Math.max(0, Math.sin(tm * 14));
        break;
      default:
        break;
    }
    if (st === 'frozen') k.blink = 0;

    /* geometry */
    const hipY = HIP_Y + k.bob;
    const cl = Math.cos(k.lean), sl = Math.sin(k.lean);
    const up = (x, y) => {
      const yy = y * (1 + k.squash);
      return [x * cl - yy * sl, hipY + x * sl + yy * cl];
    };
    const rot = (v) => [v[0] * cl - v[1] * sl, v[0] * sl + v[1] * cl];
    const legN = ik(1.6, hipY, k.fN[0], k.fN[1], LEG_A, LEG_B, 1);
    const legF = ik(-1.6, hipY, k.fF[0], k.fF[1], LEG_A, LEG_B, 1);
    const shN = up(SHOULDER_N[0], SHOULDER_N[1]);
    const shF = up(SHOULDER_F[0], SHOULDER_F[1]);
    const rN = rot(k.hN), rF = rot(k.hF);
    const armN = ik(shN[0], shN[1], shN[0] + rN[0], shN[1] + rN[1], ARM_A, ARM_B, -1);
    const armF = ik(shF[0], shF[1], shF[0] + rF[0], shF[1] + rF[1], ARM_A, ARM_B, -1);

    /* drawing, back to front */
    ctx.save();
    if (k.shake) ctx.translate(k.shake, 0);
    if (k.fall) ctx.rotate(k.fall);
    ctx.globalAlpha *= clamp(k.fade, 0, 1);
    if (st === 'frozen' && 'filter' in ctx) ctx.filter = 'grayscale(0.8) brightness(1.08)';
    if (k.speed) drawSpeed(ctx);
    drawLeg(ctx, [-1.6, hipY], legF, true);
    if (k.glance <= 0.3) drawArm(ctx, shF, armF, true);
    drawLeg(ctx, [1.6, hipY], legN, false);
    drawTorso(ctx, up);
    drawHead(ctx, up(HEAD_X, HEAD_Y + k.dip), k);
    if (k.glance > 0.3) {
      drawArm(ctx, shF, armF, true);
      drawWatch(ctx, armF.e, k.glance);
    }
    drawArm(ctx, shN, armN, false);
    drawClipboard(ctx, armN.e);
    if (k.arc && k.arc.on) drawTrail(ctx, shN, k.arc, k.lean);
    if (st === 'slow') ART.ell(ctx, 0, -1, 12, 3, C.tear, { stroke: false, alpha: 0.3 });
    ctx.restore();
  }

  /* ---------- portrait (200 x 200 box, bust centred on 0,0) ---------- */

  function drawPortrait(ctx, expr, t) {
    const e = EXPRS.indexOf(expr) >= 0 ? expr : 'neutral';
    const OUT = ART.OUT;
    const blink = e !== 'happy' && e !== 'surprised' && blinkAt(num(t)) === 1;
    const gaze = {
      neutral: [0.3, 0], happy: [0.3, 0], sad: [0, 0.6],
      angry: [0, 0], surprised: [0, -0.2], worried: [-0.6, -0.5],
    }[e];

    // jacket, shirt panel with red piping, brass buttons
    ART.poly(ctx, [[-96, 100], [-88, 70], [-62, 54], [-30, 46], [30, 46], [62, 54], [88, 70], [96, 100]], C.navy, { lw: 2.4 });
    ART.poly(ctx, [[-15, 46], [15, 46], [22, 100], [-22, 100]], C.shirt, { lw: 1.4 });
    stroke(ctx, [[-15, 46], [-22, 100]], C.red, 3);
    stroke(ctx, [[15, 46], [22, 100]], C.red, 3);
    ART.ell(ctx, 0, 70, 3.4, 3.4, C.brass, { lw: 1.4 });
    ART.ell(ctx, 0, 88, 3.4, 3.4, C.brass, { lw: 1.4 });

    // neck, collar, ears, head
    ART.rr(ctx, -14, 22, 28, 30, 8, C.skin, { lw: 2 });
    ART.poly(ctx, [[-16, 46], [16, 46], [9, 58], [0, 64], [-9, 58]], C.shirt, { lw: 1.6 });
    ART.ell(ctx, -41, -4, 7, 11, C.skinShade, { lw: 2 });
    ART.ell(ctx, 41, -4, 7, 11, C.skinShade, { lw: 2 });
    ART.ell(ctx, 0, -6, 40, 46, C.skin, { lw: 2.4 });
    for (const s of [-1, 1]) {
      ART.poly(ctx, [[s * 37, -30], [s * 41, -4], [s * 36, 8], [s * 32, -14]], C.hair, { lw: 1.6 });
    }

    // peaked cap: crown, band with piping, visor, brass badge
    ART.rr(ctx, -46, -100, 92, 56, 24, C.navy, { lw: 2.4 });
    ART.rr(ctx, -47, -51, 94, 9, 3, C.navyDark, { lw: 2 });
    stroke(ctx, [[-44, -51], [44, -51]], C.red, 2);
    stroke(ctx, [[-45, -42], [45, -42]], C.red, 2);
    ART.poly(ctx, [[-52, -42], [52, -42], [60, -32], [-60, -32]], C.navyDark, { lw: 2.4 });
    stroke(ctx, [[-58, -32], [58, -32]], C.red, 2);
    ART.ell(ctx, 0, -72, 9.5, 9.5, C.brass, { lw: 2 });
    ART.ell(ctx, 0, -72, 4.8, 4.8, C.navyDark, { lw: 1.2 });

    // brows
    const BROW = {
      neutral: [[28, -12], [18, -16], [8, -13]],
      happy: [[28, -10], [18, -21], [8, -12]],
      sad: [[28, -9], [18, -13], [8, -19]],
      angry: [[28, -22], [18, -15], [8, -10]],
      surprised: [[28, -18], [18, -30], [8, -22]],
      worried: [[28, -10], [18, -12], [8, -20]],
    }[e];
    ctx.save();
    ctx.strokeStyle = C.browInk;
    ctx.lineWidth = 4.2;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * BROW[0][0], BROW[0][1]);
      ctx.quadraticCurveTo(s * BROW[1][0], BROW[1][1], s * BROW[2][0], BROW[2][1]);
      ctx.stroke();
    }
    ctx.restore();

    // eyes
    for (const s of [-1, 1]) {
      const ex = s * 17, ey = 2;
      if (e === 'happy') {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(ex - 7, ey + 2);
        ctx.quadraticCurveTo(ex, ey - 9, ex + 7, ey + 2);
        ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
      } else if (blink) {
        stroke(ctx, [[ex - 7, ey], [ex + 7, ey]], OUT, 2.4);
      } else {
        const r = e === 'surprised' ? 9 : 7.5;
        const lid = e === 'sad' ? 0.35 : e === 'angry' ? 0.5 : 0;
        ART.eye(ctx, ex, ey, r, gaze[0], gaze[1], lid, { lw: 2.2 });
      }
    }

    // nose and thin moustache
    stroke(ctx, [[4, 6], [8, 14], [2, 18], [-3, 18]], OUT, 2);
    ctx.save();
    ctx.strokeStyle = C.hair; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 2, 26);
      ctx.quadraticCurveTo(s * 14, 19, s * 28, 25);
      ctx.quadraticCurveTo(s * 33, 26, s * 31, 31);
      ctx.stroke();
    }
    ctx.restore();

    // mouth
    ctx.save();
    ctx.strokeStyle = C.mouth; ctx.fillStyle = C.mouth; ctx.lineCap = 'round'; ctx.lineWidth = 2.8;
    ctx.beginPath();
    if (e === 'happy') {
      ctx.moveTo(-14, 34); ctx.quadraticCurveTo(0, 50, 14, 34); ctx.stroke();
    } else if (e === 'sad') {
      ctx.moveTo(-12, 46); ctx.quadraticCurveTo(0, 31, 12, 46); ctx.stroke();
    } else if (e === 'angry') {
      ctx.lineWidth = 3.6; ctx.moveTo(-11, 41); ctx.lineTo(11, 37); ctx.stroke();
    } else if (e === 'worried') {
      ctx.moveTo(-12, 41); ctx.quadraticCurveTo(-6, 34, 0, 41); ctx.quadraticCurveTo(6, 48, 12, 41); ctx.stroke();
    } else if (e === 'surprised') {
      ctx.ellipse(0, 41, 6, 8, 0, 0, PI * 2); ctx.fill();
    } else {
      ctx.moveTo(-9, 39); ctx.lineTo(9, 39); ctx.stroke();
    }
    ctx.restore();

    // expression extras: blush, sweat, tear
    if (e === 'happy' || e === 'angry') {
      for (const s of [-1, 1]) {
        ART.ell(ctx, s * 27, 18, 7, 4.2, e === 'angry' ? '#d4483c' : '#e8836f', { stroke: false, alpha: 0.45 });
      }
    }
    if (e === 'worried') {
      ART.poly(ctx, [[-50, -26], [-55, -16], [-45, -16]], C.tear, { lw: 1.6 });
      ART.ell(ctx, -50, -14, 5, 5, C.tear, { lw: 1.6 });
    }
    if (e === 'sad') ART.ell(ctx, -17, 13, 2.4, 3.4, C.tear, { lw: 1.2 });
  }

  ART.register({
    id: 'bastien', w: 26, h: 50,
    draw(ctx, p) { drawBastien(ctx, p); },
    portrait(ctx, expr, t) { drawPortrait(ctx, expr, t); },
  });
})();

</script>
  <script>
/* js/art/chars/tomas.js */
/* Tomas (8): Mireille's little brother, frozen mid-laugh with a bread roll.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up.
   Idle and frozen carry a slight grey stillness; moving states bring the colour back.
   Registers 'tomas' with ART. */
(function () {
  const OUT = ART.OUT;
  const clamp = ART.clamp;
  const lerp = ART.lerp;

  const PAL = {
    navy: '#2d3f6e', cream: '#f1e7d0', skin: '#f1c7a0', skinDk: '#d9a27a',
    hair: '#8c5a2e', hairLt: '#b98049', brow: '#3b2516', cheek: '#ef8a82', red: '#e0584f',
    mouth: '#4a1a24', tongue: '#e26a6c', teeth: '#fbf7ee', tear: '#8fd0ff',
    pants: '#6b4a2a', pantsDk: '#4e331c', boot: '#3a2a22', bootDk: '#2a1d17',
    crust: '#e6a95e', crumb: '#f8dfae', score: '#a86a2c'
  };

  // Rig in px. Legs hang from the pelvis (hip y = 0 in leg space); the upper body is drawn in pelvis space.
  const LEG1 = 4.6, LEG2 = 4.2, LEG_REST = LEG1 + LEG2;
  const ARM1 = 3.2, ARM2 = 2.8;
  const HIP_NEAR = 1.0, HIP_FAR = -1.0;
  const SH_NEAR = [2.0, -6.2], SH_FAR = [-1.8, -6.4];
  const HEAD = [0.5, -14.6];
  const HAIR_HEAD = [[-6.9, 0.4], [-6.5, -3.2], [-5.0, -5.6], [-4.0, -8.4], [-2.2, -6.4], [-0.8, -9.2], [0.8, -6.6],
    [2.6, -8.6], [3.6, -5.8], [5.2, -6.4], [6.2, -3.4], [6.9, -1.4], [5.4, -1.7], [3.4, -2.9], [1.4, -1.7],
    [-0.5, -2.6], [-2.8, -1.4], [-4.9, -1.8], [-6.1, 0.6]];

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const smooth = (x) => { const u = clamp(x, 0, 1); return u * u * (3 - 2 * u); };

  /* Mixes a '#rrggbb' colour toward its luminance by g (0 = untouched, 1 = grey). */
  function tone(hex, g) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m || !g) return hex;
    const n = parseInt(m[1], 16);
    const r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
    const L = 0.3 * r + 0.59 * gg + 0.11 * b;
    const f = clamp(g, 0, 1);
    const mix = (c) => Math.round(c + (L - c) * f);
    return '#' + [mix(r), mix(gg), mix(b)].map((v) => v.toString(16).padStart(2, '0')).join('');
  }

  function rrPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function strokePath(ctx, lw, color, build) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    build(ctx);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
    ctx.restore();
  }

  /* A jointed limb (polyline) with a dark outline, so joints do not show seams. */
  function bone(ctx, pts, w, color) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = OUT;
    ctx.lineWidth = w + 2.2;
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
    ctx.restore();
  }

  /* Pose: angles are measured from straight down; positive = forward (toward the facing side). */
  function poseOf(p) {
    const st = typeof p.state === 'string' ? p.state : 'idle';
    const t = num(p.t, 0), time = num(p.time, 0);
    const q = {
      ground: true, lift: 0, bob: 0, lean: 0, tilt: -0.12, rot: 0, alpha: 1, grey: 0.2,
      nA: 1.1, nB: 1.1, fA: -0.9, fB: 0.6,          // arms: shoulder angle, elbow bend
      nL: 0.6, nF: 1.0, fL: -0.35, fF: 0.15,        // legs: hip angle, knee flex (one knee bent mid-run)
      mouth: 'laugh', eyes: 'happy', tears: false, trail: null, streaks: false
    };
    let ph, s, c;
    switch (st) {
      case 'frozen':
        q.grey = 0.3;
        break;
      case 'slow': {
        const br = Math.sin(time * 0.9);
        q.bob = 0.25 * br; q.nA += 0.02 * br; q.grey = 0.22;
        break;
      }
      case 'walk':
        ph = time * 6.5; s = Math.sin(ph); c = Math.cos(ph);
        q.nL = 0.42 * s; q.nF = 0.6 * Math.max(0, c) + 0.05;
        q.fL = -0.42 * s; q.fF = 0.6 * Math.max(0, -c) + 0.05;
        q.bob = -0.5 * Math.cos(2 * ph); q.lean = 0.03; q.tilt = -0.12 + 0.04 * Math.cos(2 * ph);
        q.nA = 0.9 - 0.5 * s; q.nB = 1.2; q.fA = 0.5 * s; q.fB = 0.6; q.grey = 0;
        break;
      case 'run':
        ph = time * 11.5; s = Math.sin(ph); c = Math.cos(ph);
        q.nL = 0.85 * s; q.nF = 1.0 * Math.max(0, c) + 0.25;
        q.fL = -0.85 * s; q.fF = 1.0 * Math.max(0, -c) + 0.25;
        q.bob = -0.7 * Math.cos(2 * ph); q.lean = 0.2; q.tilt = -0.3 + 0.08 * Math.sin(2 * ph);
        q.nA = 0.4 - 1.0 * s; q.nB = 1.7; q.fA = 0.4 + 1.0 * s; q.fB = 1.6; q.grey = 0;
        break;
      case 'jump':
        q.ground = false;
        q.nL = 0.95; q.nF = 1.5; q.fL = 0.45; q.fF = 1.4;
        q.nA = 2.6; q.nB = 0.3; q.fA = 2.3; q.fB = 0.25;
        q.lean = -0.05; q.tilt = -0.3; q.grey = 0;
        break;
      case 'fall':
        q.ground = false;
        q.nL = 0.2; q.nF = 0.35; q.fL = -0.25; q.fF = 0.4;
        q.nA = 2.3 + 0.25 * Math.sin(time * 10); q.nB = 0.35;
        q.fA = -2.1 + 0.25 * Math.cos(time * 10); q.fB = 0.25;
        q.lean = -0.1; q.tilt = -0.25; q.eyes = 'wide'; q.mouth = 'shout'; q.grey = 0;
        break;
      case 'land': {
        const k = clamp(1 - t / 0.22, 0, 1);
        q.nL = 0.3 * k; q.nF = 1.3 * k + 0.15; q.fL = -0.3 * k; q.fF = 1.3 * k + 0.15;
        q.nA = 1.2 + 0.9 * k; q.nB = 0.5; q.fA = -1.2 - 0.6 * k; q.fB = 0.3;
        q.lean = 0.1 * k; q.tilt = -0.15; q.eyes = k > 0.5 ? 'squeeze' : 'happy'; q.grey = 0;
        break;
      }
      case 'attack': {
        let a = 2.2, b = 0.8;
        if (t < 0.08) {                      // anticipation: the roll is pulled back
          const u = smooth(t / 0.08);
          a = lerp(2.2, -1.4, u); q.lean = -0.06 * u;
        } else if (t < 0.2) {                // the swing, with a trail
          const u = smooth((t - 0.08) / 0.12);
          a = lerp(-1.4, 2.5, u); b = lerp(0.8, 0.1, u); q.lean = lerp(-0.06, 0.25, u);
          q.trail = [-1.4, a];
        } else {                             // recovery
          const u = smooth((t - 0.2) / 0.2);
          a = lerp(2.5, 2.2, u); b = lerp(0.1, 0.8, u); q.lean = lerp(0.25, 0, u);
        }
        q.nA = a; q.nB = b;
        q.nL = 0.35; q.nF = 0.25; q.fL = -0.45; q.fF = 0.2; q.fA = -0.7; q.fB = 0.5;
        q.mouth = 'shout'; q.grey = 0;
        break;
      }
      case 'dash':
        q.lean = 0.55; q.tilt = -0.35;
        q.nL = -0.9; q.nF = 0.35; q.fL = -1.25; q.fF = 0.45;
        q.nA = -1.9; q.nB = 0.3; q.fA = -1.6; q.fB = 0.25;
        q.eyes = 'wide'; q.streaks = true; q.grey = 0;
        break;
      case 'hurt': {
        const k = clamp(1 - t / 0.4, 0, 1);
        q.lean = -0.12 - 0.25 * k; q.tilt = 0.25;
        q.nA = 2.4 + 0.2 * Math.sin(time * 20); q.nB = 0.3; q.fA = -2.2; q.fB = 0.2;
        q.nL = -0.25; q.nF = 0.45; q.fL = 0.3; q.fF = 0.35;
        q.eyes = 'squeeze'; q.mouth = 'ow'; q.tears = true; q.grey = 0;
        break;
      }
      case 'dead': {
        const k = clamp(t / 0.5, 0, 1);
        q.ground = false; q.rot = (Math.PI / 2) * k * k;
        q.alpha = 1 - clamp((t - 0.6) / 1.0, 0, 1);
        q.grey = 0.3 + 0.4 * clamp(t / 1.2, 0, 1);
        q.nL = 0.2; q.nF = 0.2; q.fL = -0.2; q.fF = 0.2;
        q.nA = 2.0; q.nB = 0.2; q.fA = -1.6; q.fB = 0.2; q.tilt = 0.4;
        q.eyes = 'closed'; q.mouth = 'none';
        break;
      }
      case 'talk':                           // happy hop, arms waving
        ph = time * 8.5; s = Math.sin(ph);
        q.lift = -3.0 * Math.abs(s); q.lean = 0.04 * s; q.tilt = -0.18 + 0.12 * s;
        q.nL = 0.25 * s; q.fL = -0.25 * s;
        q.nF = 0.45 + 0.8 * Math.abs(s); q.fF = q.nF;
        q.nA = 2.5 + 0.5 * Math.sin(time * 10); q.nB = 0.6 + 0.35 * Math.sin(time * 10 + 1);
        q.fA = 2.2 + 0.5 * Math.sin(time * 10 + Math.PI); q.fB = 0.6 + 0.35 * Math.sin(time * 10 + Math.PI + 1);
        q.grey = 0;
        break;
      default: {                             // idle, and any unknown state: breathing, frozen grin
        const br = Math.sin(time * 2.4);
        q.bob = 0.3 * br; q.lean = 0.02 * br; q.nA += 0.04 * br; q.tilt += 0.02 * br;
        q.grey = 0.2;
      }
    }
    return q;
  }

  function legGeom(hipX, a, f) {
    const kx = hipX + LEG1 * Math.sin(a), ky = LEG1 * Math.cos(a);
    const fx = kx + LEG2 * Math.sin(a - f), fy = ky + LEG2 * Math.cos(a - f);
    return { hip: [hipX, 0], knee: [kx, ky], foot: [fx, fy] };
  }

  function armPts(sh, a, b) {
    const ex = sh[0] + ARM1 * Math.sin(a), ey = sh[1] + ARM1 * Math.cos(a);
    const k = a + b;
    return [[sh[0], sh[1]], [ex, ey], [ex + ARM2 * Math.sin(k), ey + ARM2 * Math.cos(k)]];
  }

  function drawLeg(ctx, L, hipY, pants, boot, C) {
    const pts = [[L.hip[0], hipY], [L.knee[0], hipY + L.knee[1]], [L.foot[0], hipY + L.foot[1]]];
    bone(ctx, pts, 3.4, C(pants));
    ART.ell(ctx, L.foot[0] + 0.9, hipY + L.foot[1] - 1.1, 2.4, 1.35, C(boot), { lw: 1 });
  }

  function drawArm(ctx, pts, sleeve, hand, cuff, C) {
    bone(ctx, pts, 3.4, C(sleeve));
    if (cuff) {
      const wx = pts[1][0] + 0.8 * (pts[2][0] - pts[1][0]);
      const wy = pts[1][1] + 0.8 * (pts[2][1] - pts[1][1]);
      ART.ell(ctx, wx, wy, 1.7, 1.7, C(PAL.cream), { lw: 0.9 });
    }
    ART.ell(ctx, pts[2][0], pts[2][1], 1.4, 1.4, C(hand), { lw: 0.9 });
  }

  function drawTorso(ctx, C) {
    const x = -3.7, y = -7.6, w = 7.4, h = 8.6;
    ctx.save();
    rrPath(ctx, x, y, w, h, 3);
    ctx.fillStyle = C(PAL.navy);
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = C(PAL.cream);
    [-5.8, -3.4, -1.0].forEach((sy) => ctx.fillRect(x - 1, sy, w + 2, 1.3));
    ctx.restore();
    strokePath(ctx, 1.2, OUT, (g) => rrPath(g, x, y, w, h, 3));
    ART.ell(ctx, 0.2, -7.4, 2.9, 1.2, C(PAL.cream), { lw: 0.9 });
  }

  function drawEye(ctx, x, y, e, mode) {
    if (mode === 'squeeze') {
      strokePath(ctx, 1.0, OUT, (g) => { g.moveTo(x - e, y - 0.2); g.quadraticCurveTo(x, y + e * 1.3, x + e, y - 0.2); });
    } else if (mode === 'closed') {
      strokePath(ctx, 1.0, OUT, (g) => { g.moveTo(x - e, y); g.lineTo(x + e, y); });
    } else if (mode === 'wide') {
      ART.eye(ctx, x, y, e * 0.9, 0.3, 0, 0, { lw: 0.9 });
    } else {                                 // happy: closed laughing crescent
      strokePath(ctx, 1.0, OUT, (g) => { g.moveTo(x - e, y + 0.4); g.quadraticCurveTo(x, y - e * 1.4, x + e, y + 0.4); });
    }
  }

  function drawMouth(ctx, q, C) {
    const m = q.mouth;
    if (m === 'laugh') {
      const path = (g) => {
        g.beginPath();
        g.moveTo(1.4, 2.4);
        g.quadraticCurveTo(3.6, 3.9, 5.6, 2.2);
        g.quadraticCurveTo(5.0, 6.6, 3.3, 6.6);
        g.quadraticCurveTo(1.6, 6.4, 1.4, 2.4);
        g.closePath();
      };
      ctx.save();
      path(ctx);
      ctx.fillStyle = C(PAL.mouth);
      ctx.fill();
      ctx.save();
      path(ctx);
      ctx.clip();
      ctx.fillStyle = C(PAL.teeth);
      ctx.fillRect(1, 1.4, 5, 1.1);
      ctx.beginPath();
      ctx.ellipse(3.5, 5.6, 1.7, 0.95, 0, 0, Math.PI * 2);
      ctx.fillStyle = C(PAL.tongue);
      ctx.fill();
      ctx.restore();
      path(ctx);
      ctx.strokeStyle = OUT;
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.restore();
    } else if (m === 'shout') {
      ART.ell(ctx, 3.7, 4.0, 1.6, 2.0, C(PAL.mouth), { lw: 0.9 });
    } else if (m === 'ow') {
      ART.ell(ctx, 3.8, 3.8, 1.3, 1.9, C(PAL.mouth), { lw: 0.9 });
    } else if (m === 'none') {
      strokePath(ctx, 0.9, OUT, (g) => { g.moveTo(2.2, 3.6); g.quadraticCurveTo(3.6, 4.0, 5.2, 3.4); });
    }
  }

  function drawHead(ctx, q, C) {
    ART.ell(ctx, -1.5, 1.0, 1.4, 1.9, C(PAL.skinDk), { lw: 1 });                 // ear
    ART.ell(ctx, 0, 0, 6.6, 6.3, C(PAL.skin), { lw: 1.2 });                      // face
    ART.ell(ctx, 2.2, 1.6, 1.5, 0.9, C(PAL.cheek), { stroke: false, alpha: 0.85 }); // rosy cheek
    ART.ell(ctx, 5.9, 0.5, 0.6, 0.5, C(PAL.skinDk), { lw: 0.7 });                // nose
    drawEye(ctx, 3.6, -0.9, 1.3, q.eyes);
    drawEye(ctx, 1.0, -0.7, 1.0, q.eyes);
    drawMouth(ctx, q, C);
    if (q.tears) ART.ell(ctx, 4.9, 1.4, 0.7, 1.0, C(PAL.tear), { lw: 0.7 });
    ART.poly(ctx, HAIR_HEAD, C(PAL.hair), { lw: 1.1 });                          // short, messy hair
    strokePath(ctx, 0.9, C(PAL.hairLt), (g) => { g.moveTo(-4.4, -4.2); g.quadraticCurveTo(-2.6, -6.2, -0.6, -6.4); });
  }

  function drawTrail(ctx, trail) {
    const s0 = Math.PI / 2 - trail[0], s1 = Math.PI / 2 - trail[1];
    ctx.save();
    ctx.beginPath();
    ctx.arc(SH_NEAR[0], SH_NEAR[1], ARM1 + ARM2, s0, s1, s1 < s0);
    ctx.strokeStyle = 'rgba(255,250,235,0.55)';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  function drawStreaks(ctx, time) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.2;
    const off = (time * 60) % 8;
    for (let i = 0; i < 3; i++) {
      const y = -13 + i * 5;
      ctx.beginPath();
      ctx.moveTo(-14 - off + i, y);
      ctx.lineTo(-9 - off + i, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function bread(ctx, x, y, rot, C) {
    ART.ell(ctx, x, y, 3.0, 1.9, C(PAL.crust), { rot, lw: 1.1 });
    ART.ell(ctx, x - 0.3, y - 0.6, 2.0, 0.85, C(PAL.crumb), { rot, stroke: false });
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    strokePath(ctx, 0.9, C(PAL.score), (g) => { g.moveTo(-1.7, 0.2); g.quadraticCurveTo(0, -0.9, 1.7, 0.1); });
    ctx.restore();
  }

  function draw(ctx, p) {
    const q = poseOf(p);
    const time = num(p.time, 0);
    const legN = legGeom(HIP_NEAR, q.nL, q.nF);
    const legF = legGeom(HIP_FAR, q.fL, q.fF);
    const lowest = Math.max(legN.foot[1], legF.foot[1]);
    const hipY = (q.ground ? -lowest : -LEG_REST) + q.lift;   // grounded: the lowest foot sits on y = 0
    const upperY = hipY + q.bob;
    const C = (hex) => tone(hex, q.grey);

    if (q.alpha < 1) ctx.globalAlpha *= q.alpha;
    if (q.rot) ctx.rotate(q.rot);
    if (q.streaks) drawStreaks(ctx, time);

    drawLeg(ctx, legF, hipY, PAL.pantsDk, PAL.bootDk, C);
    drawLeg(ctx, legN, hipY, PAL.pants, PAL.boot, C);

    ctx.save();
    ctx.translate(0, upperY);
    ctx.rotate(q.lean);
    drawArm(ctx, armPts(SH_FAR, q.fA, q.fB), ART.shade(PAL.navy, -0.2), ART.shade(PAL.skin, -0.1), false, C);
    ART.rr(ctx, -0.9, -10.2, 2.8, 3.4, 1.0, C(PAL.skinDk), { lw: 0.9 });        // neck
    drawTorso(ctx, C);
    ctx.save();
    ctx.translate(HEAD[0], HEAD[1]);
    ctx.rotate(q.tilt);
    drawHead(ctx, q, C);
    ctx.restore();
    if (q.trail) drawTrail(ctx, q.trail);
    const near = armPts(SH_NEAR, q.nA, q.nB);
    drawArm(ctx, near, PAL.navy, PAL.skin, true, C);
    bread(ctx, near[2][0] + 0.6, near[2][1] - 0.6, -0.5, C);                    // the roll, held out in front
    ctx.restore();
  }

  /* ---------- portrait (200x200 box centred on 0,0) ---------- */

  const FRINGE = [[-54, -14], [-50, -46], [-30, -60], [-8, -54], [12, -64], [34, -58], [54, -44], [54, -14],
    [40, -30], [22, -38], [4, -46], [-12, -38], [-28, -42], [-40, -30], [-52, -14]];
  const SPIKES = [[-58, -30], [-70, -62], [-50, -64], [-46, -92], [-26, -74], [-12, -100], [8, -78], [24, -98],
    [36, -76], [60, -84], [60, -40], [0, -30]];

  const EXPR = {
    neutral: { brows: [[-36, -40, -12, -42], [12, -42, 36, -40]], eyes: 'happy', mouth: 'grin', cheek: 0.8 },
    happy: { brows: [[-36, -42, -12, -46], [12, -46, 36, -42]], eyes: 'happy', mouth: 'laugh', cheek: 1 },
    sad: { brows: [[-36, -30, -12, -40], [12, -40, 36, -30]], eyes: 'sad', mouth: 'frown', cheek: 0, tear: true },
    angry: { brows: [[-38, -46, -12, -32], [12, -32, 38, -46]], eyes: 'angry', mouth: 'shout', cheek: 0.55, red: true },
    surprised: { brows: [[-40, -44, -12, -52], [12, -52, 40, -44]], eyes: 'wide', mouth: 'o', cheek: 0 },
    worried: { brows: [[-36, -30, -12, -46], [12, -46, 36, -30]], eyes: 'worry', mouth: 'wobble', cheek: 0.2, sweat: true }
  };

  function jumperPath(g) {
    g.beginPath();
    g.moveTo(-100, 100);
    g.lineTo(-100, 80);
    g.quadraticCurveTo(-98, 52, -62, 46);
    g.quadraticCurveTo(-34, 38, 0, 38);
    g.quadraticCurveTo(34, 38, 62, 46);
    g.quadraticCurveTo(98, 52, 100, 80);
    g.lineTo(100, 100);
    g.closePath();
  }

  function portraitMouth(ctx, kind) {
    if (kind === 'laugh') {
      const path = (g) => {
        g.beginPath();
        g.moveTo(-32, 20);
        g.quadraticCurveTo(0, 34, 32, 20);
        g.quadraticCurveTo(30, 70, 0, 72);
        g.quadraticCurveTo(-30, 70, -32, 20);
        g.closePath();
      };
      ctx.save();
      path(ctx);
      ctx.fillStyle = PAL.mouth;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = PAL.teeth;
      ctx.fillRect(-32, 14, 64, 14);
      ctx.beginPath();
      ctx.ellipse(0, 60, 20, 11, 0, 0, Math.PI * 2);
      ctx.fillStyle = PAL.tongue;
      ctx.fill();
      ctx.restore();
      strokePath(ctx, 3, OUT, path);
    } else if (kind === 'grin') {
      const path = (g) => {
        g.beginPath();
        g.moveTo(-26, 30);
        g.quadraticCurveTo(0, 42, 26, 30);
        g.quadraticCurveTo(18, 56, 0, 56);
        g.quadraticCurveTo(-18, 56, -26, 30);
        g.closePath();
      };
      ctx.save();
      path(ctx);
      ctx.fillStyle = PAL.mouth;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = PAL.teeth;
      ctx.fillRect(-26, 26, 52, 9);
      ctx.restore();
      strokePath(ctx, 3, OUT, path);
    } else if (kind === 'frown') {
      strokePath(ctx, 4.5, OUT, (g) => { g.moveTo(-24, 58); g.quadraticCurveTo(0, 36, 24, 58); });
    } else if (kind === 'shout') {
      ART.rr(ctx, -26, 28, 52, 36, 14, PAL.mouth, { lw: 3 });
      ART.ell(ctx, 0, 56, 13, 5, PAL.tongue, { stroke: false });
      ART.rr(ctx, -20, 30, 40, 8, 3, PAL.teeth, { lw: 1.5 });
    } else if (kind === 'o') {
      ART.ell(ctx, 0, 44, 14, 18, PAL.mouth, { lw: 3 });
      ART.ell(ctx, 0, 54, 7, 5, PAL.tongue, { stroke: false });
    } else if (kind === 'wobble') {
      strokePath(ctx, 4, OUT, (g) => {
        g.moveTo(-26, 50);
        g.quadraticCurveTo(-16, 40, -8, 50);
        g.quadraticCurveTo(0, 60, 8, 50);
        g.quadraticCurveTo(16, 40, 26, 50);
      });
    }
  }

  function drawPortrait(ctx, expr, t) {
    const key = Object.prototype.hasOwnProperty.call(EXPR, expr) ? expr : 'neutral';
    const E = EXPR[key];
    const blink = num(t, 0) % 3.4 < 0.12 ? 1 : 0;
    const eyeY = -14;

    ctx.save();
    jumperPath(ctx);
    ctx.fillStyle = PAL.navy;
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = PAL.cream;
    [60, 74, 88].forEach((y) => ctx.fillRect(-100, y, 200, 7));
    ctx.restore();
    strokePath(ctx, 3, OUT, jumperPath);

    ART.rr(ctx, -22, 14, 44, 36, 14, PAL.skinDk, { lw: 3 });                    // neck
    ART.ell(ctx, 0, 40, 34, 10, PAL.cream, { lw: 3 });                          // crew collar

    ART.ell(ctx, 0, -34, 62, 46, PAL.hair, { lw: 3 });                          // hair mass behind the head
    ART.poly(ctx, SPIKES, PAL.hair, { lw: 3 });
    ART.ell(ctx, -50, -8, 10, 14, PAL.skin, { lw: 3 });                         // ears
    ART.ell(ctx, 50, -8, 10, 14, PAL.skin, { lw: 3 });
    ART.ell(ctx, 0, -12, 50, 56, PAL.skin, { lw: 3 });                          // face
    ART.ell(ctx, 24, 18, 26, 22, PAL.skinDk, { stroke: false, alpha: 0.18 });  // jaw shade
    ART.poly(ctx, FRINGE, PAL.hair, { lw: 3 });                                 // messy fringe
    ART.ell(ctx, -22, -58, 18, 6, '#ffffff', { stroke: false, alpha: 0.18, rot: -0.3 });

    for (const [x1, y1, x2, y2] of E.brows) {
      strokePath(ctx, 4.5, PAL.brow, (g) => {
        g.moveTo(x1, y1);
        g.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 - 3, x2, y2);
      });
    }

    if (E.cheek > 0) {
      const col = E.red ? PAL.red : PAL.cheek;
      ART.ell(ctx, -31, 8, 12, 8, col, { stroke: false, alpha: E.cheek });
      ART.ell(ctx, 31, 8, 12, 8, col, { stroke: false, alpha: E.cheek });
    }

    for (const x of [-19, 19]) {
      if (E.eyes === 'happy') {
        strokePath(ctx, 3.5, OUT, (g) => { g.moveTo(x - 13, eyeY + 3); g.quadraticCurveTo(x, eyeY - 14, x + 13, eyeY + 3); });
      } else if (E.eyes === 'wide') {
        ART.eye(ctx, x, eyeY, 11, 0, 0, 0, { lw: 2.4 });
      } else if (E.eyes === 'worry') {
        ART.eye(ctx, x, eyeY, 9.5, -0.4, -0.6, blink, { lw: 2.2 });
      } else if (E.eyes === 'angry') {
        ART.eye(ctx, x, eyeY, 9.5, 0, 0, Math.max(blink, 0.5), { lw: 2.2 });
      } else {
        ART.eye(ctx, x, eyeY, 9.5, 0, 0.5, blink, { lw: 2.2 });
      }
    }

    if (E.tear) ART.ell(ctx, -24, 4, 4, 6.5, PAL.tear, { lw: 2 });
    if (E.sweat) ART.ell(ctx, -58, -34, 5, 7, PAL.tear, { lw: 2 });
    strokePath(ctx, 2.4, OUT, (g) => { g.moveTo(4, -6); g.quadraticCurveTo(9, 4, 2, 6); });   // nose
    portraitMouth(ctx, E.mouth);
  }

  ART.register({
    id: 'tomas', w: 20, h: 32,
    draw(ctx, p) { draw(ctx, p || {}); },
    portrait(ctx, expr, t) { drawPortrait(ctx, expr, t); },
  });
})();
