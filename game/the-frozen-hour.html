  <script>
/* js/env/themes/clockface.js */
/* ENV theme "clockface": the summit of the Tower (ch5). Contract: DESIGN.md section 6, AGENT_BRIEF.md.
   Dusk sky from violet to gold, the giant clock at 23:47 in the far layer, frozen clouds in soft layers,
   pale marble tiles, gold-trimmed plates, gold glints on gears, light shafts in the foreground. */
(function () {
  window.ENV_THEMES = window.ENV_THEMES || {};

  const TAU = Math.PI * 2;
  const S = 32;                                // tile size
  const HOUR_A = ((11 + 47 / 60) / 12) * TAU;  // 23:47: hour hand just short of XII
  const MIN_A = (47 / 60) * TAU;               // minute hand at 47
  const CLOCK_PERIOD = 1400;                   // world distance between two giant clocks

  function num(v, d) { return typeof v === 'number' && isFinite(v) ? v : d; }

  // Stable pseudo-random value in [0, 1) for a pair of numbers.
  function rnd(a, b) {
    const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return s - Math.floor(s);
  }

  // Calls fn(k, screenX) for each world-stable column of width P seen through a layer at factor f.
  function columns(camX, f, P, W, fn) {
    const base = Math.floor((camX * f) / P);
    const count = Math.ceil(W / P) + 2;
    for (let j = -2; j < count; j++) {
      const k = base + j;
      fn(k, k * P - camX * f);
    }
  }

  /* ---------- background ---------- */

  function stars(ctx, camX, t, W, H) {
    const P = 1200;
    columns(camX, 0.2, P, W, (k, sx) => {
      for (let s = 0; s < 8; s++) {
        const x = sx + rnd(k, s * 3 + 1) * P;
        if (x < -4 || x > W + 4) continue;
        const y = 16 + rnd(k, s * 3 + 2) * H * 0.4;
        ctx.globalAlpha = Math.max(0.1, 0.4 + 0.4 * Math.sin(t * (1 + rnd(s, k)) + s * 2.1));
        ctx.fillStyle = '#fff4d8';
        ctx.beginPath();
        ctx.arc(x, y, 0.9 + rnd(s, k) * 0.9, 0, TAU);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }

  // One frozen cloud: a body with a flat base. Lit tops come from a second, offset copy.
  function cloud(ctx, x, y, s, col, a) {
    ctx.globalAlpha = a;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x + 22 * s, y, 22 * s, 0, TAU);
    ctx.arc(x + 52 * s, y - 13 * s, 30 * s, 0, TAU);
    ctx.arc(x + 84 * s, y - 2 * s, 22 * s, 0, TAU);
    ctx.arc(x + 104 * s, y + 6 * s, 14 * s, 0, TAU);
    ctx.rect(x + 20 * s, y, 84 * s, 16 * s);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function cloudLayer(ctx, camX, camY, L, W, seed) {
    columns(camX, L.f, L.P, W, (k, sx) => {
      const x = sx + rnd(k, seed) * L.P * 0.5;
      const y = L.y0 + rnd(k, seed + 1) * (L.y1 - L.y0) - camY * L.f * 0.15;
      const s = L.sc * (0.8 + rnd(k, seed + 2) * 0.45);
      cloud(ctx, x, y, s, L.body, L.a);
      cloud(ctx, x + 8 * s, y - 7 * s, s * 0.8, L.lit, L.a * 0.8);
    });
  }

  function hand(ctx, cx, cy, a, len, w) {
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); ctx.stroke();
  }

  // The clock as seen from behind: iron back-plate with a gold toothed rim, then the cream face in front.
  function clockFace(ctx, cx, cy, R) {
    ctx.fillStyle = '#2c2046';
    ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, TAU); ctx.fill();

    ctx.fillStyle = '#9c7430';
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {  // 12 teeth on the rim
      const a = (i / 12) * TAU, d = (TAU / 12) * 0.3;
      const p = (r, s) => [cx + Math.cos(a + s * d) * r, cy + Math.sin(a + s * d) * r];
      [p(R + 10, -1), p(R + 14, -1), p(R + 14, 1), p(R + 10, 1)].forEach(([px, py], j) => ctx[j ? 'lineTo' : 'moveTo'](px, py));
      ctx.closePath();
    }
    ctx.fill();

    const face = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
    face.addColorStop(0, '#f3e3bd');
    face.addColorStop(0.75, '#e6cf9f');
    face.addColorStop(1, '#d2b47c');
    ctx.fillStyle = face;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c9963c'; ctx.lineWidth = R * 0.035;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.98, 0, TAU); ctx.stroke();

    ctx.strokeStyle = '#2a1f22';
    ctx.lineCap = 'butt';
    for (let i = 0; i < 12; i++) {
      if (i % 3) continue;
      const a = (i / 12) * TAU, big = i % 3 === 0;
      ctx.lineWidth = big ? R * 0.045 : R * 0.02;
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(a) * R * (big ? 0.78 : 0.84), cy - Math.cos(a) * R * (big ? 0.78 : 0.84));
      ctx.lineTo(cx + Math.sin(a) * R * 0.92, cy - Math.cos(a) * R * 0.92);
      ctx.stroke();
    }

    ctx.strokeStyle = '#4a3553';
    ctx.lineCap = 'round';
    hand(ctx, cx, cy, HOUR_A, R * 0.5, R * 0.06);
    hand(ctx, cx, cy, MIN_A, R * 0.78, R * 0.035);

    ctx.fillStyle = '#d9a84a';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.07, 0, TAU); ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function giantClock(ctx, camX, camY, W) {
    const R = 100;
    const cy = 118 - camY * 0.1;
    const base = Math.round((camX * 0.25) / CLOCK_PERIOD);
    ctx.save();
    ctx.globalAlpha = 0.4;
    for (let k = base - 1; k <= base + 1; k++) {
      const cx = W * 0.5 + k * CLOCK_PERIOD - camX * 0.25;
      if (cx + R + 20 < 0 || cx - R - 20 > W) continue;
      clockFace(ctx, cx, cy, R);
    }
    ctx.restore();
  }

  // Rooftop silhouettes of the Tower, some with pointed roofs.
  function spireRow(ctx, camX, f, base, col, seed, W, H, P) {
    ctx.fillStyle = col;
    columns(camX, f, P, W, (k, sx) => {
      const x0 = sx + rnd(k, seed) * P * 0.35;
      const w = P * (0.35 + rnd(k, seed + 1) * 0.25);
      const top = base - (20 + rnd(k, seed + 2) * 70);
      ctx.fillRect(x0, top, w, H - top);
      ctx.fillStyle = 'rgba(255,200,150,0.2)';  // 1px rim light along the block top
      ctx.fillRect(x0, top, w, 1);
      ctx.fillStyle = col;
      if (rnd(k, seed + 3) > 0.45) {
        const apex = 36 + rnd(k, seed + 4) * 50;
        ctx.beginPath();
        [[x0 - 4, top], [x0 + w / 2, top - apex], [x0 + w + 4, top]].forEach(([px, py], j) =>
          ctx[j ? 'lineTo' : 'moveTo'](px, py));
        ctx.fill();
      }
    });
  }

  function background(ctx, camX, camY, t, W, H) {
    const cx0 = num(camX, 0);
    const cy0 = num(camY, 0);
    const tt = num(t, 0);
    const w = num(W, 960);
    const h = num(H, 540);
    ctx.save();

    // dusk sky, opaque: violet at the top, gold at the horizon
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#24194a');
    sky.addColorStop(0.35, '#4b2c74');
    sky.addColorStop(0.6, '#9a4f8c');
    sky.addColorStop(0.8, '#e0805e');
    sky.addColorStop(1, '#ffc96b');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    const sun = ctx.createRadialGradient(w * 0.5, h * 0.95, 8, w * 0.5, h * 0.95, w * 0.55);
    sun.addColorStop(0, 'rgba(255,240,190,0.85)');
    sun.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, w, h);

    stars(ctx, cx0, tt, w, h);
    cloudLayer(ctx, cx0, cy0, { f: 0.2, P: 560, y0: 50, y1: 190, sc: 1.2, body: '#7d5b9e', lit: '#eebb8c', a: 0.5 }, w, 11);
    giantClock(ctx, cx0, cy0, w);
    cloudLayer(ctx, cx0, cy0, { f: 0.3, P: 480, y0: 190, y1: 300, sc: 1.0, body: '#b07aa2', lit: '#f7cb92', a: 0.45 }, w, 31);
    spireRow(ctx, cx0, 0.3, h * 0.74, '#4a3278', 21, w, h, 190);
    spireRow(ctx, cx0, 0.45, h * 0.82, '#33224f', 51, w, h, 230);
    cloudLayer(ctx, cx0, cy0, { f: 0.5, P: 420, y0: 320, y1: 420, sc: 0.8, body: '#e0968c', lit: '#ffe0a6', a: 0.42 }, w, 71);

    // dark ground below the summit edge (the gold rim light is drawn in foreground, above the tiles)
    const gy = h * 0.884;
    const ground = ctx.createLinearGradient(0, gy, 0, h);
    ground.addColorStop(0, '#3e2858');
    ground.addColorStop(1, '#1b1130');
    ctx.fillStyle = ground;
    ctx.fillRect(0, gy, w, h - gy);

    ctx.restore();
  }

  /* ---------- tiles ---------- */

  // Pale marble block with grey and gold veins; the veins change per cell.
  function marble(ctx, x, y, n) {
    const g = ctx.createLinearGradient(x, y, x + S, y + S);
    g.addColorStop(0, '#f6f1e6');
    g.addColorStop(1, '#d9cfbd');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, S, S);

    const a = rnd(x, y);
    const b = rnd(y, x + 7);
    ctx.beginPath();
    ctx.moveTo(x, y + a * S);
    ctx.bezierCurveTo(x + 9, y + b * S, x + 20, y + (1 - a) * S, x + S, y + b * S * 0.6 + 4);
    ctx.lineWidth = 3;  // soft tonal band under the hairline vein
    ctx.strokeStyle = 'rgba(150,126,120,0.08)';
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(150,126,120,0.2)';
    ctx.stroke();
    if (a > 0.5) {  // gold vein on about half the cells
      ctx.strokeStyle = 'rgba(196,150,70,0.12)';
      ctx.beginPath();
      ctx.moveTo(x + b * S, y);
      ctx.quadraticCurveTo(x + (1 - b) * 12, y + 14, x + a * 12 + 12, y + S);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(96,80,100,0.22)';
    ctx.strokeRect(x + 0.5, y + 0.5, S - 1, S - 1);

    if (!n.u) {
      ctx.fillStyle = '#fffdf7';
      ctx.fillRect(x, y, S, 3);
      ctx.fillStyle = 'rgba(110,84,90,0.3)';
      ctx.fillRect(x, y + 3, S, 1);
      ctx.fillStyle = 'rgba(230,186,96,0.7)';
      ctx.fillRect(x, y + 4, S, 1);
    }
    if (!n.d) { ctx.fillStyle = 'rgba(86,66,96,0.28)'; ctx.fillRect(x, y + S - 3, S, 3); }
    if (!n.r) { ctx.fillStyle = 'rgba(86,66,96,0.22)'; ctx.fillRect(x + S - 2, y, 2, S); }
    if (!n.l) { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(x, y, 2, S); }
  }

  // Thin marble plate with gold trim on top and below, rivets and short supports.
  function plate(ctx, x, y) {
    ctx.fillStyle = 'rgba(58,40,58,0.55)';
    ctx.fillRect(x + 5, y + 18, 3, 8);
    ctx.fillRect(x + S - 8, y + 18, 3, 8);

    ctx.fillStyle = '#ecd9b0';
    ctx.fillRect(x, y + 8, S, 9);

    const g = ctx.createLinearGradient(0, y + 4, 0, y + 8);
    g.addColorStop(0, '#fff2bd');
    g.addColorStop(1, '#d4a24a');
    ctx.fillStyle = g;
    ctx.fillRect(x, y + 4, S, 4);
    ctx.fillStyle = '#b8862e';
    ctx.fillRect(x, y + 16, S, 2);

    ctx.strokeStyle = 'rgba(28,20,32,0.75)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 4.5, S - 1, 13);

    ctx.fillStyle = '#fff4c8';
    ctx.beginPath();
    ctx.arc(x + 5.5, y + 10.5, 1.2, 0, TAU);
    ctx.moveTo(x + S - 4.3, y + 10.5);
    ctx.arc(x + S - 5.5, y + 10.5, 1.2, 0, TAU);
    ctx.fill();
  }

  // Brass spikes standing on a solid tile or a plate.
  function spikes(ctx, x, y) {
    for (let i = 0; i < 4; i++) {
      const sx = x + 2 + i * 8;
      ctx.beginPath();
      ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 7); ctx.lineTo(sx + 8, y + S); ctx.closePath();
      ctx.fillStyle = '#c99a3c'; ctx.fill();
      ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fbe6a0';  // lit face
      ctx.beginPath();
      ctx.moveTo(sx + 1, y + S - 1); ctx.lineTo(sx + 4, y + 9); ctx.lineTo(sx + 4.5, y + S - 1); ctx.closePath();
      ctx.fill();
    }
  }

  // Lit lantern on a post; the glass holds a small dial showing 23:47.
  function lantern(ctx, x, y, t) {
    const flick = 0.85 + 0.15 * Math.sin(t * 9 + x);
    const g = ctx.createRadialGradient(x + 16, y + 13, 1, x + 16, y + 13, 15);
    g.addColorStop(0, 'rgba(255,220,140,' + (0.55 * flick).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, S, S);

    ctx.fillStyle = '#5a4630';
    ctx.fillRect(x + 14, y + 20, 4, 12);

    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath();
    ctx.ellipse(x + 16, y + 13, 7, 8, 0, 0, TAU);
    ctx.fill(); ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fbf3df';
    ctx.beginPath(); ctx.arc(x + 16, y + 13, 4.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#14100f'; ctx.lineCap = 'round';
    hand(ctx, x + 16, y + 13, HOUR_A, 2.4, 1.1);
    hand(ctx, x + 16, y + 13, MIN_A, 3.6, 0.8);
    ctx.fillStyle = '#d9a84a';
    ctx.fillRect(x + 12, y + 3, 8, 3);
  }

  // Exit: an iron arch with a gold frame and a cream dial showing 23:47.
  function exitDoor(ctx, x, y, t) {
    ctx.beginPath();
    ctx.moveTo(x + 3, y + S);
    ctx.lineTo(x + 3, y + 13);
    ctx.arc(x + 16, y + 13, 13, Math.PI, 0);
    ctx.lineTo(x + 29, y + S);
    ctx.closePath();
    ctx.fillStyle = '#3c3048';
    ctx.fill();
    ctx.strokeStyle = '#e0b865';
    ctx.lineWidth = 2;
    ctx.stroke();

    const cx = x + 16;
    const cy = y + 14;
    ctx.fillStyle = '#fbf3df';
    ctx.beginPath(); ctx.arc(cx, cy, 8.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c9963c'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = '#14100f'; ctx.lineCap = 'round';
    hand(ctx, cx, cy, HOUR_A, 5, 1.6);
    hand(ctx, cx, cy, MIN_A, 7, 1.1);

    ctx.fillStyle = 'rgba(255,210,120,' + (0.25 + 0.12 * Math.sin(t * 3)).toFixed(3) + ')';
    ctx.fillRect(x + 3, y + S - 3, 26, 3);
  }

  // Gold gear turning in place, with two glints that drift over its rim.
  function gear(ctx, x, y, t) {
    const cx = x + 16;
    const cy = y + 16;
    const ri = 8.5;
    const ro = 11.5;
    const N = 8;
    const step = TAU / N;
    const rot = t * 2.2 + x * 0.1;
    const pt = (r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];

    const outline = [];
    for (let i = 0; i < N; i++) {
      const a = rot + i * step;
      outline.push(pt(ri, a - step * 0.3), pt(ro, a - step * 0.16), pt(ro, a + step * 0.16), pt(ri, a + step * 0.3));

    outline.forEach(([px, py], j) => ctx[j ? 'lineTo' : 'moveTo'](px, py));

    body.addColorStop(0, '#fff2b8');
    body.addColorStop(0.55, '#e0ad45');
    body.addColorStop(1, '#8c5e1e');
    ctx.fillStyle = body;
    ctx.fill();
    ctx.strokeStyle = '#2a1a0c';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#2a1f22';
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#fbe39a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 4.5, 0, TAU);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    for (let k = 0; k < 2; k++) {
      const ga = t * 0.9 + k * Math.PI + x * 0.05;
      const px = cx + Math.cos(ga) * 6.2;
      const py = cy + Math.sin(ga) * 6.2;
      ctx.globalAlpha = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * 6 + k * 2.4 + x));
      const star = [[0, -3.2], [0.9, -0.9], [3.2, 0], [0.9, 0.9], [0, 3.2], [-0.9, 0.9], [-3.2, 0], [-0.9, -0.9]];
      ctx.beginPath();
      star.forEach(([dx, dy], j) => ctx[j ? 'lineTo' : 'moveTo'](px + dx, py + dy));
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Oil flask: amber glow around a brass-capped bottle.
  function oil(ctx, x, y, t) {
    const pulse = 0.7 + 0.3 * Math.sin(t * 4 + x);
    const g = ctx.createRadialGradient(x + 16, y + 20, 2, x + 16, y + 20, 15);
    g.addColorStop(0, 'rgba(255,190,80,' + (0.35 * pulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, S, S);

    ctx.fillStyle = '#b8862e';
    ctx.fillRect(x + 12, y + 6, 8, 4);
    ctx.fillStyle = '#f5a93a';
    ctx.beginPath();
    ctx.ellipse(x + 16, y + 20, 7.5, 8.5, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#1c1420';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(x + 12, y + 16, 2, 5);
  }

  // Arena grille: violet iron bars with gold tips and a rose edge glow.
  function grille(ctx, x, y, t) {
    ctx.fillStyle = 'rgba(46,36,62,0.94)';
    ctx.fillRect(x, y, S, S);
    ctx.fillStyle = '#7e6f98';
    for (let i = 2; i < S; i += 8) ctx.fillRect(x + i, y, 3, S);
    ctx.fillStyle = '#e0b865';
    for (let i = 3; i < S; i += 8) {
      ctx.fillRect(x + i, y + 2, 1.5, 1.5);
      ctx.fillRect(x + i, y + S - 4, 1.5, 1.5);
    }
    const glow = 0.22 + 0.16 * Math.sin(t * 5 + x * 0.1);
    ctx.fillStyle = 'rgba(255,170,140,' + glow.toFixed(3) + ')';
    ctx.fillRect(x, y, 2, S);
    ctx.fillRect(x + S - 2, y, 2, S);
  }

  function tile(ctx, ch, x, y, t, nb) {
    const n = nb || {};
    const tx = num(x, 0);
    const ty = num(y, 0);
    const tt = num(t, 0);
    ctx.save();
    ctx.beginPath();
    ctx.rect(tx, ty, S, S);
    ctx.clip();
    switch (ch) {
      case '#': marble(ctx, tx, ty, n); break;
      case '=': plate(ctx, tx, ty); break;
      case '^': spikes(ctx, tx, ty); break;
      case 'C': lantern(ctx, tx, ty, tt); break;
      case 'X': exitDoor(ctx, tx, ty, tt); break;
      case 'o': gear(ctx, tx, ty, tt); break;
      case 'h': oil(ctx, tx, ty, tt); break;
      case 'B': grille(ctx, tx, ty, tt); break;
      default: break;
    }
    ctx.restore();
  }

  /* ---------- foreground ---------- */

  function foreground(ctx, camX, camY, t, W, H) {
    const cx0 = num(camX, 0);
    const tt = num(t, 0);
    const w = num(W, 960);
    const h = num(H, 540);
    ctx.save();

    // summit edge: thin gold rim light where the floor tiles meet the sky
    ctx.fillStyle = 'rgba(255,206,120,0.45)';
    ctx.fillRect(0, h * 0.884, w, 2);

    // light shafts slanting down from the upper right
    columns(cx0, 0.3, 420, w, (k, sx) => {
      const x = sx + rnd(k, 11) * 420;
      const top = 40 + rnd(k, 12) * 60;
      const lean = 180 + rnd(k, 13) * 90;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(255,236,190,0.13)');
      g.addColorStop(0.7, 'rgba(255,222,150,0.05)');
      g.addColorStop(1, 'rgba(255,222,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + top, 0);
      ctx.lineTo(x + top - lean, h);
      ctx.lineTo(x - lean, h);
      ctx.closePath();
      ctx.fill();
    });

    // slow dust motes in the gold light
    ctx.fillStyle = '#ffeeb8';
    for (let i = 0; i < 34; i++) {
      const x = (((rnd(i, 3) * w - cx0 * 0.45 + Math.sin(tt * 0.6 + i) * 10) % w) + w) % w;
      const y = (((rnd(i, 5) * h - tt * (6 + rnd(i, 4) * 10)) % h) + h) % h;
      ctx.globalAlpha = Math.min(0.4, 0.15 + 0.25 * rnd(i, 6) * (0.6 + 0.4 * Math.sin(tt * 2 + i)));
      ctx.beginPath(); ctx.arc(x, y, 0.9 + rnd(i, 7) * 1.3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // Methods never throw into the game loop.
  const safe = (fn) => (...args) => { try { fn(...args); } catch (e) { /* draw nothing */ } };
  window.ENV_THEMES.clockface = { background: safe(background), tile: safe(tile), foreground: safe(foreground) };
})();

/* js/audio/audio.js */
/* AUDIO: everything is synthesised with WebAudio (no files). Contract: DESIGN.md section 7.

(function () {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;

  let track = null, trackName = null, schedTimer = null, nextT = 0, stepIdx = 0, voices = 0;

  const seq = (s) => s.trim().split(/\s+/);

  /* Each track is a 16-step loop: lead (note or -), bass (note or -), perc (x = hat, k = kick, . = none). */
  const TRACKS = {
    title:       { bpm: 68,  lead: seq('E4 - G4 - B4 - - A4 G4 - E4 - - D4 - B3 - -'), bass: seq('E2 - - - E2 - - - B1 - - - B1 - - -'), perc: seq('. . . . . . . . . . . . . . . .'), wave: 'triangle' },
    ch1:         { bpm: 84,  lead: seq('A4 - C5 - E5 - D5 - C5 - A4 - G4 - - -'), bass: seq('A2 - A2 - F2 - G2 - A2 - - E2 -'), perc: seq('x - - - x - - - x - x - x - - -'), wave: 'triangle' },
    ch2:         { bpm: 100, lead: seq('C5 - - E5 - G5 - E5 - D5 - - F5 - D5 - -'), bass: seq('C3 - G2 - F2 - G2 - C3 - - - - - - - - - -'), perc: seq('. . . . . . . . . . . . . . . .'), wave: 'sine' },
    ch3:         { bpm: 112, lead: seq('D4 - F4 - A4 - - D4 - F4 - G4 - - A4 -'), bass: seq('D2 D2 - D2 A1 A1 - A1 D2 D2 - D2 A1 A1 - A1'), perc: seq('x - x - x - x - x - x x x - x -'), wave: 'square' },
    ch4:         { bpm: 88,  lead: seq('F4 - - G#4 F4 - - D4 - - C4 - - D4 - - -'), bass: seq('F2 - F2 - C2 - C2 - F2 - F2 - D2 - G2 -'), perc: seq('x - - - - - x - x - - - x - - -'), wave: 'triangle' },
    ch5:         { bpm: 96,  lead: seq('C5 - E5 G5 - E5 - F5 - - E5 - C5 - - -'), bass: seq('C3 - C3 - A2 - A2 - F2 - F2 - G2 - G2 -'), perc: seq('x - x - x - x - x x x - x - x - x -'), wave: 'triangle' },
    boss:        { bpm: 150, lead: seq('A4 A4 C5 - A4 - E4 - G#4 - A4 - C5 - D5 - - -'), bass: seq('A2 A2 A2 A2 A2 A2 A2 A2 F2 F2 F2 F2 G2 G2 G2 G2'), perc: seq('k - x - k - x - k - x - k - x - k x'), wave: 'sawtooth' },
    ending_good: { bpm: 76, lead: seq('C5 - E5 - G5 - C6 - B5 - G5 - E5 - C5 - - -'), bass: seq('C3 - - - G2 - - - A2 - - - F2 - - -'), perc: seq('. . . . . . . . . . . . . . . .'), wave: 'triangle' },
    ending_bad:  { bpm: 60, lead: seq('E4 - - - D#4 - - - D4 - - - - C4 - - -'), bass: seq('E2 - - - - - - - D2 - - - - - - -'), perc: seq('. . . . . . . . . . . . . . . .'), wave: 'sine' },

  // A track may come from TRACKS or from an override file (window.AUDIO_TRACKS); patterns may be strings or arrays.
  function normalizeTrack(name) {

  /* ---------- music ---------- */
  function playStep(tr, i, when) {

    const bassN = tr.bass[i % tr.bass.length];

        g.gain.setValueAtTime(0.7, when);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);

  }

    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

/* js/game.js */
/* L'HEURE FIGÉE — moteur : physique, combats, IA, boss, dialogues, menus, fins.

(function () {

  const ITALIC = 'italic 22px Georgia, "Times New Roman", serif';
  const NAMES = {
    leo: 'Leo', juliette: 'Juliette', elias: 'Elias', mireille: 'Mireille Crow', gaspard: 'Gaspard',
    regent: 'The Regent', pivert: 'Mrs. Pivert', hugo: 'Old Hugo', bastien: 'Bastien', tomas: 'Tomas',
  };
  const ABILITY_TEXT = {
    dash: 'Glide (Shift / K)',
    pendule: 'Pendulum (hold C / L)',
    ressort: 'Spring (jump in midair)',
  };
  const CONTROLS = [
    ['Move', '← →  or  Q  D'],
    ['Jump (double jump with the Spring)', 'Space  ·  ↑  ·  Z'],
    ['Drop through a platform', '↓ then Jump'],
    ['Attack with the Dawn Wrench', 'X  ·  J'],
    ['Glide (chapter II)', 'Shift  ·  K'],
    ['Pendulum: slow time (chapter III)', 'hold C  ·  L'],
    ['Talk to people', 'E  ·  Enter'],

  const canvas = document.getElementById('game');

  /* ---------- utilitaires ---------- */

  function sfx(n) { try { if (window.AUDIO) AUDIO.sfx(n); } catch (e) { /* audio facultatif */ } }
  let wantMusic = null;
  function music(n) { wantMusic = n; try { if (window.AUDIO) AUDIO.music(n); } catch (e) { /* idem */ } }
  function drawActorAt(id, x, y, pose) {
    if (!window.ART) return;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

  }

  /* ---------- entrées clavier ---------- */
  const KEYS = {
    left: ['ArrowLeft', 'KeyQ', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyZ', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'ArrowUp', 'KeyZ', 'KeyW'],
    attack: ['KeyX', 'KeyJ'],
    dash: ['ShiftLeft', 'ShiftRight', 'KeyK'],
    slow: ['KeyC', 'KeyL'],
    ok: ['Enter', 'Space', 'KeyE'],
    talk: ['KeyE', 'Enter'],
    pause: ['Escape', 'KeyP'],
  };
  const held = new Set(), hitSet = new Set();
  const on = (a) => KEYS[a].some((k) => held.has(k));
  const hit = (a) => KEYS[a].some((k) => hitSet.has(k));
  let unlocked = false;
  function unlockAudio() {

  }
  window.addEventListener('keydown', (e) => {
    const used = Object.values(KEYS).some((list) => list.includes(e.code));
    if (used) e.preventDefault();
    if (!e.repeat) hitSet.add(e.code);
    held.add(e.code);
    unlockAudio();
  });
  window.addEventListener('keyup', (e) => held.delete(e.code));
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('blur', () => held.clear());

  /* ---------- état global ---------- */
  let mode = 'title', time = 0;
  let titleSel = 0, pauseSel = 0, controlsBack = 'title';
  let ch = null, grid = [], rows = 0, cols = 0, gateCol = -1, gateClosed = false;
  let world = null, player = null;
  const cam = { x: 0, y: 0 };
  let particles = [], toasts = [];
  let shakeA = 0, flashT = 0, hitstop = 0;
  let slowGauge = 1, slowing = false;
  let transition = null, card = null, dlg = null, endKey = null, endCard = null, credits = null;
  let themeOverride = null;
  let debugSession = false;   // set by LHF.start: progress is then kept in memory only, never saved
  const story = { chapterId: 'ch1', unlocks: new Set(), flags: new Set(), progress: {} };

  function newStory() {
    story.chapterId = 'ch1';
    story.unlocks = new Set();
    story.flags = new Set();
    story.progress = {};
  }
  function progressOf(id) {
    if (!story.progress[id]) {
      story.progress[id] = { taken: new Set(), scenesDone: new Set(), npcTalked: new Set(), bossDead: false, checkpoint: null, gears: 0 };
    }
    return story.progress[id];
  }

  /* ---------- sauvegarde (localStorage, facultatif) ---------- */
  function saveGame() {
    if (debugSession) return;   // a debug start must not overwrite the real save
    try {
      const progress = {};
      for (const [id, p] of Object.entries(story.progress)) {
        progress[id] = {
          taken: [...p.taken], scenesDone: [...p.scenesDone], npcTalked: [...p.npcTalked],
          bossDead: p.bossDead, checkpoint: p.checkpoint, gears: p.gears,
        };
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        chapterId: story.chapterId, unlocks: [...story.unlocks], flags: [...story.flags], progress,
      }));
    } catch (e) { /* stockage indisponible : on joue sans sauvegarde */ }
  }
  // Lit et valide la sauvegarde sans rien modifier ; renvoie null si elle est inutilisable.
  function readSave() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!d || typeof d !== 'object') return null;
      const chapterId = d.chapterId || 'ch1';
      if (!CHAPTERS.get(chapterId)) return null;
      const progress = {};
      for (const [id, p] of Object.entries(d.progress || {})) {
        if (!p || typeof p !== 'object') return null;
        progress[id] = {
          taken: new Set(p.taken || []), scenesDone: new Set(p.scenesDone || []), npcTalked: new Set(p.npcTalked || []),
          bossDead: !!p.bossDead, checkpoint: p.checkpoint || null, gears: p.gears || 0,
        };
      }
      return { chapterId, unlocks: new Set(d.unlocks || []), flags: new Set(d.flags || []), progress };
    } catch (e) { return null; }
  }
  function loadGame() {
    const s = readSave();
    if (!s) return false;
    story.chapterId = s.chapterId;
    story.unlocks = s.unlocks;
    story.flags = s.flags;
    story.progress = s.progress;
    return true;
  }
  function hasSave() {
    return !!readSave();
  }
  function eraseSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* rien à effacer */ }
  }

  /* ---------- construction du monde ---------- */
  function buildWorld(id) {
    ch = CHAPTERS.get(id);
    if (!ch) throw new Error('Chapitre introuvable : ' + id);
    const pr = progressOf(id);
    grid = ch.map.map((row) => row.split(''));
    rows = grid.length;
    cols = grid[0].length;
    gateCol = -1;
    gateClosed = false;
    world = { start: null, bossSpawn: null, boss: null, enemies: [], npcs: [], gearsTotal: 0 };
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const k = grid[r][c], key = c + ',' + r;
        const cx = c * TS + TS / 2, bottom = (r + 1) * TS;
        if (k === 'o') { world.gearsTotal++; if (pr.taken.has(key)) grid[r][c] = '.'; }
        else if (k === 'h') { if (pr.taken.has(key)) grid[r][c] = '.'; }
        else if (k === 'B') { if (gateCol < 0) gateCol = c; if (pr.bossDead) grid[r][c] = '.'; }
        else if (k === 'S') { world.start = { x: cx, y: bottom }; grid[r][c] = '.'; }
        else if (k === 'R') { world.bossSpawn = { x: cx, y: bottom }; grid[r][c] = '.'; }
        else if (k === 'r') { world.enemies.push(makeEnemy('rouage', cx, bottom)); grid[r][c] = '.'; }
        else if (k === 'f') { world.enemies.push(makeEnemy('fige', cx, bottom)); grid[r][c] = '.'; }
        else if (k === 's') { world.enemies.push(makeEnemy('sablier', cx, r * TS + TS / 2 + 14)); grid[r][c] = '.'; }
        else if (k >= '1' && k <= '9') { world.npcs.push(makeNpc(k, cx, bottom)); grid[r][c] = '.'; }
      }
    }
    if (!world.start) world.start = { x: 3 * TS + 16, y: (rows - 2) * TS };
    if (world.bossSpawn && !pr.bossDead) {
      world.boss = makeBoss(world.bossSpawn);
      // a fresh Regent starts in phase 1, so its phase lines play again on this attempt
      pr.scenesDone.delete('boss_phase2'); pr.scenesDone.delete('boss_phase3');
    }
  }

  function makeEnemy(kind, x, y) {
    const e = {
      kind, x, y, vx: 0, vy: 0, facing: -1, dir: -1, state: 'idle', st: 0, cd: rnd(0.3, 1.0),
      hp: kind === 'fige' ? 3 : kind === 'rouage' ? 2 : 1, dead: false, deadT: 0, hurtT: 0, inv: 0,
      homeX: x, homeY: y, gone: false, chasing: false,
    };
    if (kind === 'rouage') { e.w = 26; e.h = 18; e.gravity = true; }
    else if (kind === 'fige') { e.w = 26; e.h = 48; e.gravity = true; }
    else { e.w = 26; e.h = 34; e.gravity = false; }
    return e;
  }
  function makeNpc(marker, x, y) {
    const data = (ch.npcs && ch.npcs[marker]) || null;
    return { marker, who: data && data.who ? data.who : 'narrator', x, y, data, facing: -1, talking: false };
  }
  function makeBoss(pt) {
    return {
      id: 'regent', x: pt.x, y: pt.y, w: 60, h: 100, vx: 0, vy: 0, facing: -1,
      hp: 18, phase: 1, state: 'idle', st: 0, dur: 0.8, next: null, summonCd: 0,
      inv: 0, hurtT: 0, active: false, dead: false, defeatHandled: false, hitDone: false, summoned: false,
    };
  }

  /* ---------- collisions tuiles ---------- */
  function solid(c, r) {
    if (c < 0 || c >= cols) return true;
    if (r < 0 || r >= rows) return false;
    const k = grid[r][c];
    return k === '#' || (k === 'B' && gateClosed);
  }
  function plat(c, r) {
    return c >= 0 && c < cols && r >= 0 && r < rows && grid[r][c] === '=';
  }
  // Déplace un corps (x,y = centre des pieds, w,h) avec collisions. Renvoie {landed, hitWall}.
  function moveBody(b, dt, ignorePlat) {
    const hw = b.w / 2, h = b.h;
    let landed = false, hitWall = 0;
    // axe X
    b.x += b.vx * dt;
    const top = b.y - h + 2, bot = b.y - 2;
    const r0 = Math.floor(top / TS), r1 = Math.floor(bot / TS);
    if (b.vx > 0) {
      const c = Math.floor((b.x + hw) / TS);
      for (let r = r0; r <= r1; r++) if (solid(c, r)) { b.x = c * TS - hw; b.vx = 0; hitWall = 1; break; }
    } else if (b.vx < 0) {
      const c = Math.floor((b.x - hw) / TS);
      for (let r = r0; r <= r1; r++) if (solid(c, r)) { b.x = (c + 1) * TS + hw; b.vx = 0; hitWall = -1; break; }
    }
    // axe Y
    const prevBot = b.y;
    b.y += b.vy * dt;
    const cl = Math.floor((b.x - hw + 1) / TS), cr = Math.floor((b.x + hw - 1) / TS);
    if (b.vy >= 0) {
      const rA = Math.floor(prevBot / TS), rB = Math.floor(b.y / TS);
      outer: for (let r = rA; r <= rB; r++) {
        const edge = r * TS;
        if (prevBot > edge + 0.5 || b.y < edge) continue;
        for (let c = cl; c <= cr; c++) {
          if (solid(c, r) || (!ignorePlat && plat(c, r))) { b.y = edge; b.vy = 0; landed = true; break outer; }
        }
      }
    } else {
      const prevTop = prevBot - h, newTop = b.y - h;
      const rA = Math.floor(newTop / TS), rB = Math.floor(prevTop / TS);
      outer2: for (let r = rA; r <= rB; r++) {
        const under = (r + 1) * TS;
        if (prevTop < under - 0.5 || newTop > under) continue;
        for (let c = cl; c <= cr; c++) {
          if (solid(c, r)) { b.y = under + h; b.vy = 0; break outer2; }
        }
      }
    }
    b.onGround = landed;
    return { landed, hitWall };
  }
  function touchesTile(box, chars) {
    const c0 = Math.floor(box.x / TS), c1 = Math.floor((box.x + box.w - 1) / TS);
    const r0 = Math.floor(box.y / TS), r1 = Math.floor((box.y + box.h - 1) / TS);
    for (let r = Math.max(0, r0); r <= Math.min(rows - 1, r1); r++) {
      for (let c = Math.max(0, c0); c <= Math.min(cols - 1, c1); c++) {
        if (chars.includes(grid[r][c])) return true;
      }
