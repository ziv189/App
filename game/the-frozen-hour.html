  <script>
/* js/art/chars/gaspard.js */
/* Gaspard: brass automaton, nanny and butler built by Elias. Faces right; origin (0,0) = centre of the feet.
   Loaded after humanoid.js, so this registration replaces the generic gaspard rig. Contract: DESIGN.md section 5. */
(function () {
  'use strict';

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const clamp01 = (v) => ART.clamp(v, 0, 1);
  const lerp = ART.lerp;
  const ease = (x) => {
    const k = clamp01(x);
    return k * k * (3 - 2 * k);
  };

  const STATES = ['idle', 'walk', 'run', 'jump', 'fall', 'land', 'attack', 'dash', 'hurt', 'dead', 'talk', 'slow', 'frozen'];

  const BASE = {
    brass: '#c9963f', brassD: '#8a6428', brassL: '#ecc878', brassX: '#4a3418',
    coat: '#1f3d34', coatL: '#2f5c4d', coatD: '#122820',
    collar: '#f4efe6', trouser: '#17261f', boot: '#3a2818',
    glass: '#6fd3ff', bronze: '#8c6a3a', visor: '#231a1e', steam: '#eef3f5'
  };

  const COAT = [[-11, -37], [-6, -40.5], [0, -40], [6, -40.5], [11, -37], [11.5, -31], [9.5, -25], [10.5, -20],
    [-10.5, -20], [-9.5, -25], [-11.5, -31]];

  /* ---------- colour helpers ---------- */

  function rgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    const n = m ? parseInt(m[1], 16) : 0x808080;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function desat(hex, amt) {
    const c = rgb(hex);
    const l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
    return '#' + c.map((v) => Math.round(v + (l - v) * amt).toString(16).padStart(2, '0')).join('');
  }

  function palette(frozen) {
    const out = {};
    Object.keys(BASE).forEach((k) => { out[k] = frozen ? desat(BASE[k], 0.8) : BASE[k]; });
    return out;
  }

  /* ---------- pose ---------- */

  // Blink as a short triangle every 4.4 s; 0 = open, 1 = shut.
  function blinkAt(t) {
    const k = ((t % 4.4) + 4.4) % 4.4;
    if (k > 0.16) return 0;
    return k < 0.08 ? k / 0.08 : (0.16 - k) / 0.08;
  }

  // Striking-arm angle over the attack: anticipation back, strike forward, recovery.
  function swing(T) {
    if (T < 0.12) return lerp(0.08, -1.1, ease(T / 0.12));
    if (T < 0.24) return lerp(-1.1, 1.3, ease((T - 0.12) / 0.12));
    return lerp(1.3, 0.08, ease((T - 0.24) / 0.3));
  }

  // Heavy alternating gait. Arms swing opposite to the leg on their own side.
  function gait(P, ph, o) {
    const s = Math.sin(ph), c = Math.cos(ph);
    P.legs = [
      { a: o.amp * s, bend: o.bend * Math.max(0, c), lift: o.lift * Math.max(0, c) },
      { a: -o.amp * s, bend: o.bend * Math.max(0, -c), lift: o.lift * Math.max(0, -c) }
    ];
    P.armB = -o.arm * s;
    P.armF = o.arm * s;
    P.bendB = 0.2;
    P.bendF = 0.25;
    P.dy = o.dy * Math.abs(s);
    P.tail = 0.1 * s;
  }

  function pose(p) {
    const st = STATES.indexOf(p.state) >= 0 ? p.state : 'idle';
    const T = Math.max(0, num(p.t, 0));
    const time = num(p.time, 0);
    const k = st === 'slow' ? 0.35 : 1;          // Pendule: everything runs at a third speed
    const br = Math.sin(time * 1.7 * k);         // breathing
    const P = {
      st, time, T, jet: false, dy: 0, lean: 0, tilt: 0, tail: 0, rot: 0, alpha: 1,
      legs: [{ a: 0, bend: 0.04, lift: 0 }, { a: 0, bend: 0.04, lift: 0 }],
      armB: 0.06, bendB: 0.1, armF: 0.06, bendF: 0.1,
      gear: 1, glow: 0.8, blink: blinkAt(time), mouth: 0.12, steam: 0.7,
      sparks: 0, trail: null, frozen: false, ring: false
    };
    switch (st) {
      case 'walk':
        gait(P, time * 5, { amp: 0.42, bend: 0.55, lift: 3, arm: 0.32, dy: 1.2 });
        P.lean = 0.05; P.steam = 0.8;
        break;
      case 'run':
        gait(P, time * 9, { amp: 0.6, bend: 0.9, lift: 4, arm: 0.55, dy: 2.2 });
        P.lean = 0.14; P.gear = 2.2; P.steam = 1.6;
        break;
      case 'jump':
        P.legs = [{ a: -0.25, bend: 0.1, lift: 0 }, { a: 0.4, bend: 1.0, lift: 0 }];
        P.armB = -1.5; P.armF = 1.9; P.bendB = 0.2; P.bendF = 0.2;
        P.lean = 0.04; P.tail = 0.35; P.gear = 1.6;
        break;
      case 'fall':
        P.legs = [{ a: -0.3, bend: 0.2, lift: 0 }, { a: 0.3, bend: 0.2, lift: 0 }];
        P.armB = -1.4; P.armF = 1.4; P.bendB = 0.1; P.bendF = 0.1;
        P.lean = -0.06; P.tail = -0.25; P.gear = 2; P.steam = 1.2;
        break;
      case 'land': {
        const e = clamp01(1 - T / 0.28);
        P.dy = 4.5 * e;
        P.legs = [{ a: 0.15, bend: 0.1 + 0.9 * e, lift: 0 }, { a: -0.15, bend: 0.1 + 0.9 * e, lift: 0 }];
        P.armB = -0.5 * e; P.armF = 0.5 * e; P.lean = 0.12 * e; P.steam = 1.5 + 2 * e;
        break;
      }
      case 'attack':
        P.legs = [{ a: -0.2, bend: 0.05, lift: 0 }, { a: 0.25, bend: 0.25, lift: 0 }];
        P.armF = swing(T); P.bendF = 0.3; P.armB = -0.25; P.bendB = 0.2;
        P.lean = T > 0.12 && T < 0.3 ? 0.16 : 0.03; P.gear = 2.5; P.steam = 1.2;
        if (T >= 0.12 && T < 0.42) {
          P.trail = { from: swing(Math.max(0, T - 0.08)), to: swing(T), a: 1 - (T - 0.12) / 0.3 };
        }
        break;
      case 'dash':
        P.legs = [{ a: 0.5, bend: 0.7, lift: 0 }, { a: -0.5, bend: 0.5, lift: 0 }];
        P.armB = -1.1; P.bendB = 0.25; P.armF = -0.5; P.bendF = 0.5;
        P.lean = 0.3; P.dy = 0.5; P.tail = 0.7; P.gear = 3; P.steam = 3.2; P.jet = true;
        break;
      case 'hurt': {
        const e = clamp01(1 - T / 0.5);
        P.lean = -0.22 * e; P.tilt = -0.3 * e; P.armB = -0.9 * e; P.armF = 0.9 * e; P.bendF = 0.3 * e;
        P.sparks = e; P.glow = 0.35 + 0.65 * Math.abs(Math.sin(time * 30)); P.steam = 1 + 2 * e;
        break;
      }
      case 'dead': {
        const f = clamp01(T / 0.7);
        P.rot = -1.45 * (1 - (1 - f) * (1 - f));        // topples backwards about the feet
        P.alpha = 1 - clamp01((T - 0.8) / 0.9);
        P.legs = [{ a: 0.25, bend: 0.2, lift: 0 }, { a: -0.35, bend: 0.1, lift: 0 }];
        P.armB = -0.3; P.armF = 0.9; P.bendF = 0.4;
        P.glow = 0.3 * clamp01(1 - T); P.gear = 0; P.steam = T < 0.5 ? 2.5 : 0;
        break;
      }
      case 'talk':
        P.dy = 0.5 + 0.5 * br; P.lean = 0.02; P.tilt = 0.05 * Math.sin(time * 2.2);
        P.armF = 0.3 + 0.07 * Math.sin(time * 4); P.bendF = 2.1 + 0.15 * Math.sin(time * 4);
        P.mouth = clamp01(0.5 + 0.5 * Math.sin(time * 15)); P.glow = 0.9;
        break;
      case 'frozen':
        P.frozen = true; P.gear = 0; P.steam = 0; P.glow = 0.45; P.blink = 0;
        break;
      default: {
        // idle, slow (Pendule) and unknown states
        const moving = st === 'slow' && Math.abs(num(p.vx, 0)) > 8;
        if (moving) {
          gait(P, time * 5 * k, { amp: 0.42, bend: 0.55, lift: 3, arm: 0.32, dy: 1.2 });
          P.lean = 0.05;
        } else {
          P.dy = 0.5 + 0.5 * br;
          P.armB = 0.06 - 0.02 * br;
          P.armF = 0.06 + 0.02 * br;
        }
        P.glow = 0.8 + 0.15 * Math.sin(time * 2 * k);
      }
    }
    if (st === 'slow') { P.ring = true; P.gear = 0.35; P.steam = 0.3; }
    return P;
  }

  /* ---------- drawing ---------- */

  function ringAt(ctx, time) {
    ctx.save();
    ctx.strokeStyle = 'rgba(111,211,255,0.6)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([3, 4]);
    ctx.lineDashOffset = -time * 4;
    ctx.beginPath();
    ctx.ellipse(0, 0.5, 19, 5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Hip pivot for the upper body: bob, lean forward or back.
  function lean(ctx, P) {
    ctx.translate(0, P.dy);
    ctx.translate(0, -28);
    ctx.rotate(P.lean);
    ctx.translate(0, 28);
  }

  function drawLeg(ctx, hx, hy, L, c, far) {
    const kx = hx + Math.sin(L.a) * 12, ky = hy + Math.cos(L.a) * 12;
    const a2 = L.a - L.bend;
    const ax = kx + Math.sin(a2) * 11.5, ay = ky + Math.cos(a2) * 11.5 - L.lift;
    ART.limb(ctx, hx, hy, kx, ky, 7.4, far ? ART.shade(c.trouser, -0.2) : c.trouser, { lw: 1.6 });
    ART.limb(ctx, kx, ky, ax, ay, 4.6, far ? c.brassD : c.brass, { lw: 1.4 });
    ART.ell(ctx, kx, ky, 2.4, 2.4, c.brassL, { lw: 1.1 });
    ART.ell(ctx, ax + 1.6, ay + 2, 5.2, 2.2, c.boot, { lw: 1.6 });
  }

  function drawTails(ctx, P, c) {
    ctx.translate(-4, -22); ctx.rotate(P.tail); ctx.translate(4, 22);
    ART.poly(ctx, [[-14, -23], [2, -23], [3, -13], [0, -5], [-5, -2.5], [-12.5, -7], [-15, -15]], c.coatD, { lw: 1.8 });
    ART.poly(ctx, [[-9, -22], [-1.5, -22], [-1, -13], [-4, -7.5], [-8.5, -10], [-10, -16]], c.coat, { lw: 1.2 });
  }

  function drawArm(ctx, sx, sy, aa, bend, c, far) {
    const ex = sx + Math.sin(aa) * 11, ey = sy + Math.cos(aa) * 11;
    const a2 = aa + bend;
    const wx = ex + Math.sin(a2) * 10, wy = ey + Math.cos(a2) * 10;
    ART.limb(ctx, sx, sy, ex, ey, 7.4, far ? ART.shade(c.coat, -0.15) : c.coat, { lw: 1.6 });
    ART.limb(ctx, ex, ey, wx, wy, 4.4, far ? c.brassD : c.brass, { lw: 1.4 });
    ART.limb(ctx, wx - Math.sin(a2) * 1.5, wy - Math.cos(a2) * 1.5, wx, wy, 5.6, c.collar, { lw: 1 });
    ART.ell(ctx, wx + Math.sin(a2) * 2.4, wy + Math.cos(a2) * 2.4, 2.6, 2.6, c.brassL, { lw: 1.2 });
  }

  function drawChest(ctx, P, c) {
    const g = P.time * P.gear;
    ART.ell(ctx, 0, -31, 5.6, 5.6, c.brassD, { lw: 1.6 });
    ART.ell(ctx, 0, -31, 4.4, 4.4, '#1a120c', { stroke: false });
    ART.gear(ctx, -1.2, -31.4, 3, 8, g * 1.2, c.brassL, { lw: 1 });
    ART.gear(ctx, 2.2, -29.8, 1.9, 6, -g * 1.6 + 0.3, c.brass, { lw: 0.9 });
  }

  function drawUpper(ctx, P, c) {
    drawArm(ctx, -8, -37, P.armB, P.bendB, c, true);
    ART.poly(ctx, COAT, c.coat, { lw: 2 });
    ART.poly(ctx, [[-2.6, -38.5], [2.6, -38.5], [3.2, -21], [-3.2, -21]], c.collar, { lw: 1.2 });
    ART.poly(ctx, [[-7, -40.2], [-2.2, -38], [-3.4, -21], [-8.8, -25]], c.coatL, { lw: 1.2 });
    ART.poly(ctx, [[7, -40.2], [2.2, -38], [3.4, -21], [8.8, -25]], c.coatL, { lw: 1.2 });
    ART.rr(ctx, -9.6, -27.6, 19.2, 2.6, 1, c.brassD, { lw: 1 });
    drawChest(ctx, P, c);
    [[-8, -34], [-8, -22], [8, -34], [8, -22]].forEach((b) => ART.ell(ctx, b[0], b[1], 1.3, 1.3, c.brassL, { lw: 0.9 }));
    ART.limb(ctx, 0, -43, 0, -37, 5.6, c.brassD, { lw: 1.4 });
    ART.poly(ctx, [[-6.8, -42.5], [6.8, -42.5], [7.8, -37], [0, -34.6], [-7.8, -37]], c.collar, { lw: 1.4 });
    ctx.save();
    ctx.translate(0, -42); ctx.rotate(P.tilt); ctx.translate(0, 42);
    drawHead(ctx, P, c);
    ctx.restore();
    drawArm(ctx, 8, -37, P.armF, P.bendF, c, false);
    if (P.trail) drawTrail(ctx, P.trail);
    if (P.sparks > 0.01) drawSparks(ctx, P, c);
    drawSteam(ctx, P, c);
  }

  function drawHead(ctx, P, c) {
    ART.ell(ctx, -8, -52, 1.9, 3.1, c.brassD, { lw: 1.1 });
    ART.ell(ctx, 1, -53, 9, 10.5, c.brass, { lw: 2 });
    ctx.save();
    ctx.globalAlpha *= 0.4;
    ctx.fillStyle = '#fff3c8';
    ctx.beginPath();
    ctx.ellipse(-3.2, -59, 3.4, 1.8, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ART.rr(ctx, -5, -57, 12, 9, 3.5, c.visor, { lw: 1.4 });
    glassEye(ctx, 3.8, -53, 2.5, P.glow, P.blink, c);
    dialEye(ctx, -2.2, -53, 2.1, P.time * P.gear, c);
    // grille mouth of small slats, opening while talking
    const h = 3 + 1.4 * P.mouth;
    ART.rr(ctx, -1, -47.5, 9.5, h, 1.2, c.brassX, { lw: 1 });
    ctx.save();
    ctx.strokeStyle = c.brassL;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const x = 0.6 + i * 2.4;
      ctx.moveTo(x, -46.5);
      ctx.lineTo(x, -47.5 + h - 1);
    }
    ctx.stroke();
    ctx.restore();
  }

  // The lit cyan lens: halo, disc (squashed by blink), small highlight.
  function glassEye(ctx, x, y, r, glow, blink, c) {
    const g = clamp01(glow);
    ctx.save();
    const grad = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.8);
    grad.addColorStop(0, 'rgba(111,211,255,' + (0.6 * g).toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(111,211,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ART.ell(ctx, x, y, r, Math.max(0.5, r * (1 - clamp01(blink))), ART.shade(c.glass, -0.05 + 0.3 * g), { lw: 1.1 });
    if (blink < 0.6) ART.ell(ctx, x - r * 0.35, y - r * 0.35, r * 0.26, r * 0.2, '#ffffff', { stroke: false, alpha: 0.85 });
  }

  // The dim bronze dial with a slowly turning needle.
  function dialEye(ctx, x, y, r, t, c) {
    ART.ell(ctx, x, y, r, r, ART.shade(c.bronze, -0.2), { lw: 1.1 });
    const a = t * 0.4 + 0.8;
    ctx.save();
    ctx.strokeStyle = c.brassX;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r * 0.65, y + Math.sin(a) * r * 0.65);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail(ctx, tr) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,240,200,' + (0.75 * clamp01(tr.a)).toFixed(3) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const a = lerp(tr.from, tr.to, i / 8);
      const x = 8 + Math.sin(a) * 21, y = -37 + Math.cos(a) * 21;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSparks(ctx, P, c) {
    for (let i = 0; i < 3; i++) {
      const ang = 0.6 + i * 1.1;
      const d = 6 + P.T * 26;
      ART.ell(ctx, Math.cos(ang) * d * 0.6 + 1, -30 + Math.sin(ang) * d * 0.6, 1.4, 1.4, c.brassL,
        { stroke: false, alpha: clamp01(P.sparks) });
    }
  }

  // Three puffs rising from the back of the neck (wider and longer when dashing).
  function drawSteam(ctx, P, c) {
    if (P.steam <= 0.02) return;
    const a0 = Math.min(0.6, 0.5 * P.steam);
    for (let i = 0; i < 3; i++) {
      const u = ((P.time * 0.5 + i / 3) % 1 + 1) % 1;
      const r = 1.6 + u * (2.8 + (P.jet ? 1.2 : 0));
      const x = -4 + Math.sin(u * 5 + i) * 1.5 - u * (P.jet ? 14 : 4);
      const y = -46 - u * 22;
      ART.ell(ctx, x, y, r, r * 0.9, c.steam, { stroke: false, alpha: a0 * (1 - u) });
    }
  }

  function draw(ctx, p) {
    const P = pose(p || {});
    const c = palette(P.frozen);
    ctx.save();
    if (P.alpha < 1) ctx.globalAlpha *= Math.max(0, P.alpha);
    if (P.rot) ctx.rotate(P.rot);
    if (P.ring) ringAt(ctx, P.time);
    if (!P.rot) ART.ell(ctx, 0, 0.5, 13, 2.6, '#000000', { stroke: false, alpha: 0.2 });
    drawLeg(ctx, -4, -28, P.legs[0], c, true);
    ctx.save(); lean(ctx, P); drawTails(ctx, P, c); ctx.restore();
    drawLeg(ctx, 3, -28, P.legs[1], c, false);
    ctx.save(); lean(ctx, P); drawUpper(ctx, P, c); ctx.restore();
    ctx.restore();
  }

  /* ---------- portrait (200 x 200 box centred on 0,0) ---------- */

  const EXPR = {
    neutral:   { bo: -62, bi: -62, arch: 0,  ci: 0,    co: 0,    r: 1,    glow: 0.8,  mb: 0,  mh: 11, mode: 'bar' },
    happy:     { bo: -66, bi: -66, arch: 5,  ci: 0.12, co: 0.12, r: 1,    glow: 0.95, mb: -7, mh: 10, mode: 'bar' },
    sad:       { bo: -62, bi: -74, arch: 0,  ci: 0.16, co: 0.36, r: 0.95, glow: 0.55, mb: 6,  mh: 9,  mode: 'bar' },
    angry:     { bo: -72, bi: -54, arch: 0,  ci: 0.46, co: 0.2,  r: 1,    glow: 1,    mb: 1,  mh: 6,  mode: 'bar' },
    surprised: { bo: -78, bi: -78, arch: 8,  ci: 0,    co: 0,    r: 1.2,  glow: 1,    mb: 0,  mh: 0,  mode: 'o' },
    worried:   { bo: -64, bi: -76, arch: -2, ci: 0.06, co: 0.28, r: 1,    glow: 0.6,  mb: 3,  mh: 10, mode: 'bar' }
  };

  // Eyelid: a visor-coloured cover over the top of an eye. cIn/cOut = how far it covers at inner/outer corner.
  function lid(ctx, cx, cy, r, cIn, cOut, innerLeft, bl) {
    const ci = clamp01(Math.max(cIn, bl)), co = clamp01(Math.max(cOut, bl));
    if (ci <= 0 && co <= 0) return;
    const yIn = cy - r + 2 * r * ci, yOut = cy - r + 2 * r * co;
    const yL = innerLeft ? yIn : yOut, yR = innerLeft ? yOut : yIn;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - r - 5, cy - r - 6);
    ctx.lineTo(cx + r + 5, cy - r - 6);
    ctx.lineTo(cx + r + 5, yR);
    ctx.lineTo(cx - r - 5, yL);
    ctx.closePath();
    ctx.fillStyle = BASE.visor;
    ctx.fill();
    ctx.strokeStyle = ART.OUT;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - r - 5, yL);
    ctx.lineTo(cx + r + 5, yR);
    ctx.stroke();
    ctx.restore();
  }

  function portrait(ctx, expr, t) {
    const e = EXPR[expr] || EXPR.neutral;
    const tt = num(t, 0);
    const bl = blinkAt(tt);
    const c = BASE;

    const bg = ctx.createRadialGradient(0, -10, 10, 0, -10, 120);
    bg.addColorStop(0, 'rgba(236,200,120,0.3)');
    bg.addColorStop(1, 'rgba(236,200,120,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(-100, -100, 200, 200);

    for (let i = 0; i < 3; i++) {
      const u = ((tt * 0.4 + i / 3) % 1 + 1) % 1;
      ART.ell(ctx, -12 - u * 28 + Math.sin(u * 5 + i) * 4, 36 - u * 80, 4 + u * 7, 3.5 + u * 6, c.steam,
        { stroke: false, alpha: 0.35 * (1 - u) });
    }

    // shoulders, collar, shirt front, chest window
    ART.poly(ctx, [[-98, 100], [-97, 64], [-72, 46], [-34, 40], [0, 42], [34, 40], [72, 46], [97, 64], [98, 100]], c.coat, { lw: 3 });
    ART.poly(ctx, [[-10, 58], [10, 58], [12, 100], [-12, 100]], c.collar, { lw: 2.4 });
    ART.poly(ctx, [[-24, 42], [24, 42], [12, 70], [0, 62], [-12, 70]], c.collar, { lw: 2.4 });
    ART.ell(ctx, 0, 84, 13, 13, c.brassD, { lw: 2.4 });
    ART.ell(ctx, 0, 84, 10.4, 10.4, '#1a120c', { stroke: false });
    ART.gear(ctx, -3, 83.5, 6.2, 9, tt * 0.9, c.brassL, { lw: 1.6 });
    ART.gear(ctx, 5.2, 81, 4.2, 7, -tt * 1.2, c.brass, { lw: 1.4 });
    [[-40, 76], [40, 76], [-40, 96], [40, 96]].forEach((b) => ART.ell(ctx, b[0], b[1], 3.2, 3.2, c.brassL, { lw: 1.6 }));

    // neck and oval brass head
    ART.rr(ctx, -15, 32, 30, 22, 6, c.brassD, { lw: 2.4 });
    ART.ell(ctx, 0, -24, 56, 62, c.brass, { lw: 3 });
    ctx.save();
    ctx.globalAlpha *= 0.4;
    ctx.fillStyle = '#fff3c8';
    ctx.beginPath();
    ctx.ellipse(-26, -62, 16, 8, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ART.ell(ctx, -48, -10, 3.2, 3.2, c.brassD, { lw: 1.4 });
    ART.ell(ctx, 48, -10, 3.2, 3.2, c.brassD, { lw: 1.4 });
    ART.rr(ctx, -50, -46, 100, 46, 16, c.visor, { lw: 2.4 });

    // brows
    ctx.save();
    ctx.strokeStyle = ART.OUT;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    [-1, 1].forEach((s) => {
      const ox = s * 44, ix = s * 14;
      ctx.beginPath();
      ctx.moveTo(ox, e.bo);
      ctx.quadraticCurveTo((ox + ix) / 2, (e.bo + e.bi) / 2 - e.arch, ix, e.bi);
      ctx.stroke();
    });
    ctx.restore();

    // eyes: cyan lens on the right, bronze dial on the left
    glassEye(ctx, 22, -24, 13 * e.r, e.glow, 0, c);
    lid(ctx, 22, -24, 13 * e.r, e.ci, e.co, true, bl);
    dialEye(ctx, -22, -24, 12 * e.r, tt * 0.5, c);
    lid(ctx, -22, -24, 12 * e.r, e.ci, e.co, false, bl);

    // grille mouth
    if (e.mode === 'o') {
      ART.ell(ctx, 0, 24, 13, 11, c.brassX, { lw: 2.6 });
      ctx.save();
      ctx.strokeStyle = c.brassL;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 24, 6.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else {
      const xs = [-26, -13, 0, 13, 26];
      const topY = (x) => 12 + e.mb * (x / 26) * (x / 26);
      const top = xs.map((x) => [x, topY(x)]);
      const bot = xs.slice().reverse().map((x) => [x, topY(x) + e.mh]);
      ART.poly(ctx, top.concat(bot), c.brassX, { lw: 2.6 });
      ctx.save();
      ctx.strokeStyle = c.brassL;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      [-18, -9, 0, 9, 18].forEach((x) => {
        ctx.moveTo(x, topY(x) + 2);
        ctx.lineTo(x, topY(x) + e.mh - 2);
      });
      ctx.stroke();
      ctx.restore();
    }
  }

  ART.register({
    id: 'gaspard', w: 34, h: 62,
    draw(ctx, p) { draw(ctx, p); },
    portrait(ctx, expr, t) { portrait(ctx, expr, t); }
  });
})();

</script>
  <script>
/* js/art/chars/regent.js */
/* The Regent (Aurelien Vantard), final boss of chapter 4. Art only, no game logic.
   Drawn facing right; origin (0,0) = centre of the feet; y negative is up. About 121 px tall.
   Loads after js/art/humanoid.js, so this registration replaces the generic boss rig for id 'regent'. */
(function () {
  const OUT = ART.OUT;
  const clamp = ART.clamp;
  const lerp = ART.lerp;

  const C = {
    coat: '#1a1a24', coatLift: '#2a2a36', lining: '#3d1f4f', liningLo: '#24102f',
    gold: '#d9b35a', goldHi: '#f6e1a0', goldLo: '#7d5e24',
    porcelain: '#efe9dc', crack: '#4a4048', ink: '#2a2230',
    skin: '#e6c3a5', hair: '#c9c4cc', hairLo: '#8f8a99', glove: '#f4f1ea',
    trouser: '#26263a', boot: '#0e0e12',
    sand: '#ffd27a', sandHi: '#fff3c4', sandLo: '#b5761f',
  };
  const STATES = ['intro', 'idle', 'walk', 'telegraph', 'slam', 'beam', 'charge', 'summon', 'hurt', 'dead'];
  const EXPRS = ['neutral', 'happy', 'sad', 'angry', 'surprised', 'worried'];
  const HIP = [2, -62];
  const HEAD = [3, -109];
  const SH_NEAR = [8, -91];
  const SH_FAR = [-9, -89];
  // Cracks on the mask (figure space). Phase 1 shows 2, phase 2 shows 5, phase 3 shows all 8.
  const CRACKS = [
    [[10.5, -116], [7.5, -114], [8, -111.5], [4.5, -109]],
    [[5, -118.5], [6, -116.5], [4, -114.8]],
    [[9, -105], [6.5, -103], [7, -100.5]],
    [[4, -112], [3.5, -109], [5, -106]],
    [[11, -111.5], [9.5, -109.5]],
    [[4.5, -117.5], [6, -115.5], [4.2, -113.5]],
    [[8.5, -104], [6.5, -102], [7.5, -100]],
    [[6.2, -119], [5.8, -117]],
  ];

  function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
  function stateOf(p) { return STATES.indexOf(p && p.state) >= 0 ? p.state : 'idle'; }
  function phaseOf(p) { return clamp(Math.round(num(p && p.phase)) || 1, 1, 3); }
  function easeOut(k) { return 1 - (1 - k) * (1 - k); }
  function blinkAt(t) { const c = ((t % 3.8) + 3.8) % 3.8; return c < 0.14 ? Math.sin(c / 0.14 * Math.PI) : 0; }

  // Closed filled shape with the dark outline. build(ctx) adds the sub-path.
  function shape(ctx, color, build, lw) {
    ctx.save();
    ctx.beginPath();
    build(ctx);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = OUT;
    ctx.lineWidth = lw || 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  // Open polyline. pts = [[x, y], ...].
  function polyline(ctx, pts, color, w) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = w || 1.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  // Elbow between shoulder S and hand H, pushed sideways by bend (negative = forward).
  function elbow(S, H, bend) {
    const dx = H[0] - S[0], dy = H[1] - S[1];
    const len = Math.hypot(dx, dy) || 1;
    return [(S[0] + H[0]) / 2 - dy / len * bend, (S[1] + H[1]) / 2 + dx / len * bend];
  }

  function arm(ctx, S, H, bend, sleeve) {
    const E = elbow(S, H, bend);
    ART.limb(ctx, S[0], S[1], E[0], E[1], 8.5, sleeve, { lw: 1.6 });
    ART.limb(ctx, E[0], E[1], H[0], H[1], 7, sleeve, { lw: 1.6 });
    ART.ell(ctx, E[0] + (H[0] - E[0]) * 0.82, E[1] + (H[1] - E[1]) * 0.82, 3, 3, C.gold, { lw: 1 });
    ART.ell(ctx, H[0], H[1], 3.6, 3.1, C.glove, { lw: 1.2 });
  }

  function leg(ctx, hip, foot, col) {
    const kx = (hip[0] + foot[0]) / 2 + 1.5, ky = -30 + foot[1] * 0.5;
    ART.limb(ctx, hip[0], hip[1], kx, ky, 10, col, { lw: 1.6 });
    ART.limb(ctx, kx, ky, foot[0], foot[1] - 4, 7.5, col, { lw: 1.6 });
    ART.rr(ctx, foot[0] - 4, foot[1] - 6, 15, 6, 2.5, C.boot, { lw: 1.6 });
  }

  // Cane: B = ferrule (on the ground, or in the air when raised), P = top of the shaft, clock-face pommel.
  function cane(ctx, c, glow) {
    const B = c.B, P = c.P;
    ART.limb(ctx, B[0], B[1], P[0], P[1], 2.8, C.gold, { lw: 1.2 });
    ART.ell(ctx, B[0], B[1] - 1, 2.2, 1.5, C.ink, { lw: 1 });
    const kx = P[0], ky = P[1] - 3.5, gr = 4 + 20 * glow;
    if (glow > 0) {
      ctx.save();
      const g = ctx.createRadialGradient(kx, ky, 1, kx, ky, gr);
      g.addColorStop(0, 'rgba(255,236,170,0.95)');
      g.addColorStop(1, 'rgba(255,210,122,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(kx, ky, gr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ART.ell(ctx, kx, ky, 4, 4, C.gold, { lw: 1.3 });
    polyline(ctx, [[kx, ky], [kx, ky - 2.6]], '#4a3414', 0.9);
    polyline(ctx, [[kx, ky], [kx + 2.2, ky + 0.6]], '#4a3414', 0.9);
  }

  // Phase 3: four gears orbit the torso. front=false draws the ones behind him, front=true the ones in front.
  function orbit(ctx, tm, front) {
    for (let i = 0; i < 4; i++) {
      const a = tm * 1.4 + i * Math.PI / 2, depth = Math.sin(a);
      if ((depth > 0) !== front) continue;
      ART.gear(ctx, 2 + Math.cos(a) * 40, -72 + depth * 26, 6.5, 8, tm * 2 + i, C.gold, { lw: 1.2 });
    }
  }

  // Joint targets, cane and body offsets for each boss state (upper-body space, feet at 0,0).
  function pose(st, t, tm) {
    const s = {
      alpha: 1, dy: 0, fall: 0, lean: 0, br: Math.sin(tm * 2.2) * 0.9, gl: 0, o: 0, headDx: 0, headDy: 0,
      nearH: [13.2, -58], nearBend: -2, farH: [-17, -58], farBend: 2,
      cane: { B: [14, 0], P: [13, -70], hand: 'near' },
      nearFoot: [8, 0], farFoot: [-6, 0],
    };
    if (st === 'intro') {                       // rises out of the clock, then bows
      s.alpha = clamp(t, 0, 1);
      s.dy = (1 - s.alpha) * -14;
      s.lean = 0.22 * Math.sin(clamp((t - 1.2) / 0.9, 0, 1) * Math.PI);
    } else if (st === 'walk') {
      const ph = tm * 7, sw = Math.sin(ph), cs = Math.cos(ph);
      s.br = -Math.abs(sw) * 1.2;
      s.lean = 0.03;
      s.nearH = [13 + sw * 3, -58];
      s.farH = [-17 - sw * 3, -58];
      s.cane = { B: [14 + sw * 4, 0], P: [13 + sw * 3, -70], hand: 'near' };
      s.nearFoot = [8 + sw * 9, -Math.max(0, cs) * 4];
      s.farFoot = [-6 - sw * 9, -Math.max(0, -cs) * 4];
    } else if (st === 'telegraph') {            // cane raised, glow builds, head trembles
      const g = clamp(t, 0, 1);
      s.lean = -0.04;
      s.gl = g;
      s.headDx = Math.sin(tm * 70) * 0.7 * g;
      s.nearBend = -3;
      s.nearH = [16.2, -118];
      s.cane = { B: [15.5, -100], P: [17, -138], hand: 'near' };
      s.farH = [-17, -62];
      s.farBend = 4;
    } else if (st === 'slam') {                 // cane comes down onto the ground
      const k0 = clamp(t / 0.22, 0, 1), k = k0 * k0;
      s.lean = lerp(-0.04, 0.16, k);
      s.nearBend = -3 - k;
      s.nearH = [lerp(16.2, 18, k), lerp(-118, -56, k)];
      s.cane = { B: [lerp(15.5, 24, k), lerp(-100, 0, k)], P: [lerp(17, 15.9, k), lerp(-138, -75.6, k)], hand: 'near' };
      s.farH = [-17 + 2 * k, -62 + 4 * k];
      s.farBend = 4 - 2 * k;
    } else if (st === 'beam') {                 // palm open toward the beam, cane held behind in the far hand
      s.lean = 0.05;
      s.nearH = [20, -79];
      s.nearBend = 1;
      s.farH = [-19.3, -60];
      s.cane = { B: [-21, 0], P: [-19, -72], hand: 'far' };
    } else if (st === 'charge') {               // lean-in dash, cane levelled like a lance
      const sw = Math.sin(tm * 14), cs = Math.cos(tm * 14);
      s.lean = 0.32;
      s.br = 0;
      s.nearH = [24, -72];
      s.nearBend = 3;
      s.farH = [-20 + sw * 2, -60];
      s.cane = { B: [-12, -66], P: [36, -74], hand: 'near' };
      s.nearFoot = [18 + sw * 6, -Math.max(0, cs) * 5];
      s.farFoot = [-12 - sw * 6, -Math.max(0, -cs) * 5];
    } else if (st === 'summon') {               // arms open wide, coat parts, gears rise
      const o = easeOut(clamp(t / 0.7, 0, 1));
      s.o = o;
      s.lean = -0.05 * o;
      s.nearH = [lerp(13.2, 34, o), lerp(-58, -98, o)];
      s.nearBend = -4 * o;
      s.farH = [lerp(-17, -30, o), lerp(-58, -98, o)];
      s.farBend = 4 * o;
      s.cane = null;
    } else if (st === 'hurt') {                 // recoil, decaying
      const k = 1 - clamp(t / 0.45, 0, 1);
      s.lean = -0.22 * k;
      s.headDx = -1.6 * k;
      s.headDy = 0.9 * k;
      s.gl = k;
    } else if (st === 'dead') {                 // topples forward and fades
      s.fall = 1.5 * easeOut(clamp(t / 0.9, 0, 1));
      s.alpha = 1 - clamp((t - 1.5) / 1.2, 0, 1);
      s.br = 0;
    }
    return s;
  }

  function coatPath(c, tail) {
    c.moveTo(-7, -98);
    c.lineTo(-13, -91);
    c.bezierCurveTo(-17, -84, -15, -76, -13, -70);
    c.bezierCurveTo(-16, -60, -19, -50, -19 - tail, -40);
    c.quadraticCurveTo(-14 - tail * 0.5, -30, -9 - tail * 0.4, -36);
    c.quadraticCurveTo(-4, -30, 0, -37);
    c.quadraticCurveTo(5, -30, 9, -36);
    c.quadraticCurveTo(13, -32, 16, -38);
    c.bezierCurveTo(14, -52, 12, -62, 10, -70);
    c.bezierCurveTo(12, -78, 13, -86, 11, -92);
    c.quadraticCurveTo(8, -97, 4, -99);
  }

  // Filled polygon from a list of points (used for coat shards and summon flaps).
  function poly(ctx, pts, color, lw) {
    shape(ctx, color, (c) => {
      c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    }, lw);
  }

  function slit(ctx, pts) {
    polyline(ctx, pts, OUT, 4.4);
    polyline(ctx, pts, C.lining, 2.2);
  }

  function drawCoat(ctx, st, ph, tm) {
    const tail = st === 'charge' ? 9 : 0;
    shape(ctx, C.coat, (c) => coatPath(c, tail), 2);
    polyline(ctx, [[-7, -74], [-9, -58], [-9 - tail * 0.4, -40]], ART.shade(C.coat, 0.16), 1.2);
    polyline(ctx, [[-13, -91], [-17, -84], [-15, -76], [-13, -70], [-16, -60], [-19, -50], [-19 - tail, -40]], '#5b5b74', 1.4); // light from the upper left, back edge and tail
    polyline(ctx, [[16, -38], [14, -52], [12, -62], [10, -70], [12, -78], [13, -86], [11, -92], [8, -97], [4, -99]], '#5b5b74', 1.4); // front edge, under the lining
    poly(ctx, [[4, -98], [9, -92], [10, -70], [13, -42], [8, -42], [6, -70]], C.lining, 1.4);
    [[7.5, -84], [8.2, -73], [9, -61], [10, -49]].forEach((b, i) => {
      ART.gear(ctx, b[0], b[1], 2.2, 6, i * 0.4, C.gold, { lw: 1 });
    });
    if (ph >= 2) slit(ctx, [[-15, -62], [-11, -58], [-14, -53], [-10, -48], [-13, -45]]);
    if (ph >= 3) {
      slit(ctx, [[1, -56], [4, -51], [2, -46], [6, -42]]);
      const w = Math.sin(tm * 3) * 1.5;
      poly(ctx, [[-17, -40], [-22 + w, -28], [-16, -26], [-13, -36]], C.coat, 1.6);
      poly(ctx, [[-3, -34], [-4 - w, -23], [1, -27], [2, -33]], C.coat, 1.6);
      poly(ctx, [[11, -35], [16 + w, -25], [13, -23], [9, -33]], C.coat, 1.6);
    }
  }

  // Summon: the front panels part, a purple cavity opens and gears rise out of it.
  function chestOpen(ctx, o, tm) {
    if (o <= 0.02) return;
    poly(ctx, [[10, -92], [10 + 12 * o, -86], [12 + 15 * o, -50], [10, -40]], C.coat, 1.6);
    ART.ell(ctx, 8, -80, 1.5 + 4 * o, 2 + 8 * o, C.liningLo, { lw: 1.4 });
    for (let i = 0; i < 3; i++) {
      ART.gear(ctx, 8 + o * (7 + i * 5), -86 + i * 8 - o * 4, 5.4 - i * 0.6, 7, tm * (2 + i), C.gold, { lw: 1.2 });
    }
  }

  function drawHead(ctx, st, ph, t, tm, s) {
    ctx.save();
    ctx.translate(s.headDx, s.headDy);
    ART.ell(ctx, -1, -113, 9, 8, C.hairLo, { rot: 0.25, lw: 1.6 });   // swept-back hair
    ART.ell(ctx, -4, -102, 2.2, 2.8, C.skin, { lw: 1.2 });            // ear
    ART.ell(ctx, HEAD[0], HEAD[1], 9.5, 11.5, C.skin, { lw: 1.6 });
    ART.ell(ctx, HEAD[0] - 1, HEAD[1] - 8.5, 8.5, 4.6, C.hair, { rot: -0.12, lw: 1.4 });

    // Porcelain clock mask over the front half of the face, clipped to the head.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(HEAD[0], HEAD[1], 9.5, 11.5, 0, 0, Math.PI * 2);
    ctx.clip();
    const mx = HEAD[0] + 6.5, my = HEAD[1] - 1;
    ctx.beginPath();
    ctx.ellipse(mx, my, 7.5, 11.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.porcelain;
    ctx.fill();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 1.3;
    ctx.stroke();
    [[0, -9.5], [6, 0], [0, 9.5], [-5.5, 0]].forEach((d) => ART.ell(ctx, mx + d[0], my + d[1], 1.1, 1.1, C.ink, { stroke: false }));
    polyline(ctx, [[mx, my], [mx - 0.6, my - 4.5]], C.ink, 1.6);   // hour hand: 23:47
    polyline(ctx, [[mx, my], [mx - 5.9, my - 1.3]], C.ink, 1.2);   // minute hand
    ART.ell(ctx, mx, my, 0.9, 0.9, C.gold, { lw: 0.6 });
    const n = ph >= 3 ? 8 : ph === 2 ? 5 : 2;
    for (let i = 0; i < n; i++) {
      if (ph >= 2) {
        polyline(ctx, CRACKS[i], C.ink, 1.3);
        ctx.save();
        ctx.translate(-0.5, -0.5);                                    // gold highlight on the lit (upper-left) edge
        polyline(ctx, CRACKS[i], 'rgba(255,210,122,0.6)', 0.5);
        ctx.restore();
      } else {
        polyline(ctx, CRACKS[i], C.crack, 0.9);
      }
    }
    ctx.restore();

    ctx.beginPath();                                                  // head outline over the mask edge
    ctx.ellipse(HEAD[0], HEAD[1], 9.5, 11.5, 0, 0, Math.PI * 2);
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    if (ph >= 3) ART.ell(ctx, -1.5, -110.5, 4, 4, C.goldHi, { stroke: false, alpha: 0.4 });
    ART.eye(ctx, -1.5, -110.5, 2.1, 0.8, 0.1, blinkAt(tm), { lw: 1 });
    polyline(ctx, [[-6, -114.5], [0, -115.6]], '#8a8590', 1.1);

    if (st === 'hurt' && t < 0.3) {                                   // sparks off the mask
      ctx.save();
      ctx.globalAlpha *= clamp(1 - t / 0.3, 0, 1);
      for (let i = 0; i < 5; i++) {
        const a = -1.2 + i * 0.45, r0 = 9, r1 = 13 + (i % 2) * 3;
        polyline(ctx, [[12 + Math.cos(a) * r0, -110 + Math.sin(a) * r0],
          [12 + Math.cos(a) * r1, -110 + Math.sin(a) * r1]], C.goldHi, 1.2);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // Sand beam from the palm: x +20..+350, y -92..-66 (the engine's beam hitbox).
  function beam(ctx, tm) {
    const x0 = 20, x1 = 350, y0 = -92, y1 = -66, yc = -79;
    const pulse = 0.85 + 0.15 * Math.sin(tm * 30);
    ctx.save();
    const base = ctx.globalAlpha;
    // Three layers (outer glow, body, white core), each fading toward the end of the beam.
    const layer = (col0, col1, y, h, alpha) => {
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, col0);
      g.addColorStop(1, col1);
      ctx.fillStyle = g;
      ctx.globalAlpha = base * alpha;
      ctx.fillRect(x0, y, x1 - x0, h);
    };
    layer('rgba(255,190,90,0.55)', 'rgba(255,190,90,0)', y0 - 6, (y1 - y0) + 12, pulse);
    layer('rgba(255,211,122,0.95)', 'rgba(255,211,122,0.12)', y0, y1 - y0, 1);
    layer('rgba(255,250,225,1)', 'rgba(255,250,225,0)', yc - 2.5, 5, 1);
    for (let i = 0; i < 24; i++) {                                    // sand streaming along the beam
      const x = x0 + 8 + ((tm * (120 + (i % 5) * 30) + i * 61) % (x1 - x0 - 16));
      const y = y0 + 4 + ((i * 37) % (y1 - y0 - 8));
      ctx.globalAlpha = base * 0.9 * (1 - (x - x0) / (x1 - x0));
      ctx.fillStyle = i % 2 ? C.sandHi : C.sandLo;
      ctx.beginPath();
      ctx.arc(x, y, 1.2 + (i % 3) * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(x0, yc, 1, x0, yc, 16);        // glow at the palm
    g.addColorStop(0, 'rgba(255,240,190,0.95)');
    g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.globalAlpha = base;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x0, yc, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Charge: sand streaks trailing behind him.
  function speedLines(ctx, tm) {
    ctx.save();
    ctx.globalAlpha *= 0.5;
    ctx.strokeStyle = C.sand;
    ctx.lineCap = 'round';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const y = -100 + i * 11 + Math.sin(tm * 9 + i) * 2, xEnd = -26 - (i % 3) * 12;
      ctx.beginPath();
      ctx.moveTo(xEnd - 30 - (i % 2) * 18, y);
      ctx.lineTo(xEnd, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Slam: a ground wave from the cane tip, with cracks.
  function shockwave(ctx, t) {
    const u = t - 0.22;
    if (u <= 0) return;
    const r = 8 + u * 140;
    ctx.save();
    ctx.globalAlpha *= clamp(1 - u / 0.9, 0, 1);
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(24, 0, r, r * 0.14, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = C.goldHi;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(24, 0, r * 0.82, r * 0.11, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = C.crack;
    ctx.lineWidth = 1.4;
    for (let d = -1; d <= 1; d += 2) {
      for (let i = 0; i < 3; i++) {
        const x0 = 24 + d * (5 + i * 6), x1 = x0 + d * Math.min(18, u * 60);
        ctx.beginPath();
        ctx.moveTo(x0, 1.5);
        ctx.lineTo(x1, 1 + i * 0.6);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function draw(ctx, p) {
    p = p || {};
    const st = stateOf(p);
    const t = Math.max(0, num(p.t));
    const tm = num(p.time);
    const ph = phaseOf(p);
    const s = pose(st, t, tm);
    if (s.alpha <= 0.01) return;

    ctx.save();
    ctx.globalAlpha *= clamp(s.alpha, 0, 1);
    if (st === 'beam') beam(ctx, tm);
    if (st === 'charge') speedLines(ctx, tm);
    ART.ell(ctx, 3, 0.5, 22 - s.fall * 5, 4.2, '#000000', { stroke: false, alpha: 0.28 * (1 - s.fall / 2) });

    ctx.save();
    if (s.fall) ctx.rotate(s.fall);
    ctx.translate(0, s.dy);
    leg(ctx, [-2, -62], s.farFoot, ART.shade(C.trouser, -0.12));
    leg(ctx, [4, -62], s.nearFoot, C.trouser);

    // Upper body pivots at the hip: lean, then breathing offset.
    ctx.save();
    ctx.translate(HIP[0], HIP[1]);
    ctx.rotate(s.lean);
    ctx.translate(-HIP[0], -HIP[1] + s.br);
    arm(ctx, SH_FAR, s.farH, s.farBend, ART.shade(C.coat, 0.08));
    if (s.cane && s.cane.hand === 'far') cane(ctx, s.cane, 0);
    if (ph >= 3) orbit(ctx, tm, false);
    drawCoat(ctx, st, ph, tm);
    if (st === 'summon') chestOpen(ctx, s.o, tm);
    ART.rr(ctx, -6.5, -104, 13, 8, 3, C.coat, { lw: 1.8 });            // high collar
    ART.rr(ctx, -4, -98.5, 9, 2.4, 1, C.lining, { stroke: false });
    drawHead(ctx, st, ph, t, tm, s);
    arm(ctx, SH_NEAR, s.nearH, s.nearBend, C.coat);
    if (s.cane && s.cane.hand === 'near') cane(ctx, s.cane, s.gl);
    if (ph >= 3) orbit(ctx, tm, true);
    ctx.restore();

    ctx.restore();
    if (st === 'slam') shockwave(ctx, t);
    ctx.restore();
  }

  /* ---------- portrait: head and shoulders, 200x200 box centred on (0,0) ---------- */
  function portrait(ctx, expr, t) {
    const ex = EXPRS.indexOf(expr) >= 0 ? expr : 'neutral';
    const bl = ex === 'happy' ? Math.max(0.35, blinkAt(num(t))) : blinkAt(num(t));

    const glow = ctx.createRadialGradient(0, -20, 8, 0, -20, 120);
    glow.addColorStop(0, 'rgba(120,70,165,0.42)');
    glow.addColorStop(1, 'rgba(120,70,165,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-100, -100, 200, 200);

    shape(ctx, C.coat, (c) => {                                       // coat and shoulders
      c.moveTo(-98, 100); c.lineTo(-98, 78);
      c.quadraticCurveTo(-96, 56, -66, 48);
      c.lineTo(-30, 40); c.lineTo(30, 40);
      c.lineTo(66, 48); c.quadraticCurveTo(96, 56, 98, 78);
      c.lineTo(98, 100);
    }, 2.2);
    polyline(ctx, [[-88, 76], [-84, 62], [-68, 52]], '#4b4664', 2);
    ART.rr(ctx, -8, 54, 16, 50, 3, C.lining, { lw: 1.4 });
    ART.gear(ctx, 0, 70, 3.4, 6, 0.2, C.gold, { lw: 1.2 });
    ART.gear(ctx, 0, 88, 3.4, 6, 0.5, C.gold, { lw: 1.2 });

    ART.ell(ctx, -4, -34, 50, 56, C.hairLo, { lw: 2 });               // silver mass behind the head
    ART.rr(ctx, -15, 20, 30, 26, 6, C.skin, { lw: 1.6 });             // neck
    ART.rr(ctx, -28, 30, 56, 18, 8, C.coat, { lw: 2 });               // high collar
    ART.rr(ctx, -20, 34, 40, 4, 2, C.lining, { stroke: false });
    ART.ell(ctx, -43, -16, 6.5, 9, C.skin, { lw: 1.8 });              // ears
    ART.ell(ctx, 43, -16, 6.5, 9, C.skin, { lw: 1.8 });
    ART.ell(ctx, 0, -18, 44, 52, C.skin, { lw: 2 });                  // head

    // Porcelain mask on the viewer's right half of the face, clock hands at 23:47.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, -18, 44, 52, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.beginPath();
    ctx.ellipse(26, -20, 26, 58, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.porcelain;
    ctx.fill();
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(26, -20, 22, 0, Math.PI * 2);
    ctx.strokeStyle = C.goldLo;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    for (let i = 0; i < 12; i++) {                                    // tick marks
      const a = i * Math.PI / 6, r0 = i % 3 === 0 ? 15 : 18.5, r1 = 21;
      polyline(ctx, [[26 + Math.sin(a) * r0, -20 - Math.cos(a) * r0],
        [26 + Math.sin(a) * r1, -20 - Math.cos(a) * r1]], C.gold, i % 3 === 0 ? 2 : 1);
    }
    polyline(ctx, [[26, -20], [24.4, -31.9]], C.ink, 2.6);            // hour hand
    polyline(ctx, [[26, -20], [7.4, -24]], C.ink, 1.8);               // minute hand
    ART.ell(ctx, 26, -20, 2.4, 2.4, C.gold, { lw: 1 });
    polyline(ctx, [[14, -62], [20, -52], [17, -45], [24, -36]], C.crack, 1.4);
    polyline(ctx, [[4, -6], [10, 2], [6, 10]], C.crack, 1.2);
    polyline(ctx, [[30, -74], [27, -64], [33, -58]], C.crack, 1.2);
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(0, -18, 44, 52, 0, 0, Math.PI * 2);
    ctx.strokeStyle = OUT;
    ctx.lineWidth = 2;
    ctx.stroke();

    shape(ctx, C.hair, (c) => {                                       // swept fringe, visible half
      c.moveTo(-46, -16); c.quadraticCurveTo(-50, -66, -4, -74);
      c.quadraticCurveTo(-18, -60, -26, -52); c.quadraticCurveTo(-36, -42, -42, -20);
    }, 2);

    polyline(ctx, [[-2, -14], [-6, 4], [0, 7]], '#b98b72', 1.6);     // nose
    ART.eye(ctx, -18, -22, ex === 'surprised' ? 10 : 8.5, 0.2, 0, bl, { lw: 1.8 });
    if (ex === 'angry') {                                             // lowered lid
      shape(ctx, C.skin, (c) => {
        c.moveTo(-28, -37); c.lineTo(-6, -31); c.lineTo(-6, -23); c.lineTo(-28, -28);
      }, 1.4);
    }

    const brows = {
      neutral: [[-34, -42], [-21, -42], [-8, -42]],
      happy: [[-34, -43], [-21, -48], [-8, -44]],
      sad: [[-34, -40], [-21, -41], [-8, -49]],
      angry: [[-34, -46], [-21, -44], [-8, -37]],

    const R = {
      lift: -5 + Math.sin(tm * 2.2) * 1.4,            // hovering, bobbing on the clock

      near: [0.5 + idle * 0.06, 0.75 + idle * 0.05],  // [upper arm, forearm]

    };

      }
      case 'jump':
        R.near = [2.5, 2.9]; R.far = [-2.2, -2.5];

  function puff(ctx, x, y, r, pal) {

    const r = 28 + pulse;
    const g = ctx.createRadialGradient(0, cy, 2, 0, cy, r);
    g.addColorStop(0, 'rgba(255,230,150,0.55)');
    g.addColorStop(0.55, 'rgba(255,200,95,0.2)');

    const f = 1 - C(t / 1.1, 0, 1);
    if (f > 0) {

        lift: -5 - t * 3, lean: 0, sx: 1 + t * 0.05, sy: 1 - t * 0.02, recoil: 0,
        hemSwing: 0, hemDy: 0, drag: 0, hairLift: -t * 4,
        near: [0.5, 0.75], far: [-0.42, -0.6], blink: 0, mouth: 0, alpha: 1, trail: null, afterimg: false

      ctx.translate(0, -2); ctx.scale(R.sx, R.sy); ctx.translate(0, 2);
      ctx.globalAlpha = LIVE.alpha * f;

    }
    for (let i = 0; i < 26; i++) {
      const r1 = rnd(i, 1), r2 = rnd(i, 2), r3 = rnd(i, 3);
      const d = r3 * 0.6;                     // staggered release
      const pt = t - d;
      if (pt <= 0) continue;
      const a = C(1 - pt / (LIFE - d), 0, 1) * C(pt / 0.15, 0, 1);
      const x = (r1 - 0.5) * 16 + (r1 - 0.5) * pt * 5 + Math.sin(pt * 2.4 + i) * 2;
      const y = -22 - r2 * 14 - pt * (6 + r3 * 8);
      const rad = 0.8 + r3 * 1.3;
      ctx.beginPath(); ctx.arc(x, y, rad * 2.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,214,107,' + (0.3 * a).toFixed(3) + ')'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,243,196,' + a.toFixed(3) + ')'; ctx.fill();
    }
  }

  function draw(ctx, p) {

    const pal = P.frozen ? FROZEN : LIVE;

    drawGlow(ctx, R.lift - 22, Math.sin(P.tm * 1.5) * 1.8, pal.glow);

    ctx.translate(0, R.lift);
    ctx.translate(0, -12); ctx.rotate(R.lean); ctx.translate(0, 12);   // lean pivots at the waist
    ctx.translate(R.recoil, 0);
    ctx.translate(0, -2); ctx.scale(R.sx, R.sy); ctx.translate(0, 2);  // squash and stretch about the hem
    ctx.globalAlpha = pal.alpha * R.alpha;

    ctx.restore();

      ctx.globalAlpha *= 0.35; ctx.strokeStyle = pal.brass; ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]); ctx.lineDashOffset = -P.tm * 8;
      ctx.beginPath(); ctx.arc(0, R.lift - 20, 19, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- portrait (200 x 200 box centred on 0,0) ---------- */
  function portraitCurl(ctx, x, y, r) {
    ART.ell(ctx, x, y, r, r * 0.9, LIVE.hair, { lw: 2.4, outline: HAIR_DK });
    ctx.save();
    ctx.strokeStyle = LIVE.hairHi; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r * 0.5, 3.5, 4.9); ctx.stroke();
    ctx.restore();
  }

  function portrait(ctx, expr, t) {
    const E = EXPRS.indexOf(expr) >= 0 ? expr : 'neutral';
    const tt = N(t, 0);
    const bl = blinkAt(tt);
    const shim = Math.sin(tt * 3.1) * 0.9;
    ctx.save();
    ctx.translate(0, Math.sin(tt * 1.6) * 0.5);

    // Golden aura.
    const gl = ctx.createRadialGradient(0, -8, 24, 0, -8, 100);
    gl.addColorStop(0, 'rgba(255,226,140,0.55)');
    gl.addColorStop(0.6, 'rgba(255,200,95,0.18)');
    gl.addColorStop(1, 'rgba(255,200,95,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.94;

    // Hair: curls around the head, drifting outward; hair mass behind the face.
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * (0.95 + i * 0.134);
      const x = Math.cos(a) * (56 + Math.sin(tt * 1.2 + i) * 1.8);
      const y = -26 + Math.sin(a) * 52 + Math.cos(tt * 1.1 + i * 0.7) * 1.4;
      portraitCurl(ctx, x, y, 14 + (i % 3) * 2);
    }
    ART.ell(ctx, 0, -22, 50, 48, LIVE.hair, { lw: 2.5, outline: HAIR_DK });

    // Neck, dress shoulders, gold stitching.
    ART.limb(ctx, 0, 30, 0, 62, 26, LIVE.skin, { lw: 3 });
    ctx.beginPath();
    ctx.moveTo(-96, 98);
    ctx.quadraticCurveTo(-92, 66, -54, 56);
    ctx.quadraticCurveTo(-26, 50, -14, 52);
    ctx.quadraticCurveTo(0, 66, 14, 52);
    ctx.quadraticCurveTo(26, 50, 54, 56);
    ctx.quadraticCurveTo(92, 66, 96, 98);
    ctx.closePath();
    ctx.fillStyle = LIVE.dress; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = LINE; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.save();
    ctx.strokeStyle = LIVE.gold; ctx.lineWidth = 2.2; ctx.setLineDash([3, 3.5]);
    ctx.beginPath(); ctx.moveTo(-13, 55); ctx.quadraticCurveTo(0, 69, 13, 55); ctx.stroke();
    ctx.restore();
    const beads = [[-62, 74], [-74, 86], [-82, 96], [-38, 80], [62, 74], [74, 86], [82, 96], [38, 80]];
    for (let i = 0; i < beads.length; i++) ART.ell(ctx, beads[i][0], beads[i][1], 2.6, 2.6, LIVE.gold, { lw: 1.1, outline: LIVE.goldDk });

    // Ribbon and brass pocket-watch pendant.
    ART.limb(ctx, 0, 56, 0, 70, 2.6, LIVE.ribbon, { lw: 1.6, outline: LINE });
    ctx.save();
    ctx.translate(0, 70); ctx.rotate(Math.sin(tt * 2.2) * 0.1); ctx.translate(0, -70);
    ART.ell(ctx, 0, 69, 3.6, 3.2, LIVE.brass, { lw: 2, outline: LIVE.brassDk });
    ART.ell(ctx, 0, 84, 13, 13, LIVE.brass, { lw: 2.6, outline: LIVE.brassDk });
    ART.ell(ctx, 0, 84, 9.5, 9.5, LIVE.brassLt, { stroke: false });
    ctx.beginPath();
    ctx.strokeStyle = LIVE.brassDk; ctx.lineWidth = 2;
    ctx.moveTo(0, 84); ctx.lineTo(0, 76.5); ctx.moveTo(0, 84); ctx.lineTo(5.5, 87);
    ctx.stroke();
    ctx.fillStyle = '#fffbe8';
    ctx.beginPath(); ctx.arc(-4.5, 79, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Head.
    ART.ell(ctx, 0, -6, 44, 50, LIVE.skin, { lw: 3 });
    for (const x of [-30, -12, 8, 28]) portraitCurl(ctx, x, -48 + Math.sin(tt * 1.7 + x) * 1.2, 12);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,246,210,0.7)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(shim, -6 + shim * 0.6, 44.5, 50.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // Eyes.
    if (E === 'happy') {
      ctx.save();
      ctx.strokeStyle = LINE; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
      for (const x of [-18, 18]) { ctx.beginPath(); ctx.arc(x, -10, 8.5, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); }
      ctx.restore();
    } else {
      const r = E === 'surprised' ? 12 : 10.5;
      const lx = E === 'worried' ? -0.5 : 0.3;
      const ly = E === 'sad' ? 0.5 : E === 'worried' ? -0.4 : 0;
      const b = E === 'angry' ? 0.5 : E === 'sad' ? Math.max(0.3, bl) : bl;
      for (const x of [-18, 18]) ART.eye(ctx, x, -12, r, lx, ly, b, { lw: 2.6, white: '#fffdf4', pupil: '#2d2030' });
    }

    // Brows, nose, blush.
    const brows = BROWS[E];
    for (let i = 0; i < brows.length; i++) {
      const q = brows[i];
      ART.limb(ctx, q[0], q[1], q[2], q[3], 4.2, HAIR_DK, { stroke: false });
    }
    ctx.save();
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(4, 2, 3, 0.3, 1.2); ctx.stroke();
    ctx.restore();
    const blush = E === 'happy' ? 0.6 : 0.35;
    ART.ell(ctx, -31, 8, 9, 5.5, '#f09a88', { stroke: false, alpha: blush });
    ART.ell(ctx, 31, 8, 9, 5.5, '#f09a88', { stroke: false, alpha: blush });

    // Mouth.
    ctx.save();
    ctx.strokeStyle = LINE; ctx.fillStyle = '#5a2233'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    if (E === 'happy') {
      ctx.moveTo(-20, 22); ctx.quadraticCurveTo(0, 50, 20, 22); ctx.quadraticCurveTo(0, 30, -20, 22);
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke();
    } else if (E === 'sad') {
      ctx.moveTo(-14, 38); ctx.quadraticCurveTo(0, 22, 14, 38); ctx.stroke();
    } else if (E === 'angry') {
      ctx.moveTo(-13, 30); ctx.lineTo(13, 30); ctx.lineTo(9, 36); ctx.lineTo(-9, 36);
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke();
    } else if (E === 'surprised') {
      ctx.ellipse(0, 30, 8, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke();
    } else if (E === 'worried') {
      ctx.moveTo(-14, 30); ctx.quadraticCurveTo(-7, 24, 0, 30); ctx.quadraticCurveTo(7, 36, 14, 29); ctx.stroke();
    } else {
      ctx.moveTo(-11, 30); ctx.quadraticCurveTo(0, 35, 11, 29); ctx.stroke();
    }
    ctx.restore();

    ctx.restore();
  }

  ART.register({ id: 'juliette', w: 22, h: 42, draw: draw, portrait: portrait });
})();

</script>
  <script>
/* js/art/chars/elias.js */
/* elias: Elias Varin, master clockmaker, half machine, keeper of the balance wheel at the top of the Tower.
   Look: tall and lean, long brown workshop coat with rolled sleeves, grey waistcoat, spectacles pushed down,
   neat grey hair. The LEFT half of his face is brass (cheek gear, clock-dial eye); his left arm is partly brass.
   Drawn facing right; origin (0,0) = centre of the feet. Character sheet: game/characters/elias.md */
(function () {
  if (!window.ART) return;
  const ART = window.ART;
  const TAU = Math.PI * 2;

  const STATES = { idle: 1, walk: 1, run: 1, jump: 1, fall: 1, land: 1, attack: 1, dash: 1,
    hurt: 1, dead: 1, talk: 1, slow: 1, frozen: 1 };

  // Portrait expressions: bo/bi = brow height at the outer/inner end, lid = eyelid closing, mouth = mouth shape.
  const EXPR = {
    neutral: { bo: -24, bi: -25, lid: 0, mouth: 'flat' },
    happy: { bo: -27, bi: -27, lid: 0.3, mouth: 'smile' },
    sad: { bo: -20, bi: -31, lid: 0.28, mouth: 'frown', look: 0.6 },
    angry: { bo: -31, bi: -19, lid: 0.36, mouth: 'tight' },
    surprised: { bo: -34, bi: -34, lid: 0, mouth: 'open', big: true },
    worried: { bo: -22, bi: -30, lid: 0.12, mouth: 'wave' }
  };

  const BASE = {
    skin: '#e8c3a0', skinShade: '#c99c79',
    hair: '#aaa7a2', hairLight: '#dcd9d3', hairDark: '#6d6962',
    coat: '#6b4a2e', coatDark: '#4a3220', coatLight: '#8a6240',
    shirt: '#efe6d2', waist: '#8f959d',
    trousers: '#3b3d4a', trousersDark: '#2a2c36', boot: '#2a1d17',
    brass: '#c9963f', brassLight: '#e6c26d', brassDark: '#7a5620',
    seam: '#4a3416', dial: '#f6efe1', ink: '#2a2024', mouth: '#5a2e2a'
  };

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d || 0);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeOut = (k) => 1 - Math.pow(1 - k, 3);
  const blinkAt = (t) => (((t % 3.4) + 3.4) % 3.4 < 0.12 ? 1 : 0);

  function mixHex(a, b, k) {
    const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
    let out = '#';
    for (const sh of [16, 8, 0]) {
      const x = (A >> sh) & 255, y = (B >> sh) & 255;
      out += Math.round(x + (y - x) * k).toString(16).padStart(2, '0');
    }
    return out;
  }

  // Frozen state greys every colour out (statue look).
  function palette(frozen) {
    const K = {};
    for (const key in BASE) K[key] = frozen ? mixHex(BASE[key], '#7d7f86', 0.55) : BASE[key];
    return K;
  }

  function fillStroke(ctx, path, fill, lw) {
    path();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = ART.OUT;
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  /* ---------- pose solver: angles are from straight down, positive = forward (+x) ---------- */
  function solve(st, t, time) {
    const s = {
      lean: 0, hipDy: 0, breath: 0.7 * Math.sin(time * 2.4), gear: time * 0.9, dial: time * 0.5,
      legN: 0.02, legNb: 0, legF: -0.03, legFb: 0,
      armN: 0.06 + 0.03 * Math.sin(time * 2.4), foN: 0.3, armF: -0.04, foF: 0.2,
      headTilt: 0, mouth: 0, blink: blinkAt(time), alpha: 1, spin: 0, key: false,
      streaks: false, ring: false, trail: false, trailFrom: 0, trailTo: 0
    };
    switch (st) {
      case 'walk': {
        const ph = time * 7, S = Math.sin(ph), C = Math.cos(ph);
        s.legN = 0.42 * S; s.legNb = 0.6 * Math.max(0, C);
        s.legF = -0.42 * S; s.legFb = 0.6 * Math.max(0, -C);
        s.armN = -0.5 * S; s.foN = s.armN + 0.3;
        s.armF = 0.5 * S; s.foF = s.armF + 0.3;
        s.hipDy = -1.2 * Math.abs(S);
        break;
      }
      case 'run': {
        const ph = time * 11, S = Math.sin(ph), C = Math.cos(ph);
        s.lean = 0.12;
        s.legN = 0.75 * S; s.legNb = Math.max(0, C);
        s.legF = -0.75 * S; s.legFb = Math.max(0, -C);
        s.armN = -0.9 * S; s.foN = s.armN + 1.2;
        s.armF = 0.9 * S; s.foF = s.armF + 1.2;
        s.hipDy = -2.2 * Math.abs(S);
        break;
      }
      case 'jump':
        if (t < 0.07) { // crouch before the push
          s.hipDy = 2.5; s.legN = 0.1; s.legNb = 0.6; s.legF = -0.1; s.legFb = 0.5;
          s.armN = -0.9; s.foN = -0.6; s.armF = -0.6; s.foF = -0.2;
        } else { // rising, legs tucked, arms up
          s.legN = 0.9; s.legNb = 1.6; s.legF = 0.35; s.legFb = 1.8;
          s.armN = 2.6; s.foN = 2.8; s.armF = 2.0; s.foF = 2.5; s.lean = -0.04;
        }
        break;
      case 'fall':
        s.legN = 0.3; s.legNb = 0.2; s.legF = -0.25; s.legFb = 0.1;
        s.armN = 1.5; s.foN = 1.6; s.armF = -0.9; s.foF = -0.7; s.lean = -0.03;
        break;
      case 'land': {
        const k = 1 - clamp(t / 0.18, 0, 1);
        s.hipDy = 6 * k; s.lean = 0.08 * k;
        s.legN = 0.2; s.legNb = 0.1 + 0.5 * k; s.legF = -0.15; s.legFb = 0.5 * k;
        s.armN = 0.1 + 0.8 * k; s.foN = s.armN + 0.4; s.armF = -0.6 * k; s.foF = s.armF + 0.3;
        break;
      }
      case 'attack': {
        const W = 0.09, A = 0.2;
        let sw;
        if (t < W) sw = lerp(0, -1.5, clamp(t / W, 0, 1)); // anticipation: arm winds back
        else if (t < W + A) sw = lerp(-1.5, 2.1, easeOut(clamp((t - W) / A, 0, 1)));
        else sw = lerp(2.1, 0.3, clamp((t - W - A) / 0.2, 0, 1));
        const striking = t >= W && t < W + A;
        s.armN = sw; s.foN = sw + (striking ? 0.1 : 0.7); s.key = true;
        s.lean = striking ? 0.14 : t < W ? -0.06 : 0;
        s.armF = -0.45 * sw; s.foF = s.armF + 0.3;
        s.trail = t >= W && t < W + A + 0.12; s.trailFrom = -1.5; s.trailTo = sw;
        break;
      }
      case 'dash':
        s.lean = 0.34; s.streaks = true; s.hipDy = -1;
        s.legN = -0.95; s.legNb = 0.1; s.legF = 0.45; s.legFb = 0.7;
        s.armN = -1.35; s.foN = -1.5; s.armF = -1.1; s.foF = -1.3;
        break;
      case 'hurt': {
        const k = clamp(t / 0.45, 0, 1);
        s.lean = lerp(-0.24, 0, k); s.headTilt = lerp(-0.3, 0, k); s.blink = 0.85;
        s.armN = lerp(-2.0, s.armN, k); s.foN = lerp(-2.3, 0.3, k);
        s.armF = lerp(2.1, -0.04, k); s.foF = lerp(2.4, 0.2, k);
        s.alpha = t < 0.3 && Math.floor(t * 24) % 2 === 0 ? 0.55 : 1;
        break;
      }
      case 'dead': {
        const k = clamp(t / 0.5, 0, 1);
        s.spin = -(Math.PI / 2) * k * k * (3 - 2 * k); // falls backwards, around the feet
        s.alpha = 1 - clamp((t - 0.6) / 0.9, 0, 1);
        s.legN = 0.15; s.legF = -0.1; s.armN = 1.2; s.foN = 1.4; s.armF = -1.0; s.foF = -0.8;
        s.headTilt = 0.4 * k; s.blink = 1;
        break;
      }
      case 'talk':
        s.armN = 0.35 + 0.05 * Math.sin(time * 3); s.foN = 1.5 + 0.35 * Math.sin(time * 5);
        s.armF = -0.1; s.foF = 0.2; s.headTilt = 0.06 * Math.sin(time * 4);
        s.mouth = 0.5 + 0.5 * Math.sin(time * 14);
        break;
      case 'slow': { // Pendule active: everything slows, a ring of ticks appears
        const S = Math.sin(time * 2.5);
        s.lean = 0.04 * Math.sin(time * 1.4);
        s.legN = 0.2 * S; s.legF = -0.2 * S;
        s.armN = -0.25 * S; s.foN = s.armN + 0.2; s.armF = 0.25 * S; s.foF = s.armF + 0.2;
        s.gear = time * 0.3; s.dial = time * 0.2; s.ring = true;
        break;
      }
      case 'frozen':
        s.breath = 0; s.gear = 0; s.dial = 0; s.blink = 0;
        s.armN = 0.06; s.armF = -0.04;
        break;
      default:
        break;
    }
    return s;
  }

  /* ---------- body parts (hip frame: origin = hip, y down) ---------- */
  function leg(ctx, K, x0, y0, a, bend, col) {
    const kx = x0 + Math.sin(a) * 14.5, ky = y0 + Math.cos(a) * 14.5;
    const b = a - bend; // knee flexes backwards
    const ax = kx + Math.sin(b) * 14.5, ay = ky + Math.cos(b) * 14.5;
    ART.limb(ctx, x0, y0, kx, ky, 5.4, col, { lw: 1 });
    ART.limb(ctx, kx, ky, ax, ay, 4.8, col, { lw: 1 });
    ART.ell(ctx, ax + 1.3, ay + 0.8, 3.9, 2.1, K.boot, { lw: 1 });
  }

  function neck(ctx, K) {
    ART.rr(ctx, -1.9, -24, 3.8, 8, 1.2, K.skinShade, { lw: 0.8 });
  }

  function torso(ctx, K) {
    const body = () => {
      ctx.beginPath();
      ctx.moveTo(-6.6, -18.2);
      ctx.quadraticCurveTo(0, -19.9, 6.6, -18.2);
      ctx.quadraticCurveTo(8.6, -12.5, 6.2, -6.5);
      ctx.quadraticCurveTo(8.4, 4, 9.4, 16.2);
      ctx.quadraticCurveTo(0, 18.8, -9.4, 16.2);
      ctx.quadraticCurveTo(-8.4, 4, -6.2, -6.5);
      ctx.quadraticCurveTo(-8.6, -12.5, -6.6, -18.2);
      ctx.closePath();
    };
    fillStroke(ctx, body, K.coat, 1.6);
    ctx.save(); // far side of the long coat in shade
    body();
    ctx.clip();
    ctx.globalAlpha *= 0.4;
    ctx.fillStyle = K.coatDark;
    ctx.fillRect(-10, -20, 5, 40);
    ctx.restore();
    ctx.save(); // hem stitching
    ctx.setLineDash([1, 1.1]);
    ctx.strokeStyle = K.coatDark; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-8, 12.5); ctx.lineTo(8, 12.5); ctx.stroke();
    ctx.restore();
    fillStroke(ctx, () => { // grey waistcoat in the open front
      ctx.beginPath();
      ctx.moveTo(-2.8, -17.8); ctx.lineTo(2.8, -17.8);
      ctx.quadraticCurveTo(3.4, -6, 2.6, 6); ctx.lineTo(-2.6, 6);
      ctx.quadraticCurveTo(-3.4, -6, -2.8, -17.8);
      ctx.closePath();
    }, K.waist, 0.9);
    for (const y of [-9, -3, 3]) ART.ell(ctx, 0.2, y, 0.6, 0.6, K.brassLight, { lw: 0.4 });
    ctx.strokeStyle = K.brassDark; ctx.lineWidth = 0.6; // watch chain and pocket watch
    ctx.beginPath(); ctx.moveTo(-2.5, -13); ctx.quadraticCurveTo(-0.6, -10.5, -1.6, -6.2); ctx.stroke();
    ART.ell(ctx, -1.6, -4.8, 1.4, 1.4, K.brass, { lw: 0.5 });
    fillStroke(ctx, () => { // shirt collar
      ctx.beginPath(); ctx.moveTo(-2.6, -18.6); ctx.lineTo(0, -15.4); ctx.lineTo(2.6, -18.6); ctx.closePath();
    }, K.shirt, 0.7);
    fillStroke(ctx, () => { // right lapel
      ctx.beginPath(); ctx.moveTo(2.6, -18.4); ctx.lineTo(5.8, -15.6); ctx.lineTo(3.4, -9); ctx.closePath();
    }, K.coatLight, 0.6);
    ctx.strokeStyle = K.coatDark; ctx.lineWidth = 0.7; // coat front edge
    ctx.beginPath(); ctx.moveTo(3.1, -15); ctx.lineTo(3.5, 5); ctx.stroke();
  }

  // Attack trail: the arc the arm sweeps through.
  function trail(ctx, K, s) {
    ctx.save();
    ctx.globalAlpha *= 0.4;
    ctx.strokeStyle = K.dial; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const th = lerp(s.trailFrom, s.trailTo, i / 8);
      const x = 5 + Math.sin(th) * 22, y = -16 + Math.cos(th) * 22;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Arm from shoulder (sx, sy). brass = his left arm: coat sleeve, brass forearm and hand with visible joints.
  function arm(ctx, K, sx, sy, th, fo, brass, s) {
    const ex = sx + Math.sin(th) * 10, ey = sy + Math.cos(th) * 10;
    const wx = ex + Math.sin(fo) * 9, wy = ey + Math.cos(fo) * 9;
    const hx = wx + Math.sin(fo) * 2.4, hy = wy + Math.cos(fo) * 2.4;
    if (brass) {
      ART.limb(ctx, sx, sy, ex, ey, 4.4, K.coatDark, { lw: 1 });
      ART.limb(ctx, ex, ey, wx, wy, 3.2, K.brass, { lw: 1 });
      ART.limb(ctx, wx, wy, hx, hy, 2.8, K.brassDark, { lw: 0.8 });
      ART.ell(ctx, sx, sy, 2.2, 2.2, K.brassLight, { lw: 0.8 });          // shoulder joint
      ART.gear(ctx, ex, ey, 2.0, 6, s.gear, K.brassLight, { lw: 0.6 });   // elbow joint
      ART.ell(ctx, wx, wy, 1.4, 1.4, K.brassLight, { lw: 0.6 });          // wrist ring
      return;
    }
    ART.limb(ctx, sx, sy, ex, ey, 4.6, K.coat, { lw: 1 });
    ART.limb(ctx, ex, ey, wx, wy, 3.4, K.shirt, { lw: 1 });                // shirt sleeve
    ART.limb(ctx, ex, ey, ex + (wx - ex) * 0.35, ey + (wy - ey) * 0.35, 5.0, K.coatLight, { lw: 1 }); // rolled cuff
    ART.ell(ctx, hx, hy, 1.7, 1.9, K.skin, { lw: 0.8 });
    if (s.key) ART.gear(ctx, hx + Math.sin(fo) * 2.2, hy + Math.cos(fo) * 2.2, 2.1, 6, s.gear, K.brass, { lw: 0.6 });
  }

  function streaks(ctx, K) { // dash motion lines behind him
    ctx.save();
    ctx.globalAlpha *= 0.35;
    ctx.strokeStyle = K.dial; ctx.lineCap = 'round'; ctx.lineWidth = 1.4;
    for (const [x0, y, x1] of [[-13, -34, -25], [-11, -26, -28], [-15, -18, -24]]) {
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    ctx.restore();
  }

  function ring(ctx) { // Pendule: a faint ring of ticks around him
    ctx.save();
    ctx.globalAlpha *= 0.22;
    ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, -30, 25, 0, TAU); ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12;
      ctx.beginPath();
      ctx.moveTo(Math.sin(a) * 22, -30 - Math.cos(a) * 22);
      ctx.lineTo(Math.sin(a) * 25, -30 - Math.cos(a) * 25);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Head, origin at the head centre. His left half (screen right) is brass.
  function head(ctx, K, s) {
    ctx.save();
    ctx.translate(0, -26.5);
    ctx.rotate(s.headTilt);
    ART.ell(ctx, -0.4, -1.2, 5.9, 6.1, K.hair, { lw: 1 });                 // back hair
    ART.ell(ctx, -4.9, 0.8, 1.1, 1.6, K.skinShade, { lw: 0.6 });           // near ear
    ART.ell(ctx, 5.0, 0.8, 1.1, 1.6, K.brass, { lw: 0.6 });                // brass ear
    ART.ell(ctx, 0, 0.3, 5.1, 6.1, K.skin, { stroke: false });             // face
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0.3, 5.1, 6.1, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = K.brass; ctx.fillRect(0.7, -7, 6, 14);                 // brass half
    ctx.strokeStyle = K.seam; ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(0.7, -7); ctx.lineTo(0.7, 7); ctx.moveTo(2.4, -3.6); ctx.lineTo(5.8, -3.9); ctx.stroke();
    ART.gear(ctx, 3.4, 2.6, 1.7, 6, s.gear, K.brassLight, { lw: 0.5 });    // cheek gear
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0.3, 5.1, 6.1, 0, 0, TAU);
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = 0.9; ctx.stroke();
    // clock-dial eye: hands fixed at 23:47; the seconds hand moves only while he does
    ART.ell(ctx, 2.9, -1.4, 1.6, 1.6, K.brassLight, { lw: 0.5 });
    ctx.beginPath(); ctx.arc(2.9, -1.4, 1.1, 0, TAU); ctx.fillStyle = K.dial; ctx.fill();
    const hand = (a, len, col, w) => {
      ctx.beginPath(); ctx.moveTo(2.9, -1.4);
      ctx.lineTo(2.9 + Math.sin(a) * len, -1.4 - Math.cos(a) * len);
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
    };
    hand(6.156, 0.7, K.ink, 0.4);   // hour, 11
    hand(4.921, 0.95, K.ink, 0.3);  // minute, 47
    hand(s.dial, 1.0, '#a3361f', 0.25);
    // human eye, spectacles pushed down so the eye looks over the lens
    ART.eye(ctx, -2.2, -1.3, 1.25, 0, 0.2, s.blink, { lw: 0.6 });
    ctx.strokeStyle = K.brassDark; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(-2.2, 0.9, 2.0, 1.6, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.2, 0.2); ctx.lineTo(1.3, -0.2); ctx.moveTo(-4.2, 0.3); ctx.lineTo(-5.4, -0.4); ctx.stroke();
    ART.ell(ctx, -0.4, -4.4, 5.3, 2.0, K.hair, { lw: 0.6 });               // neat grey hair on top
    ctx.strokeStyle = K.ink; ctx.lineWidth = 0.5;                          // mouth
    if (s.mouth > 0.05) ART.ell(ctx, 0.6, 3.5, 0.9, 0.25 + 0.6 * s.mouth, K.mouth, { lw: 0.4 });
    else { ctx.beginPath(); ctx.moveTo(-0.6, 3.6); ctx.lineTo(1.8, 3.4); ctx.stroke(); }
    ctx.restore();
  }

  function draw(ctx, p) {
    const pp = p || {};
    let st = STATES[pp.state] ? pp.state : 'idle';
    if (st === 'jump' && num(pp.vy) > 60) st = 'fall'; // descending
    const t = num(pp.t), time = num(pp.time);
    const K = palette(st === 'frozen');
    const s = solve(st, t, time);
    const hipY = -32 + s.hipDy;
    ctx.save();
    ctx.globalAlpha *= s.alpha;
    if (s.spin) ctx.rotate(s.spin);
    if (s.ring) ring(ctx);
    if (s.streaks) streaks(ctx, K);
    leg(ctx, K, -1, hipY, s.legF, s.legFb, K.trousersDark);   // far leg
    leg(ctx, K, 1.5, hipY, s.legN, s.legNb, K.trousers);      // near leg
    ctx.translate(0, hipY);
    ctx.rotate(s.lean);
    ctx.translate(0, s.breath);
    neck(ctx, K);
    torso(ctx, K);
    if (s.trail) trail(ctx, K, s);
    arm(ctx, K, -6, -16, s.armF, s.foF, true, s);    // his left arm (brass)
    head(ctx, K, s);
    arm(ctx, K, 5, -16, s.armN, s.foN, false, s);    // his right arm (flesh, rolled sleeve)
    ctx.restore();
  }

  /* ---------- portrait: 200x200 box centred on (0,0); his left (brass) side is on the viewer's right ---------- */
  function dialEye(ctx, x, y, r, sec, close) {
    ART.ell(ctx, x, y, r + 2.4, r + 2.4, BASE.brassLight, { lw: 2 });
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = BASE.dial; ctx.fill();
    ctx.strokeStyle = BASE.ink; ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12;
      ctx.lineWidth = i % 3 ? 1 : 1.6;
      ctx.beginPath();
      ctx.moveTo(x + Math.sin(a) * r * 0.76, y - Math.cos(a) * r * 0.76);
      ctx.lineTo(x + Math.sin(a) * r * 0.9, y - Math.cos(a) * r * 0.9);
      ctx.stroke();
    }
    const hand = (a, len, w, col) => {
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + Math.sin(a) * r * len, y - Math.cos(a) * r * len);
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
    };
    hand(6.156, 0.5, 3, BASE.ink);   // hour hand: 11
    hand(4.921, 0.78, 2, BASE.ink);  // minute hand: 47 (it reads 23:47)
    hand(sec, 0.86, 1, '#a3361f');   // seconds
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fillStyle = BASE.ink; ctx.fill();
    if (close > 0.01) { // brass lid closing from the top
      const top = y - r - 4, h = (2 * r + 8) * clamp(close, 0, 1), edge = top + h;
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r + 2.4, 0, TAU); ctx.clip();
      ctx.fillStyle = BASE.brass; ctx.fillRect(x - r - 4, top, 2 * r + 8, h);
      ctx.strokeStyle = BASE.seam; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x - r - 4, edge); ctx.lineTo(x + r + 4, edge); ctx.stroke();
      ctx.restore();
    }
  }

  function portrait(ctx, expr, t) {
    const E = EXPR[expr] || EXPR.neutral;
    const tt = num(t), blink = blinkAt(tt), K = BASE;
    const close = Math.max(blink, E.lid);

    // workshop backdrop with a faint clock face
    ctx.fillStyle = '#2b2119';
    ctx.fillRect(-100, -100, 200, 200);
    ctx.strokeStyle = 'rgba(201,150,63,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -8, 84, 0, TAU); ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12;
      ctx.beginPath();
      ctx.moveTo(Math.sin(a) * 74, -8 - Math.cos(a) * 74);
      ctx.lineTo(Math.sin(a) * 82, -8 - Math.cos(a) * 82);
      ctx.stroke();
    }

    ART.ell(ctx, 0, -18, 46, 52, K.hair, { lw: 2.5 });       // back hair
    ART.ell(ctx, -42, -2, 8, 13, K.skinShade, { lw: 2 });    // near ear
    ART.ell(ctx, 42, -2, 8, 13, K.brass, { lw: 2 });         // brass ear
    ART.rr(ctx, -17, 14, 34, 34, 8, K.skinShade, { lw: 2 }); // neck

    fillStroke(ctx, () => { // long brown coat, shoulders to the box edge
      ctx.beginPath();
      ctx.moveTo(-100, 100); ctx.lineTo(-100, 74);
      ctx.quadraticCurveTo(-98, 48, -70, 42); ctx.quadraticCurveTo(-44, 36, -22, 36);
      ctx.lineTo(22, 36); ctx.quadraticCurveTo(44, 36, 70, 42);
      ctx.quadraticCurveTo(98, 48, 100, 74); ctx.lineTo(100, 100); ctx.closePath();
    }, K.coat, 2.5);
    fillStroke(ctx, () => { // grey waistcoat
      ctx.beginPath(); ctx.moveTo(-16, 38); ctx.lineTo(16, 38); ctx.lineTo(22, 100); ctx.lineTo(-22, 100); ctx.closePath();
    }, K.waist, 2);
    for (const y of [64, 78, 92]) ART.ell(ctx, 0, y, 2.2, 2.2, K.brassLight, { lw: 1 });
    ctx.strokeStyle = K.brassDark; ctx.lineWidth = 1.6; // watch chain and pocket watch
    ctx.beginPath(); ctx.moveTo(-14, 54); ctx.quadraticCurveTo(-4, 64, -10, 72); ctx.stroke();
    ART.ell(ctx, -10, 78, 6.5, 6.5, K.brass, { lw: 1.5 });
    ART.ell(ctx, -10, 78, 4.5, 4.5, K.dial, { lw: 0.8 });
    fillStroke(ctx, () => { // shirt collar
      ctx.beginPath(); ctx.moveTo(-16, 38); ctx.lineTo(0, 58); ctx.lineTo(16, 38); ctx.closePath();
    }, K.shirt, 2);
    fillStroke(ctx, () => { // lapels
      ctx.beginPath(); ctx.moveTo(-22, 36); ctx.lineTo(-6, 74); ctx.lineTo(-24, 100); ctx.lineTo(-50, 100); ctx.lineTo(-42, 56); ctx.closePath();
    }, K.coatLight, 2);
    fillStroke(ctx, () => {
      ctx.beginPath(); ctx.moveTo(22, 36); ctx.lineTo(6, 74); ctx.lineTo(24, 100); ctx.lineTo(50, 100); ctx.lineTo(42, 56); ctx.closePath();
    }, K.coatLight, 2);

    // face: skin, then the brass half (clipped to the face), then the outline
    ART.ell(ctx, 0, -6, 42, 50, K.skin, { stroke: false });
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, -6, 42, 50, 0, 0, TAU); ctx.clip();
    const g = ctx.createLinearGradient(2, -56, 44, 40);
    g.addColorStop(0, K.brassLight); g.addColorStop(0.55, K.brass); g.addColorStop(1, K.brassDark);
    ctx.fillStyle = g;
    ctx.fillRect(2, -60, 50, 120);
    ctx.strokeStyle = K.seam; ctx.lineWidth = 1.3; // seam down the nose
    ctx.beginPath(); ctx.moveTo(2, -60); ctx.lineTo(2, 50); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(16, -46); ctx.lineTo(28, -30); ctx.lineTo(22, -12);
    ctx.moveTo(30, 6); ctx.lineTo(40, 10);
    ctx.stroke();
    for (const [x, y] of [[8, -44], [8, -26], [8, -8], [10, 8]]) {
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, TAU); ctx.fillStyle = K.brassDark; ctx.fill();
    }
    ART.gear(ctx, 24, 22, 10, 10, tt * 0.6, K.brassLight, { lw: 1.4 }); // cheek gear, turning
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, -6, 42, 50, 0, 0, TAU);
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = 2.5; ctx.stroke();

    // nose, spectacles pushed down, temple
    ctx.strokeStyle = K.skinShade; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.quadraticCurveTo(4.5, 7, -1, 13); ctx.stroke();
    ART.ell(ctx, -1.2, 13.4, 2.4, 1.6, K.skinShade, { lw: 1 });
    ctx.strokeStyle = K.brassDark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(-22, 2, 13, 9.5, 0, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(0, -3, 9.6, -2); ctx.stroke();
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-35, -1); ctx.lineTo(-44, -4); ctx.stroke();

    // neat grey hair swept across the forehead
    ctx.beginPath();
    ctx.moveTo(-44, -6);
    ctx.bezierCurveTo(-48, -60, -8, -70, 10, -64);
    ctx.bezierCurveTo(34, -58, 48, -38, 44, -6);
    ctx.bezierCurveTo(40, -24, 30, -34, 18, -36);
    ctx.bezierCurveTo(2, -38, -20, -40, -30, -30);
    ctx.bezierCurveTo(-38, -24, -42, -14, -44, -6);
    ctx.closePath();
    ctx.fillStyle = K.hair; ctx.fill();
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, -52); ctx.quadraticCurveTo(-6, -62, 22, -56);
    ctx.strokeStyle = K.hairLight; ctx.lineWidth = 3; ctx.stroke();

    // brows
    const brow = (xo, yo, xi, yi) => {
      ctx.beginPath(); ctx.moveTo(xo, yo);
      ctx.quadraticCurveTo((xo + xi) / 2, Math.min(yo, yi) - 4, xi, yi);
      ctx.stroke();
    };
    ctx.strokeStyle = K.hairDark; ctx.lineWidth = 4.2;
    brow(-38, E.bo, -9, E.bi);
    brow(38, E.bo, 9, E.bi);

    // eyes: human eye on his right, clock-dial eye on his left (brass)
    ART.eye(ctx, -22, -4, E.big ? 7.2 : 6.4, 0, E.look || 0, close, { lw: 1.8 });
    dialEye(ctx, 24, -2, 12, tt * 0.5, close);

    // mouth
    ctx.strokeStyle = K.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    switch (E.mouth) {
      case 'smile': ctx.moveTo(-14, 26); ctx.quadraticCurveTo(0, 40, 14, 26); ctx.stroke(); break;
      case 'frown': ctx.moveTo(-12, 37); ctx.quadraticCurveTo(0, 27, 12, 37); ctx.stroke(); break;
      case 'tight': ctx.moveTo(-11, 32); ctx.lineTo(11, 32); ctx.stroke(); break;
      case 'wave':
        ctx.moveTo(-13, 32); ctx.quadraticCurveTo(-6.5, 26, 0, 32);
        ctx.quadraticCurveTo(6.5, 38, 13, 31); ctx.stroke();
        break;
      case 'open': ART.ell(ctx, 0, 34, 7, 9, K.mouth, { lw: 2 }); break;
      default: ctx.moveTo(-12, 30); ctx.quadraticCurveTo(0, 32, 12, 29); ctx.stroke();
    }
  }

  ART.register({ id: 'elias', w: 30, h: 64, draw: draw, portrait: portrait });
})();

</script>
  <script>
/* js/art/chars/pivert.js */
/* Mrs. Pivert, the baker stuck in her loop (ch1-ch5). Plump and rosy-cheeked, brick-red dress,
   flour-stained white apron, blue headscarf with yellow polka dots, hair pinned up with a pencil,
   a round loaf held in both hands. Drawn facing right; origin (0,0) = centre of the feet; y negative is up.
   Overrides the base drawing for id 'pivert' (loaded after humanoid.js). */
(function () {
  'use strict';

  const OUT = ART.OUT;
  const clamp = ART.clamp;
  const lerp = ART.lerp;

  const BASE = {
    skin: '#f2c3a0', skinDark: '#d99a72', blush: '#ec7467',
    hair: '#6b4a33', dress: '#b0473a', apron: '#f6f0e2', flour: '#d3c5a6',
    scarf: '#2f5ea8', dot: '#f3cc4f', shoe: '#3a2a22', stocking: '#4b3a33',
    bread: '#c98a3d', crust: '#9c5a24', breadHi: '#e9b76c', dust: '#f7efdc',
    pencil: '#f2c94c', wood: '#e0b08a', mouth: '#8a3b33', mouthIn: '#6b2a2a',
    tongue: '#e8706a', brow: '#5b3e2b', drop: '#8fc3e8'
  };
  const FROST = '#a9bfd0';
  const STATES = ['idle', 'walk', 'run', 'jump', 'fall', 'land', 'attack', 'dash', 'hurt', 'dead', 'talk', 'slow', 'frozen'];
  const EXPRS = ['neutral', 'happy', 'sad', 'angry', 'surprised', 'worried'];
  const BROWS = {
    neutral: [[-27, -30, -9, -31], [9, -31, 27, -30]],
    happy: [[-27, -33, -9, -35], [9, -35, 27, -33]],
    sad: [[-27, -28, -9, -36], [9, -36, 27, -28]],
    angry: [[-27, -36, -9, -30], [9, -30, 27, -36]],
    surprised: [[-27, -35, -9, -39], [9, -39, 27, -35]],
    worried: [[-27, -29, -9, -40], [9, -40, 27, -29]]
  };

  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const smooth = (u) => u * u * (3 - 2 * u);

  function rgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(a, b, k) {
    const A = rgb(a), B = rgb(b);
    return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join('');
  }
  /* fz > 0 frosts the colours toward grey-blue (frozen NPC, slowed time). */
  function palette(fz) {
    const c = {};
    for (const k in BASE) c[k] = fz > 0 ? mix(BASE[k], FROST, fz) : BASE[k];
    c.dressDark = ART.shade(c.dress, -0.22);
    c.dressLight = ART.shade(c.dress, 0.16);
    c.apronShade = ART.shade(c.apron, -0.14);
    return c;
  }

  /* ---------- pose: turns the engine pose into body parameters ---------- */
  function pose(p) {
    const st = STATES.indexOf(p.state) >= 0 ? p.state : 'idle';
    const t = Math.max(0, num(p.t));
    const time = num(p.time);
    const m = {
      st, t, time,
      lean: 0, sx: 1, sy: 1, bob: 0, fz: 0, alpha: 1,
      feet: [[-3.6, 0], [3.6, 0]],                        // ground contact of each foot
      loaf: { x: 2, y: -17, rx: 6.6, ry: 4.6 },
      swing: null, behind: false, dash: false,
      blink: ((time % 3.4) + 3.4) % 3.4 < 0.12 ? 1 : 0,
      squint: 0, mouth: 0, mouthO: false,
      flutter: Math.sin(time * 2.2) * 0.7                  // scarf tails
    };
    switch (st) {
      case 'talk':
        m.sy = 1 + 0.012 * Math.sin(time * 2.4);
        m.lean = 0.03 * Math.sin(time * 2);
        m.loaf.y = -17 - 1.4 * Math.abs(Math.sin(time * 5.5));
        m.mouth = 0.5 + 0.5 * Math.sin(time * 18);
        break;
      case 'slow':
        m.sy = 1 + 0.015 * Math.sin(time * 0.9);
        m.lean = 0.01 * Math.sin(time * 0.5);
        m.fz = 0.2;
        break;
      case 'frozen':
        m.fz = 0.5;
        m.blink = 0;
        break;
      case 'walk':
      case 'run': {
        const run = st === 'run';
        const ph = time * (run ? 13 : 8.5);
        const s = Math.sin(ph), co = Math.cos(ph);
        const amp = run ? 4.6 : 3.2, lift = run ? 3 : 2;
        m.lean = (run ? 0.09 : 0) + (run ? 0.03 : 0.035) * s;   // waddle, forward lean when running
        m.bob = -(run ? 2.2 : 1.3) * Math.abs(s);              // two bounces per stride
        m.feet = [
          [-3.6 + amp * s, -lift * Math.max(0, co)],
          [3.6 - amp * s, -lift * Math.max(0, -co)]
        ];
        m.loaf.x = 2 - 0.8 * s;                                // the loaf sways against the stride
        break;
      }
      case 'jump':
        m.sx = 0.97; m.sy = 1.05; m.lean = 0.04;
        m.feet = [[-2.8, -4.2], [2.8, -4.6]];                  // tucked knees
        m.loaf.y = -20.5;
        break;
      case 'fall':
        m.sy = 1.02; m.lean = -0.02;
        m.feet = [[-4.4, -2.2], [4.2, -1.6]];
        m.loaf.y = -20;
        m.flutter = -1.2 + Math.sin(time * 9) * 0.5;
        break;
      case 'land': {
        const k = clamp(1 - t / 0.22, 0, 1);
        m.sx = 1 + 0.12 * k; m.sy = 1 - 0.16 * k;
        m.feet = [[-3.6 - 1.5 * k, 0], [3.6 + 1.5 * k, 0]];
        m.loaf.y = -17 + 1.5 * k;
        break;
      }
      case 'attack': {
        // wind-up behind her, then a wide arc forward with a trail; the loaf is the weapon
        const u = clamp(t / 0.45, 0, 1);
        const CX = 4, CY = -21, R = 14;
        let th;
        if (u < 0.3) th = lerp(-0.4, -2.7, smooth(u / 0.3));
        else if (u < 0.6) { const q = (u - 0.3) / 0.3; th = lerp(-2.7, 0.25, q * q); }
        else th = 0.25;
        m.lean = u < 0.3 ? -0.1 * (u / 0.3) : u < 0.6 ? lerp(-0.1, 0.2, (u - 0.3) / 0.3) : lerp(0.2, 0.05, (u - 0.6) / 0.4);
        m.loaf.x = CX + R * Math.cos(th);
        m.loaf.y = CY + R * Math.sin(th);
        m.behind = th < -1.2;
        if (u >= 0.3 && u < 0.75) m.swing = { cx: CX, cy: CY, R, from: Math.max(-2.7, th - 1.5), to: th };
        break;
      }
      case 'dash':
        m.sx = 1.04; m.sy = 0.96; m.lean = 0.24; m.dash = true;
        m.feet = [[-6.5, -0.8], [5.2, -0.4]];
        m.loaf.x = 6; m.loaf.y = -18;
        m.flutter = 0.6;
        break;
      case 'hurt': {
        const k = clamp(1 - t / 0.4, 0, 1);
