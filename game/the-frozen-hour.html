  <script>
/* js/art/creatures/rouage.js */
/* Rouage: clockwork crab of brass gears (creature). Plain browser script, contract in game/AGENT_BRIEF.md.
   Drawn facing right, origin (0,0) = centre of the feet, y negative is up. The engine flips it for left. */
(function () {
  const BRASS = '#c8963c';
  const BRASS_LT = '#ecc56e';
  const BRASS_DK = '#7d5219';
  const RED = '#d9372b';
  const RED_HOT = '#ff7a5c';
  const RED_DIM = '#6e1410';
  const GRAV = 40; // px/s^2, pulls the parts that fly apart on death

  // Rig, in px. Body centre (-1,-8), radius 6.5.
  const BODY = { x: -1, y: -8, r: 6.5 };
  const HIP = [[-5, -4.5], [-2, -2.2], [1.5, -2.2], [4.5, -4.5]]; // leg roots
  const FOOT = [-10, -5, 3.5, 8.5];                               // resting feet (y = 0)
  const LEG_PHASE = [0, Math.PI, Math.PI, 0];                      // diagonal gait
  const CLAW_UP = { base: [4.5, -10.5], wrist: [9.5, -13.5] };
  const CLAW_LO = { base: [5, -6], wrist: [10.5, -6.5] };
  const EYE = [2.6, -2.8];                                         // offset from body centre
  const ANTENNA = [
    { base: [-3.2, -13.8], coil: [-9.5, -16.6] },
    { base: [-0.5, -14.6], coil: [-6, -17.4] }
  ];
  // Death: main gear, three smaller gears, each with start position, launch speed and spin.
  const PARTS = [
    { x: -1, y: -8, r: 6.5, teeth: 9, vx: -12, vy: -34, spin: 5 },
    { x: 4, y: -10, r: 3.8, teeth: 7, vx: 22, vy: -30, spin: -8 },
    { x: -6, y: -5, r: 3.0, teeth: 6, vx: -26, vy: -12, spin: 9 },
    { x: 2, y: -3, r: 2.2, teeth: 5, vx: 8, vy: -40, spin: -11 },
    { x: -3, y: -14, r: 2.6, teeth: 6, vx: -6, vy: -26, spin: 7 }
  ];

  function num(v, d) { return typeof v === 'number' && isFinite(v) ? v : d; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function easeOut(u) { const k = clamp01(u); return 1 - (1 - k) * (1 - k); }

  // Eye blink: a short close every 3.6 s.
  function blinkAt(time) {
    const ph = ((time % 3.6) + 3.6) % 3.6;
    return ph < 0.14 ? 1 - Math.abs(ph - 0.07) / 0.07 : 0;
  }

  // Two-pass stroke: dark outline first, then the coloured line on top.
  function wire(ctx, build, col) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath(); build();
    ctx.strokeStyle = ART.OUT; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); build();
    ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke();
  }

  // Spring leg: a zig-zag coil from the hip (x1,y1) to the foot (x2,y2).
  function spring(ctx, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const pts = [];
    for (let i = 0; i <= 6; i++) {
      const u = i / 6;
      const o = i === 0 || i === 6 ? 0 : i % 2 ? 1.3 : -1.3;
      pts.push([x1 + dx * u + nx * o, y1 + dy * u + ny * o]);
    }
    wire(ctx, () => {
      pts.forEach((q, i) => { if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); });
    }, BRASS);
  }

  // Coiled antenna: a curved stem ending in a spiral centred on (cx,cy).
  function antenna(ctx, bx, by, cx, cy) {
    const R = 1.8;
    const sx = cx + R, sy = cy;
    wire(ctx, () => {
      ctx.moveTo(bx, by);
      ctx.bezierCurveTo(bx - 1.5, by - 3.5, sx + 2.5, sy - 2.5, sx, sy);
    }, BRASS_LT);
    wire(ctx, () => {
      for (let i = 0; i <= 18; i++) {
        const an = i * 0.5, rr = R - i * 0.085;
        const x = cx + Math.cos(an) * rr, y = cy + Math.sin(an) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }, BRASS_LT);
  }

  // Pincer jaw: a tapered blade from the wrist (wx,wy) along angle a.
  function jaw(ctx, wx, wy, a) {
    const L = 5.2, c = Math.cos(a), s = Math.sin(a);
    const local = [[0, -1.5], [L * 0.7, -1.2], [L, 0], [L * 0.7, 0.9], [0, 1.5]];
    const pts = local.map((q) => [wx + q[0] * c - q[1] * s, wy + q[0] * s + q[1] * c]);
    ART.poly(ctx, pts, BRASS, { lw: 1.4 });
  }

  // Claw: arm from base to wrist, two jaws spread by `open` radians (0 = closed).
  function claw(ctx, bx, by, wx, wy, open) {
    const dir = Math.atan2(wy - by, wx - bx);
    ART.limb(ctx, bx, by, wx, wy, 3.2, BRASS_DK, { lw: 1 });
    jaw(ctx, wx, wy, dir - open / 2);
    jaw(ctx, wx, wy, dir + open / 2);
    ART.ell(ctx, wx, wy, 1.6, 1.6, BRASS_LT, { lw: 1 });
  }

  // Poses. Each returns the same fields, so one routine draws every state.
  function poseIdle(time) {
    return {
      bob: Math.sin(time * 2.4) * 0.5, breathe: Math.sin(time * 2.4) * 0.25,
      lunge: 0, tilt: 0, rot: time * 0.5,
      open: 0.5 + 0.25 * Math.sin(time * 1.6),
      feet: FOOT.map((x) => [x, 0]),
      eye: RED, glow: 0, blink: blinkAt(time),
      sway: Math.sin(time * 2) * 0.5
    };
  }

  function poseWalk(time) {
    const ph = time * 9;
    const feet = FOOT.map((x, i) => {
      const a = ph + LEG_PHASE[i];
      return [x + Math.sin(a) * 3.2, -Math.max(0, Math.cos(a)) * 2.6];
    });
    return {
      bob: -Math.abs(Math.sin(ph)) * 0.9, breathe: 0,
      lunge: 0, tilt: 0, rot: time * 1.5,
      open: 0.5 + 0.35 * Math.sin(time * 4),
      feet, eye: RED, glow: 0, blink: blinkAt(time),
      sway: Math.sin(time * 5) * 1.2
    };
  }

  // Attack: crouch and draw the pincers in, lunge with them flared wide, hold, recover.
  function poseAttack(a, time) {
    let bob, lunge, open;
    if (a < 0.15) {
      const u = a / 0.15;
      bob = 1.2 * u; lunge = -2 * u; open = 0.3 * (1 - u);
    } else if (a < 0.3) {
      const u = easeOut((a - 0.15) / 0.15);
      bob = 1.2 - 1.7 * u; lunge = -2 + 7 * u; open = 1.35 * u;
    } else if (a < 0.5) {
      bob = -0.5; lunge = 5; open = 1.35;
    } else {
      const u = clamp01((a - 0.5) / 0.35);
      bob = -0.5 * (1 - u); lunge = 5 * (1 - u); open = 1.35 + (0.3 - 1.35) * u;
    }
    return {
      bob, breathe: 0, lunge, tilt: 0,
      rot: time * 0.5 + a * 14, open,
      feet: FOOT.map((x) => [x, 0]),
      eye: RED_HOT, glow: 1, blink: 0,
      sway: -2 * clamp01(lunge / 5)
    };
  }

  // Hurt: flinch back and shake, pincers snap shut, eye flashes then dims.
  function poseHurt(a) {
    const dec = clamp01(1 - a / 0.45);
    return {
      bob: 0.3 * dec, breathe: 0,
      lunge: -2.5 * dec + Math.sin(a * 70) * 0.8 * dec,
      tilt: -0.22 * dec,
      rot: a * 4, open: 0,
      feet: FOOT.map((x) => [x * (1 + 0.15 * dec), 0]),
      eye: a < 0.1 ? '#ffe6d6' : RED,
      glow: 0,
      blink: a > 0.1 && a < 0.3 ? 1 : 0,
      sway: 3 * dec * Math.sin(a * 30)
    };
  }

  function drawCrab(ctx, s, alpha) {
    const bx = BODY.x + s.lunge;
    const by = BODY.y + s.bob;
    const r = BODY.r + s.breathe;
    ctx.save();
    ctx.globalAlpha *= alpha == null ? 1 : clamp01(alpha);
    if (s.tilt) ctx.rotate(s.tilt); // pivots on the feet

    for (let i = 0; i < 4; i++) { // spring legs, behind the body
      const f = s.feet[i];
      spring(ctx, HIP[i][0] + s.lunge, HIP[i][1] + s.bob, f[0], f[1]);
      ART.ell(ctx, f[0], f[1] - 0.6, 1.4, 1, BRASS_DK, { lw: 1 });
    }

    // Pincers: the lower claw opens a little less than the upper one.
    claw(ctx, CLAW_UP.base[0] + s.lunge, CLAW_UP.base[1] + s.bob,
         CLAW_UP.wrist[0] + s.lunge, CLAW_UP.wrist[1] + s.bob, s.open);
    claw(ctx, CLAW_LO.base[0] + s.lunge, CLAW_LO.base[1] + s.bob,
         CLAW_LO.wrist[0] + s.lunge, CLAW_LO.wrist[1] + s.bob, s.open * 0.9);

    for (let i = 0; i < ANTENNA.length; i++) {
      const a = ANTENNA[i];
      antenna(ctx, a.base[0] + s.lunge, a.base[1] + s.bob, a.coil[0] + s.sway, a.coil[1] + s.bob);
    }

    ART.gear(ctx, bx, by, r, 9, s.rot, BRASS, { lw: 1.6 });
    for (let i = 0; i < 3; i++) { // rivets turn with the gear
      const an = s.rot + i * 2.094 + 0.5;
      ART.ell(ctx, bx + Math.cos(an) * r * 0.62, by + Math.sin(an) * r * 0.62, 0.7, 0.7, BRASS_DK, { stroke: false });
    }
    // Light from the upper left.
    ART.ell(ctx, bx - r * 0.5, by - r * 0.52, 2.2, 0.9, BRASS_LT, { stroke: false, alpha: 0.7, rot: -0.6 });

    const ex = bx + EYE[0], ey = by + EYE[1];
    if (s.glow > 0) ART.ell(ctx, ex, ey, 3.6, 3.6, RED_HOT, { stroke: false, alpha: 0.3 * s.glow });
    const ry = Math.max(0.35, 2 * (1 - clamp01(s.blink)));
    ART.ell(ctx, ex, ey, 2, ry, s.eye, { lw: 1.2 });
    if (ry > 1) ART.ell(ctx, ex - 0.6, ey - 0.7, 0.6, 0.45, '#fff1ea', { stroke: false, alpha: 0.9 });
    ctx.restore();
  }

  // Death: legs and claws fall away first, then the gears fly apart, land and fade.
  function drawDead(ctx, t) {
    if (t < 0.3) drawCrab(ctx, poseIdle(0), 1 - t / 0.3);
    const a = clamp01(1 - (t - 0.3) / 1.0);
    const ea = clamp01(1 - (t - 0.1) / 0.6);
    if (a <= 0 && ea <= 0) return;
    ctx.save();
    if (a > 0) {
      for (let i = 0; i < PARTS.length; i++) {
        const q = PARTS[i];
        const x = q.x + q.vx * t;
        const y = Math.min(q.y + q.vy * t + 0.5 * GRAV * t * t, -q.r); // comes to rest on the ground
        ART.gear(ctx, x, y, q.r, q.teeth, q.spin * t, BRASS, { lw: 1.4, alpha: a });
      }
    }
    if (ea > 0) { // the red eye bead
      ART.ell(ctx, 1.6 + 14 * t, -10.8 - 22 * t + 0.5 * GRAV * t * t, 1.3, 1.3, RED_HOT, { stroke: false, alpha: ea });
    }
    ctx.restore();
  }

  function draw(ctx, pose) {
    const p = pose || {};
    const t = Math.max(0, num(p.t, 0));
    const time = num(p.time, 0);
    switch (p.state) {
      case 'walk': return drawCrab(ctx, poseWalk(time));
      case 'attack': return drawCrab(ctx, poseAttack(t, time));
      case 'hurt': return drawCrab(ctx, poseHurt(t));
      case 'dead': return drawDead(ctx, t);
      default: return drawCrab(ctx, poseIdle(time)); // idle, and any unknown state
    }
  }

  // Stub portrait: a brass gear with a red eye.
  function portrait(ctx, expr, t) {
    ART.gear(ctx, 0, 0, 64, 12, num(t, 0) * 0.3, BRASS, { lw: 3 });
    ART.ell(ctx, 0, 0, 26, 26, RED, { lw: 3 });
    ART.ell(ctx, -8, -9, 7, 4, '#fff1ea', { stroke: false, alpha: 0.8 });
  }

  ART.register({ id: 'rouage', w: 26, h: 18, draw: draw, portrait: portrait });
})();

  <script>
/* js/art/creatures/fige.js */
/* Creature "fige": a citizen of Vermeil turned to grey stone, frozen mid-step.
   Facing right; origin (0,0) = centre of the feet, y negative is up. Registered with ART (id 'fige', 26x48).
   idle: still, dim eyes. walk: stop-motion, snaps on a 0.25 s beat. attack: wind-up, arm sweep, eyes and
   cracks turn red-orange. hurt: flinch. dead: splits in two and crumbles to dust. Unknown states act as idle. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const easeOut = (x) => 1 - (1 - x) * (1 - x);
  const bez = (a, c, b, t) => {
    const u = 1 - t;
    return [
      u * u * a[0] + 2 * u * t * c[0] + t * t * b[0],
      u * u * a[1] + 2 * u * t * c[1] + t * t * b[1],
    ];
  };
  // deterministic pseudo-random in [0, 1) for the dust specks
  const rnd = (i, s) => {
    const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
    return v - Math.floor(v);
  };

  const C = {
    stoneLt: '#c4bdb1', stone: '#aaa398', stoneDk: '#756f66',
    coat: '#7b766d', coatDk: '#5d5951',
    hat: '#43474f', hatDk: '#30333b',
    crack: '#3b3730', dust: '#b8b1a5',
    eyeIdle: '#d9cf82', eyeWalk: '#fff1a8', eyeHot: '#ff5a1f', glow: '#ff6a2a',
  };

  // cracks in upper-body space (they move with the torso)
  const CRACKS = [
    [[-3.2, -49.5], [-1.1, -47.2], [-2.5, -44.2], [-0.6, -41.6]],   // head
    [[-4.6, -34], [-1.8, -29.5], [-3.4, -24.5], [-1.2, -20]],       // coat, back
    [[4.6, -33.5], [3.2, -29.5], [5.4, -25.5]],                     // coat, front
    [[-0.4, -21], [1.9, -16], [0.6, -12.5]],                        // coat, hem
    [[-1.2, -56], [0.3, -54.4], [-0.4, -52.2]],                     // hat crown
  ];

  const EYES = {
    dim:   { col: C.eyeIdle, alpha: 0.5, halo: 0 },
    pale:  { col: C.eyeWalk, alpha: 1, halo: 0.25 },
    hot:   { col: C.eyeHot, alpha: 1, halo: 0.5 },
    flash: { col: '#ffffff', alpha: 1, halo: 0.4 },
  };

  function crack(ctx, pts, col, lw, alpha) {
    ctx.save();
    ctx.globalAlpha *= clamp(alpha, 0, 1);
    ctx.strokeStyle = col;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.restore();
  }

  function glowCracks(ctx, k) {
    const shimmer = 0.75 + 0.25 * Math.sin(k.tm * 18);
    ctx.save();
    ctx.shadowColor = C.glow;
    ctx.shadowBlur = 6;
    for (const pts of CRACKS) crack(ctx, pts, C.glow, 1.3, clamp(k.glow * shimmer * 0.7, 0, 0.7));
    ctx.restore();
  }

  function eyes(ctx, k) {
    const e = k.eye === 'off' ? null : (EYES[k.eye] || EYES.dim);
    const spots = [[0.4, -45.4], [3.9, -45.2]];
    for (const [x, y] of spots) {
      if (!e) {
        ART.ell(ctx, x, y, 1.2, 0.9, C.crack, { stroke: false, alpha: 0.8 });   // empty sockets
        continue;
      }
      if (e.halo) ART.ell(ctx, x, y, 3, 2.6, e.col, { stroke: false, alpha: e.halo });
      ART.ell(ctx, x, y, 1.6, 1.4, e.col, { lw: 0.8, alpha: e.alpha });
    }
  }

  // one leg: the boot snaps to its spot; the hip stays put
  function leg(ctx, bx, lift, limbCol) {
    ART.limb(ctx, bx * 0.3, -15, bx, -4 - lift, 4.2, limbCol, { lw: 1.2 });
    ART.rr(ctx, bx - 3.5, -5 - lift, 8.5, 5, 1.6, C.hat, { lw: 1.3 });
  }

  function body(ctx, k) {
    ctx.save();
    leg(ctx, k.farX, k.farLift, C.stoneDk);
    leg(ctx, k.nearX, k.nearLift, C.stone);

    // upper body: lunge and bob, then lean around the hips
    ctx.translate(k.lunge, k.bob);
    ctx.translate(0, -14);
    ctx.rotate(k.lean);
    ctx.translate(0, 14);

    // far arm, behind the coat
    ART.limb(ctx, -5.5, -36, k.farHand[0], k.farHand[1], 4.2, C.coatDk, { lw: 1.2 });
    ART.ell(ctx, k.farHand[0], k.farHand[1], 2.3, 2.3, C.stone, { lw: 1.1 });

    // long coat with a flared hem
    ART.poly(ctx, [[-8, -38], [7.5, -38], [8, -27], [10.5, -10], [-10.5, -10], [-6.5, -27]], C.coat, { lw: 1.6 });
    ART.poly(ctx, [[-3.5, -38], [1.8, -38], [-0.2, -26]], C.coatDk, { lw: 1 });   // lapel
    ART.ell(ctx, 0.6, -31, 0.9, 0.9, C.stoneLt, { lw: 0.8 });                    // buttons
    ART.ell(ctx, 0.6, -23, 0.9, 0.9, C.stoneLt, { lw: 0.8 });
    ART.limb(ctx, 0.5, -38, 0.5, -41, 4, C.stone, { lw: 1 });                    // neck
    ART.poly(ctx, [[-4.5, -40], [5, -40], [5.5, -36.5], [-4.5, -36.5]], C.coatDk, { lw: 1 });   // collar

    // head, with light from the upper left
    ART.ell(ctx, 0.5, -44.5, 6.2, 6.6, C.stoneLt, { lw: 1.6 });
    ART.ell(ctx, -2.6, -47.4, 2, 1.1, '#ffffff', { stroke: false, alpha: 0.28 });
    eyes(ctx, k);

    // bowler hat: crown, then brim over the head
    ART.ell(ctx, 0.5, -53.6, 5.8, 4.2, C.hat, { lw: 1.3 });
    ART.ell(ctx, -2, -55.6, 2.2, 1.1, '#ffffff', { stroke: false, alpha: 0.12 });
    ART.ell(ctx, 0.5, -50.2, 8.4, 2, C.hatDk, { lw: 1.3 });

    // motion trail of the strike arm (attack only)
    for (const g of k.trail || []) ART.limb(ctx, 5.5, -36, g[0], g[1], 3, C.glow, { stroke: false, alpha: g[2] });

    // near arm, in front of the coat
    ART.limb(ctx, 5.5, -36, k.nearHand[0], k.nearHand[1], 4.4, C.coat, { lw: 1.3 });
    ART.ell(ctx, k.nearHand[0], k.nearHand[1], 2.4, 2.4, C.stoneLt, { lw: 1.1 });

    for (const pts of CRACKS) crack(ctx, pts, C.crack, 1.1, 0.9);
    if (k.glow > 0.02) glowCracks(ctx, k);
    ctx.restore();
  }

  // pose values for one frame; every state is computed from pose.t and pose.time
  function poseFor(pose, st) {
    const t = Math.max(0, num(pose.t, 0));
    const tm = num(pose.time, 0);
    const k = {
      tm, lean: 0, lunge: 0, bob: 0,
      nearX: 0, nearLift: 0, farX: 0, farLift: 0,
      nearHand: [9, -23], farHand: [-7, -23],
      eye: 'dim', glow: 0, trail: null,
    };
    if (st === 'walk') {
      // stop-motion: the pose changes only on each 0.25 s beat; four beats make one step
      const f = ((Math.floor(tm / 0.25) % 4) + 4) % 4;
      k.nearX = [3, 0, -3, 0][f];
      k.nearLift = [0, 0, 0, 2][f];
      k.farX = [-3, 0, 3, 0][f];
      k.farLift = [0, 2, 0, 0][f];
      k.nearHand = [9 - k.nearX * 0.8, -23];   // each arm swings against its own leg
      k.farHand = [-7 - k.farX * 0.8, -23];
      k.bob = f % 2 ? -1 : 0;
      k.lean = f % 2 ? 0.04 : -0.02;
      k.eye = 'pale';
    } else if (st === 'attack') {
      k.eye = 'hot';
      const start = [-5, -28], ctrl = [7, -20], end = [16, -33];
      if (t < 0.16) {                         // wind-up: rear back, cracks begin to warm
        const a = t / 0.16;
        k.lean = -0.2 * a;
        k.lunge = -2 * a;
        k.nearHand = lerp2([9, -23], start, a);
        k.farHand = lerp2([-7, -23], [-9, -33], a);
        k.glow = a;
      } else if (t < 0.28) {                  // strike: the arm sweeps forward along an arc
        const e = easeOut((t - 0.16) / 0.12);
        k.lean = -0.2 + 0.58 * e;
        k.lunge = -2 + 7 * e;
        k.nearHand = bez(start, ctrl, end, e);
        k.trail = [
          [...bez(start, ctrl, end, Math.max(0, e - 0.35)), 0.3 * e],
          [...bez(start, ctrl, end, Math.max(0, e - 0.7)), 0.15 * e],
        ];
        k.farHand = [-9, -33];
        k.glow = 1;
      } else {                                // recovery: the heat drains out
        const r = clamp((t - 0.28) / 0.6, 0, 1);
        k.lean = 0.38 * (1 - r);
        k.lunge = 7 * (1 - r);
        k.nearHand = lerp2(end, [9, -23], r);
        k.farHand = lerp2([-9, -33], [-7, -23], r);
        k.glow = 1 - r;
      }
    } else if (st === 'hurt') {
      const a = clamp(1 - t / 0.3, 0, 1);    // flinch that settles within 0.3 s
      k.lean = -0.28 * a;
      k.lunge = -5 * a;
      k.nearHand = lerp2([9, -23], [12, -28], a);
      k.farHand = lerp2([-7, -23], [-11, -27], a);
      k.eye = t < 0.1 ? 'flash' : 'dim';
      k.glow = 0.5 * a;
    }
    return k;
  }

  function dust(ctx, t) {
    const N = 22;
    ctx.save();
    const puff = clamp(t / 0.8, 0, 1) * (1 - clamp((t - 0.6) / 1.4, 0, 1));
    if (puff > 0.01) ART.ell(ctx, 0, -1.5, 4 + 8 * puff, 2 + 1.5 * puff, C.dust, { stroke: false, alpha: 0.45 * puff });
    for (let i = 0; i < N; i++) {
      const u = t - 0.4 - rnd(i, 1) * 0.5;   // each speck leaves at its own moment
      if (u <= 0) continue;
      const a = 1 - clamp(u / 1.5, 0, 1);
      if (a <= 0.01) continue;
      const x0 = (rnd(i, 2) - 0.5) * 16;
      const y0 = -6 - rnd(i, 3) * 38;
      const vx = (rnd(i, 4) - 0.5) * 14 + x0 * 0.4;
      const vy = -3 - rnd(i, 5) * 7;
      const x = x0 + vx * u;
      const y = Math.min(0, y0 + vy * u + 13 * u * u);   // gravity, settles on the ground
      ctx.globalAlpha = a;
      ctx.fillStyle = C.dust;
      ctx.beginPath();
      ctx.arc(x, y, 0.6 + rnd(i, 6) * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawDead(ctx, pose) {
    const t = Math.max(0, num(pose.t, 0));
    const k = poseFor({ time: num(pose.time, 0) }, 'idle');
    k.eye = 'off';
    const split = easeOut(clamp(t / 0.45, 0, 1));     // 0..1: the two halves part
    const crumble = clamp((t - 0.45) / 1.0, 0, 1);    // 0..1: the stone gives way
    const fade = 1 - crumble;
    if (fade > 0.01) {
      if (split < 0.01) {
        ctx.save();
        ctx.globalAlpha *= fade;
        body(ctx, k);
        ctx.restore();
      } else {
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.globalAlpha *= fade;
          ctx.translate(side * 4.5 * split, 6 * crumble);
          ctx.rotate(side * 0.2 * split);
          ctx.beginPath();
          ctx.rect(side < 0 ? -40 : 0, -70, 40, 80);   // this half only, in figure space
          ctx.clip();
          body(ctx, k);
          ctx.restore();
        }
      }
    }
    dust(ctx, t);
  }

  function draw(ctx, p) {
    const pose = p || {};
    const st = typeof pose.state === 'string' ? pose.state : 'idle';
    if (st === 'dead') {
      drawDead(ctx, pose);
      return;
    }
    body(ctx, poseFor(pose, st));
  }

  const BROWS = {
    neutral:   [[-36, -14, -12, -16], [12, -16, 36, -14]],
    happy:     [[-36, -16, -12, -18], [12, -18, 36, -16]],
    sad:       [[-34, -12, -12, -22], [12, -22, 34, -12]],
    angry:     [[-36, -28, -12, -16], [12, -16, 36, -28]],
    surprised: [[-36, -24, -12, -30], [12, -30, 36, -24]],
    worried:   [[-34, -12, -12, -24], [12, -24, 34, -12]],
  };

  function portrait(ctx, expr, t) {
    const e = BROWS[expr] ? expr : 'neutral';
    const blink = num(t, 0) % 4 < 0.12 ? 1 : 0;
    ART.poly(ctx, [[-98, 100], [-82, 64], [82, 64], [98, 100]], C.coat, { lw: 3 });   // shoulders
    ART.ell(ctx, 0, 6, 54, 62, C.stoneLt, { lw: 4 });                                  // head
    ART.eye(ctx, -20, 2, 9, 0, 0, blink, { white: C.eyeWalk, pupil: '#3a3320', lw: 2.5 });
    ART.eye(ctx, 20, 2, 9, 0, 0, blink, { white: C.eyeWalk, pupil: '#3a3320', lw: 2.5 });
    for (const [x1, y1, x2, y2] of BROWS[e]) ART.limb(ctx, x1, y1, x2, y2, 5, C.hatDk, { lw: 1.5 });
    crack(ctx, [[24, 22], [34, 30], [28, 44]], C.crack, 2.5, 0.8);
    ctx.save();
    ctx.strokeStyle = C.crack;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (e === 'surprised') {
      ctx.ellipse(0, 40, 7, 9, 0, 0, Math.PI * 2);
      ctx.fillStyle = C.crack;
      ctx.fill();
    } else if (e === 'happy') {
      ctx.moveTo(-14, 36); ctx.quadraticCurveTo(0, 52, 14, 36); ctx.stroke();
    } else if (e === 'sad' || e === 'worried') {
      ctx.moveTo(-14, 46); ctx.quadraticCurveTo(0, 34, 14, 46); ctx.stroke();
    } else if (e === 'angry') {
      ctx.moveTo(-12, 40); ctx.lineTo(12, 44); ctx.stroke();
    } else {
      ctx.moveTo(-13, 42); ctx.lineTo(13, 42); ctx.stroke();
    }
    ctx.restore();
    ART.ell(ctx, 0, -44, 66, 9, C.hatDk, { lw: 3.5 });   // bowler brim
    ART.ell(ctx, 0, -60, 42, 26, C.hat, { lw: 3.5 });    // bowler crown
  }

  ART.register({ id: 'fige', w: 26, h: 48, draw, portrait });
})();

  <script>
/* js/art/creatures/sablier.js */
/* Creature: sablier, a flying hourglass with paper wings that feeds on lost moments.
   Facing right; origin (0,0) = bottom of the glass, hitbox 26 x 34. Plain browser script, registered with ART. */
(function () {
  const P = {
    brass: '#c9963f', brassHi: '#f0d78f', brassDark: '#7a5222',
    glass: 'rgba(200,235,255,0.38)', glassHi: 'rgba(255,255,255,0.9)',
    sand: '#e8a13a', sandHi: '#ffd27a',
    paper: '#f4efe6', paperDark: '#cdbfa6', ink: '#3a3a44',
  };
  const TOP = -29.5, WAIST = -17.2, BOT = -4.5; // glass extent along y
  const HINGE_Y = -19;                          // wings join the glass here

  // Wing flap per state: [base angle above horizontal, amplitude, speed]. Angles in radians.
  const FLAP = {
    idle: [0.6, 0.45, 9],
    walk: [0.6, 0.5, 13],
    attack: [0.25, 0.05, 30],   // wings tucked back along the body
    hurt: [0.8, 0.4, 28],
    dead: [-0.15, 0, 0],        // wings stopped, hanging limp
  };

  // Both bulbs as one closed path, joined at the waist.
  function glassPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-7, TOP);
    ctx.bezierCurveTo(-7, -23, -1.2, -20.5, -1, WAIST);
    ctx.bezierCurveTo(-1.2, -14, -7, -11, -7, BOT);
    ctx.lineTo(7, BOT);
    ctx.bezierCurveTo(7, -11, 1.2, -14, 1, WAIST);
    ctx.bezierCurveTo(1.2, -20.5, 7, -23, 7, TOP);
    ctx.closePath();
  }

  function grain(ctx, x, y, r, a) {
    ctx.save();
    ctx.globalAlpha *= ART.clamp(a, 0, 1);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = P.sandHi;
    ctx.fill();
    ctx.restore();
  }

  // Faint trail of grains falling behind the flight path.
  function trail(ctx, tm) {
    for (let i = 0; i < 5; i++) {
      const s = ((tm * 0.9 + i / 5) % 1 + 1) % 1;
      grain(ctx, -4 - s * 12 + Math.sin(tm * 3 + i) * 0.8, -15 + s * s * 15, 0.9, (1 - s) * 0.6);
    }
  }

  // Speed streaks behind the body during the dive.
  function streaks(ctx, k) {
    ctx.save();
    ctx.globalAlpha *= 0.55 * ART.clamp(k, 0, 1);
    ctx.strokeStyle = P.sandHi;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-12, -24); ctx.lineTo(-22, -28);
    ctx.moveTo(-10, -17); ctx.lineTo(-24, -17);
    ctx.moveTo(-12, -10); ctx.lineTo(-21, -6);
    ctx.stroke();
    ctx.restore();
  }

  // One paper wing: root (rx, ry), angle a above horizontal pointing back, length len.
  function wing(ctx, rx, ry, a, len, fill) {
    const dx = -Math.cos(a), dy = -Math.sin(a); // points back and up
    const nx = -dy, ny = dx;                    // leading edge side (up and forward)
    const at = (s, o) => [rx + dx * len * s + nx * len * o, ry + dy * len * s + ny * len * o];
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    let c = at(0.5, 0.2), e = at(1, 0);
    ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]);          // leading edge
    c = at(0.84, -0.2); e = at(0.66, -0.12);
    ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]);          // scalloped trailing edge
    c = at(0.5, -0.24); e = at(0.33, -0.12);
    ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]);
    c = at(0.16, -0.2);
    ctx.quadraticCurveTo(c[0], c[1], rx, ry);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = ART.OUT;
    ctx.stroke();
    // ink veins
    ctx.beginPath();
    [[0.6, 0.07], [0.88, -0.02], [0.5, -0.1]].forEach(function (v) {
      const q = at(v[0], v[1]);
      ctx.moveTo(rx, ry);
      ctx.lineTo(q[0], q[1]);
    });
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 0.8;
    ctx.globalAlpha *= 0.85;
    ctx.stroke();
    ctx.restore();
  }

  // Glass, sand (clipped to the glass), outline, glint and the stream through the waist.
  function drawGlass(ctx, fu, tm) {
    const fl = 1 - fu;
    const lowTop = BOT - fl * 9; // surface of the sand pile in the lower bulb
    glassPath(ctx);
    ctx.fillStyle = P.glass;
    ctx.fill();
    ctx.save();
    glassPath(ctx);
    ctx.clip();
    ctx.fillStyle = P.sand;
    if (fu > 0.02) ctx.fillRect(-9, WAIST - fu * 11, 18, fu * 11 + 1); // upper sand rests on the waist
    if (fl > 0.02) {
      ctx.fillRect(-9, lowTop, 18, BOT - lowTop + 3);
      ctx.beginPath();
      ctx.ellipse(0, lowTop, 7, 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    glassPath(ctx);
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = ART.OUT;
    ctx.stroke();
    ctx.beginPath(); // glint on the upper bulb
    ctx.moveTo(-4.6, -26);
    ctx.quadraticCurveTo(-4.2, -22.5, -2.8, -20.2);
    ctx.strokeStyle = P.glassHi;
    ctx.lineWidth = 1.1;
    ctx.stroke();
    if (fu > 0.02) { // stream through the waist, wobbling
      ctx.beginPath();
      ctx.moveTo(0, WAIST);
      ctx.lineTo(Math.sin(tm * 22) * 0.35, fl > 0.02 ? lowTop : BOT - 1);
      ctx.strokeStyle = P.sandHi;
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  // Brass caps with glints and rivets.
  function drawCaps(ctx) {
    ART.rr(ctx, -9, -33, 18, 3.5, 1.2, P.brass, { lw: 1.4 });
    ART.rr(ctx, -9, BOT, 18, 3.5, 1.2, P.brass, { lw: 1.4 });
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-6, -31.9); ctx.lineTo(4, -31.9);
    ctx.moveTo(-6, -3.6); ctx.lineTo(4, -3.6);
    ctx.strokeStyle = P.brassHi;
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
    [[-6.5, -31.25], [6.5, -31.25], [-6.5, -2.75], [6.5, -2.75]].forEach(function (r) {
      ART.ell(ctx, r[0], r[1], 0.9, 0.9, P.brassDark, { lw: 0.6 });
    });
  }

  function draw(ctx, p) {
    const pose = p || {};
    const st = Object.prototype.hasOwnProperty.call(FLAP, pose.state) ? pose.state : 'idle';
    const t = Math.max(0, Number(pose.t) || 0);
    const tm = Number(pose.time) || 0;
    const f = FLAP[st];
    let dx = 0, dy = 0, tilt = 0, lenK = 1, fade = 1;
    let fu = 1 - ((tm / 7) % 1 + 1) % 1; // upper sand left: drains, then the hour turns

    switch (st) {
      case 'walk':
        dy = Math.sin(tm * 4.2) * 1.4;
        tilt = Math.sin(tm * 2.1) * 0.1;
        break;
      case 'attack':
        lenK = 0.6;
        if (t < 0.14) { tilt = -0.3 * (t / 0.14); dx = -2 * (t / 0.14); } // pull back
        else tilt = Math.min(1.2, -0.3 + (t - 0.14) * 10);               // dive nose-down
        break;
      case 'hurt': {
        const k = Math.max(0, 1 - t / 0.35);
        tilt = -0.3 * k;
        dx = -3 * k;
        break;
      }
      case 'dead':
        tilt = t * 4.2;                                  // tumbling
        dy = Math.min(t * t * 12, 16);
        fade = t > 1.5 ? Math.max(0, 1 - (t - 1.5) / 0.6) : 1;
        fu = 1 - Math.min(1, t / 1.8);                   // sand runs out
        break;
      default: // idle
        dy = Math.sin(tm * 2.2) * 1.0;
        tilt = Math.sin(tm * 1.3) * 0.05;
    }

    const wingA = function (ph) { return f[0] + f[1] * Math.sin(tm * f[2] + ph); };
    ctx.save();
    ctx.globalAlpha *= fade;
    ctx.translate(dx, dy);
    ctx.translate(0, WAIST);
    ctx.rotate(tilt);
    ctx.translate(0, -WAIST);
    if (st !== 'dead') trail(ctx, tm);
    if (st === 'attack') streaks(ctx, (t - 0.1) / 0.1);
    wing(ctx, 0, HINGE_Y, wingA(0.5), 14.5 * lenK, P.paperDark); // far wing
    wing(ctx, 0, HINGE_Y, wingA(0), 17 * lenK, P.paper);         // near wing
    drawGlass(ctx, fu, tm);
    drawCaps(ctx);
    ART.ell(ctx, 0, HINGE_Y, 1.7, 1.7, P.brassDark, { lw: 0.8 }); // wing hinge
    ctx.restore();
  }

  // Portrait stub: the creature scaled up and centred in the 200x200 box.
  function portrait(ctx, expr, t) {
    ctx.save();
    ctx.scale(4, 4);
    ctx.translate(0, 17);
    draw(ctx, { state: 'idle', time: Number(t) || 0 });
    ctx.restore();
  }

  ART.register({ id: 'sablier', w: 26, h: 34, draw: draw, portrait: portrait });
})();

(function () {
  const TH = {
    station: {
      sky: ['#14122a', '#3a3152'], far: '#241f3d', mid: '#1a1730', fg: '#0d0b1a',
      stone: '#5a5266', mortar: '#3b3548', top: '#8c85a0', plat: '#6d6b78', platTop: '#a9a7b4',
      accent: '#f2c66d', rain: true,
    },
    market: {

      stone: '#b99470', mortar: '#8a6a4f', top: '#e2c08f', plat: '#7a4f2e', platTop: '#b07a48',
      accent: '#ffd27a', dust: true,
    },
    foundry: {
      sky: ['#1e0b08', '#6b2412'], far: '#3a1510', mid: '#2a0f0b', fg: '#140605',
      stone: '#4b4040', mortar: '#2c2424', top: '#7d6a64', plat: '#5a3a2a', platTop: '#8e5a3a',
      accent: '#ff8a3d', embers: true,
    },
    tower: {
      sky: ['#161c2a', '#3a4a5e'], far: '#2a3646', mid: '#1f2936', fg: '#0e131c',
      stone: '#6b6f7c', mortar: '#3e434f', top: '#9aa0ae', plat: '#7a5a3a', platTop: '#b08a5a',
      accent: '#8fd3e8', dust: true,
    },
    clockface: {
      sky: ['#2a2a52', '#e8b060'], far: '#c9a0a0', mid: '#a0708a', fg: '#4a3050',
      stone: '#e9e2d4', mortar: '#b9b0a0', top: '#ffffff', plat: '#c9a050', platTop: '#f2d27a',
      accent: '#ffe39a', light: true,
    },
  };
  const get = (t) => TH[t] || TH.station;

  function drawSky(ctx, th, W, H) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function silhouetteRow(ctx, color, camX, factor, base, H, seed) {
    ctx.fillStyle = color;
    const period = 240;
    const off = -((camX * factor) % period);
    for (let i = -1; i < 6; i++) {
      const x = off + i * period;
      const h = 90 + ((i * 37 + seed * 13) % 110 + 110) % 110;
      ctx.fillRect(x, base - h, period * 0.62, h + (H - base));
      ctx.beginPath();
      ctx.moveTo(x - 6, base - h);
      ctx.lineTo(x + period * 0.31, base - h - 34);
      ctx.lineTo(x + period * 0.68, base - h);
      ctx.fill();
    }
  }

  function drawClock(ctx, cx, cy, r, color, hourA, minA) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,30,20,0.6)'; ctx.lineWidth = Math.max(2, r * 0.05);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(40,30,20,0.85)';
    ctx.lineWidth = r * 0.06; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(hourA) * r * 0.5, cy - Math.cos(hourA) * r * 0.5); ctx.stroke();
    ctx.lineWidth = r * 0.035;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(minA) * r * 0.8, cy - Math.cos(minA) * r * 0.8); ctx.stroke();
    ctx.restore();
  }

  // 23:47 frozen: hour hand just before 12 (near 11.8h), minute hand at 47 min.
  const HOUR_A = (11.78 / 12) * Math.PI * 2, MIN_A = (47 / 60) * Math.PI * 2;

  function themeOverride(theme) {
    const O = window.ENV_THEMES && window.ENV_THEMES[theme];
    return O || null;
  }

  function drawBackground(ctx, theme, camX, camY, t, W, H) {
    const O = themeOverride(theme);
    if (O && typeof O.background === 'function') { O.background(ctx, camX, camY, t, W, H); return; }
    const th = get(theme);
    drawSky(ctx, th, W, H);
    const cx = camX || 0;
    // far clock / sun
    if (theme === 'clockface') {
      ctx.globalAlpha = 0.9;
      drawClock(ctx, W * 0.72 - cx * 0.05, 150 - (camY || 0) * 0.05, 130, '#f6ecd6', HOUR_A, MIN_A);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % 220, 2, 2);
    } else if (theme === 'station') {
      drawClock(ctx, W * 0.5 - cx * 0.12, 120, 78, '#e8e0cc', HOUR_A, MIN_A);
    }
    silhouetteRow(ctx, th.far, cx, 0.2, H * 0.62, H, 1);
    silhouetteRow(ctx, th.mid, cx, 0.45, H * 0.8, H, 2);
    if (theme === 'foundry') {
      const glow = 0.25 + 0.1 * Math.sin((t || 0) * 3);
      ctx.fillStyle = 'rgba(255,120,40,' + glow.toFixed(3) + ')';
      ctx.fillRect(0, H * 0.6, W, H * 0.4);
      for (let i = 0; i < 6; i++) {
        const x = ((i * 200 - cx * 0.3) % (W + 200) + W + 200) % (W + 200) - 100;
        ctx.fillStyle = 'rgba(200,190,180,0.14)';
        ctx.beginPath(); ctx.arc(x, H * 0.35 - ((t || 0) * 10 + i * 30) % 120, 40 + i * 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (theme === 'tower') {
      ctx.save();
      ctx.globalAlpha = 0.25;
      for (let i = 0; i < 3; i++) {
        const gx = W * (0.2 + i * 0.3) - cx * 0.15;
        ctx.strokeStyle = '#8fa8b8'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(gx, H * 0.45 - (camY || 0) * 0.1, 90 + i * 20, 0, Math.PI * 2); ctx.stroke();
        for (let k = 0; k < 12; k++) {
          const a = k / 12 * Math.PI * 2;
          ctx.fillStyle = '#8fa8b8';
          ctx.fillRect(gx + Math.cos(a) * 92, H * 0.45 - (camY || 0) * 0.1 + Math.sin(a) * 92 - 4, 14, 8);
        }
      }
      ctx.restore();
    }
    if (theme === 'market') {
      // striped awnings along the top
      ctx.save();
      for (let i = 0; i < 12; i++) {
        const x = ((i * 90 - cx * 0.5) % 1080 + 1080) % 1080 - 60;
        ctx.fillStyle = i % 2 ? '#e8d5a0' : '#b8524a';
        ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x + 90, 40); ctx.lineTo(x + 84, 88); ctx.lineTo(x + 45, 100); ctx.lineTo(x + 6, 88); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    // ground haze
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, H * 0.82, W, H * 0.18);
  }

  /* ---------- tiles ---------- */
  function brickPattern(ctx, x, y, th, s) {
    ctx.strokeStyle = th.mortar;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let row = 0; row < 4; row++) {
      const yy = y + row * 8 + 0.5;
      ctx.moveTo(x, yy); ctx.lineTo(x + s, yy);
      const off = row % 2 ? 0 : 8;
      for (let c = off; c < s; c += 16) { ctx.moveTo(x + c + 0.5, yy); ctx.lineTo(x + c + 0.5, yy + 8); }
    }
    ctx.stroke();
  }

  function drawTile(ctx, theme, chr, x, y, t, nb) {
    const O = themeOverride(theme);
    if (O && typeof O.tile === 'function') { O.tile(ctx, chr, x, y, t, nb); return; }
    const th = get(theme);
    const n = nb || {};
    const S = 32;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, S, S); ctx.clip();
    if (chr === '#') {
      ctx.fillStyle = th.stone; ctx.fillRect(x, y, S, S);
      brickPattern(ctx, x, y, th, S);
      ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x, y, S, 3);
      if (!n.u) { ctx.fillStyle = th.top; ctx.fillRect(x, y, S, 5); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y + 5, S, 2); }
      if (!n.l) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x, y, 2, S); }
      if (!n.r) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + S - 2, y, 2, S); }
    } else if (chr === '=') {
      ctx.fillStyle = th.plat; ctx.fillRect(x, y + 6, S, 10);
      ctx.fillStyle = th.platTop; ctx.fillRect(x, y + 4, S, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 3, y + 16, 3, 10); ctx.fillRect(x + S - 6, y + 16, 3, 10);
      ctx.fillStyle = th.accent; for (let i = 4; i < S; i += 10) ctx.fillRect(x + i, y + 8, 2, 2);
    } else if (chr === '^') {
      ctx.fillStyle = '#b8862e';
      for (let i = 0; i < 4; i++) {
        const sx = x + 2 + i * 8;
        ctx.beginPath(); ctx.moveTo(sx, y + S); ctx.lineTo(sx + 4, y + 8); ctx.lineTo(sx + 8, y + S); ctx.closePath();
        ctx.fill(); ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1; ctx.stroke();
      }
    } else if (chr === 'C') {
      const flick = 0.85 + 0.15 * Math.sin(t * 9 + x);
      const g = ctx.createRadialGradient(x + 16, y + 14, 2, x + 16, y + 14, 20);
      g.addColorStop(0, 'rgba(255,220,130,' + (0.7 * flick).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,220,130,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 4, y - 6, S + 8, S + 8);
      ctx.fillStyle = '#2a2024'; ctx.fillRect(x + 14, y + 20, 4, 12);
      ctx.fillStyle = '#ffe39a';
      ctx.beginPath(); ctx.arc(x + 16, y + 14, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = '#1c1420'; ctx.beginPath(); ctx.moveTo(x + 16, y + 14); ctx.lineTo(x + 16, y + 10); ctx.moveTo(x + 16, y + 14); ctx.lineTo(x + 19, y + 14); ctx.stroke();
    } else if (chr === 'X') {
      ctx.fillStyle = '#4a4a55'; ctx.fillRect(x + 2, y, S - 4, S);
      ctx.fillStyle = '#2a2a33'; ctx.fillRect(x + 6, y + 3, S - 12, S - 3);
      ctx.fillStyle = '#e8e0cc'; ctx.beginPath(); ctx.arc(x + 16, y + 14, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 16, y + 14); ctx.lineTo(x + 16, y + 8); ctx.moveTo(x + 16, y + 14); ctx.lineTo(x + 21, y + 14); ctx.stroke();
      ctx.fillStyle = th.accent; ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t * 3); ctx.fillRect(x + 4, y + 26, S - 8, 3); ctx.globalAlpha = 1;
    } else if (chr === 'o') {
      const spin = t * 2.2 + x * 0.1;
      if (window.ART) ART.gear(ctx, x + 16, y + 16, 9, 8, spin, '#f2c66d', { lw: 1.4 });
      ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(t * 6 + x)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x + 22, y + 9, 1.6, 0, Math.PI * 2); ctx.fill();
    } else if (chr === 'h') {
      const pulse = 0.7 + 0.3 * Math.sin(t * 4 + x);
      ctx.fillStyle = '#7d4a1c'; ctx.fillRect(x + 12, y + 6, 8, 4);
      ctx.fillStyle = 'rgba(255,170,60,' + pulse.toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(x + 16, y + 20, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1c1420'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + 12, y + 16, 2, 5);
    } else if (chr === 'B') {
      ctx.fillStyle = 'rgba(40,36,44,0.92)'; ctx.fillRect(x, y, S, S);
      ctx.fillStyle = '#7a7480';
      for (let i = 2; i < S; i += 8) ctx.fillRect(x + i, y, 3, S);
      ctx.fillStyle = '#b8862e';
      for (let i = 3; i < S; i += 8) ctx.fillRect(x + i, y + 4, 1.5, 1.5);
      const glow = 0.3 + 0.2 * Math.sin(t * 5);
      ctx.fillStyle = 'rgba(255,90,60,' + glow.toFixed(3) + ')';
      ctx.fillRect(x, y, 2, S); ctx.fillRect(x + S - 2, y, 2, S);
    }
    ctx.restore();
  }

  function drawForeground(ctx, theme, camX, camY, t, W, H) {
    const O = themeOverride(theme);
    if (O && typeof O.foreground === 'function') { O.foreground(ctx, camX, camY, t, W, H); return; }
    const th = get(theme);
    ctx.save();
    if (th.rain) {
      ctx.strokeStyle = 'rgba(190,200,230,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 90; i++) {
        const x = ((i * 137 + (t || 0) * 380 - (camX || 0) * 0.4) % (W + 60) + W + 60) % (W + 60) - 30;
        const y = ((i * 71 + (t || 0) * 900) % (H + 40)) - 20;
        ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 14);
      }
      ctx.stroke();
    }
    if (th.embers) {
      ctx.fillStyle = 'rgba(255,160,70,0.5)';
      for (let i = 0; i < 24; i++) {
        const x = ((i * 91 - (camX || 0) * 0.6) % (W + 40) + W + 40) % (W + 40) - 20;
        const y = H - ((t || 0) * (30 + i * 3) + i * 37) % H;
        ctx.beginPath(); ctx.arc(x, y, 1.5 + (i % 3) * 0.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (th.dust) {
      ctx.fillStyle = 'rgba(255,240,210,0.22)';
      for (let i = 0; i < 30; i++) {
        const x = ((i * 113 - (camX || 0) * 0.3) % (W + 40) + W + 40) % (W + 40) - 20;
        const y = ((i * 67 + (t || 0) * 18) % (H + 20)) - 10;
        ctx.fillRect(x, y, 2, 2);
      }
    }
    if (th.light) {
      ctx.fillStyle = 'rgba(255,240,190,0.07)';
      for (let i = 0; i < 4; i++) {
        const x = i * 260 - (camX || 0) * 0.1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 90, 0); ctx.lineTo(x + 240, H); ctx.lineTo(x + 170, H); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  window.ENV = { drawBackground, drawTile, drawForeground };
})();
